// Save all portfolio data to Firestore under the user's UID
async function cloudSave(uid, data){
  if(!fbDb)throw new Error("Firebase not configured");
  await fbDb.collection("users").doc(uid).set(data, {merge:true});
}

// Load portfolio data from Firestore
async function cloudLoad(uid){
  if(!fbDb)throw new Error("Firebase not configured");
  const doc = await fbDb.collection("users").doc(uid).get();

// ─── Treemap ──────────────────────────────────────────────────────────────────
function squarify(items,x,y,w,h){
  if(!items.length)return[];
  const r=[];_layout(items,x,y,w,h,items.reduce((s,i)=>s+i.value,0),r);return r;
}
function _layout(it,x,y,w,h,tot,r){
  if(!it.length)return;
  if(it.length===1){r.push({...it[0],x,y,w,h});return;}
  const hz=w>=h,dim=hz?w:h;let row=[],rt=0,best=Infinity;
  for(let i=0;i<it.length;i++){
    row.push(it[i]);rt+=it[i].value;
    const rd=(rt/tot)*dim;let worst=0;
    for(const ri of row){const od=(ri.value/rt)*(hz?h:w);const ra=Math.max(rd/od,od/rd);if(ra>worst)worst=ra;}
    if(worst>best){row.pop();rt-=it[i].value;break;}best=worst;
  }
  const rd=(rt/tot)*dim;let cur=hz?y:x;
  for(const ri of row){const sz=(ri.value/rt)*(hz?h:w);hz?r.push({...ri,x,y:cur,w:rd,h:sz}):r.push({...ri,x:cur,y,w:sz,h:rd});cur+=sz;}
  const rem=it.slice(row.length);if(!rem.length)return;
  const remT=tot-rt;hz?_layout(rem,x+rd,y,w-rd,h,remT,r):_layout(rem,x,y+rd,w,h-rd,remT,r);
}

// ─── Live Price Fetcher ───────────────────────────────────────────────────────
const YAHOO_BASE ="https://query2.finance.yahoo.com/v8/finance/chart/";
const YAHOO_BASE1="https://query1.finance.yahoo.com/v8/finance/chart/";

const PROXIES=[
  u=>"https://corsproxy.io/?"+encodeURIComponent(u),
  u=>"https://api.allorigins.win/raw?url="+encodeURIComponent(u),
  u=>"https://proxy.cors.sh/"+u,

// Try a single proxy — resolves with parsed JSON or rejects
async function tryProxy(proxyUrl, timeoutMs){
  const r=await fetch(proxyUrl,{signal:AbortSignal.timeout(timeoutMs)});
  if(!r.ok)throw new Error("HTTP "+r.status);
  const t=await r.text();
  if(!t||t.length<10)throw new Error("Empty response");
  let parsed=JSON.parse(t);
  // Unwrap allorigins /get JSON wrapper {contents:"...",status:{}}
  if(parsed?.contents&&typeof parsed.contents==="string") parsed=JSON.parse(parsed.contents);
  return parsed;
}

// Race ALL proxies in parallel — first valid response wins, others are cancelled
async function fetchWithProxy(url, timeoutMs=10000){
  return new Promise((resolve,reject)=>{
    let settled=false;
    let pending=PROXIES.length;
    const errors=[];
    PROXIES.forEach(proxy=>{
      tryProxy(proxy(url), timeoutMs)
        .then(data=>{
          if(!settled){settled=true;resolve(data);}
        })
        .catch(e=>{
          errors.push(e.message);
          pending--;
          if(pending===0&&!settled) reject(new Error("All proxies failed: "+url.split("?")[0].split("/").pop()));
        });
    });
  });
}

// ─── IDX (Indonesia Stock Exchange) public API ───────────────────────────────
// Used as fallback for .JK stocks when Yahoo Finance blocks proxy requests
async function fetchIDXPrice(stockCode){
  const code=stockCode.toUpperCase().replace(".JK","").trim();
  const endpoints=[
    // IDX official API
    `https://api-apps.idx.co.id/api/Stock/GetStockSummary?StockCode=${code}`,
    // IDX stock detail
    `https://api-apps.idx.co.id/api/Stock/GetStockData?StockCode=${code}`,
    // IDX latest price
    `https://api-apps.idx.co.id/api/Stock/GetTradingResult?StockCode=${code}`,
    // Stockbit public API (popular Indonesian stock tracker)
    `https://api.stockbit.com/v2.4/fundamental/financialsummary/${code}`,
    // CNBC Indonesia markets API
    `https://api.markets.ft.com/data/prices/v1/series/symbol/${code}.JK`,
  ];
  for(const url of endpoints){
    try{
      const d=await fetchWithProxy(url,8000);
      if(!d)continue;
      // IDX API pattern: {data:{ClosePrice, PreviousPrice}} or {ClosePrice}
      const item=d?.data||d?.Data||d;
      const cur=parseFloat(item?.ClosePrice??item?.closePrice??item?.LastPrice??item?.lastPrice??item?.price??0);
      if(cur>0){
        const prev=parseFloat(item?.PreviousPrice??item?.previousPrice??item?.OpenPrice??cur);
        return{current:cur,prev};
      }
      // Array response — take first item
      const arr=Array.isArray(item)?item:(item?.stockData||item?.result||[]);
      if(arr.length){
        const r=arr[0];
        const cur2=parseFloat(r?.ClosePrice??r?.closePrice??r?.LastPrice??0);
        if(cur2>0)return{current:cur2,prev:parseFloat(r?.PreviousPrice??cur2)};
      }
    }catch(e){/* try next */}
  }
  throw new Error("IDX: "+code+" not found");
}

// ─── Stooq public CSV API (more proxy-friendly than Yahoo) ───────────────────
// Symbol conversion for Stooq: BHP.AX→bhp.au, BBRI.JK→bbri.id, BTC-AUD→btc-aud.crypto
function toStooqSymbol(yahooSymbol){
  const s=yahooSymbol.toUpperCase();
  if(s.endsWith(".AX"))  return s.replace(".AX",".AU").toLowerCase();
  if(s.endsWith(".JK"))  return s.replace(".JK",".ID").toLowerCase();  // IDX uses .id on Stooq
  if(s.endsWith("-AUD")) return s.replace("-AUD","-AUD.CRYPTO").toLowerCase();
  if(s.endsWith("-USD")) return s.replace("-USD","-USD.CRYPTO").toLowerCase();
  if(s.endsWith("-BTC")) return s.replace("-BTC","-BTC.CRYPTO").toLowerCase();
  if(s==="GC=F")  return "gc.f";
  if(s==="SI=F")  return "si.f";
  if(s==="CL=F")  return "cl.f";
  if(s==="NG=F")  return "ng.f";
  if(s.endsWith(".L"))   return s.toLowerCase();
  if(s.endsWith(".SI"))  return s.toLowerCase();
  if(s.endsWith(".TO"))  return s.toLowerCase();
  if(s.endsWith(".HK"))  return s.toLowerCase();
  if(!s.includes(".")&&!s.includes("-")&&!s.includes("=")) return s.toLowerCase()+".us";
  return null;
}

async function fetchStooq(yahooSymbol){
  const stooq=toStooqSymbol(yahooSymbol);
  if(!stooq)throw new Error("No Stooq symbol for "+yahooSymbol);
  // Request 5 days of daily data — last 2 rows give current close + previous close
  const url=`https://stooq.com/q/l/?s=${stooq}&f=sd2t2ohlcv&h&e=csv`;
  const raw=await fetchWithProxyRaw(url);
  // CSV: Symbol,Date,Time,Open,High,Low,Close,Volume
  const lines=raw.trim().split("\n").filter(l=>l&&!l.startsWith("Symbol"));
  if(!lines.length)throw new Error("Stooq: no data for "+stooq);
  // Most recent row last
  const parseLine=l=>{const p=l.split(",");return parseFloat(p[6])||0;};
  const cur=parseLine(lines[lines.length-1]);
  const prev=lines.length>1?parseLine(lines[lines.length-2]):cur;
  if(!cur)throw new Error("Stooq: zero price for "+stooq);
  return{current:cur,prev};
}

// Raw text version of fetchWithProxy (for CSV responses like Stooq)
async function fetchWithProxyRaw(url,timeoutMs=10000){
  return new Promise((resolve,reject)=>{
    let settled=false;let pending=PROXIES.length;
    PROXIES.forEach(proxy=>{
      fetch(proxy(url),{signal:AbortSignal.timeout(timeoutMs)})
        .then(async r=>{
          if(!r.ok)throw new Error("HTTP "+r.status);
          const t=await r.text();
          if(!t||t.length<10)throw new Error("Empty");
          // allorigins /get wraps in JSON — extract contents string
          if(t.trim().startsWith("{")&&t.includes('"contents"')){
            try{const j=JSON.parse(t);if(j.contents){if(!settled){settled=true;resolve(j.contents);}return;}}catch(e){}
          }
          if(!settled){settled=true;resolve(t);}
        })
        .catch(()=>{
          pending--;
          if(pending===0&&!settled)reject(new Error("All proxies failed (raw)"));
        });
    });
  });
}

async function fetchYahooPrice(symbol){
  const sym=encodeURIComponent(symbol);
  const isJK=symbol.endsWith(".JK");

  // Race Yahoo (3 endpoints) AND Stooq simultaneously — fastest valid response wins
  const yahooAttempt=(async()=>{
    const candidates=[
      YAHOO_BASE +sym+"?interval=1d&range=5d&includePrePost=false",
      YAHOO_BASE1+sym+"?interval=1d&range=5d&includePrePost=false",
      YAHOO_V7   +sym+"&fields=regularMarketPrice,regularMarketPreviousClose,previousClose",
    ];
    for(const url of candidates){
      try{
        const d=await fetchWithProxy(url);
        const res=d?.chart?.result?.[0];
        if(res){
          const m=res.meta;
          const cur=m.regularMarketPrice??m.price??m.postMarketPrice;
          if(cur){const prev=m.previousClose??m.chartPreviousClose??m.regularMarketPreviousClose??cur;return{current:cur,prev};}
        }
        const q=d?.quoteResponse?.result?.[0];
        if(q&&q.regularMarketPrice){
          return{current:q.regularMarketPrice,prev:q.regularMarketPreviousClose??q.previousClose??q.regularMarketPrice};
        }
      }catch(e){}
    }
    throw new Error("Yahoo failed");
  })();

  const stooqAttempt=fetchStooq(symbol).catch(e=>Promise.reject(e));

  // Race both — whichever wins first
  try{
    return await Promise.any([yahooAttempt,stooqAttempt]);
  }catch(e){
    // Both failed — try IDX API as last resort for .JK stocks
    if(isJK){try{return await fetchIDXPrice(symbol);}catch(e2){}}
    throw new Error("All sources failed for "+symbol);
  }
}

async function fetchBenchmark(symbol){
  const sym=encodeURIComponent(symbol);
  const candidates=[
    YAHOO_BASE +sym+"?interval=1mo&range=5y",
    YAHOO_BASE1+sym+"?interval=1mo&range=5y",
    YAHOO_BASE +sym+"?interval=1mo&range=3y",
  ];
  let lastErr="No data";
  for(const url of candidates){
    try{
      const d=await fetchWithProxy(url);
      const res=d?.chart?.result?.[0];
      if(!res)continue;
      const ts=res.timestamp||[];
      const closes=res.indicators?.quote?.[0]?.close||[];
      if(!ts.length||!closes.length)continue;
      const base=closes.find(v=>v!=null)||1;
      return{
        labels:ts.map(t=>new Date(t*1000).toISOString().slice(0,10)),
        pct:closes.map(v=>v!=null?((v-base)/base)*100:null),
        raw:closes,
      };
    }catch(e){ lastErr=e.message; }
  }
  throw new Error(lastErr);
}

    `https://api.bareksa.com/v2/fixed-income/nav-history?symbol=${code}&period=5y`,

    // Bibit public API
    `https://api.bibit.id/v1/reksa-dana/${code}/nav-history?period=5y`,
    // Infovesta data
    `https://www.infovesta.com/index/fundperformance/getnavhistory?code=${code}`,
  ];
  for(const url of endpoints){
    try{
      const d=await fetchWithProxy(url,8000);
      if(!d)continue;
      // Bareksa pattern: {data:{navHistory:[{date,nav}]}}
      const hist=d?.data?.navHistory||d?.data?.nav_history||d?.navHistory||
                 d?.data||d?.result||d?.history||[];
      const arr=Array.isArray(hist)?hist:[];
      if(arr.length<3)continue;
      // Sort by date ascending
      const sorted=arr.filter(x=>x.date||x.nav_date||x.tanggal)
        .map(x=>({
          date:x.date||x.nav_date||x.tanggal,
          nav:parseFloat(x.nav||x.nilai_nav||x.navPerUnit||x.value||0)
        }))
        .filter(x=>x.nav>0)
        .sort((a,b)=>a.date.localeCompare(b.date));
      if(sorted.length<3)continue;
      const base=sorted[0].nav;
      return{
        labels:sorted.map(x=>x.date),
        pct:sorted.map(x=>((x.nav-base)/base)*100),
        raw:sorted.map(x=>x.nav),
      };
    }catch(e){/* try next */}
  }
  throw new Error("MF NAV unavailable: "+fundCode);
}

// ─── Indonesian Government Bond prices ───────────────────────────────────────
async function fetchDJPPRPrice(seriSBN){
  const sn=seriSBN.toUpperCase().trim();

  // Helper: try a URL directly (no proxy) first, then via proxy
  async function tryDirect(url, timeoutMs=6000){
    // Direct fetch first — IDX APIs often have open CORS headers
    try{
      const r=await fetch(url,{signal:AbortSignal.timeout(timeoutMs)});
      if(r.ok){const t=await r.text();if(t&&t.length>10)return JSON.parse(t);}
    }catch(e){}
    // Fallback via proxy
    return fetchWithProxy(url, timeoutMs);
  }

  // Helper: extract price from bond object regardless of field naming
  function bondPrice(obj){
    if(!obj||typeof obj!=="object")return 0;
    const keys=Object.keys(obj);
    const find=(...names)=>{
      for(const n of names){
        const k=keys.find(k=>k.toLowerCase()===n.toLowerCase());
        if(k&&parseFloat(obj[k])>0)return parseFloat(obj[k]);
      }return 0;
    };
    return find("ClosePrice","LastPrice","Price","Close","Bid","Ask","HargaBid","HargaAsk","closeprice","lastprice","price");
  }

  // ── Source 1: IDX API — direct + proxied, single bond lookup ──
  const idxSingle=[
    `https://api-apps.idx.co.id/api/Bond/GetBondData?BondCode=${sn}`,
    `https://api-apps.idx.co.id/api/BondBursa/GetBondBursaData?BondCode=${sn}`,
    `https://api-apps.idx.co.id/api/Bond/GetBondSummary?StockCode=${sn}`,
    `https://api-apps.idx.co.id/api/Stock/GetStockSummary?StockCode=${sn}`,
  ];
  for(const url of idxSingle){
    try{
      const d=await tryDirect(url);
      if(!d)continue;
      const item=d?.data||d?.Data||d;
      const arr=Array.isArray(item)?item:null;
      const obj=arr?arr[0]:item;
      if(obj&&typeof obj==="object"){
        const cur=bondPrice(obj);
        if(cur>0){
          const prev=bondPrice({PreviousPrice:obj.PreviousPrice??obj.previousPrice??obj.PreviousClose??cur})||cur;
          return{current:cur,prev};
        }
      }
    }catch(e){}
  }

  // ── Source 2: IDX full bond listing — find by code ──
  const idxAll=[
    "https://api-apps.idx.co.id/api/Bond/GetBondBursaAllData",
    "https://api-apps.idx.co.id/api/BondBursa/GetBondBursaAllData",
    "https://api-apps.idx.co.id/api/Bond/GetAllBondData",
  ];
  for(const url of idxAll){
    try{
      const d=await tryDirect(url,10000);
      const arr=Array.isArray(d)?d:Array.isArray(d?.data)?d.data:Array.isArray(d?.Data)?d.Data:[];
      const bond=arr.find(x=>Object.values(x).some(v=>String(v).toUpperCase()===sn));
      if(bond){const cur=bondPrice(bond);if(cur>0)return{current:cur,prev:cur};}
    }catch(e){}
  }

  // ── Source 3: PHEI (official Indonesian bond pricing agency) ──
  try{
    const d=await fetchWithProxy(`https://www.phei.co.id/api/bond/price?code=${sn}`,6000);
    const item=d?.data||d;
    const cur=parseFloat(item?.price||item?.cleanPrice||item?.dirtyPrice||0);
    if(cur>0)return{current:cur,prev:parseFloat(item?.previousPrice||cur)};
  }catch(e){}

  // ── Source 4: Bareksa public bond API ──
  try{
    const d=await fetchWithProxy(`https://api.bareksa.com/v2/fixed-income/product?isin_code=${sn}&type=sukuk`,6000);
    const item=d?.data?.[0]||d;
    const cur=parseFloat(item?.nav||item?.price||item?.lastPrice||0);
    if(cur>0)return{current:cur,prev:cur};
  }catch(e){}

  // ── Source 5: Stooq ──
  try{
    const raw=await fetchWithProxyRaw(`https://stooq.com/q/l/?s=${sn.toLowerCase()}.id&f=sd2ohlcv&h&e=csv`,6000);
    const lines=raw.trim().split("\n").filter(l=>l&&!l.startsWith("Symbol"));
    if(lines.length){const p=lines[lines.length-1].split(",");const cur=parseFloat(p[6])||0;if(cur>0)return{current:cur,prev:cur};}
  }catch(e){}

  throw new Error(sn+": bond price unavailable — enter manually");
}

        // Pattern: {seriesCollection:[{dataPoints:[[date,val]]}]}

  ];
  for(const url of feEndpoints){
    try{
      const d=await fetchWithProxy(url);
      if(!d)continue;
      // FE API patterns: {exitPrice, entryPrice} or {nav} or [{price}]
      const arr=Array.isArray(d)?d:[d];
      for(const item of arr){
        const c=parseFloat(item?.exitPrice??item?.nav??item?.price??item?.unitPrice??0);
        if(c>0)return{current:c,prev:parseFloat(item?.previousExitPrice??item?.prevNav??c)};
      }
    }catch(e){/* try next */}
  }

  // ── Source C: Morningstar screener fallback for any APIR (no ID needed) ──
  try{
    const d=await fetchWithProxy(`https://lt.morningstar.com/api/rest.svc/klr5zyak8x/security/screener?page=1&pageSize=3&outputType=json&version=1&languageId=en-AU&currencyId=AUD&universeIds=FOZAUS%24%24ALL&securityDataPoints=SecId%7CName%7CNAVASOF%7CNAVD1&term=${ap}`);
    const rows=d?.rows||[];

  throw new Error(`${ap}: fund NAV unavailable — enter price manually`);
}

// ─── Compute Holding ──────────────────────────────────────────────────────────
function computeHolding(h,prices,prevPrices,R){
  let qty=0,cbL=0,rgL=0,lots=[],divL=0;
  const txs=[...h.transactions].sort((a,b)=>new Date(a.date)-new Date(b.date));
  for(const tx of txs){
    if(tx.type==="buy"){lots.push({qty:tx.qty,price:tx.price});qty+=tx.qty;cbL+=tx.qty*tx.price;}
    else if(tx.type==="sell"){let rem=tx.qty;qty-=tx.qty;while(rem>0&&lots.length){const lot=lots[0],used=Math.min(lot.qty,rem);rgL+=used*(tx.price-lot.price);cbL-=used*lot.price;lot.qty-=used;rem-=used;if(lot.qty===0)lots.shift();}}
    else if(tx.type==="dividend"){divL+=tx.totalAmount||0;}
  }
  const cpL=prices[h.ticker]??0,pcL=prevPrices[h.ticker]??cpL;
  const cvL=qty*cpL,ugL=cvL-cbL,dgL=(cpL-pcL)*qty,dgPct=pcL>0?(cpL-pcL)/pcL*100:0;
  const cv=toAUD(cvL,h.currency,R),cb=toAUD(cbL,h.currency,R),ug=toAUD(ugL,h.currency,R);
  const rg=toAUD(rgL,h.currency,R),divs=toAUD(divL,h.currency,R),dg=toAUD(dgL,h.currency,R);
  const totalInv=txs.filter(t=>t.type==="buy").reduce((s,t)=>s+toAUD(t.qty*t.price,h.currency,R),0);
  const totalGain=ug+rg+divs,gainPct=totalInv>0?(totalGain/totalInv)*100:0;
  const divYoc=totalInv>0?(divs/totalInv)*100:0;
  return{...h,qty,costBasis:cb,currentPrice:cpL,prevClose:pcL,currentValue:cv,unrealizedGain:ug,
    realizedGain:rg,totalDividends:divs,totalGain,gainPct,dayGain:dg,dayGainPct:dgPct,
    divYieldOnCost:divYoc,totalInvested:totalInv};
}

  // data = [{label, value, type:'start'|'pos'|'neg'|'total'}]
  const ref=useRef(null);const inst=useRef(null);
  useEffect(()=>{
    if(!ref.current||typeof Chart==="undefined"||!data.length)return;
    if(inst.current)inst.current.destroy();
    const labels=data.map(d=>d.label);
    // Build floating bars: [base, top]
    let running=0;
    const bases=[],tops=[],bgColors=[];
    data.forEach(d=>{
      if(d.type==="start"||d.type==="total"){
        bases.push(0);tops.push(d.value);
        bgColors.push(d.type==="total"?(d.value>=0?"#6366f1":"#ef4444"):"#6366f155");
      }else if(d.type==="pos"){
        bases.push(running);tops.push(running+d.value);
        bgColors.push("#22c55e");running+=d.value;
      }else{
        bases.push(running+d.value);tops.push(running);
        bgColors.push("#ef4444");running+=d.value;
      }
    });
    // Chart.js floating bars need [min,max]
    const floatData=bases.map((b,i)=>[Math.min(b,tops[i]),Math.max(b,tops[i])]);
    inst.current=new Chart(ref.current,{
      type:"bar",
      data:{labels,datasets:[{data:floatData,backgroundColor:bgColors,borderColor:bgColors.map(c=>c+"cc"),borderWidth:1,borderRadius:4,borderSkipped:false}]},
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false},tooltip:{backgroundColor:T.bg3,borderColor:T.border,borderWidth:1,titleColor:T.text,bodyColor:T.text2,padding:10,cornerRadius:8,
          callbacks:{label:(ctx)=>{const d2=data[ctx.dataIndex];const v=d2.value;const sign=v>=0?"+":"";return`${sign}${yFmt?yFmt(Math.abs(v)):("A$"+(Math.abs(v)/1000).toFixed(1)+"K")} (${sign}${((v/(Math.abs(data[0].value)||1))*100).toFixed(1)}%)`;}}}},
        scales:{x:{grid:{color:"transparent"},ticks:{color:T.chartTick,font:{size:10}},border:{color:T.border}},
          y:{grid:{color:T.chartGrid},ticks:{color:T.chartTick,font:{size:10},callback:yFmt||(v=>`A$${(v/1000).toFixed(0)}K`)},border:{color:T.border}}},
      }
    });
    return()=>{if(inst.current)inst.current.destroy();};
  },[data,T,yFmt]);
  return <div style={{height,position:"relative"}}>{data.length?<canvas ref={ref}/>:<div style={{height,display:"flex",alignItems:"center",justifyContent:"center",color:T.text3,fontSize:12}}>No data for selected period</div>}</div>;
}

// Column aliases — flexible headers users might write
const COL={
  ticker:     ["ticker","symbol","stock code","scrip","stock ticker","asx code","idx code","security code"],
  name:       ["name","company","company name","security name","description","instrument","issuer"],
  type:       ["type","transaction type","tx type","txtype","tx_type","action","trade type"],
  date:       ["date","trade date","settlement date","payment date","tx date","transaction date","value date"],
  qty:        ["qty","quantity","units","volume","lots","number of shares","number of units","unit count"],
  price:      ["price","unit price","trade price","cost price","nav","purchase price","sale price"],
  currency:   ["currency","ccy","cur","denomination"],
  assetType:  ["asset type","asset_type","asset class","category","class","security type","instrument type"],
  exchange:   ["exchange","market","listing","exchange code","exch","bourse"],
  yahooSymbol:["yahoo","yahoo symbol","yahoo_symbol","yfinance","yf symbol","yahoo finance"],
  faceValue:  ["face value","face_value","nominal","nominal value","par value","par"],
  isBondPct:  ["is bond","isbond","bond pct","bond %","fixed rate bond","is_bond"],
  entitledQty:["entitled qty","entitled units","entitled shares","entitled","ex date units","qualifying units","qualifying shares"],
  amountPerShare:["amount per share","div per share","coupon per unit","dividend per share","dividend rate","coupon rate","div rate","rate per unit","distribution per unit"],
  totalAmount:["total amount","total dividend","total coupon","gross amount","total distribution","dividend total"],
};

// Resolve a raw header string to a COL field name.
// Strategy: exact match first, then word-boundary match (alias is a complete word within header),
// then header equals alias. Never uses raw substring includes to avoid "asset_type" → "type".
function resolveHeader(raw){
  if(!raw&&raw!==0)return null;
  // Normalise: lowercase, collapse whitespace, replace underscores/hyphens with spaces
  const norm=s=>String(s).toLowerCase().trim().replace(/[_\-]/g," ").replace(/\s+/g," ");
  const lo=norm(raw);
  // 1. Exact match (also try normalised alias)
  for(const[field,aliases]of Object.entries(COL)){
    if(aliases.map(norm).includes(lo))return field;
  }
  // 2. Word-boundary: alias appears as a complete phrase within the header
  for(const[field,aliases]of Object.entries(COL)){
    for(const a of aliases){
      const na=norm(a);
      const re=new RegExp("(^|[\\s/])" + na.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + "([\\s/]|$)");
      if(re.test(lo))return field;
    }
  }
  return null;
}

function normaliseType(raw=""){
  const lo=raw.toLowerCase().trim();
  if(["buy","purchase","bought","b","top up","topup","top-up","add"].includes(lo))return"buy";
  if(["sell","sale","sold","s","disposal","withdraw"].includes(lo))return"sell";
  if(["div","dividend","dividends","income","distribution","coupon","interest","yield","d"].includes(lo))return"dividend";
  return null;
}

function normaliseDate(raw=""){
  if(!raw)return"";
  // Handle DD/MM/YYYY, DD-MM-YYYY, MM/DD/YYYY, YYYY-MM-DD, Excel serial numbers
  if(typeof raw==="number"){
    // Excel date serial
    const d=new Date(Math.round((raw-25569)*86400*1000));
    return d.toISOString().slice(0,10);
  }
  const s=String(raw).trim();
  // ISO already
  if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);
  // DD/MM/YYYY or DD-MM-YYYY
  const m1=s.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{4})/);
  if(m1){
    const[,d,mo,y]=m1;
    // Ambiguous: if day>12 definitely DD/MM, else assume DD/MM (Australian convention)
    return`${y}-${mo.padStart(2,"0")}-${d.padStart(2,"0")}`;
  }
  // Try native parse as last resort
  const dt=new Date(s);
  if(!isNaN(dt))return dt.toISOString().slice(0,10);
  return s;
}

function normaliseCurrency(raw=""){
  const lo=String(raw).toUpperCase().trim();
  if(["AUD","A$","AU"].includes(lo))return"AUD";
  if(["IDR","RP","RUPIAH"].includes(lo))return"IDR";
  if(["USD","US$","$"].includes(lo))return"USD";
  return lo||"AUD";
}

function normaliseAssetType(raw=""){
  const lo=raw.toLowerCase().trim();
  const map={
    "shares":      "Shares / Stocks","stocks":"Shares / Stocks","share":"Shares / Stocks","stock":"Shares / Stocks","equity":"Shares / Stocks",
    "etf":         "ETF","exchange traded fund":"ETF",
    "mutual fund": "Mutual Fund","unit trust":"Mutual Fund","reksadana":"Mutual Fund",
    "index fund":  "Index Fund",
    "super":       "Superannuation","superannuation":"Superannuation",
    "bond":        "Bond – Government","govt bond":"Bond – Government","government bond":"Bond – Government","sbn":"Bond – Indonesia (SBN)",
    "sukuk":       "Bond – Sharia (Sukuk)","sharia bond":"Bond – Sharia (Sukuk)","pbs":"Bond – Sharia (Sukuk)",
    "commodity":   "Commodity","commodities":"Commodity","gold":"Commodity","silver":"Commodity",
    "crypto":      "Cryptocurrency","cryptocurrency":"Cryptocurrency","bitcoin":"Cryptocurrency","token":"Cryptocurrency",
    "forex":       "Forex","fx":"Forex","currency":"Forex",
    "reit":        "REIT / Property","property":"REIT / Property","real estate":"REIT / Property",
    "cash":        "Cash / Term Deposit","td":"Cash / Term Deposit","term deposit":"Cash / Term Deposit","deposit":"Cash / Term Deposit",
  };
  for(const[k,v]of Object.entries(map)){if(lo.includes(k))return v;}
  // Try to find an exact match in ASSET_TYPES
  return ASSET_TYPES.find(t=>t.toLowerCase()===lo)||raw||"Shares / Stocks";
}

function parseRows(rawRows){
  if(!rawRows.length)return{rows:[],errors:[],fieldMap:{}};
  const sampleKeys=Object.keys(rawRows[0]);
  const fieldMap={};
  sampleKeys.forEach(k=>{const f=resolveHeader(k);if(f)fieldMap[f]=k;});

  const rows=[],errors=[];
  rawRows.forEach((raw,i)=>{
    const row={};
    const R=n=>fieldMap[n]?String(raw[fieldMap[n]]??"").trim():"";
    const RN=n=>fieldMap[n]?parseFloat(String(raw[fieldMap[n]]??"").replace(/[^\d.\-]/g,""))||0:0;

    row.ticker=(R("ticker")||"").toUpperCase();
    row.type=normaliseType(R("type"));
    row.date=normaliseDate(fieldMap["date"]?raw[fieldMap["date"]]:"");
    row.qty=RN("qty");
    row.price=RN("price");
    row.name=R("name")||row.ticker;
    row.currency=normaliseCurrency(R("currency"));
    row.assetType=normaliseAssetType(R("assetType"));
    row.exchange=R("exchange");
    row.yahooSymbol=R("yahooSymbol");
    row.faceValue=RN("faceValue")||null;
    row.isBondPct=["true","yes","1","y"].includes(R("isBondPct").toLowerCase());
    row.entitledQty=RN("entitledQty")||null;
    row.amountPerShare=RN("amountPerShare");
    row.totalAmount=RN("totalAmount");

    // Validation
    const errs=[];
    if(!row.ticker)errs.push("Missing ticker");
    if(!row.type)errs.push(`Unknown type "${R("type")}"`);
    if(!row.date)errs.push("Missing date");
    if(row.type==="buy"||row.type==="sell"){
      if(!row.qty||row.qty<=0)errs.push("qty must be > 0");
      if(!row.price||row.price<=0)errs.push("price must be > 0");
    }
    if(row.type==="dividend"){
      if(!row.amountPerShare&&!row.totalAmount)errs.push("Need amount per share or total amount");
    }
    row._rowNum=i+2; // 1-indexed + header
    row._errors=errs;
    rows.push(row);
    if(errs.length)errors.push({rowNum:i+2,ticker:row.ticker,errs});
  });
  return{rows,errors,fieldMap};
}

function buildPortfolioFromRows(parsedRows,existingPortfolio=[]){
  // Group rows by ticker, merge into existing portfolio
  const portfolio=[...existingPortfolio.map(h=>({...h,transactions:[...h.transactions]}))];
  const valid=parsedRows.filter(r=>!r._errors.length);

  valid.forEach(row=>{
    let holding=portfolio.find(h=>h.ticker===row.ticker);
    if(!holding){
      holding={
        id:Date.now()+Math.random(),
        ticker:row.ticker,name:row.name||row.ticker,
        currency:row.currency||"AUD",
        assetType:row.assetType||"Shares / Stocks",
        exchange:row.exchange||"",
        yahooSymbol:row.yahooSymbol||suggestYahoo(row.ticker,row.exchange,row.assetType),
        transactions:[],
      };
      if(row.isBondPct)holding.isBondPct=true;
      if(row.faceValue)holding.faceValue=row.faceValue;
      portfolio.push(holding);
    }

    if(row.type==="buy"||row.type==="sell"){
      holding.transactions.push({type:row.type,qty:row.qty,price:row.price,date:row.date});
    }else if(row.type==="dividend"){
      // If totalAmount provided use it; else compute from entitledQty or qty
      const entQ=row.entitledQty||row.qty||null;
      let total=row.totalAmount||0;
      if(!total&&row.amountPerShare&&entQ)total=row.amountPerShare*entQ;
      holding.transactions.push({
        type:"dividend",amountPerShare:row.amountPerShare,
        totalAmount:total,
        ...(entQ?{entitledQty:entQ}:{}),
        date:row.date,
      });
    }
  });

  // Sort each holding's transactions by date
  portfolio.forEach(h=>h.transactions.sort((a,b)=>new Date(a.date)-new Date(b.date)));
  return portfolio;
}

function readFileAsRows(file){
  return new Promise((resolve,reject)=>{
    const ext=file.name.split(".").pop().toLowerCase();
    if(ext==="csv"||ext==="txt"){
      const reader=new FileReader();
      reader.onload=e=>{
        const result=Papa.parse(e.target.result,{header:true,skipEmptyLines:true,dynamicTyping:false});
        resolve(result.data);
      };
      reader.onerror=reject;
      reader.readAsText(file);
    }else if(["xlsx","xls","ods"].includes(ext)){
      const reader=new FileReader();
      reader.onload=e=>{
        const wb=XLSX.read(e.target.result,{type:"array",cellDates:false});
        // Use first sheet
        const ws=wb.Sheets[wb.SheetNames[0]];
        const data=XLSX.utils.sheet_to_json(ws,{defval:"",raw:true});
        resolve(data);
      };
      reader.onerror=reject;
      reader.readAsArrayBuffer(file);
    }else{
      reject(new Error("Unsupported file type: ."+ext+". Use .csv, .xlsx or .xls"));
    }
  });
}
