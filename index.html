// ─── Error Boundary ──────────────────────────────────────────────────────────
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false, error: null };
  }
  static getDerivedStateFromError(error) {
    return { hasError: true, error };
  }
  componentDidCatch(error, info) {
    console.error("React error boundary caught:", error, info);
  }
  render() {
    if (this.state.hasError) {
      return (
        <div style={{ padding: 20, color:"red", background:"#fff", fontFamily:"monospace" }}>
          <h2>Something went wrong.</h2>
          <pre>{this.state.error?.stack}</pre>
          <button onClick={() => window.location.reload()}>Reload</button>
        </div>
      );
    }
    return this.props.children;
  }
}

// ─── Treemap ──────────────────────────────────────────────────────────────────
function squarify(items,x,y,w,h){
  if(!items.length)return[];
  const r=[];_layout(items,x,y,w,h,items.reduce((s,i)=>s+i.value,0),r);return r;
}
function _layout(it,x,y,w,h,tot,r){
  if(!it.length)return;
  if(it.length===1){r.push({...it[0],x,y,w,h});return;}
  const hz=w>=h,dim=hz?w:h;let row=[],rt=0,best=Infinity;
  for(let i=0;i<it.length;i++){
    row.push(it[i]);rt+=it[i].value;
    const rd=(rt/tot)*dim;let worst=0;
    for(const ri of row){const od=(ri.value/rt)*(hz?h:w);const ra=Math.max(rd/od,od/rd);if(ra>worst)worst=ra;}
    if(worst>best){row.pop();rt-=it[i].value;break;}best=worst;
  }
  const rd=(rt/tot)*dim;let cur=hz?y:x;
  for(const ri of row){const sz=(ri.value/rt)*(hz?h:w);hz?r.push({...ri,x,y:cur,w:rd,h:sz}):r.push({...ri,x:cur,y,w:sz,h:rd});cur+=sz;}
  const rem=it.slice(row.length);if(!rem.length)return;
  const remT=tot-rt;hz?_layout(rem,x+rd,y,w-rd,h,remT,r):_layout(rem,x,y+rd,w,h-rd,remT,r);
}

// ─── Currency helpers ────────────────────────────────────────────────────────
const toAUD=(a,cur,R)=>{if(cur==="IDR")return a/R.AUD_IDR;if(cur==="USD")return a/R.AUD_USD;return a;};
const fromAUD=(a,cur,R)=>{if(cur==="IDR")return a*R.AUD_IDR;if(cur==="USD")return a*R.AUD_USD;return a;};
function fmtIDR(n){try{return Math.round(n).toLocaleString("id-ID");}catch{return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,".");}}
function fmtAUD(n){return Math.abs(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,",");}
function fmtCur(audAmt,dc,R,compact=false){
  const a=fromAUD(audAmt,dc,R);
  if(dc==="IDR"){const abs=Math.abs(a);if(compact&&abs>=1e9)return`Rp${(a/1e9).toFixed(1)}M`;if(compact&&abs>=1e6)return`Rp${(a/1e6).toFixed(1)}Jt`;if(compact&&abs>=1e3)return`Rp${(a/1e3).toFixed(0)}Rb`;return`Rp ${fmtIDR(a)}`;}
  if(dc==="USD"){const abs=Math.abs(a);if(compact&&abs>=1e6)return`US$${(a/1e6).toFixed(2)}M`;if(compact&&abs>=1e3)return`US$${(a/1e3).toFixed(1)}K`;return`US$${fmtAUD(a)}`;}
  const abs=Math.abs(a);if(compact&&abs>=1e6)return`A$${(a/1e6).toFixed(2)}M`;if(compact&&abs>=1e3)return`A$${(a/1e3).toFixed(1)}K`;return`A$${fmtAUD(a)}`;
}
function fmtGain(audAmt,dc,R){
  const a=fromAUD(audAmt,dc,R);const sign=a>=0?"+":"-";
  if(dc==="IDR")return`${sign}Rp ${fmtIDR(Math.abs(a))}`;
  if(dc==="USD")return`${sign}US$${fmtAUD(a)}`;
  return`${sign}A$${fmtAUD(a)}`;
}
const fmtPct=n=>`${n>=0?"+":""}${n.toFixed(2)}%`;
const fmtDate=d=>{try{return new Date(d+"T12:00:00").toLocaleDateString("en-AU",{day:"2-digit",month:"short",year:"numeric"});}catch{return d;}};
const fmtMon=d=>{try{const dt=new Date(d+"-01");return dt.toLocaleDateString("en-AU",{month:"short",year:"2-digit"});}catch{return d;}};
const fmtMonShort=d=>{try{return new Date(d+"T12:00:00").toLocaleDateString("en-AU",{day:"2-digit",month:"short"});}catch{return d;}};
const fmtTime=d=>{if(!d)return"—";try{return d.toLocaleTimeString("en-AU",{hour:"2-digit",minute:"2-digit"});}catch{return"—";}};

async function fetchWithProxyRaw(url,timeoutMs=10000){
  return new Promise((resolve,reject)=>{
    let settled=false;let pending=PROXIES.length;
    PROXIES.forEach(proxy=>{
      fetch(proxy(url),{signal:AbortSignal.timeout(timeoutMs)})
        .then(async r=>{
          if(!r.ok)throw new Error("HTTP "+r.status);
          const t=await r.text();
          if(!t||t.length<10)throw new Error("Empty");
          if(t.trim().startsWith("{")&&t.includes('"contents"')){
            try{const j=JSON.parse(t);if(j.contents){if(!settled){settled=true;resolve(j.contents);}return;}}catch(e){}
          }
          if(!settled){settled=true;resolve(t);}
        })
        .catch(()=>{
          pending--;
          if(pending===0&&!settled)reject(new Error("All proxies failed (raw)"));
        });
    });
  });
}

async function tryProxy(proxyUrl, timeoutMs){
  const r=await fetch(proxyUrl,{signal:AbortSignal.timeout(timeoutMs)});
  if(!r.ok)throw new Error("HTTP "+r.status);
  const t=await r.text();
  if(!t||t.length<10)throw new Error("Empty response");
  let parsed=JSON.parse(t);
  if(parsed?.contents&&typeof parsed.contents==="string") parsed=JSON.parse(parsed.contents);
  return parsed;
}

async function fetchWithProxy(url, timeoutMs=10000){
  return new Promise((resolve,reject)=>{
    let settled=false;
    let pending=PROXIES.length;
    const errors=[];
    PROXIES.forEach(proxy=>{
      tryProxy(proxy(url), timeoutMs)
        .then(data=>{
          if(!settled){settled=true;resolve(data);}
        })
        .catch(e=>{
          errors.push(e.message);
          pending--;
          if(pending===0&&!settled) reject(new Error("All proxies failed: "+url.split("?")[0].split("/").pop()));
        });
    });
  });
}

// ─── Compute Holding ──────────────────────────────────────────────────────────
function computeHolding(h,prices,prevPrices,R){
  let qty=0,cbL=0,rgL=0,lots=[],divL=0;
  const txs=[...h.transactions].sort((a,b)=>new Date(a.date)-new Date(b.date));
  for(const tx of txs){
    if(tx.type==="buy"){lots.push({qty:tx.qty,price:tx.price});qty+=tx.qty;cbL+=tx.qty*tx.price;}
    else if(tx.type==="sell"){let rem=tx.qty;qty-=tx.qty;while(rem>0&&lots.length){const lot=lots[0],used=Math.min(lot.qty,rem);rgL+=used*(tx.price-lot.price);cbL-=used*lot.price;lot.qty-=used;rem-=used;if(lot.qty===0)lots.shift();}}
    else if(tx.type==="dividend"){divL+=tx.totalAmount||0;}
  }
  const cpL=prices[h.ticker]??0,pcL=prevPrices[h.ticker]??cpL;
  const cvL=qty*cpL,ugL=cvL-cbL,dgL=(cpL-pcL)*qty,dgPct=pcL>0?(cpL-pcL)/pcL*100:0;
  const cv=toAUD(cvL,h.currency,R),cb=toAUD(cbL,h.currency,R),ug=toAUD(ugL,h.currency,R);
  const rg=toAUD(rgL,h.currency,R),divs=toAUD(divL,h.currency,R),dg=toAUD(dgL,h.currency,R);
  const totalInv=txs.filter(t=>t.type==="buy").reduce((s,t)=>s+toAUD(t.qty*t.price,h.currency,R),0);
  const totalGain=ug+rg+divs,gainPct=totalInv>0?(totalGain/totalInv)*100:0;
  const divYoc=totalInv>0?(divs/totalInv)*100:0;
  return{...h,qty,costBasis:cb,currentPrice:cpL,prevClose:pcL,currentValue:cv,unrealizedGain:ug,
    realizedGain:rg,totalDividends:divs,totalGain,gainPct,dayGain:dg,dayGainPct:dgPct,
    divYieldOnCost:divYoc,totalInvested:totalInv};
}

    inst.current=new Chart(ref.current,{type:"line",data:{labels,datasets},options:{spanGaps:spanGaps,responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:T.text2,font:{family:"Roboto",size:11},boxWidth:10,padding:12}},tooltip:{backgroundColor:T.bg3,borderColor:T.border,borderWidth:1,titleColor:T.text,bodyColor:T.text2,padding:10,cornerRadius:8,callbacks:{label:(ctx)=>{const fmt=ctx.dataset.yAxisID==="y2"&&y2Fmt?y2Fmt:yFmt||(v=>`${v}`);return` ${ctx.dataset.label}: ${fmt(ctx.parsed.y)}`;}}}},scales:scales,elements:{line:{tension:.4},point:{radius:2,hoverRadius:5}}}});
    return()=>{if(inst.current)inst.current.destroy();};
  },[labels,datasets,T,yFmt,y2Fmt]);
  return <div style={{height,position:"relative"}}><canvas ref={ref}/></div>;
}

function ChartBar({labels,datasets,T,yFmt,y2Fmt,height=200,stacked=false,lineDatasets=[]}){
  const ref=useRef(null);const inst=useRef(null);
  useEffect(()=>{
    if(!ref.current||typeof Chart==="undefined")return;
    if(inst.current)inst.current.destroy();
    const hasY2 = lineDatasets.length > 0 || y2Fmt != null;
    const barDatasets = datasets.map(ds => ({...ds, type:'bar'}));
    const lineDs = lineDatasets.map(ld => ({...ld, type:'line', yAxisID:'y2', borderWidth:2, pointRadius:2, fill:false, tension:0.3}));
    const allDatasets = [...barDatasets, ...lineDs];
    const scales = {
      x:{grid:{color:"transparent"},ticks:{color:T.chartTick,font:{size:10}},border:{color:T.border},stacked:stacked},
      y:{grid:{color:T.chartGrid},ticks:{color:T.chartTick,font:{size:10},callback:yFmt||(v=>`A$${v.toFixed(0)}`)},border:{color:T.border},stacked:stacked,position:'left'},
    };
    if(hasY2){
      scales.y2 = {
        grid:{drawOnChartArea:false},
        ticks:{color:'#06b6d4',font:{size:10},callback:y2Fmt},
        border:{color:T.border},
        position:'right',
      };
    }
    inst.current=new Chart(ref.current,{
      type:'bar',
      data:{labels,datasets:allDatasets},
      options:{
        responsive:true,maintainAspectRatio:false,
        plugins:{
          legend:{
            labels:{
              color:T.text2,font:{family:"Roboto",size:9},boxWidth:8,padding:6,
              filter:(item)=> item.datasetIndex < barDatasets.length
            }
          },
          tooltip:{
            backgroundColor:T.bg3,borderColor:T.border,borderWidth:1,titleColor:T.text,bodyColor:T.text2,padding:10,cornerRadius:8,
            callbacks:{
              label:(ctx)=>{
                const fmt = ctx.dataset.yAxisID==='y2' && y2Fmt ? y2Fmt : yFmt ? yFmt : (v=>`A$${v.toFixed(0)}`);
                return ` ${ctx.dataset.label}: ${fmt(ctx.parsed.y)}`;
              }
            }
          }
        },
        scales
      }
    });
    return()=>{if(inst.current)inst.current.destroy();};
  },[labels,datasets,T,yFmt,y2Fmt,stacked,lineDatasets]);
  return <div style={{height,position:"relative"}}><canvas ref={ref}/></div>;
}

    const capitalGain = endVal - startVal - topUps + netSales - divInPeriod;

                      </div>
                    ))}
                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:5}}>
                      <button onClick={()=>openTrade(selH,"buy")}  style={bS(T.greenBtn,"#fff",{padding:"7px 0",fontSize:11})}>Buy</button>
                      <button onClick={()=>openTrade(selH,"sell")} style={bS(T.redBtn,"#fff",{padding:"7px 0",fontSize:11})}>Sell</button>
                      <button onClick={()=>openDiv(selH)}          style={bS(T.tealBtn,"#fff",{padding:"7px 0",fontSize:11})}>💰 {selH.isBondPct?"Coupon":"Dividend"}</button>
                      <button onClick={()=>openHistory(selH)}      style={bO(T.text2,{padding:"7px 0",fontSize:11})}>📋 History</button>
                    </div>
                  </>
                ):(
                  <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:120,textAlign:"center"}}>
                    <div style={{fontSize:28,marginBottom:8,opacity:.4}}>👆</div>
                    <div style={{fontFamily:"'Space Mono',monospace",fontSize:11,color:T.text3,lineHeight:1.8}}>Tap any box<br/>to view details</div>
                  </div>
                )}
              </div>
            </div>
          )}
          {view==="table"&&(
            <div style={{overflowX:"auto",...card()}}>
              {/* table unchanged */}
            </div>
          )}
          {view==="chart"&&(
            <div style={{display:"flex",flexDirection:"column",gap:14}}>
              <div style={{display:"grid",gridTemplateColumns:isMob?"1fr 1fr":"repeat(5,1fr)",gap:10}}>
                {(()=>{
                  const totROI=totInv>0?((totVal+totDivs-totInv)/totInv)*100:0;
                  return[
                    ["Total Invested", FC(totInv),                              T.text2,       "💰", false],
                    ["Current Value",  FC(totVal),                              T.text,        "📈", false],
                    ["Total Gain/Loss",`${FG(totGain)}  ${fmtPct(totPct)}`,    pColor(totGain),"🏆", false],
                    ["Total Income",   `${FC(totDivs)}  ${fmtPct(divYieldOnly)} yld`,T.teal,        "🌱", false],
                    ["Total ROI",      fmtPct(totROI),                          pColor(totROI), "🎯", true],
                  ].map(([l,v,c,ic,fullRow])=>(
                    <div key={l} style={{...card({padding:"14px 16px"}),gridColumn:fullRow&&isMob?"1 / -1":"auto"}}>
                      <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:6}}>
                        <span style={{fontSize:16}}>{ic}</span>
                        <span style={{fontSize:10,color:T.text3,letterSpacing:1,textTransform:"uppercase",fontWeight:600}}>{l}</span>
                      </div>
                      <div style={{fontFamily:"'Space Mono',monospace",fontSize:13,fontWeight:700,color:c,whiteSpace:"pre-line",lineHeight:1.6}}>{v}</div>
                    </div>
                  ));
                })()}
              </div>
              <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                <span style={{fontSize:11,color:T.text3,fontWeight:500}}>Time period:</span>
                <div style={{display:"flex",gap:3,background:T.bg3,padding:3,borderRadius:10,border:`1px solid ${T.border}`}}>
                  {["1M","3M","6M","YTD","1Y","5Y"].map(p=>(
                    <button key={p} onClick={()=>setChartPeriod(p)} style={{padding:"5px 12px",borderRadius:7,border:"none",background:chartPeriod===p?`linear-gradient(135deg,#22c55e,#06b6d4)`:"transparent",color:chartPeriod===p?"#fff":T.text3,fontSize:11,fontWeight:chartPeriod===p?700:500,transition:"all .15s",cursor:"pointer"}}>{p}</button>
                  ))}
                </div>
                <span style={{fontSize:10,color:T.text3,marginLeft:4}}>{chartData.labels.length} data points</span>
              </div>
              <div className="chart-row" style={{display:"flex",gap:12,flexWrap:isMob?"wrap":"nowrap"}}>
                <div style={{flex:"2 1 280px",...card({padding:16})}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
                    <div>
                      <div style={{fontSize:12,fontWeight:600,color:T.text,marginBottom:2}}>Portfolio Value Over Time</div>
                      <div style={{fontSize:11,color:T.text3}}>{displayCur} · {chartPeriod} view</div>
                    </div>
                    {chartData.labels.length>=2&&<div style={{textAlign:"right"}}>
                      <div style={{fontSize:10,color:T.text3}}>Period return</div>
                      <div style={{fontFamily:"'Space Mono',monospace",fontSize:12,fontWeight:700,color:pColor(chartData.endVal-chartData.startVal)}}>{fmtPct(chartData.startVal>0?(chartData.endVal-chartData.startVal)/chartData.startVal*100:0)}</div>
                    </div>}
                  </div>
                  <ChartLine labels={chartData.labels} datasets={[
                    {label:"Portfolio Value",data:chartData.vals,borderColor:dark?"#22c55e":"#16a34a",backgroundColor:dark?"rgba(34,197,94,.07)":"rgba(22,163,74,.06)",fill:true,borderWidth:2,yAxisID:"y"},
                    {label:"Cum. Dividends / Coupons",data:chartData.divCumul,borderColor:dark?"#06b6d4":"#0891b2",backgroundColor:"transparent",borderDash:[5,4],borderWidth:1.5,yAxisID:"y2"}
                  ]} T={T} yFmt={yFmtD} y2Fmt={yFmtD} height={isMob?170:230}/>
                </div>
                <div style={{flex:"1 1 200px",...card({padding:16})}}>
                  <div style={{fontSize:12,fontWeight:600,color:T.text,marginBottom:2}}>Asset Allocation</div>
                  <div style={{fontSize:11,color:T.text3,marginBottom:12}}>by type · {displayCur}</div>
                  <ChartDoughnut labels={chartData.tLabels} data={chartData.tVals} colors={chartData.palette} T={T} height={isMob?180:230}/>
                </div>
              </div>
              <div className="chart-row" style={{display:"flex",gap:12,flexWrap:isMob?"wrap":"nowrap"}}>
                <div style={{flex:"2 1 280px",...card({padding:16})}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
                    <div>
                      <div style={{fontSize:12,fontWeight:600,color:T.text,marginBottom:2}}>📈 Monthly Dividend & Coupon Contributions</div>
                      <div style={{fontSize:11,color:T.text3}}>{chartData.mLabels.length} months · {chartPeriod} · {displayCur}</div>
                    </div>
                    {chartData.divCAGR!=null&&<div style={{textAlign:"right"}}>
                      <div style={{fontSize:9,color:T.text3,letterSpacing:.5,textTransform:"uppercase"}}>Dividend CAGR</div>
                      <div style={{fontFamily:"'Space Mono',monospace",fontSize:13,fontWeight:700,color:chartData.divCAGR>=0?T.green:T.red}}>{chartData.divCAGR>=0?"+":""}{chartData.divCAGR.toFixed(1)}%</div>
                      <div style={{fontSize:9,color:T.text3}}>{chartData.divCAGRYears}yr growth</div>
                    </div>}
                  </div>
                  <ChartBar
                    labels={chartData.mLabels}
                    datasets={chartData.mDatasets && chartData.mDatasets.length ? chartData.mDatasets : [{label:"Income",data:chartData.mVals,backgroundColor:dark?"rgba(6,182,212,.72)":"rgba(8,145,178,.6)",borderColor:dark?"#06b6d4":"#0891b2",borderWidth:1,borderRadius:5}]}
                    T={T} yFmt={yFmtD} y2Fmt={yFmtD} height={isMob?160:210}
                    stacked={!!(chartData.mDatasets && chartData.mDatasets.length>1)}
                    lineDatasets={[
                      {label:"Cumulative",data:chartData.cumDividends,borderColor:dark?"#06b6d4":"#0891b2",backgroundColor:"transparent",borderWidth:2,pointRadius:2}
                    ]}
                  />
                  <div style={{fontSize:9,color:T.text3,marginTop:6}}>Teal line = cumulative total dividends</div>
                </div>
                <div style={{flex:"1 1 200px",...card({padding:16})}}>
                  <div style={{fontSize:12,fontWeight:600,color:T.text,marginBottom:2}}>Currency Split</div>
                  <div style={{fontSize:11,color:T.text3,marginBottom:12}}>by holding currency · {displayCur}</div>
                  <ChartDoughnut labels={chartData.byCurLabels} data={chartData.byCurVals} colors={chartData.byCurColors} T={T} height={isMob?160:210}/>
                </div>
              </div>
              <div style={{...card({padding:16})}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12,flexWrap:"wrap",gap:8}}>
                  <div>
                    <div style={{fontSize:12,fontWeight:600,color:T.text,marginBottom:2}}>📦 Net Buy Tracker — {chartPeriod}</div>
                    <div style={{fontSize:11,color:T.text3}}>Buys minus sells per month (green = net accumulation, red = net withdrawal)</div>
                  </div>
                </div>
                <ChartBar
                  labels={chartData.netBuyMLabels}
                  datasets={[{
                    label:"Net Buy/Sell",
                    data:chartData.netBuyBars,
                    backgroundColor:chartData.netBuyBars.map(v=>v>=0?(dark?"#22c55e":"#16a34a"):(dark?"#ef4444":"#dc2626")),
                    borderColor:"transparent",
                    borderRadius:4
                  }]}
                  T={T} yFmt={yFmtD} y2Fmt={yFmtD}
                  height={isMob?180:210}
                  stacked={false}
                  lineDatasets={[
                    {label:"Cumulative Net",data:chartData.netBuyCumulative,borderColor:dark?"#6366f1":"#4f46e5",backgroundColor:"transparent",borderWidth:2,pointRadius:2}
                  ]}
                />
                <div style={{fontSize:9,color:T.text3,marginTop:6}}>Purple line = cumulative net flow</div>
              </div>
              <div style={{...card({padding:16})}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12,flexWrap:"wrap",gap:8}}>
                  <div>
                    <div style={{fontSize:12,fontWeight:600,color:T.text,marginBottom:2}}>📊 Growth Contributors — {chartPeriod}</div>
                    <div style={{fontSize:11,color:T.text3}}>Breakdown of what drove your portfolio value change</div>
                  </div>
                  <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>
                    {[["Start / End","#6366f155"],["Capital Gain","#22c55e"],["Capital Loss","#ef4444"],["Top-Up (Buy)","#22c55e"],["Dividends","#22c55e"]].map(([l,c])=>(
                      <div key={l} style={{display:"flex",alignItems:"center",gap:4}}>
                        <div style={{width:10,height:10,borderRadius:2,background:c}}/>
                        <span style={{fontSize:10,color:T.text3}}>{l}</span>
                      </div>
                    ))}
                  </div>
                </div>
                <ChartWaterfall data={chartData.waterfallData} T={T} yFmt={yFmtD} height={isMob?220:270}/>
                {chartData.waterfallData.length>1&&(()=>{
                  const wf=chartData.waterfallData;
                  const capItem=wf.find(d=>d.label==="Capital Gain"||d.label==="Capital Loss");
                  const topUp=wf.find(d=>d.label==="Top-Ups");
                  const divItem=wf.find(d=>d.label==="Dividends");
                  const total=chartData.endVal-chartData.startVal;
                  const pct=(v)=>total!==0?(v/Math.abs(total)*100).toFixed(0)+"%":"—";
                  return(
                    <div style={{display:"flex",gap:8,marginTop:12,flexWrap:"wrap"}}>
                      {[
                        ["💹 Capital G/L",capItem?.value??0,capItem?.value>=0?"#22c55e":"#ef4444",pct(capItem?.value??0)],
                        ["💸 Top-Ups",topUp?.value??0,"#6366f1",pct(topUp?.value??0)],
                        ["🌱 Dividends",divItem?.value??0,T.teal,pct(divItem?.value??0)],
                      ].map(([l,v,c,p])=>(
                        <div key={l} style={{background:T.bg4,border:`1px solid ${T.border}`,borderRadius:8,padding:"8px 12px",flex:"1 1 100px",minWidth:100}}>
                          <div style={{fontSize:10,color:T.text3,marginBottom:3}}>{l}</div>
                          <div style={{fontFamily:"'Space Mono',monospace",fontSize:12,fontWeight:700,color:c}}>{FC(v,true)}</div>
                          <div style={{fontSize:10,color:T.text3,marginTop:1}}>{p} of change</div>
                        </div>
                      ))}
                    </div>
                  );
                })()}
              </div>
              <div style={{...card({padding:16})}}>
                {/* Benchmark comparison unchanged */}
              </div>
            </div>
          )}
        </main>

        {/* Modals – all unchanged, not repeated */}
      </div>
    </ErrorBoundary>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
