<title>SAUDAGAR KAPITALIS — Investment Dashboard</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;width:100%;overflow-x:hidden}
  body{min-height:100vh;font-family:'Roboto','Segoe UI',system-ui,sans-serif;font-size:14px;
       -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:hidden;
       background:var(--bg,#121212);color:var(--text,#e8eaed);
       transition:background .25s,color .25s;

  .pulse{animation:pulse 1.5s ease-in-out infinite}

  .chart-row{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:12px;align-items:stretch}

  .hdr-mobile{display:none}
  .header-kpis{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
  .header-kpi{display:flex;flex-direction:column;min-width:64px;

  .header-kpi .label{font-size:9px;letter-spacing:1.1px;text-transform:uppercase;font-weight:600;
    color:var(--kpi-label,#9aa0a6)}
  .header-kpi .value{font-size:17px;font-weight:700;font-family:'Space Mono',monospace;
    letter-spacing:-0.3px;line-height:1.2}

    color:var(--sysinfo-color,#9aa0a6)}

  .income-risk-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:6px}

    background:linear-gradient(180deg,#34a853,#1a73e8);opacity:.6}
  .risk-card .label{font-size:9px;letter-spacing:1px;text-transform:uppercase;font-weight:600;

  .risk-card .value{font-size:16px;font-weight:700;font-family:'Space Mono',monospace;margin-top:2px;
    font-variant-numeric:tabular-nums}
  .risk-card .sub{font-size:10px;color:var(--text3,#9aa0a6);margin-top:1px;font-weight:400}

  .bf-sum-label{font-size:8px;color:var(--text3,#9aa0a6);letter-spacing:.8px;text-transform:uppercase;

<script type="text/babel">
const {useState,useMemo,useCallback,useEffect,useRef,useLayoutEffect}=React;

class ErrorBoundary extends React.Component{
  constructor(p){super(p);this.state={hasError:false,error:null};}
  static getDerivedStateFromError(e){return {hasError:true,error:e};}
  componentDidCatch(e,i){console.error("Error boundary:",e,i);}
  render(){
    if(this.state.hasError) return (
      <div style={{padding:20,color:"red",background:"#fff",fontFamily:"monospace"}}>
        <h2>Something went wrong.</h2>
        <pre style={{whiteSpace:"pre-wrap"}}>{this.state.error?.stack}</pre>
        <button onClick={()=>window.location.reload()}>Reload</button>
      </div>);
    return this.props.children;
  }
}

const ASSET_TYPES=["Shares / Stocks","ETF","Mutual Fund","Index Fund","Superannuation",
  "Bond – Government","Bond – Corporate","Bond – Indonesia (SBN)","Bond – Sharia (Sukuk)",
  "Commodity","Cryptocurrency","Forex","REIT / Property","Cash / Term Deposit","Other"];
const CURRENCIES=["AUD","IDR","USD"];
const DIVIDEND_PAYING_TYPES=new Set(["Shares / Stocks","ETF","Mutual Fund","Index Fund","Superannuation",
  "REIT / Property","Bond – Government","Bond – Corporate","Bond – Indonesia (SBN)","Bond – Sharia (Sukuk)"]);
const INCOME_RISK_EXCLUDED_TICKERS=new Set(["SHIB","BTC","GOLD","NUL5339AU","NUL7270AU"]);

const DARK={bg:"#121212",bg2:"#1e1e1e",bg3:"#2a2a2a",bg4:"#333",bg5:"#3d3d3d",border:"#3d3d3d",border2:"#555",
  text:"#e8eaed",text2:"#bdc1c6",text3:"#9aa0a6",text4:"#6c7278",green:"#81c995",greenBtn:"#34a853",

  cardBg:"#252525",hoverBg:"#333",kpiLabel:"#9aa0a6",sysinfoColor:"#9aa0a6",borderColor:"#3d3d3d"};
const LIGHT={bg:"#f1f3f4",bg2:"#fff",bg3:"#f8f9fa",bg4:"#e8eaed",bg5:"#dadce0",border:"#dadce0",border2:"#bdc1c6",
  text:"#202124",text2:"#3c4043",text3:"#5f6368",text4:"#80868b",green:"#1e8e3e",greenBtn:"#1a73e8",
  red:"#d93025",redBtn:"#d93025",teal:"#1a73e8",tealBtn:"#1a73e8",amber:"#e37400",amberBg:"#fef7e0",
  shadow:"0 2px 12px rgba(0,0,0,.12)",chartGrid:"rgba(0,0,0,.06)",chartTick:"#5f6368",
  cardBg:"#fff",hoverBg:"#f1f3f4",kpiLabel:"#5f6368",sysinfoColor:"#5f6368",borderColor:"#dadce0"};

function squarify(items,x,y,w,h){
  if(!items.length)return[];
  const r=[]; _layout(items,x,y,w,h,items.reduce((s,i)=>s+i.value,0),r); return r;
}
function _layout(it,x,y,w,h,tot,r){
  if(!it.length)return;
  if(it.length===1){r.push({...it[0],x,y,w,h});return;}
  const hz=w>=h, dim=hz?w:h; let row=[],rt=0,best=Infinity;
  for(let i=0;i<it.length;i++){
    row.push(it[i]); rt+=it[i].value;
    const rd=(rt/tot)*dim; let worst=0;
    for(const ri of row){const od=(ri.value/rt)*(hz?h:w); const ra=Math.max(rd/od,od/rd); if(ra>worst)worst=ra;}
    if(worst>best){row.pop();rt-=it[i].value;break;}
    best=worst;
  }
  const rd=(rt/tot)*dim; let cur=hz?y:x;
  for(const ri of row){const sz=(ri.value/rt)*(hz?h:w);
    hz?r.push({...ri,x,y:cur,w:rd,h:sz}):r.push({...ri,x:cur,y,w:sz,h:rd}); cur+=sz;}
  const rem=it.slice(row.length); if(!rem.length)return;
  const remT=tot-rt;
  hz?_layout(rem,x+rd,y,w-rd,h,remT,r):_layout(rem,x,y+rd,w,h-rd,remT,r);
}

function getPerformanceColor(pct,dark){
  const maxAbs=10;
  const clamped=Math.max(-maxAbs,Math.min(maxAbs,pct));
  const ratio=clamped/maxAbs;
  if(Math.abs(pct)<0.05) return {bg:dark?"#3d3d3d":"#e8eaed",text:dark?"#bdc1c6":"#3c4043",
    border:dark?"#555":"#bdc1c6"};
  const hue=((ratio+1)/2)*120, sat=75, light=dark?32:45;
  return {bg:`hsl(${hue},${sat}%,${light}%)`,text:"#fff",
    border:`hsl(${hue},${sat}%,${dark?22:35}%)`};
}
function getDividendColor(yieldPct,dark){
  const maxYield=8;
  const clamped=Math.max(0,Math.min(maxYield,yieldPct));
  const ratio=clamped/maxYield;
  if(yieldPct<=0.01) return {bg:dark?"#3d3d3d":"#e8eaed",text:dark?"#bdc1c6":"#3c4043",
    border:dark?"#555":"#bdc1c6"};
  const hue=50-ratio*20, sat=85, light=dark?38:52;
  return {bg:`hsl(${hue},${sat}%,${light}%)`,text:"#fff",
    border:`hsl(${hue},${sat}%,${dark?25:40}%)`};
}
const divColor=(y,d)=>getDividendColor(y,d);

const toAUD=(a,c,R)=>{if(c==="IDR")return a/R.AUD_IDR; if(c==="USD")return a/R.AUD_USD; return a;};
const fromAUD=(a,c,R)=>{if(c==="IDR")return a*R.AUD_IDR; if(c==="USD")return a*R.AUD_USD; return a;};
function fmtIDR(n){try{return Math.round(n).toLocaleString("id-ID");}catch{return Math.round(n).toString()
  .replace(/\B(?=(\d{3})+(?!\d))/g,".");}}
function fmtAUD(n){return Math.abs(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,",");}
function fmtCur(aud,dc,R,compact=false){
  const a=fromAUD(aud,dc,R);
  if(dc==="IDR"){const abs=Math.abs(a);
    if(compact&&abs>=1e9)return`Rp${(a/1e9).toFixed(1)}M`;
    if(compact&&abs>=1e6)return`Rp${(a/1e6).toFixed(1)}Jt`;
    if(compact&&abs>=1e3)return`Rp${(a/1e3).toFixed(0)}Rb`;
    return`Rp ${fmtIDR(a)}`;}
  if(dc==="USD"){const abs=Math.abs(a);
    if(compact&&abs>=1e6)return`US$${(a/1e6).toFixed(2)}M`;
    if(compact&&abs>=1e3)return`US$${(a/1e3).toFixed(1)}K`;
    return`US$${fmtAUD(a)}`;}
  const abs=Math.abs(a);
  if(compact&&abs>=1e6)return`A$${(a/1e6).toFixed(2)}M`;
  if(compact&&abs>=1e3)return`A$${(a/1e3).toFixed(1)}K`;
  return`A$${fmtAUD(a)}`;
}
function fmtGain(aud,dc,R){
  const a=fromAUD(aud,dc,R), sign=a>=0?"+":"-";
  if(dc==="IDR")return`${sign}Rp ${fmtIDR(Math.abs(a))}`;
  if(dc==="USD")return`${sign}US$${fmtAUD(a)}`;
  return`${sign}A$${fmtAUD(a)}`;
}
const fmtPct=n=>`${n>=0?"+":""}${n.toFixed(2)}%`;
const fmtDate=d=>{try{return new Date(d+"T12:00:00").toLocaleDateString("en-AU",{day:"2-digit",month:"short",year:"numeric"});}catch{return d;}};
const fmtMon=d=>{try{return new Date(d+"-01").toLocaleDateString("en-AU",{month:"short",year:"2-digit"});}catch{return d;}};
const fmtTime=d=>{if(!d)return"—";try{return d.toLocaleTimeString("en-AU",{hour:"2-digit",minute:"2-digit"});}catch{return"—";}};

  const ex=(exchange||"").toUpperCase().trim(); const at=assetType||""; const tk=ticker.toUpperCase();
  if(ex==="ASX")return tk+".AX";

function getHeldDays(h){
  const buys=h.transactions.filter(t=>t.type==="buy"&&t.date);
  if(!buys.length)return 0;
  const sorted=[...buys].sort((a,b)=>new Date(a.date)-new Date(b.date));
  const first=new Date(sorted[0].date).getTime();
  return Math.max(1,Math.floor((Date.now()-first)/86400000));
}
function getFirstBuyDate(h){
  const buys=h.transactions.filter(t=>t.type==="buy"&&t.date);
  if(!buys.length)return null;
  const sorted=[...buys].sort((a,b)=>new Date(a.date)-new Date(b.date));
  return sorted[0].date;
}
function fmtDur(d){
  if(d<30)return`${d}d`;
  if(d<365)return`${Math.floor(d/30)}mo`;
  const y=Math.floor(d/365.25);
  const m=Math.floor((d-y*365.25)/30);
  return m>0?`${y}y ${m}mo`:`${y}y`;
}

let _workingProxyIndex=-1;

function unwrapJina(t){
  if(typeof t!=="string")return t;
  const m=t.match(/Markdown Content:\s*([\s\S]*)$/);
  if(m)return m[1].trim();
  return t;
}

async function tryProxy(proxyUrl,timeoutMs){
  const r=await fetch(proxyUrl,{signal:AbortSignal.timeout(timeoutMs),credentials:"omit",mode:"cors"});
  if(!r.ok)throw new Error("HTTP "+r.status);
  let t=await r.text();
  if(!t||t.length<10)throw new Error("Empty response");
  t=unwrapJina(t);
  try{
    let parsed=JSON.parse(t);
    if(parsed?.contents&&typeof parsed.contents==="string")parsed=JSON.parse(parsed.contents);
    return parsed;
  }catch{return t;}
}

async function fetchWithProxy(url,timeoutMs=8000){
  const order=_workingProxyIndex>=0
    ?[_workingProxyIndex,...PROXIES.map((_,i)=>i).filter(i=>i!==_workingProxyIndex)]
    :PROXIES.map((_,i)=>i);
  const attempts=order.map(i=>tryProxy(PROXIES[i](url),timeoutMs).then(data=>({data,i})));
  try{
    const result=await Promise.any(attempts);
    _workingProxyIndex=result.i;
    return result.data;
  }catch{
    _workingProxyIndex=-1;
    throw new Error("All "+PROXIES.length+" proxies failed for "+url.split("?")[0]);
  }
}

async function fetchWithProxyRaw(url,timeoutMs=8000){
  const order=_workingProxyIndex>=0
    ?[_workingProxyIndex,...PROXIES.map((_,i)=>i).filter(i=>i!==_workingProxyIndex)]
    :PROXIES.map((_,i)=>i);
  const attempts=order.map(i=>
    fetch(PROXIES[i](url),{signal:AbortSignal.timeout(timeoutMs),credentials:"omit",mode:"cors"})
      .then(async r=>{
        if(!r.ok)throw new Error("HTTP "+r.status);
        const t=await r.text();
        if(!t||t.length<10)throw new Error("Empty");
        return{data:unwrapJina(t),i};
      })
  );
  try{
    const result=await Promise.any(attempts);
    _workingProxyIndex=result.i;
    return result.data;
  }catch{
    _workingProxyIndex=-1;
    throw new Error("All proxies failed (raw) for "+url.split("?")[0]);
  }
}

function toStooqSymbol(y){
  const s=y.toUpperCase();
  if(s.endsWith(".AX"))return s.replace(".AX",".AU").toLowerCase();
  if(s.endsWith(".JK"))return s.replace(".JK",".ID").toLowerCase();
  if(s==="GC=F")return"gc.f"; if(s==="SI=F")return"si.f"; if(s==="CL=F")return"cl.f";
  if(s.endsWith(".L")||s.endsWith(".SI")||s.endsWith(".TO")||s.endsWith(".HK"))return s.toLowerCase();
  if(!s.includes(".")&&!s.includes("-")&&!s.includes("="))return s.toLowerCase()+".us";
  return null;
}

async function fetchStooq(y){
  const stooq=toStooqSymbol(y); if(!stooq)throw new Error("No Stooq symbol");
  const now=new Date(), d1=new Date(now); d1.setDate(d1.getDate()-7);
  const fmt=d=>`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;
  const raw=await fetchWithProxyRaw(`https://stooq.com/q/d/l/?s=${stooq}&d1=${fmt(d1)}&d2=${fmt(now)}&i=d`);
  const lines=raw.trim().split("\n").map(l=>l.trim()).filter(Boolean);
  if(lines.length<2)throw new Error("Stooq: no data");
  const header=lines[0].toLowerCase().split(","), ci=header.indexOf("close");
  if(ci<0)throw new Error("Stooq: no Close col");
  const data=lines.slice(1).filter(l=>!/no data/i.test(l));
  if(!data.length)throw new Error("Stooq: empty");
  data.sort((a,b)=>a.split(",")[0].localeCompare(b.split(",")[0]));
  const parse=l=>parseFloat(l.split(",")[ci])||0;
  const cur=parse(data[data.length-1]), prev=data.length>1?parse(data[data.length-2]):cur;
  if(!cur)throw new Error("Stooq: zero");
  return {current:cur,prev};
}

async function fetchYahooPrice(symbol){
  const sym=encodeURIComponent(symbol);
  const parseChart=d=>{
    const res=d?.chart?.result?.[0]; if(!res)return null;
    const ts=res.timestamp, cl=res.indicators?.quote?.[0]?.close;
    if(!ts||!cl||ts.length<2)return null;
    const p=cl[cl.length-2], c=cl[cl.length-1];
    return p&&c?{current:c,prev:p}:null;
  };
  try{
    const data=await fetchWithProxy(`https://query1.finance.yahoo.com/v8/finance/chart/${sym}?interval=1d&range=2d&includePrePost=false`);
    const r=parseChart(data); if(r?.current>0&&r.prev>0)return r;
  }catch(e){}
  try{
    const data=await fetchWithProxy(YAHOO_V7+sym+"&fields=regularMarketPrice,regularMarketPreviousClose");
    const q=data?.quoteResponse?.result?.[0]||data?.result?.[0];
    if(q?.regularMarketPrice&&q?.regularMarketPreviousClose)
      return {current:q.regularMarketPrice,prev:q.regularMarketPreviousClose};
  }catch(e){}
  for(const url of [YAHOO_BASE+sym+"?interval=1d&range=2d",YAHOO_BASE1+sym+"?interval=1d&range=2d"]){
    try{const r=parseChart(await fetchWithProxy(url)); if(r?.current>0&&r.prev>0)return r;}catch(e){}
  }
  try{const r=await fetchStooq(symbol); if(r?.current>0)return r;}catch(e){}
  throw new Error("All price sources failed for "+symbol);
}

async function fetchDJPPRPrice(seriSBN){
  const sn=seriSBN.toUpperCase().trim();
  const idxSingle=[`https://api-apps.idx.co.id/api/Bond/GetBondData?BondCode=${sn}`,
    `https://api-apps.idx.co.id/api/Bond/GetBondSummary?StockCode=${sn}`];
  const bondPrice=o=>{
    if(!o||typeof o!=="object")return 0;
    const keys=Object.keys(o);
    for(const n of["ClosePrice","LastPrice","Price","Close","Bid","Ask"]){
      const k=keys.find(k=>k.toLowerCase()===n.toLowerCase());
      if(k&&parseFloat(o[k])>0)return parseFloat(o[k]);
    } return 0;
  };
  for(const url of idxSingle){
    try{
      const r=await fetch(url,{signal:AbortSignal.timeout(6000)});
      if(!r.ok)continue;
      const d=await r.json(); const item=d?.data||d?.Data||d;
      const obj=Array.isArray(item)?item[0]:item;
      if(obj){const c=bondPrice(obj); if(c>0)return{current:c,prev:c};}
    }catch(e){}
  }
  try{
    const d=await fetchWithProxy(`https://www.phei.co.id/api/bond/price?code=${sn}`,6000);
    const item=d?.data||d;
    const c=parseFloat(item?.price||item?.cleanPrice||0);
    if(c>0)return{current:c,prev:c};
  }catch(e){}
  throw new Error(sn+": bond price unavailable");
}

function computeHolding(h,prices,prevPrices,R){
  let qty=0,cbL=0,rgL=0,lots=[],divL=0;
  const txs=[...h.transactions].sort((a,b)=>new Date(a.date)-new Date(b.date));
  for(const tx of txs){
    if(tx.type==="buy"){lots.push({qty:tx.qty,price:tx.price});qty+=tx.qty;cbL+=tx.qty*tx.price;}
    else if(tx.type==="sell"){
      let rem=tx.qty; qty-=tx.qty;
      while(rem>0&&lots.length){const lot=lots[0],u=Math.min(lot.qty,rem);
        rgL+=u*(tx.price-lot.price); cbL-=u*lot.price; lot.qty-=u; rem-=u; if(lot.qty===0)lots.shift();}
    } else if(tx.type==="dividend"){divL+=tx.totalAmount||0;}
  }
  const cpL=prices[h.ticker]??0, pcL=prevPrices[h.ticker]??cpL;
  const cvL=qty*cpL, ugL=cvL-cbL, dgL=(cpL-pcL)*qty, dgPct=pcL>0?(cpL-pcL)/pcL*100:0;
  const cv=toAUD(cvL,h.currency,R), cb=toAUD(cbL,h.currency,R), ug=toAUD(ugL,h.currency,R);
  const rg=toAUD(rgL,h.currency,R), divs=toAUD(divL,h.currency,R), dg=toAUD(dgL,h.currency,R);
  const totalInv=txs.filter(t=>t.type==="buy").reduce((s,t)=>s+toAUD(t.qty*t.price,h.currency,R),0);
  const totalGain=ug+rg+divs, gainPct=totalInv>0?(totalGain/totalInv)*100:0;
  const divYoc=totalInv>0?(divs/totalInv)*100:0;
  return {...h,qty,costBasis:cb,currentPrice:cpL,prevClose:pcL,currentValue:cv,unrealizedGain:ug,
    realizedGain:rg,totalDividends:divs,totalGain,gainPct,dayGain:dg,dayGainPct:dgPct,
    divYieldOnCost:divYoc,totalInvested:totalInv};
}

let globalIdCounter=Date.now();
function repairPortfolio(p){
  if(!Array.isArray(p))return[];
  const seen=new Set();
  return p.map(h=>{
    let id=h.id;
    if(!id||typeof id!=="number"||isNaN(id)||seen.has(id))id=++globalIdCounter;
    seen.add(id);
    let tx=h.transactions; if(!Array.isArray(tx))tx=[];
    tx=tx.filter(t=>t&&typeof t==="object");
    return {...h,id,transactions:tx};
  });
}

function makeSeedHistory(){
  const h=[];
  const now=new Date();
  let val=42000;
  let divs=0;
  const WEEKS=78;
  for(let i=WEEKS;i>=0;i--){
    const d=new Date(now);
    d.setDate(d.getDate()-i*7);
    const drift=110;
    const noise=(Math.random()-0.48)*1800;
    const dip=(i%17===0&&i>0)?-900:0;
    val=Math.max(22000,val+drift+noise+dip);
    if(i%5===0)divs+=180+Math.random()*420;
    h.push({
      date:d.toISOString().slice(0,10),
      totalValueAUD:Math.round(val),
      totalDividendsAUD:Math.round(divs)
    });
  }
  return h;
}

  useEffect(()=>{const h=()=>setW(window.innerWidth); window.addEventListener("resize",h);
    return()=>window.removeEventListener("resize",h);},[]);
  return w;
}

function ChartLine({labels,datasets,T,yFmt,y2Fmt,height=220,spanGaps=false,mobile=false}){
  const ref=useRef(null);
  const inst=useRef(null);

    try{return JSON.stringify({l:labels,d:datasets.map(d=>({y:d.yAxisID||"y",data:d.data}))});}
    catch{return String(Date.now());}
  },[labels,datasets]);

  useEffect(()=>{
    if(!ref.current||typeof Chart==="undefined")return;
    if(inst.current){inst.current.destroy();inst.current=null;}
    const hasY2=y2Fmt&&datasets.some(d=>d.yAxisID==="y2");
    const tickSize=mobile?11:10;
    const maxTicks=mobile?5:8;
    const scales={
      x:{grid:{color:T.chartGrid},
         ticks:{color:T.chartTick,font:{size:tickSize,weight:"500"},maxRotation:0,
           autoSkip:true,maxTicksLimit:maxTicks},
         border:{color:T.border}},
      y:{grid:{color:T.chartGrid},
         ticks:{color:T.chartTick,font:{size:tickSize,weight:"500"},callback:yFmt||(v=>`${v}`)},
         border:{color:T.border},position:"left",beginAtZero:false},
    };
    if(hasY2){
      scales.y2={grid:{drawOnChartArea:false},
        ticks:{color:dark?T.teal:"#1a73e8",font:{size:tickSize,weight:"500"},callback:y2Fmt},
        border:{color:T.border},position:"right",beginAtZero:true};
    }
    inst.current=new Chart(ref.current,{
      type:"line",
      data:{labels,datasets},
      options:{
        spanGaps,responsive:true,maintainAspectRatio:false,
        animation:{duration:280},
        interaction:{mode:"index",intersect:false},
        plugins:{
          legend:{display:true,
            labels:{color:T.text2,font:{family:"Roboto",size:mobile?10:11,weight:"500"},
                    boxWidth:10,padding:mobile?8:12,usePointStyle:true}},
          tooltip:{backgroundColor:T.bg2,borderColor:T.border,borderWidth:1,
            titleColor:T.text,bodyColor:T.text2,padding:10,cornerRadius:8,
            callbacks:{label:(ctx)=>{
              const fmt=ctx.dataset.yAxisID==="y2"&&y2Fmt?y2Fmt:yFmt||(v=>`${v}`);
              return` ${ctx.dataset.label}: ${fmt(ctx.parsed.y)}`;
            }}},
        },
        scales,
        elements:{line:{tension:0.4},point:{radius:2,hoverRadius:5}},
      },
    });
    return()=>{if(inst.current){inst.current.destroy();inst.current=null;}};
  },[sig,T,yFmt,y2Fmt,spanGaps,mobile]);

function ChartWaterfall({data,T,yFmt,height=240,mobile=false}){
  const ref=useRef(null);
  const inst=useRef(null);
  const sig=useMemo(()=>JSON.stringify(data),[data]);
  useEffect(()=>{
    if(!ref.current||typeof Chart==="undefined"||!data.length)return;
    if(inst.current){inst.current.destroy();inst.current=null;}
    const labels=data.map(d=>d.label);
    let running=data[0]?.value||0;
    const bases=[],tops=[],bgColors=[],borderColors=[];
    const intermediateMins=[],intermediateMaxs=[];
    data.forEach(d=>{
      if(d.type==="pos"||d.type==="neg"){
        intermediateMins.push(Math.min(running,running+d.value));
        intermediateMaxs.push(Math.max(running,running+d.value));
      }
    });
    running=data[0]?.value||0;
    data.forEach(d=>{
      if(d.type==="start"){bases.push(0);tops.push(d.value);bgColors.push("#6366f177");borderColors.push("#6366f1");}
      else if(d.type==="total"){bases.push(0);tops.push(d.value);
        bgColors.push(d.value>=(data[0]?.value??0)?"#6366f1":"#ef4444");
        borderColors.push(d.value>=(data[0]?.value??0)?"#818cf8":"#f87171");}
      else if(d.type==="pos"){bases.push(running);tops.push(running+d.value);
        bgColors.push("#34a853");borderColors.push("#66bb6a");running+=d.value;}
      else{bases.push(running+d.value);tops.push(running);
        bgColors.push("#ea4335");borderColors.push("#f28b82");running+=d.value;}
    });
    const floatData=bases.map((b,i)=>[Math.min(b,tops[i]),Math.max(b,tops[i])]);
    const allIntermediate=[...intermediateMins,...intermediateMaxs];
    const interMin=allIntermediate.length?Math.min(...allIntermediate):0;
    const interMax=allIntermediate.length?Math.max(...allIntermediate):0;
    const interRange=interMax-interMin;
    const startVal=data[0]?.value??0, endVal=data[data.length-1]?.value??0;
    const bigVal=Math.max(startVal,endVal);
    const useCompressed=interRange>0&&interRange/bigVal<0.15&&bigVal>0;
    const yMin=useCompressed?Math.max(0,interMin-interRange*2):0;
    const yMax=useCompressed?Math.min(bigVal,interMax+interRange*2):bigVal*1.05;
    const tickSize=mobile?11:10;
    inst.current=new Chart(ref.current,{
      type:"bar",
      data:{labels,datasets:[{data:floatData,backgroundColor:bgColors,borderColor:borderColors,
        borderWidth:1.5,borderRadius:4,borderSkipped:false}]},
      options:{
        responsive:true,maintainAspectRatio:false,animation:{duration:280},
        plugins:{
          legend:{display:false},

            bodyColor:T.text2,padding:10,cornerRadius:8,
            callbacks:{label:(ctx)=>{const d2=data[ctx.dataIndex],v=d2.value;
              const sign=v>=0?"+":"";
              const pct=data[0]?.value?((v/Math.abs(data[0].value))*100).toFixed(1):0;
              return`${sign}${yFmt?yFmt(Math.abs(v)):"A$"+(Math.abs(v)/1000).toFixed(1)+"K"} (${sign}${pct}%)`;}}},
        },
        scales:{
          x:{grid:{color:"transparent"},ticks:{color:T.chartTick,font:{size:tickSize,weight:"500"},
            maxRotation:0,autoSkip:true},border:{color:T.border}},
          y:{grid:{color:T.chartGrid},ticks:{color:T.chartTick,font:{size:tickSize,weight:"500"},
            callback:yFmt||(v=>`A$${(v/1000).toFixed(0)}K`)},border:{color:T.border},
            ...(useCompressed?{min:yMin,max:yMax}:{})},
        },
      },
    });
    return()=>{if(inst.current){inst.current.destroy();inst.current=null;}};
  },[sig,T,yFmt,mobile]);
  return (
    <div className="chart-wrap" style={{height}}>

const COL={
  ticker:["ticker","symbol","stock code","scrip","stock ticker","asx code","idx code","security code"],
  name:["name","company","company name","security name","description","instrument","issuer"],
  type:["type","transaction type","tx type","txtype","tx_type","action","trade type"],
  date:["date","trade date","settlement date","payment date","tx date","transaction date","value date"],
  qty:["qty","quantity","units","volume","lots","number of shares","number of units","unit count"],
  price:["price","unit price","trade price","cost price","nav","purchase price","sale price"],
  currency:["currency","ccy","cur","denomination"],
  assetType:["asset type","asset_type","asset class","category","class","security type","instrument type"],
  exchange:["exchange","market","listing","exchange code","exch","bourse"],
  yahooSymbol:["yahoo","yahoo symbol","yahoo_symbol","yfinance","yf symbol","yahoo finance"],
  faceValue:["face value","face_value","nominal","nominal value","par value","par"],
  isBondPct:["is bond","isbond","bond pct","bond %","fixed rate bond","is_bond"],
  entitledQty:["entitled qty","entitled units","entitled shares","entitled","ex date units",
    "qualifying units","qualifying shares"],
  amountPerShare:["amount per share","div per share","coupon per unit","dividend per share",
    "dividend rate","coupon rate","div rate","rate per unit","distribution per unit"],
  totalAmount:["total amount","total dividend","total coupon","gross amount","total distribution","dividend total"],
};
function resolveHeader(raw){
  if(!raw&&raw!==0)return null;
  const norm=s=>String(s).toLowerCase().trim().replace(/[_\-]/g," ").replace(/\s+/g," ");
  const lo=norm(raw);
  for(const[f,al]of Object.entries(COL))if(al.map(norm).includes(lo))return f;
  for(const[f,al]of Object.entries(COL))for(const a of al){
    const na=norm(a);
    const re=new RegExp("(^|[\\s/])"+na.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"([\\s/]|$)");
    if(re.test(lo))return f;
  }
  return null;
}
function normaliseType(raw=""){
  const lo=raw.toLowerCase().trim();
  if(["buy","purchase","bought","b","top up","topup","top-up","add"].includes(lo))return"buy";
  if(["sell","sale","sold","s","disposal","withdraw"].includes(lo))return"sell";
  if(["div","dividend","dividends","income","distribution","coupon","interest","yield","d"].includes(lo))return"dividend";
  return null;
}
function normaliseDate(raw=""){
  if(!raw)return"";
  if(typeof raw==="number"){const d=new Date(Math.round((raw-25569)*86400*1000));return d.toISOString().slice(0,10);}
  const s=String(raw).trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);
  const m1=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);
  if(m1){const[,d,mo,y]=m1;return`${y}-${mo.padStart(2,"0")}-${d.padStart(2,"0")}`;}
  const dt=new Date(s);
  if(!isNaN(dt))return dt.toISOString().slice(0,10);
  return s;
}
function normaliseCurrency(raw=""){
  const lo=String(raw).toUpperCase().trim();
  if(["AUD","A$","AU"].includes(lo))return"AUD";
  if(["IDR","RP","RUPIAH"].includes(lo))return"IDR";
  if(["USD","US$","$"].includes(lo))return"USD";
  return lo||"AUD";
}
function normaliseAssetType(raw=""){
  const lo=raw.toLowerCase().trim();
  const map={"shares":"Shares / Stocks","stocks":"Shares / Stocks","share":"Shares / Stocks",
    "stock":"Shares / Stocks","equity":"Shares / Stocks","etf":"ETF","exchange traded fund":"ETF",
    "mutual fund":"Mutual Fund","unit trust":"Mutual Fund","reksadana":"Mutual Fund","index fund":"Index Fund",
    "super":"Superannuation","superannuation":"Superannuation","bond":"Bond – Government",
    "govt bond":"Bond – Government","government bond":"Bond – Government","sbn":"Bond – Indonesia (SBN)",
    "sukuk":"Bond – Sharia (Sukuk)","sharia bond":"Bond – Sharia (Sukuk)","pbs":"Bond – Sharia (Sukuk)",
    "commodity":"Commodity","commodities":"Commodity","gold":"Commodity","silver":"Commodity",
    "crypto":"Cryptocurrency","cryptocurrency":"Cryptocurrency","bitcoin":"Cryptocurrency",
    "token":"Cryptocurrency","forex":"Forex","fx":"Forex","currency":"Forex","reit":"REIT / Property",
    "property":"REIT / Property","real estate":"REIT / Property","cash":"Cash / Term Deposit",
    "td":"Cash / Term Deposit","term deposit":"Cash / Term Deposit","deposit":"Cash / Term Deposit"};
  for(const[k,v]of Object.entries(map))if(lo.includes(k))return v;
  return ASSET_TYPES.find(t=>t.toLowerCase()===lo)||raw||"Shares / Stocks";
}
function parseRows(rawRows){
  if(!rawRows.length)return{rows:[],errors:[],fieldMap:{}};
  const sampleKeys=Object.keys(rawRows[0]);
  const fieldMap={};
  sampleKeys.forEach(k=>{const f=resolveHeader(k);if(f)fieldMap[f]=k;});
  const rows=[],errors=[];
  rawRows.forEach((raw,i)=>{
    const row={};
    const R=n=>fieldMap[n]?String(raw[fieldMap[n]]??"").trim():"";
    const RN=n=>fieldMap[n]?parseFloat(String(raw[fieldMap[n]]??"").replace(/[^\d.\-]/g,""))||0:0;
    row.ticker=(R("ticker")||"").toUpperCase();
    row.type=normaliseType(R("type"));
    row.date=normaliseDate(fieldMap["date"]?raw[fieldMap["date"]]:"");
    row.qty=RN("qty");row.price=RN("price");
    row.name=R("name")||row.ticker;
    row.currency=normaliseCurrency(R("currency"));
    row.assetType=normaliseAssetType(R("assetType"));
    row.exchange=R("exchange");row.yahooSymbol=R("yahooSymbol");
    row.faceValue=RN("faceValue")||null;
    row.isBondPct=["true","yes","1","y"].includes(R("isBondPct").toLowerCase());
    row.entitledQty=RN("entitledQty")||null;
    row.amountPerShare=RN("amountPerShare");row.totalAmount=RN("totalAmount");
    const errs=[];
    if(!row.ticker)errs.push("Missing ticker");
    if(!row.type)errs.push(`Unknown type "${R("type")}"`);
    if(!row.date)errs.push("Missing date");
    if(row.type==="buy"||row.type==="sell"){
      if(!row.qty||row.qty<=0)errs.push("qty must be > 0");
      if(!row.price||row.price<=0)errs.push("price must be > 0");
    }
    if(row.type==="dividend"&&!row.amountPerShare&&!row.totalAmount)
      errs.push("Need amount per share or total amount");
    row._rowNum=i+2;row._errors=errs;rows.push(row);
    if(errs.length)errors.push({rowNum:i+2,ticker:row.ticker,errs});
  });
  return{rows,errors,fieldMap};
}
function buildPortfolioFromRows(parsedRows,existing=[]){
  const repaired=repairPortfolio(existing);
  const portfolio=repaired.map(h=>({...h,transactions:[...h.transactions]}));
  const valid=parsedRows.filter(r=>!r._errors.length);
  valid.forEach(row=>{
    let h=portfolio.find(p=>p.ticker===row.ticker);
    if(!h){
      h={id:Date.now()+Math.random()*1000,ticker:row.ticker,name:row.name||row.ticker,
        currency:row.currency||"AUD",assetType:row.assetType||"Shares / Stocks",
        exchange:row.exchange||"",
        yahooSymbol:row.yahooSymbol||suggestYahoo(row.ticker,row.exchange,row.assetType),
        transactions:[]};
      if(row.isBondPct)h.isBondPct=true;
      if(row.faceValue)h.faceValue=row.faceValue;
      portfolio.push(h);
    }
    if(row.type==="buy"||row.type==="sell"){
      h.transactions.push({type:row.type,qty:row.qty,price:row.price,date:row.date});
    }else if(row.type==="dividend"){
      const eq=row.entitledQty||row.qty||null;
      let total=row.totalAmount||0;
      if(!total&&row.amountPerShare&&eq)total=row.amountPerShare*eq;
      h.transactions.push({type:"dividend",amountPerShare:row.amountPerShare,totalAmount:total,
        ...(eq?{entitledQty:eq}:{}),date:row.date});
    }
  });
  portfolio.forEach(h=>h.transactions.sort((a,b)=>new Date(a.date)-new Date(b.date)));
  return repairPortfolio(portfolio);
}
function readFileAsRows(file){
  return new Promise((resolve,reject)=>{
    const ext=file.name.split(".").pop().toLowerCase();
    if(ext==="csv"||ext==="txt"){
      const rd=new FileReader();
      rd.onload=e=>{const r=Papa.parse(e.target.result,{header:true,skipEmptyLines:true,dynamicTyping:false});
        resolve(r.data);};
      rd.onerror=reject; rd.readAsText(file);
    }else if(["xlsx","xls","ods"].includes(ext)){
      const rd=new FileReader();
      rd.onload=e=>{const wb=XLSX.read(e.target.result,{type:"array",cellDates:false});
        const ws=wb.Sheets[wb.SheetNames[0]];
        resolve(XLSX.utils.sheet_to_json(ws,{defval:"",raw:true}));};
      rd.onerror=reject; rd.readAsArrayBuffer(file);
    }else reject(new Error("Unsupported file type: ."+ext));
  });
}

function computeRiskMetrics(hist){
  if(!hist||hist.length<3)return{volatility:null,maxDrawdown:null,bestMonth:null,worstMonth:null};
  const sorted=[...hist].sort((a,b)=>new Date(a.date)-new Date(b.date));
  const vals=sorted.map(d=>d.totalValueAUD);
  const rets=[];
  for(let i=1;i<vals.length;i++)if(vals[i-1]>0){
    let r=(vals[i]-vals[i-1])/vals[i-1];
    if(r>1)r=1; if(r<-1)r=-1;
    rets.push(r);
  }
  if(rets.length<2)return{volatility:null,maxDrawdown:null,bestMonth:null,worstMonth:null};
  const mean=rets.reduce((s,r)=>s+r,0)/rets.length;
  const variance=rets.reduce((s,r)=>s+(r-mean)**2,0)/rets.length;
  const vol=Math.sqrt(variance)*Math.sqrt(12);
  let peak=vals[0], maxDD=0;
  for(const v of vals){if(v>peak)peak=v; const dd=peak>0?(peak-v)/peak:0; if(dd>maxDD)maxDD=dd;}
  const mr=[];
  for(let i=1;i<vals.length;i++){
    let r=vals[i-1]>0?(vals[i]-vals[i-1])/vals[i-1]:0;
    if(r>1)r=1; if(r<-1)r=-1;
    mr.push({date:sorted[i].date,ret:r});
  }
  const best=mr.reduce((a,b)=>a.ret>b.ret?a:b,{ret:-Infinity});
  const worst=mr.reduce((a,b)=>a.ret<b.ret?a:b,{ret:Infinity});
  return {volatility:vol*100,maxDrawdown:maxDD*100,
    bestMonth:best.ret!==-Infinity?{date:best.date,ret:best.ret*100}:null,
    worstMonth:worst.ret!==Infinity?{date:worst.date,ret:worst.ret*100}:null};
}

function computeIncomeRiskMetrics(portfolio,rates){
  if(!Array.isArray(portfolio))return{totalIncome:0,stability:null,payoutRisk:null,cutProb:null,
    concentration:null,dividendGrowth:null};
  const divHoldings=portfolio.filter(h=>DIVIDEND_PAYING_TYPES.has(h.assetType)&&
    !INCOME_RISK_EXCLUDED_TICKERS.has(h.ticker));
  if(!divHoldings.length)return{totalIncome:0,stability:null,payoutRisk:null,cutProb:null,
    concentration:null,dividendGrowth:null};
  const quarterly={},holdingTotal={},yearly={};
  for(const h of divHoldings){
    const tx=h.transactions.filter(t=>t.type==="dividend"&&t.date);
    for(const t of tx){
      const d=new Date(t.date), q=Math.floor(d.getMonth()/3)+1;
      const qk=`${d.getFullYear()}-Q${q}`, y=String(d.getFullYear());
      const amt=toAUD(t.totalAmount||0,h.currency,rates);
      quarterly[qk]=(quarterly[qk]||0)+amt;
      yearly[y]=(yearly[y]||0)+amt;
      holdingTotal[h.ticker]=(holdingTotal[h.ticker]||0)+amt;
    }
  }
  const qks=Object.keys(quarterly).sort();
  if(qks.length<3)return{totalIncome:0,stability:null,payoutRisk:null,cutProb:null,
    concentration:null,dividendGrowth:null};
  const vals=qks.map(k=>quarterly[k]);
  const mean=vals.reduce((a,b)=>a+b,0)/vals.length;
  const std=Math.sqrt(vals.reduce((s,v)=>s+(v-mean)**2,0)/vals.length);
  const cv=mean>0?std/mean:1;
  const stability=Math.max(0,Math.min(1,1-Math.min(cv,1)));
  let peak=-Infinity,maxDD=0;
  for(const v of vals){if(v>peak)peak=v; if(peak>0){const dd=(peak-v)/peak; if(dd>maxDD)maxDD=dd;}}
  const payoutRisk=Math.min(1,maxDD);
  let cutProb;
  if(stability>0.7&&payoutRisk<0.3)cutProb="Low";
  else if(stability>0.5&&payoutRisk<0.5)cutProb="Low–Medium";
  else if(payoutRisk<0.6)cutProb="Medium";
  else if(payoutRisk<0.75)cutProb="Medium–High";
  else cutProb="High";
  const sortedInc=Object.values(holdingTotal).sort((a,b)=>b-a);
  const top3=sortedInc.slice(0,3).reduce((s,v)=>s+v,0);
  const total=sortedInc.reduce((s,v)=>s+v,0);
  const concentration=total>0?top3/total:0;
  const years=Object.keys(yearly).sort();
  let dividendGrowth=null;
  if(years.length>=2){
    const fy=years[0], ly=years[years.length-1];
    const fv=yearly[fy], lv=yearly[ly];
    const n=parseInt(ly)-parseInt(fy);
    if(n>0&&fv>0&&lv>0)dividendGrowth=(Math.pow(lv/fv,1/n)-1)*100;
  }
  return {totalIncome:total,stability,payoutRisk,cutProb,concentration,dividendGrowth,
    quarters:qks,incomeValues:vals};
}

    const qVals=qKeys.map(k=>qMap[k]);

    const divYears={};
    portfolio.forEach(h=>h.transactions.forEach(tx=>{
      if(tx.type==="dividend"&&tx.date){
        const y=tx.date.slice(0,4);
        divYears[y]=(divYears[y]||0)+toAUD(tx.totalAmount||0,h.currency,rates);
      }
    }));
    const yearKeys=Object.keys(divYears).sort();
    let divCAGR_val=null,divCAGRYears=0;
    if(yearKeys.length>=2){
      const f=yearKeys[0], l=yearKeys[yearKeys.length-1];
      const fv=divYears[f], lv=divYears[l];
      const n=parseInt(l)-parseInt(f);
      if(n>0&&fv>0){divCAGR_val=(Math.pow(lv/fv,1/n)-1)*100;divCAGRYears=n;}
    }

    const waterfallData=[];
    if(sorted.length>=2){
      const fw=sorted[0]?.totalValueAUD||0, lw=sorted[sorted.length-1]?.totalValueAUD||0;
      waterfallData.push({label:"Start",value:fw,type:"start"});
      const buys={},sells={},divs={};
      portfolio.forEach(h=>h.transactions.forEach(tx=>{
        if(tx.type==="buy"){
          const d=tx.date||"1900-01-01";
          if(d>=cutoffStr)buys[h.ticker]=(buys[h.ticker]||0)+toAUD(tx.qty*tx.price,h.currency,rates);
        }else if(tx.type==="sell"){
          const d=tx.date||"1900-01-01";
          if(d>=cutoffStr)sells[h.ticker]=(sells[h.ticker]||0)+toAUD(tx.qty*tx.price,h.currency,rates);
        }else if(tx.type==="dividend"){
          const d=tx.date||"1900-01-01";
          if(d>=cutoffStr)divs[h.ticker]=(divs[h.ticker]||0)+toAUD(tx.totalAmount||0,h.currency,rates);
        }
      }));
      const tB=Object.values(buys).reduce((a,b)=>a+b,0);
      const tS=Object.values(sells).reduce((a,b)=>a+b,0);
      const tD=Object.values(divs).reduce((a,b)=>a+b,0);
      const cg=lw-fw-tB+tS-tD;
      if(Math.abs(tB)>0.01)waterfallData.push({label:"Top-Ups",value:tB,type:"pos"});
      if(Math.abs(tS)>0.01)waterfallData.push({label:"Withdrawals",value:-tS,type:"neg"});
      if(Math.abs(tD)>0.01)waterfallData.push({label:"Dividends",value:tD,type:"pos"});
      if(Math.abs(cg)>0.01)waterfallData.push({label:cg>=0?"Capital Gain":"Capital Loss",
        value:cg,type:cg>=0?"pos":"neg"});
      waterfallData.push({label:"End",value:lw,type:"total"});
    }

    const buyFlowMap={};
    portfolio.forEach(h=>h.transactions.forEach(tx=>{
      if(!tx.date||tx.date<cutoffStr)return;
      if(tx.type!=="buy"&&tx.type!=="sell")return;
      const m=tx.date.slice(0,7);
      if(!buyFlowMap[m])buyFlowMap[m]={buys:0,sells:0,buyCount:0,sellCount:0};
      const amt=toAUD((tx.qty||0)*(tx.price||0),h.currency,rates);
      if(tx.type==="buy"){buyFlowMap[m].buys+=amt;buyFlowMap[m].buyCount++;}
      else{buyFlowMap[m].sells+=amt;buyFlowMap[m].sellCount++;}
    }));
    const bfMonths=Object.keys(buyFlowMap).sort();
    const bfLabels=bfMonths.map(m=>fmtMon(m));
    const bfBuys=bfMonths.map(m=>buyFlowMap[m].buys);
    const bfSells=bfMonths.map(m=>-buyFlowMap[m].sells);
    let runningNet=0;
    const bfCumulative=bfMonths.map(m=>{
      runningNet+=buyFlowMap[m].buys-buyFlowMap[m].sells;
      return runningNet;
    });
    const bfTotalBought=bfBuys.reduce((s,v)=>s+v,0);
    const bfTotalSold=Object.values(buyFlowMap).reduce((s,v)=>s+v.sells,0);
    const bfNetDeployed=bfTotalBought-bfTotalSold;
    const bfBuyCount=Object.values(buyFlowMap).reduce((s,v)=>s+v.buyCount,0);
    const bfSellCount=Object.values(buyFlowMap).reduce((s,v)=>s+v.sellCount,0);
    const now=new Date();
    const thisMonthKey=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;
    const bfThisMonthNet=buyFlowMap[thisMonthKey]?
      (buyFlowMap[thisMonthKey].buys-buyFlowMap[thisMonthKey].sells):0;
    const bfThisMonthCount=buyFlowMap[thisMonthKey]?buyFlowMap[thisMonthKey].buyCount:0;

    /* Invested capital over time vs portfolio value */
    const investedSeries=[];
    {
      const txs=[];
      portfolio.forEach(h=>h.transactions.forEach(tx=>{
        if((tx.type==="buy"||tx.type==="sell")&&tx.date){
          txs.push({date:tx.date,amt:toAUD((tx.qty||0)*(tx.price||0),h.currency,rates),
            type:tx.type});
        }
      }));
      txs.sort((a,b)=>new Date(a.date)-new Date(b.date));
      let running=0, ti=0;
      for(const pt of sorted){
        const pd=pt.date;
        while(ti<txs.length&&txs[ti].date<=pd){
          running+=txs[ti].type==="buy"?txs[ti].amt:-txs[ti].amt;
          ti++;
        }
        investedSeries.push(Math.max(0,running));
      }
    }

    return {labels,rawDates,vals,divCumul,investedSeries,startVal,endVal,tLabels,tVals,palette,

        backgroundColor:dark?"rgba(138,180,248,.6)":"rgba(26,115,232,.5)",

      divCAGR:divCAGR_val,divCAGRYears,waterfallData,

  const runSimulation=useCallback(()=>{
    if(!holdings.length)return null;
    const{growthRate,reinvestDividends,fxRate,simulationYears,targetPct}=whatIf;
    const totalValue=holdings.reduce((s,h)=>s+h.currentValue,0);
    if(totalValue<=0)return null;
    const holdingData=holdings.map(h=>({...h,divYield:h.currentValue>0?h.totalDividends/h.currentValue:0}));
    const safeT=targetPct&&typeof targetPct==="object"?targetPct:{};
    const totalPct=Object.values(safeT).reduce((s,v)=>s+(typeof v==="number"?v:0),0);
    let pctMap={...safeT};
    if(totalPct===0){
      const cur={}; holdings.forEach(h=>{cur[h.ticker]=(h.currentValue/totalValue)*100;}); pctMap=cur;
    }else{
      const sum=Object.values(pctMap).reduce((s,v)=>s+(typeof v==="number"?v:0),0);
      if(sum>0&&Math.abs(sum-100)>0.001){const f=100/sum;Object.keys(pctMap).forEach(k=>{pctMap[k]*=f;});}
    }
    let adjVal=0;
    const adjustedHoldings=holdingData.map(h=>{
      const pct=pctMap[h.ticker]||0;
      const av=(pct/100)*totalValue;
      adjVal+=av;
      const ad=av*h.divYield;
      return{...h,adjustedValue:av,adjustedDividends:ad,targetPct:pct};
    });
    const wY=adjustedHoldings.reduce((s,h)=>s+(h.targetPct/100)*h.divYield,0);
    let pv=totalValue, annualDiv=0;
    const dh=[];
    for(let i=0;i<simulationYears;i++){
      pv*=(1+growthRate/100);
      if(fxRate!==0)pv*=(1+fxRate/100);
      const d=pv*wY; annualDiv=d; dh.push(d);
      if(reinvestDividends)pv+=d;
    }
    const fPV=pv;
    const tot=dh.reduce((s,v)=>s+v,0);
    const avg=dh.length?tot/dh.length:0;
    let dCAGR=null;
    if(dh.length>=2&&dh[0]>0&&dh[dh.length-1]>0)
      dCAGR=(Math.pow(dh[dh.length-1]/dh[0],1/(dh.length-1))-1)*100;
    const maxPct=Math.max(...adjustedHoldings.map(h=>h.targetPct||0));
    return {finalPortfolioValue:fPV,avgAnnualDividend:avg,totalDividendsReceived:tot,
      dividendCAGR:dCAGR,riskConcentration:maxPct,adjustedHoldings,weightedAvgYield:wY,
      targetPct:pctMap,totalValue,growthRate,reinvestDividends,fxRate,simulationYears};
  },[holdings,whatIf]);
  const simulationResult=useMemo(()=>runSimulation(),[runSimulation]);

    setFetchSt(s=>({...s,loading:true,fetched:0}));

    const fetchablePrices=portfolio.filter(h=>{
      if(h.yahooSymbol)return true;
      if(/^(PBS|SBN|SR|ST|FR|ORI|SUKUK)\d/i.test(h.ticker))return true;
      if(/^[A-Z]{3}\d{4}[A-Z]{2}$/i.test(h.ticker))return true;
      return false;
    });
    const newP={...prices}, newPP={...prevPrices};
    const errors={};
    let successes=0;
    function fetchFor(h){
      if(h.yahooSymbol)return fetchYahooPrice(h.yahooSymbol);
      const tk=h.ticker.toUpperCase();
      if(/^(PBS|SBN|SR|ST|FR|ORI)\d/i.test(tk))return fetchDJPPRPrice(tk);
      if(/^[A-Z]{3}\d{4}[A-Z]{2}$/i.test(tk))return fetchAUFundPrice(tk);
      return Promise.reject(new Error("No price source"));
    }
    const CP=8, res=new Array(fetchablePrices.length);
    async function f2(h,idx){
      try{const p=await fetchFor(h);res[idx]={status:"fulfilled",value:{h,p}};}
      catch(e){res[idx]={status:"rejected",reason:e};}
    }
    let qp=0;
    while(qp<fetchablePrices.length){
      const batch=fetchablePrices.slice(qp,qp+CP);
      await Promise.allSettled(batch.map((h,bi)=>f2(h,qp+bi)));
      qp+=CP;
      const done=res.filter(Boolean).length;
      setFetchSt(s=>({...s,fetched:done,total:fetchablePrices.length}));
    }
    res.forEach((r,i)=>{
      const h=fetchablePrices[i];

                  {l:"Annual Income",v:FC(avgAnnualDividend,true),c:T.teal,s:"avg dividend/coupon"},
                  {l:"Dividend CAGR",v:dividendCAGR!==null?fmtPct(dividendCAGR):"—",
                    c:dividendCAGR!==null&&dividendCAGR>=0?T.green:T.red,s:`over ${simulationYears} years`},
                  {l:"Risk Concentration",v:riskConcentration.toFixed(0)+"%",

                    <div style={{fontSize:14,fontWeight:700,color:m.c,

                  const md=Math.min(r.w,r.h);

                      background:c.bg,border:"1px solid "+c.border,display:"flex",flexDirection:"column",

                      padding:2,textAlign:"center",overflow:"hidden"}}>
                      <span>{r.ticker}</span>
                      <span style={{fontSize:fs*0.8,opacity:.9}}>{FC(r.adjustedValue,true)}</span>
                      <span style={{fontSize:fs*0.7,opacity:.7}}>{pct.toFixed(0)}%</span>
                    </div>

              <div style={{fontSize:9,color:T.text3}}>Save current settings</div>
            </div>
            <div style={{display:"flex",gap:4}}>
              <input style={{...inp(),padding:"5px 10px",fontSize:10,width:130}}

                if(!whatIf.scenarioName)return;
                setWhatIf(w=>({...w,scenarios:[...w.scenarios,{id:Date.now(),name:w.scenarioName,

                  result:simulationResult}],scenarioName:""}));

            </div>
          </div>
          {whatIf.scenarios.length>0&&(

                    <span style={{fontWeight:700,fontSize:11,color:T.text}}>{s.name}</span>
                    <button onClick={()=>setWhatIf(w=>({...w,scenarios:w.scenarios.filter(sc=>sc.id!==s.id)}))}

                  <div style={{fontSize:8,color:T.text3,marginTop:3}}>

                    reinvestDividends:s.reinvestDividends,fxRate:s.fxRate,targetPct:s.targetPct,
                    simulationYears:s.simulationYears,activeScenario:s.id}))}
                    style={bO(T.teal,{fontSize:9,padding:"2px 8px",marginTop:4})}>Load</button>
                </div>

  const renderImportModal=()=>{
    const IS=importSt;
    const valid=IS.parsed.filter(r=>!r._errors.length);
    const invalid=IS.parsed.filter(r=>r._errors.length);
    const tickers=[...new Set(valid.map(r=>r.ticker))];
    const dropZoneStyle={border:"2px dashed "+(IS.dragOver?T.greenBtn:T.border2),borderRadius:12,
      padding:"32px 20px",textAlign:"center",
      background:IS.dragOver?(dark?"#1e2a1e":"#e8f5e9"):T.bg4,transition:"all .2s",cursor:"pointer"};
    return (
      <div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:6}}>
          <h2 style={{fontFamily:"'Space Mono',monospace",fontSize:15,fontWeight:700,color:T.text}}>📥 Import Transactions</h2>
          {IS.step==="preview"&&<span style={{fontSize:11,color:T.text3}}>{IS.fileName}</span>}
        </div>
        <p style={{fontSize:11,color:T.text3,marginBottom:16,lineHeight:1.6}}>
          Upload a CSV or Excel file with your buy, sell and dividend history. Download a template below to see the exact format.
        </p>
        <div style={{display:"flex",gap:8,marginBottom:18,flexWrap:"wrap"}}>
          <button onClick={downloadTemplateCSV} style={bO(T.teal,{fontSize:11,padding:"6px 12px"})}>⬇ Template CSV</button>
          <button onClick={downloadTemplateXLSX} style={bO(T.teal,{fontSize:11,padding:"6px 12px"})}>⬇ Template Excel (.xlsx)</button>
          <span style={{fontSize:10,color:T.text3,alignSelf:"center",marginLeft:4}}>See "Field Reference" tab in Excel</span>
        </div>
        <input ref={importFileRef} type="file" accept=".csv,.xlsx,.xls,.ods,.txt" style={{display:"none"}}
          onChange={e=>{if(e.target.files[0])handleImportFile(e.target.files[0]);e.target.value="";}}/>
        {(IS.step==="idle"||IS.step==="parsing")&&(
          <div style={dropZoneStyle}
            onDragOver={e=>{e.preventDefault();setImportSt(s=>({...s,dragOver:true}));}}
            onDragLeave={()=>setImportSt(s=>({...s,dragOver:false}))}
            onDrop={e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f)handleImportFile(f);}}
            onClick={()=>importFileRef.current&&importFileRef.current.click()}>
            <div style={{fontSize:36,marginBottom:10,opacity:.5}}>📂</div>
            <div style={{fontSize:14,fontWeight:600,color:T.text,marginBottom:4}}>
              {IS.step==="parsing"?"⟳ Parsing file…":"Drag & drop your file here"}
            </div>
            <div style={{fontSize:12,color:T.text3,marginBottom:16}}>or click to browse · CSV, XLSX, XLS supported</div>
            {IS.step!=="parsing"&&(
              <button style={bS(T.greenBtn,"#fff",{fontSize:12,padding:"8px 20px"})}
                onClick={e=>{e.stopPropagation();importFileRef.current&&importFileRef.current.click();}}>Choose File</button>
            )}
          </div>
        )}
        {IS.step==="error"&&(
          <div style={{background:dark?"#2d0a0a":"#fee2e2",border:"1px solid "+T.redBtn+"55",
            borderRadius:10,padding:"14px 16px",color:T.red}}>
            <div style={{fontWeight:700,marginBottom:4}}>Could not read file</div>
            <div style={{fontSize:12}}>{IS.errorMsg}</div>
            <button style={bO(T.red,{fontSize:11,marginTop:10})}
              onClick={()=>setImportSt(s=>({...s,step:"idle"}))}>Try again</button>
          </div>
        )}
        {IS.step==="preview"&&(
          <div>
            {IS.fieldMap&&Object.keys(IS.fieldMap).length>0&&(
              <div style={{background:T.bg4,border:"1px solid "+T.border,borderRadius:10,padding:"10px 14px",marginBottom:14}}>
                <div style={{fontSize:10,fontWeight:700,color:T.text2,letterSpacing:1.2,
                  textTransform:"uppercase",marginBottom:7}}>Detected Column Mapping</div>
                <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                  {Object.entries(IS.fieldMap).map(([field,col])=>(
                    <span key={field} style={{fontSize:10,background:T.bg2,border:"1px solid "+T.border2,
                      borderRadius:5,padding:"2px 8px",color:T.text2}}>
                      <span style={{color:T.text3}}>{col}</span>
                      <span style={{color:T.border2,margin:"0 4px"}}>→</span>
                      <span style={{color:T.teal,fontWeight:600}}>{field}</span>
                    </span>
                  ))}
                </div>
                {!IS.fieldMap.ticker&&<div style={{marginTop:8,fontSize:11,color:T.amber}}>⚠️ No <b>ticker</b> column detected — rename your ticker column to exactly <code>ticker</code></div>}
                {!IS.fieldMap.type&&<div style={{marginTop:4,fontSize:11,color:T.amber}}>⚠️ No <b>type</b> column detected — rename to <code>type</code> with values: buy, sell, dividend</div>}
              </div>
            )}
            <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap"}}>
              {[[IS.parsed.length+" rows",T.text],[valid.length+" valid",T.green],
                ...(invalid.length?[[invalid.length+" errors",T.amber]]:[]),
                [tickers.length+" tickers",T.teal],
                [valid.filter(r=>r.type==="buy").length+" buys",T.text2],
                [valid.filter(r=>r.type==="sell").length+" sells",T.text2],
                [valid.filter(r=>r.type==="dividend").length+" dividends",T.teal]].map(([l,c])=>(
                  <span key={l} style={{fontSize:11,fontWeight:600,color:c,background:T.bg4,
                    border:"1px solid "+T.border,borderRadius:6,padding:"3px 10px"}}>{l}</span>
              ))}
            </div>
            <div style={{display:"flex",alignItems:"center",gap:10,background:T.bg4,
              border:"1px solid "+T.border,borderRadius:10,padding:"10px 14px",marginBottom:14,flexWrap:"wrap"}}>
              <span style={{fontSize:12,fontWeight:600,color:T.text}}>Import mode:</span>
              {[["merge","Merge with existing"],["replace","Replace all data"]].map(([v,l])=>(
                <button key={v} onClick={()=>setImportSt(s=>({...s,mergeMode:v}))}
                  style={{padding:"5px 14px",borderRadius:7,
                    border:"1px solid "+(IS.mergeMode===v?T.greenBtn:T.border),
                    background:IS.mergeMode===v?(dark?"#0a2e1e":"#dcfce7"):"transparent",
                    color:IS.mergeMode===v?T.greenBtn:T.text3,fontSize:12,fontWeight:IS.mergeMode===v?700:400}}>{l}</button>

              <span style={{fontSize:10,color:IS.mergeMode==="replace"?T.amber:T.text3}}>

              <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>

                <tbody>
                  {IS.parsed.map((r,i)=>{

                    const bg=ok?(i%2===0?T.bg3:T.bg2):(dark?"#2a1500":"#fff7ed");
                    const tc=r.type==="buy"?T.green:r.type==="sell"?T.red:T.teal;
                    const tbg=r.type==="buy"?(dark?"#0a2e1e":"#dcfce7"):r.type==="sell"?(dark?"#2d0a0a":"#fee2e2"):(dark?"#041824":"#cffafe");
                    return (
                      <tr key={i} style={{background:bg}}>
                        <td style={{padding:"6px 8px",borderBottom:"1px solid "+T.border}}>{ok?"✅":"⚠️"}</td>
                        <td style={{padding:"6px 8px",color:T.text3,fontSize:9,borderBottom:"1px solid "+T.border}}>{r._rowNum}</td>
                        <td style={{padding:"6px 8px",fontFamily:"'Space Mono',monospace",fontWeight:700,
                          color:T.text,borderBottom:"1px solid "+T.border}}>{r.ticker}</td>
                        <td style={{padding:"6px 8px",borderBottom:"1px solid "+T.border}}>
                          {r.type&&<span style={{padding:"1px 6px",borderRadius:4,fontSize:9,fontWeight:700,
                            background:tbg,color:tc}}>{r.type.toUpperCase()}</span>}
                        </td>
                        <td style={{padding:"6px 8px",color:T.text2,borderBottom:"1px solid "+T.border,whiteSpace:"nowrap"}}>{r.date}</td>

                        <td style={{padding:"6px 8px",fontFamily:"'Space Mono',monospace",color:T.text2,borderBottom:"1px solid "+T.border}}>{r.price||"—"}</td>

                        <td style={{padding:"6px 8px",fontFamily:"'Space Mono',monospace",color:T.teal,borderBottom:"1px solid "+T.border}}>{r.amountPerShare||"—"}</td>
                        <td style={{padding:"6px 8px",color:T.text2,borderBottom:"1px solid "+T.border}}>{r.entitledQty||"—"}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
            {valid.length===0&&<div style={{textAlign:"center",padding:"8px 0",color:T.red,fontSize:12,marginBottom:12}}>
              No valid rows found. Fix the errors and re-upload.
            </div>}
            <div style={{display:"flex",gap:8,justifyContent:"space-between",alignItems:"center",flexWrap:"wrap"}}>
              <button style={bO(T.text2,{fontSize:11})}
                onClick={()=>setImportSt(s=>({...s,step:"idle",parsed:[],rows:[],errors:[]}))}>Upload different file</button>
              <div style={{display:"flex",gap:8}}>
                <button style={bO(T.text2)} onClick={closeModal}>Cancel</button>
                <button style={{...bS(T.greenBtn,"#fff"),opacity:valid.length?1:.4,
                  cursor:valid.length?"pointer":"not-allowed"}} disabled={!valid.length} onClick={confirmImport}>
                  Import {valid.length} rows {IS.mergeMode==="replace"?"(replace all)":"(merge)"}
                </button>
              </div>
            </div>
          </div>
        )}
        {IS.step==="done"&&(
          <div style={{textAlign:"center",padding:"24px 0"}}>
            <div style={{fontSize:48,marginBottom:12}}>🎉</div>
            <div style={{fontSize:18,fontWeight:700,color:T.green,marginBottom:8}}>Import complete!</div>
            <div style={{fontSize:13,color:T.text2,marginBottom:8}}>{IS.importedCount} transactions imported.</div>
            <div style={{fontSize:11,color:T.text3,marginBottom:24}}>Click the 🔄 Live Prices button to fetch current prices for new holdings.</div>
            <button style={bS(T.greenBtn,"#fff",{padding:"9px 28px",fontSize:13})} onClick={closeModal}>Done</button>
          </div>
        )}
      </div>
    );
  };

    ["chart","📊","Charts"],
    ["whatif","💡","What-If"]

    <ErrorBoundary>
      <div style={{minHeight:"100vh",background:T.bg,color:T.text}}>

                    </div>
                  )}
                  {!(form.isBondPct||(form.assetType||"").includes("Bond")||(form.assetType||"").includes("Sukuk"))&&(
                    <div style={{marginBottom:10}}>
                      <label style={lbl({fontSize:9})}>Yahoo Finance Symbol <span style={{color:T.text3,
                        fontWeight:400,letterSpacing:0,textTransform:"none",fontSize:8}}>(auto-suggested)</span></label>
                      <input style={inp()}
                        placeholder={suggestYahoo(form.ticker||"",form.exchange||"",form.assetType||"")||"e.g. BHP.AX"}
                        value={form.yahooSymbol||""}
                        onChange={e=>setForm(f=>({...f,yahooSymbol:e.target.value}))}/>
                    </div>
                  )}
                  <div style={{display:"grid",gridTemplateColumns:isMob?"1fr 1fr":"1fr 1fr 1fr",gap:10,marginBottom:12}}>
                    <div><label style={lbl({fontSize:9})}>Quantity *</label>
                      <input style={inp()} type="number" placeholder="Units" value={form.qty||""}
                        onChange={e=>setForm(f=>({...f,qty:e.target.value}))}/></div>
                    <div><label style={lbl({fontSize:9})}>Price ({form.currency||"AUD"}) *</label>
                      <input style={inp()} type="number" placeholder="Per unit" value={form.price||""}
                        onChange={e=>setForm(f=>({...f,price:e.target.value}))}/></div>
                    <div><label style={lbl({fontSize:9})}>Date</label>
                      <input style={inp()} type="date" value={form.date||""}
                        onChange={e=>setForm(f=>({...f,date:e.target.value}))}/></div>
                  </div>
                  <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
                    <button style={bO(T.text2,{fontSize:11})} onClick={closeModal}>Cancel</button>
                    <button style={bS(T.greenBtn,"#fff",{fontSize:11})} onClick={submitAdd}>Add Position</button>
                  </div>
                </>
              )}

              {modal.mode==="trade"&&(
                <>
                  <h2 style={{fontFamily:"'Space Mono',monospace",fontSize:15,fontWeight:700,
                    color:T.text,marginBottom:4}}>
                    {modal.tradeType==="buy"?"Buy More —":"Sell —"} {modal.holding.ticker}</h2>
                  <p style={{color:T.text3,fontSize:11,fontWeight:500,marginBottom:14}}>
                    {modal.holding.name} · {modal.holding.assetType} · Held: {modal.holding.qty.toFixed(4)}</p>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:12}}>
                    {[["Quantity","qty","number","Units"],
                      ["Price ("+modal.holding.currency+")","price","number","Per unit"],
                      ["Date","date","date",""]].map(([l,k,t,ph])=>(
                      <div key={k}><label style={lbl({fontSize:9})}>{l}</label>
                        <input style={inp()} type={t} placeholder={ph} value={form[k]||""}
                          onChange={e=>setForm(f=>({...f,[k]:e.target.value}))}/></div>
                    ))}
                  </div>
                  <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
                    <button style={bO(T.text2,{fontSize:11})} onClick={closeModal}>Cancel</button>
                    <button style={bS(modal.tradeType==="buy"?T.greenBtn:T.redBtn,"#fff",{fontSize:11})}
                      onClick={submitTrade}>Confirm {modal.tradeType==="buy"?"Purchase":"Sale"}</button>
                  </div>
                </>
              )}

              {modal.mode==="dividend"&&(
                <>
                  <h2 style={{fontFamily:"'Space Mono',monospace",fontSize:15,fontWeight:700,
                    color:T.text,marginBottom:4}}>
                    {modal.holding.isBondPct?"🏦 Record Coupon":"💰 Record Dividend"} — {modal.holding.ticker}</h2>
                  <p style={{color:T.text3,fontSize:11,fontWeight:500,marginBottom:12}}>
                    {modal.holding.name} · {modal.holding.currency}
                    {modal.holding.isBondPct&&` · Face value: Rp ${fmtIDR(modal.holding.faceValue||1000000)}/unit`}</p>
                  <div style={{background:dark?"#0f1120":"#f8f9ff",border:"1px solid "+T.border2,
                    borderRadius:8,padding:"10px 12px",marginBottom:12,fontSize:10,color:T.text2,
                    lineHeight:1.5,fontWeight:500}}>
                    <b style={{color:T.text,fontWeight:600}}>📅 Ex-Dividend tip:</b> Shares bought <em>after</em> the ex-date don't qualify.
                    Reduce entitled units accordingly.
                  </div>
                  <div style={{display:"grid",gridTemplateColumns:isMob?"1fr":"1fr 1fr 1fr",gap:10,marginBottom:10}}>
                    <div><label style={lbl({fontSize:9})}>
                      {modal.holding.isBondPct?"Coupon / Unit":"Dividend / Unit"} ({modal.holding.currency})</label>
                      <input style={inp()} type="number"
                        placeholder={modal.holding.isBondPct?"e.g. 33750":"e.g. 1.25"}
                        value={form.amountPerShare||""}
                        onChange={e=>setForm(f=>({...f,amountPerShare:e.target.value}))}/></div>
                    <div><label style={lbl({fontSize:9})}>Entitled Units</label>
                      <input style={inp()} type="number" placeholder="Units entitled"
                        value={form.entitledQty||""}
                        onChange={e=>setForm(f=>({...f,entitledQty:e.target.value}))}/></div>
                    <div><label style={lbl({fontSize:9})}>Payment Date</label>
                      <input style={inp()} type="date" value={form.date||""}
                        onChange={e=>setForm(f=>({...f,date:e.target.value}))}/></div>
                  </div>
                  {form.amountPerShare&&form.entitledQty&&(()=>{
                    const total=+form.amountPerShare*+form.entitledQty;
                    const cur=modal.holding.currency;
                    const totalFmt=cur==="IDR"?`Rp ${fmtIDR(total)}`:cur==="USD"?`US$${total.toFixed(2)}`:`A$${total.toFixed(2)}`;
                    return (
                      <div style={{background:dark?"#041824":"#e0f9f8",border:"1px solid "+T.teal+"55",
                        borderRadius:6,padding:"10px 14px",marginBottom:12}}>
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",
                          flexWrap:"wrap",gap:6}}>
                          <div><span style={{fontSize:10,color:T.teal,fontWeight:500}}>
                            Total {modal.holding.isBondPct?"coupon":"dividend"}: </span>
                            <strong style={{fontFamily:"'Space Mono',monospace",fontSize:13,
                              color:T.teal,fontWeight:700}}>{totalFmt}</strong></div>
                        </div>
                        <div style={{fontSize:9,color:T.text3,marginTop:4,fontWeight:500}}>
                          {form.amountPerShare} × {form.entitledQty} units = {totalFmt}</div>
                      </div>
                    );
                  })()}
                  <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
                    <button style={bO(T.text2,{fontSize:11})} onClick={closeModal}>Cancel</button>
                    <button style={bS(T.tealBtn,"#fff",{fontSize:11})} onClick={submitDiv}
                      disabled={!form.amountPerShare||!form.entitledQty}>
                      Record {modal.holding.isBondPct?"Coupon":"Dividend"}</button>
                  </div>
                </>
              )}

              {modal.mode==="history"&&histH&&histC&&(
                <>
                  <h2 style={{fontFamily:"'Space Mono',monospace",fontSize:15,fontWeight:700,
                    color:T.text,marginBottom:4}}>📋 Transaction History</h2>
                  <p style={{fontSize:11,color:T.text3,fontWeight:500,marginBottom:12}}>
                    {modal.holding.ticker} — {modal.holding.name}</p>
                  <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(110px,1fr))",
                    gap:8,marginBottom:12}}>
                    {[["Market Value",FC(histC.currentValue),T.text],
                      ["Held",fmtDur(getHeldDays(histH))+" since "+fmtDate(getFirstBuyDate(histH)||"—"),T.text2],
                      ["Total G/L",`${FG(histC.totalGain)} (${fmtPct(histC.gainPct)})`,pColor(histC.totalGain)],
                      ["Div/Coupons",FC(histC.totalDividends),T.teal]].map(([l,v,c])=>(
                      <div key={l} style={{background:T.bg4,border:"1px solid "+T.border,
                        borderRadius:6,padding:"6px 12px"}}>
                        <div style={{fontSize:8,color:T.text3,letterSpacing:1,textTransform:"uppercase",fontWeight:600}}>{l}</div>
                        <div style={{fontFamily:"'Space Mono',monospace",fontSize:11,
                          fontWeight:700,color:c,marginTop:2}}>{v}</div>
                      </div>
                    ))}
                  </div>
                  <div style={{overflowX:"auto",borderRadius:6,border:"1px solid "+T.border}}>
                    <table style={{width:"100%",borderCollapse:"collapse"}}>
                      <thead>
                        <tr>{["Date","Type","Units / Div","Price / Div","Total",""].map(c=>(
                          <th key={c} style={{padding:"7px 9px",textAlign:"left",fontSize:8,letterSpacing:1,
                            color:T.text3,textTransform:"uppercase",background:T.bg,
                            borderBottom:"1px solid "+T.border,whiteSpace:"nowrap",fontWeight:600}}>{c}</th>
                        ))}</tr>
                      </thead>
                      <tbody>
                        {[...histH.transactions].sort((a,b)=>new Date(b.date)-new Date(a.date)).map((tx,i)=>{
                          const oi=histH.transactions.indexOf(tx);
                          const tmap={buy:{l:"BUY",c:T.green,bg:dark?"#0d3d2833":"#dcfce7"},
                            sell:{l:"SELL",c:T.red,bg:dark?"#3d0a0a33":"#fee2e2"},
                            dividend:{l:histH.isBondPct?"COUPON":"DIV",c:T.teal,bg:dark?"#04182833":"#cffafe"}};
                          const t=tmap[tx.type]||tmap.buy;
                          const cur=histH.currency;
                          const fL=v=>cur==="IDR"?`Rp ${fmtIDR(v)}`:cur==="USD"?`US$${v.toFixed(2)}`:`A$${v.toFixed(2)}`;
                          return (
                            <tr key={i} style={{background:i%2===0?T.bg3:T.bg2}}>
                              <td style={{padding:"7px 9px",fontFamily:"'Space Mono',monospace",fontSize:10,
                                color:T.text2,borderBottom:"1px solid "+T.border,whiteSpace:"nowrap",fontWeight:500}}>
                                {fmtDate(tx.date)}</td>
                              <td style={{padding:"7px 9px",borderBottom:"1px solid "+T.border}}>
                                <span style={{padding:"2px 7px",borderRadius:4,background:t.bg,color:t.c,
                                  fontFamily:"'Space Mono',monospace",fontSize:8,fontWeight:700}}>{t.l}</span></td>
                              <td style={{padding:"7px 9px",fontFamily:"'Space Mono',monospace",fontSize:10,
                                color:T.text2,borderBottom:"1px solid "+T.border,fontWeight:500}}>
                                {tx.type==="dividend"?`${(tx.amountPerShare||0).toFixed(4)}/unit`:(tx.qty||"—")}</td>
                              <td style={{padding:"7px 9px",fontFamily:"'Space Mono',monospace",fontSize:10,
                                color:T.text2,borderBottom:"1px solid "+T.border,fontWeight:500}}>
                                {fL(tx.type==="dividend"?(tx.amountPerShare||0):(tx.price||0))}</td>
                              <td style={{padding:"7px 9px",fontFamily:"'Space Mono',monospace",fontSize:11,
                                fontWeight:700,color:t.c,borderBottom:"1px solid "+T.border}}>
                                {fL(tx.type==="dividend"?(tx.totalAmount||0):((tx.qty||0)*(tx.price||0)))}</td>
                              <td style={{padding:"5px 7px",borderBottom:"1px solid "+T.border}}>
                                <div style={{display:"flex",gap:4}}>
                                  <button onClick={()=>setEditTx({holdingId:histH.id,txIndex:oi,tx:{...tx}})}
                                    style={{fontSize:10,padding:"2px 8px",borderRadius:4,
                                      border:"1px solid "+T.border,background:T.bg4,color:T.text2,
                                      cursor:"pointer",fontWeight:500}}>✏️</button>
                                  <button onClick={()=>{
                                    if(!confirm("Delete this transaction?"))return;
                                    setPortfolioRepaired(p=>p.map(h=>h.id===histH.id?
                                      {...h,transactions:h.transactions.filter((_,j)=>j!==oi)}:h));
                                  }} style={{fontSize:10,padding:"2px 8px",borderRadius:4,
                                    border:"1px solid "+T.red+"44",background:T.bg4,color:T.red,
                                    cursor:"pointer",fontWeight:500}}>🗑️</button>
                                </div>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:12}}>
                    <span style={{fontSize:10,color:T.text3,fontWeight:500}}>
                      {histH.transactions.length} transactions total</span>
                    <button style={bO(T.text2,{fontSize:10})} onClick={closeModal}>Close</button>
                  </div>
                </>
              )}

              {modal.mode==="price"&&(
                <>
                  <h2 style={{fontFamily:"'Space Mono',monospace",fontSize:15,fontWeight:700,
                    color:T.text,marginBottom:4}}>✏️ Manual Price Override</h2>
                  <p style={{color:T.text3,fontSize:10,fontWeight:500,marginBottom:12}}>
                    Override prices or edit Yahoo symbols. Auto-fetch skips holdings with no Yahoo symbol.</p>
                  <div style={{marginBottom:14}}>
                    <label style={lbl({fontSize:9})}>Display Currency</label>
                    <select style={{...inp(),background:T.bg,width:"auto",minWidth:120}}
                      value={form.displayCur||displayCur}
                      onChange={e=>setForm(f=>({...f,displayCur:e.target.value}))}>
                      {CURRENCIES.map(c=><option key={c}>{c}</option>)}</select>
                  </div>
                  {holdings.map(h=>(
                    <div key={h.ticker} style={{marginBottom:14,paddingBottom:14,borderBottom:"1px solid "+T.border}}>
                      <div style={{fontSize:11,color:T.text,fontWeight:700,
                        fontFamily:"'Space Mono',monospace",marginBottom:8}}>
                        {h.ticker}<span style={{fontFamily:"'Roboto',sans-serif",color:T.text3,fontWeight:400}}> — {h.name}</span>
                        {!h.yahooSymbol&&<span style={{marginLeft:6,fontSize:9,background:dark?"#1a100a":"#fff7ed",
                          color:T.amber,padding:"1px 7px",borderRadius:10,
                          border:"1px solid "+T.amber+"44",fontWeight:500}}>✏️ Manual</span>}
                      </div>
                      <div style={{display:"grid",gridTemplateColumns:isMob?"1fr 1fr":"1fr 1fr 1fr",gap:8}}>
                        <div><label style={lbl({fontSize:8})}>Current Price</label>
                          <input style={inp()} type="number" placeholder={String(prices[h.ticker]||"")}
                            value={form["c_"+h.ticker]||""}
                            onChange={e=>setForm(f=>({...f,["c_"+h.ticker]:e.target.value}))}/></div>
                        <div><label style={lbl({fontSize:8})}>Prev Close</label>
                          <input style={inp()} type="number" placeholder={String(prevPrices[h.ticker]||"")}
                            value={form["p_"+h.ticker]||""}
                            onChange={e=>setForm(f=>({...f,["p_"+h.ticker]:e.target.value}))}/></div>
                        <div><label style={lbl({fontSize:8})}>Yahoo Symbol</label>
                          <input style={{...inp(),fontFamily:"'Space Mono',monospace",fontSize:10}}
                            placeholder={suggestYahoo(h.ticker,h.exchange,h.assetType)}
                            value={form["ys_"+h.ticker]??h.yahooSymbol??""}
                            onChange={e=>setForm(f=>({...f,["ys_"+h.ticker]:e.target.value}))}/></div>
                      </div>
                    </div>
                  ))}
                  <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:4}}>
                    <button style={bO(T.text2,{fontSize:10})} onClick={closeModal}>Cancel</button>
                    <button style={bS(T.greenBtn,"#fff",{fontSize:10})} onClick={submitManualPrice}>💾 Save</button>
                  </div>
                </>
              )}

              {modal.mode==="import"&&renderImportModal()}
            </div>
          </div>
        )}

        {editTx&&(()=>{
          const h=portfolio.find(p=>p.id===editTx.holdingId);
          if(!h)return null;
          const tx=editTx.tx;
          const cur=h.currency||"AUD";
          const save=()=>{
            setPortfolioRepaired(p=>p.map(holding=>holding.id===editTx.holdingId?
              {...holding,transactions:holding.transactions.map((t,j)=>j===editTx.txIndex?{...editTx.tx}:t)}:holding));
            setEditTx(null);
          };
          const fi=(field,label,type="text",placeholder="")=>(
            <div key={field}>
              <label style={{fontSize:9,color:T.text3,letterSpacing:1,textTransform:"uppercase",fontWeight:600}}>{label}</label>
              <input type={type} style={{...inp(),marginTop:2}} value={tx[field]??""} placeholder={placeholder}
                onChange={e=>{const v=type==="number"?(parseFloat(e.target.value)||0):e.target.value;
                  setEditTx(s=>({...s,tx:{...s.tx,[field]:v}}));}}/>
            </div>
          );
          return (
            <div onClick={()=>setEditTx(null)} className="modal-sheet"
              style={{position:"fixed",inset:0,background:"rgba(0,0,0,.82)",backdropFilter:"blur(6px)",
                zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:12}}>
              <div onClick={e=>e.stopPropagation()}
                style={{background:T.bg2,border:"1px solid "+T.border,borderRadius:14,padding:22,
                  width:"100%",maxWidth:400,boxShadow:T.shadow}}>
                <h2 style={{fontFamily:"'Space Mono',monospace",fontSize:14,fontWeight:700,
                  color:T.text,marginBottom:4}}>✏️ Edit Transaction</h2>
                <p style={{fontSize:10,color:T.text3,fontWeight:500,marginBottom:14}}>
                  {h.ticker} — {tx.type?.toUpperCase()}</p>
                <div style={{display:"flex",flexDirection:"column",gap:10}}>
                  {fi("date","Date","date")}
                  {tx.type!=="dividend"&&fi("qty","Units / Quantity","number","0")}
                  {tx.type!=="dividend"&&fi("price",`Price (${cur})`,"number","0")}
                  {tx.type==="dividend"&&fi("amountPerShare",`Amount per Unit (${cur})`,"number","0")}
                  {tx.type==="dividend"&&fi("entitledQty","Entitled Units","number","0")}
                  {tx.type==="dividend"&&fi("totalAmount",`Total Amount (${cur})`,"number","0")}
                </div>
                <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:16}}>
                  <button style={bO(T.text2,{fontSize:10})} onClick={()=>setEditTx(null)}>Cancel</button>
                  <button style={bS(T.greenBtn,"#fff",{fontSize:10})} onClick={save}>Save</button>
                </div>
              </div>
            </div>
          );
        })()}

        {showPassiveModal&&(
          <div onClick={()=>setShowPassiveModal(false)} className="modal-sheet"
            style={{position:"fixed",inset:0,background:"rgba(0,0,0,.7)",backdropFilter:"blur(6px)",
              zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:12}}>
            <div onClick={e=>e.stopPropagation()}
              style={{background:T.bg2,border:"1px solid "+T.border,borderRadius:14,padding:22,
                width:"100%",maxWidth:400,boxShadow:T.shadow}}>
              <h2 style={{fontFamily:"'Space Mono',monospace",fontSize:15,fontWeight:700,
                color:T.text,marginBottom:4}}>⚙️ Passive Income Settings</h2>
              <p style={{fontSize:10,color:T.text3,fontWeight:500,marginBottom:14}}>
                Set your monthly target, super draw rate, and average super balance.</p>
              <div style={{marginBottom:12}}>
                <label style={lbl({fontSize:9})}>Monthly Target (AUD)</label>
                <input type="number" step="100" value={monthlyTargetAud}
                  onChange={e=>setMonthlyTargetAud(parseFloat(e.target.value)||0)}
                  style={{...inp(),marginTop:2}} placeholder="e.g. 5000"/></div>
              <div style={{marginBottom:12}}>
                <label style={lbl({fontSize:9})}>Super Annual Draw Rate (%)</label>
                <input type="number" step="0.1" value={superDrawRate}
                  onChange={e=>setSuperDrawRate(parseFloat(e.target.value)||0)}
                  style={{...inp(),marginTop:2}} placeholder="e.g. 4.0"/>
                <div style={{fontSize:9,color:T.text3,marginTop:4,fontWeight:500}}>
                  Applied to NUL5339AU + NUL7270AU</div></div>
              <div style={{marginBottom:16}}>
                <label style={lbl({fontSize:9})}>Average Super Balance (AUD)</label>
                <input type="number" step="1000" value={avgSuperBalanceAud}
                  onChange={e=>setAvgSuperBalanceAud(parseFloat(e.target.value)||0)}
                  style={{...inp(),marginTop:2}} placeholder="e.g. 100000"/>
                <div style={{fontSize:9,color:T.text3,marginTop:4,fontWeight:500}}>Used to compare your super</div></div>
              <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
                <button style={bO(T.text2,{fontSize:10})} onClick={()=>setShowPassiveModal(false)}>Cancel</button>
                <button style={bS(T.greenBtn,"#fff",{fontSize:10})} onClick={()=>setShowPassiveModal(false)}>Save</button>
              </div>
            </div>
          </div>
        )}
      </div>
    </ErrorBoundary>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
