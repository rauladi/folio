// ========== ERROR BOUNDARY ==========
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false, error: null };
  }
  static getDerivedStateFromError(error) {
    return { hasError: true, error };
  }
  componentDidCatch(error, info) {
    console.error("React error boundary caught:", error, info);
  }
  render() {
    if (this.state.hasError) {
      return (
        <div style={{ padding: 20, color: "red", background: "#fff", fontFamily: "monospace" }}>
          <h2>Something went wrong.</h2>
          <pre>{this.state.error?.stack}</pre>
          <button onClick={() => window.location.reload()}>Reload</button>
        </div>
      );
    }
    return this.props.children;
  }
}

// ─── Treemap ──────────────────────────────────────────────────────────────────
function squarify(items,x,y,w,h){
  if(!items.length)return[];
  const r=[];_layout(items,x,y,w,h,items.reduce((s,i)=>s+i.value,0),r);return r;
}
function _layout(it,x,y,w,h,tot,r){
  if(!it.length)return;
  if(it.length===1){r.push({...it[0],x,y,w,h});return;}
  const hz=w>=h,dim=hz?w:h;let row=[],rt=0,best=Infinity;
  for(let i=0;i<it.length;i++){
    row.push(it[i]);rt+=it[i].value;
    const rd=(rt/tot)*dim;let worst=0;
    for(const ri of row){const od=(ri.value/rt)*(hz?h:w);const ra=Math.max(rd/od,od/rd);if(ra>worst)worst=ra;}
    if(worst>best){row.pop();rt-=it[i].value;break;}best=worst;
  }
  const rd=(rt/tot)*dim;let cur=hz?y:x;
  for(const ri of row){const sz=(ri.value/rt)*(hz?h:w);hz?r.push({...ri,x,y:cur,w:rd,h:sz}):r.push({...ri,x:cur,y,w:sz,h:rd});cur+=sz;}
  const rem=it.slice(row.length);if(!rem.length)return;
  const remT=tot-rt;hz?_layout(rem,x+rd,y,w-rd,h,remT,r):_layout(rem,x,y+rd,w,h-rd,remT,r);
}

// ─── Currency helpers ────────────────────────────────────────────────────────
const toAUD=(a,cur,R)=>{if(cur==="IDR")return a/R.AUD_IDR;if(cur==="USD")return a/R.AUD_USD;return a;};
const fromAUD=(a,cur,R)=>{if(cur==="IDR")return a*R.AUD_IDR;if(cur==="USD")return a*R.AUD_USD;return a;};
function fmtIDR(n){try{return Math.round(n).toLocaleString("id-ID");}catch{return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,".");}}
function fmtAUD(n){return Math.abs(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,",");}
function fmtCur(audAmt,dc,R,compact=false){
  const a=fromAUD(audAmt,dc,R);
  if(dc==="IDR"){const abs=Math.abs(a);if(compact&&abs>=1e9)return`Rp${(a/1e9).toFixed(1)}M`;if(compact&&abs>=1e6)return`Rp${(a/1e6).toFixed(1)}Jt`;if(compact&&abs>=1e3)return`Rp${(a/1e3).toFixed(0)}Rb`;return`Rp ${fmtIDR(a)}`;}
  if(dc==="USD"){const abs=Math.abs(a);if(compact&&abs>=1e6)return`US$${(a/1e6).toFixed(2)}M`;if(compact&&abs>=1e3)return`US$${(a/1e3).toFixed(1)}K`;return`US$${fmtAUD(a)}`;}
  const abs=Math.abs(a);if(compact&&abs>=1e6)return`A$${(a/1e6).toFixed(2)}M`;if(compact&&abs>=1e3)return`A$${(a/1e3).toFixed(1)}K`;return`A$${fmtAUD(a)}`;
}
function fmtGain(audAmt,dc,R){
  const a=fromAUD(audAmt,dc,R);const sign=a>=0?"+":"-";
  if(dc==="IDR")return`${sign}Rp ${fmtIDR(Math.abs(a))}`;
  if(dc==="USD")return`${sign}US$${fmtAUD(a)}`;
  return`${sign}A$${fmtAUD(a)}`;
}
const fmtPct=n=>`${n>=0?"+":""}${n.toFixed(2)}%`;
const fmtDate=d=>{try{return new Date(d+"T12:00:00").toLocaleDateString("en-AU",{day:"2-digit",month:"short",year:"numeric"});}catch{return d;}};
const fmtMon=d=>{try{const dt=new Date(d+"-01");return dt.toLocaleDateString("en-AU",{month:"short",year:"2-digit"});}catch{return d;}};

async function fetchWithProxyRaw(url,timeoutMs=10000){
  return new Promise((resolve,reject)=>{
    let settled=false;let pending=PROXIES.length;
    PROXIES.forEach(proxy=>{
      fetch(proxy(url),{signal:AbortSignal.timeout(timeoutMs)})
        .then(async r=>{
          if(!r.ok)throw new Error("HTTP "+r.status);
          const t=await r.text();
          if(!t||t.length<10)throw new Error("Empty");
          if(t.trim().startsWith("{")&&t.includes('"contents"')){
            try{const j=JSON.parse(t);if(j.contents){if(!settled){settled=true;resolve(j.contents);}return;}}catch(e){}
          }
          if(!settled){settled=true;resolve(t);}
        })
        .catch(()=>{
          pending--;
          if(pending===0&&!settled)reject(new Error("All proxies failed (raw)"));
        });
    });
  });
}

async function tryProxy(proxyUrl, timeoutMs){
  const r=await fetch(proxyUrl,{signal:AbortSignal.timeout(timeoutMs)});
  if(!r.ok)throw new Error("HTTP "+r.status);
  const t=await r.text();
  if(!t||t.length<10)throw new Error("Empty response");
  let parsed=JSON.parse(t);
  if(parsed?.contents&&typeof parsed.contents==="string") parsed=JSON.parse(parsed.contents);
  return parsed;
}

async function fetchWithProxy(url, timeoutMs=10000){
  return new Promise((resolve,reject)=>{
    let settled=false;
    let pending=PROXIES.length;
    const errors=[];
    PROXIES.forEach(proxy=>{
      tryProxy(proxy(url), timeoutMs)
        .then(data=>{
          if(!settled){settled=true;resolve(data);}
        })
        .catch(e=>{
          errors.push(e.message);
          pending--;
          if(pending===0&&!settled) reject(new Error("All proxies failed: "+url.split("?")[0].split("/").pop()));
        });
    });
  });
}

// ─── Compute Holding ──────────────────────────────────────────────────────────
function computeHolding(h,prices,prevPrices,R){
  let qty=0,cbL=0,rgL=0,lots=[],divL=0;
  const txs=[...h.transactions].sort((a,b)=>new Date(a.date)-new Date(b.date));
  for(const tx of txs){
    if(tx.type==="buy"){lots.push({qty:tx.qty,price:tx.price});qty+=tx.qty;cbL+=tx.qty*tx.price;}
    else if(tx.type==="sell"){let rem=tx.qty;qty-=tx.qty;while(rem>0&&lots.length){const lot=lots[0],used=Math.min(lot.qty,rem);rgL+=used*(tx.price-lot.price);cbL-=used*lot.price;lot.qty-=used;rem-=used;if(lot.qty===0)lots.shift();}}
    else if(tx.type==="dividend"){divL+=tx.totalAmount||0;}
  }
  const cpL=prices[h.ticker]??0,pcL=prevPrices[h.ticker]??cpL;
  const cvL=qty*cpL,ugL=cvL-cbL,dgL=(cpL-pcL)*qty,dgPct=pcL>0?(cpL-pcL)/pcL*100:0;
  const cv=toAUD(cvL,h.currency,R),cb=toAUD(cbL,h.currency,R),ug=toAUD(ugL,h.currency,R);
  const rg=toAUD(rgL,h.currency,R),divs=toAUD(divL,h.currency,R),dg=toAUD(dgL,h.currency,R);
  const totalInv=txs.filter(t=>t.type==="buy").reduce((s,t)=>s+toAUD(t.qty*t.price,h.currency,R),0);
  const totalGain=ug+rg+divs,gainPct=totalInv>0?(totalGain/totalInv)*100:0;
  const divYoc=totalInv>0?(divs/totalInv)*100:0;
  return{...h,qty,costBasis:cb,currentPrice:cpL,prevClose:pcL,currentValue:cv,unrealizedGain:ug,
    realizedGain:rg,totalDividends:divs,totalGain,gainPct,dayGain:dg,dayGainPct:dgPct,
    divYieldOnCost:divYoc,totalInvested:totalInv};
}

  const[tmMode,setTmMode]      =useState("performance");
  const[tmShowVal,setTmShowVal]=useState(true);
  const[tmSize,setTmSize]      =useState({w:600,h:420});
  const[tmSlider,setTmSlider]  =useState(null);
  const[chartPeriod,setChartPeriod]=useState("1Y");
  const[benchmarks,setBenchmarks]=useState({labels:[],series:{},holdingPrices:{}});
  const[bmVisible,setBmVisible]  =useState({sp500:true,brk:false,jkse:true,eido:true,vas:false});
  const[valuesHidden,setValuesHidden]=useState(false);
  const[editTx,setEditTx]        =useState(null);
  const[fetchSt,setFetchSt]    =useState({loading:false,lastUpdate:null,errors:{},successes:0,total:0,fetched:0,rateOk:null,bmStatus:null});
  const[fbUser,setFbUser]      =useState(null);
  const[syncSt,setSyncSt]      =useState("idle");
  const[syncMsg,setSyncMsg]    =useState("");
  const[importSt,setImportSt]  =useState({step:"idle",rows:[],parsed:[],errors:[],mergeMode:"merge",dragOver:false});
  const importFileRef          =useRef(null);
  const[monthlyTargetAud, setMonthlyTargetAud] = useState(()=>ld("f6_targetAud", 0));
  const[superDrawRate, setSuperDrawRate] = useState(()=>ld("f6_superRate", 0));
  const[showPassiveModal, setShowPassiveModal] = useState(false);
  const[avgSuperBalanceAud, setAvgSuperBalanceAud] = useState(()=>ld("f6_avgSuper", 0));

  const T=dark?DARK:LIGHT;
  const winW=useWindowSize();
  const isMob=winW<768;

  // ... effects unchanged

  const holdings=useMemo(()=>portfolio.map(h=>computeHolding(h,prices,prevPrices,rates)).filter(h=>h.qty>0),[portfolio,prices,prevPrices,rates]);

  const totVal    =holdings.reduce((s,h)=>s+h.currentValue,0);
  const totGain   =holdings.reduce((s,h)=>s+h.totalGain,0);
  const totInv    =holdings.reduce((s,h)=>s+h.totalInvested,0);
  const totPct    =totInv>0?(totGain/totInv)*100:0;
  const totDayGain=holdings.reduce((s,h)=>s+h.dayGain,0);
  const prevTot   =totVal-totDayGain;
  const totDayPct =prevTot>0?(totDayGain/prevTot)*100:0;
  const totDivs   =holdings.reduce((s,h)=>s+h.totalDividends,0);
  const divYld    =totInv>0?(totDivs/totInv)*100:0;

  const divYieldOnly = useMemo(() => { /* ... */ }, [holdings]);
  const divCAGR = useMemo(() => computeDividendCAGR(portfolio, rates), [portfolio, rates]);
  const monthlyDivsAUD = useMemo(() => computeMonthlyDividendsToDate(portfolio, rates), [portfolio, rates]);
  const superFundsValueAUD = useMemo(() => computeSuperFundsValue(holdings), [holdings]);
  const monthlyPassiveNumerator = useMemo(() => {
    const superMonthly = (superFundsValueAUD * (superDrawRate / 100)) / 12;
    return monthlyDivsAUD + superMonthly;
  }, [monthlyDivsAUD, superFundsValueAUD, superDrawRate]);
  const monthlyPassivePercent = useMemo(() => {
    if (monthlyTargetAud <= 0) return null;
    return (monthlyPassiveNumerator / monthlyTargetAud) * 100;
  }, [monthlyPassiveNumerator, monthlyTargetAud]);
  const targetDisplay = useMemo(() => {
    if (monthlyTargetAud <= 0) return "—";
    return fmtCur(monthlyTargetAud, displayCur, rates, true);
  }, [monthlyTargetAud, displayCur, rates]);
  
  const superBenchmarkPercent = useMemo(() => {
    if (avgSuperBalanceAud <= 0) return null;
    return (superFundsValueAUD / avgSuperBalanceAud) * 100;
  }, [superFundsValueAUD, avgSuperBalanceAud]);

  const FC=(a,compact=false)=>valuesHidden?"••••••":fmtCur(a,displayCur,rates,compact);
  const FG=(a)=>valuesHidden?"••••••":fmtGain(a,displayCur,rates);
  const pColor=n=>n>=0?T.green:T.red;

  // 🟢 Performance treemap: size = currentValue
  const perfRects=useMemo(()=>{const it=holdings.map(h=>({...h,value:h.currentValue})).sort((a,b)=>b.value-a.value);return it.length?squarify(it,0,0,tmSize.w,tmSize.h):[];},[holdings,tmSize]);
  // 🟢 Dividend treemap: size = totalDividends
  const divRects =useMemo(()=>{const it=holdings.filter(h=>h.totalDividends>0).map(h=>({...h,value:h.totalDividends})).sort((a,b)=>b.value-a.value);return it.length?squarify(it,0,0,tmSize.w,tmSize.h):[];},[holdings,tmSize]);
  // 🟢 Day treemap: size = currentValue (changed from dayGain), color = dayGainPct
  const dayRects =useMemo(()=>{const it=holdings.map(h=>({...h,value:h.currentValue})).sort((a,b)=>b.value-a.value);return it.length?squarify(it,0,0,tmSize.w,tmSize.h):[];},[holdings,tmSize]);

  const sliderDate=tmSlider!=null&&benchmarks.labels.length>tmSlider?benchmarks.labels[tmSlider]:null;
  const sliderRects=useMemo(()=>{ /* ... unchanged ... */ },[sliderDate,benchmarks.holdingPrices,benchmarks.labels,portfolio,prices,rates,tmSize]);

  const rects=tmSlider!=null&&sliderRects!=null&&sliderRects.length>0?sliderRects:(tmMode==="performance"?perfRects:tmMode==="day"?dayRects:divRects);
  const totalPortfolioDivs=useMemo(()=>holdings.reduce((s,h)=>s+h.totalDividends,0),[holdings]);
  const selH=holdings.find(h=>h.ticker===selected);

  const periodCutoff = useCallback((period) => { /* ... */ }, []);
  
  const autoRefresh = useCallback(async () => { /* ... */ }, [portfolio, prices, prevPrices, rates]);

  const chartData = useMemo(() => { /* ... */ }, [history, holdings, displayCur, rates, portfolio, chartPeriod, periodCutoff, benchmarks, totVal, dark, prices]);
  
  const yFmtD=useCallback((v)=>{
    if(displayCur==="IDR"){const abs=Math.abs(v);if(abs>=1e9)return`Rp${(v/1e9).toFixed(1)}M`;if(abs>=1e6)return`Rp${(v/1e6).toFixed(1)}Jt`;return`Rp${(v/1e3).toFixed(0)}Rb`;}
    const abs=Math.abs(v);if(abs>=1e6)return`${displayCur==="USD"?"US$":"A$"}${(v/1e6).toFixed(1)}M`;return`${displayCur==="USD"?"US$":"A$"}${(v/1e3).toFixed(0)}K`;
  },[displayCur]);

  // ... all modal handlers unchanged

  const card=(x={})=>({background:T.bg3,border:`1px solid ${T.border}`,borderRadius:12,...x});
  const bS=(bg,col,x={})=>({padding:"8px 16px",border:"none",borderRadius:8,background:bg,color:col,fontSize:12,fontWeight:700,...x});
  const bO=(col,x={})=>({padding:"8px 14px",border:`1px solid ${T.border2}`,borderRadius:8,background:"transparent",color:col,fontSize:12,...x});
  const inp=()=>({width:"100%",background:T.bg,border:`1px solid ${T.border}`,borderRadius:8,padding:"9px 12px",color:T.text,fontSize:13,outline:"none"});
  const lbl=(x={})=>({display:"block",fontSize:9,letterSpacing:1.2,color:T.text3,textTransform:"uppercase",marginBottom:5,fontWeight:600,...x});
  const fmtNativePrice=(h,v)=>{const cur=h.currency;if(!v&&v!==0)return"—";if(cur==="IDR")return`Rp ${fmtIDR(v)}`;if(cur==="USD")return`US$${fmtAUD(v)}`;return`A$${fmtAUD(v)}`;};
  const fetchBarColor=fetchSt.loading?T.amber:Object.keys(fetchSt.errors).length>0?T.amber:fetchSt.lastUpdate?T.green:T.text3;

  // JSX return
  return (
    <ErrorBoundary>
      <div style={{minHeight:"100vh",background:T.bg,color:T.text}}>
        {/* Header unchanged */}
        <header style={{background:T.bg2,borderBottom:`1px solid ${T.border}`,position:"sticky",top:0,zIndex:20,boxShadow:T.shadow}}>
          {/* ... */}
        </header>

        {/* View switcher */}
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"8px 14px",borderBottom:`1px solid ${T.border}`,background:T.bg2,flexWrap:"wrap",gap:8}}>
          <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
            {view==="treemap"&&tmMode==="performance"&&<>
              <span style={{fontSize:9,color:T.text3,letterSpacing:1,textTransform:"uppercase",marginRight:2}}>G/L to date:</span>
              {[[-4,"≤-3%"],[-2,"-1%"],[0,"0"],[1,"+1%"],[4,"+3%+"]].map(([p,l])=>{const c=gainColor(p,dark);return(<div key={l} style={{display:"flex",alignItems:"center",gap:3}}><div style={{width:11,height:11,borderRadius:2,background:c.bg,border:`1px solid ${c.border}`}}/><span style={{fontSize:9,color:T.text3}}>{l}</span></div>);})}
              <span style={{fontSize:9,color:T.text4,marginLeft:6}}>· Box size = current market value · Colour = total return %</span>
            </>}
            {view==="treemap"&&tmMode==="day"&&<>
              <span style={{fontSize:9,color:T.text3,letterSpacing:1,textTransform:"uppercase",marginRight:2}}>Day G/L %:</span>
              {[[-3,"≤-2%"],[-1,"-0.5%"],[0,"0"],[0.6,"+0.5%"],[3,"+2%+"]].map(([p,l])=>{const c=dayColor(p,dark);return(<div key={l} style={{display:"flex",alignItems:"center",gap:3}}><div style={{width:11,height:11,borderRadius:2,background:c.bg,border:`1px solid ${c.border}`}}/><span style={{fontSize:9,color:T.text3}}>{l}</span></div>);})}
              <span style={{fontSize:9,color:T.text4,marginLeft:6}}>· Box size = current market value · Colour = day return %</span>
            </>}
            {view==="treemap"&&tmMode==="dividend"&&<>
              <span style={{fontSize:9,color:T.text3,letterSpacing:1,textTransform:"uppercase",marginRight:2}}>Div yld/cost:</span>
              {[[-1,"0%"],[0.5,">0%"],[2,"+2%"],[4,"+4%"],[6,"+6%+"]].map(([y,l])=>{const c=divColor(y,dark);return(<div key={l} style={{display:"flex",alignItems:"center",gap:3}}><div style={{width:11,height:11,borderRadius:2,background:c.bg,border:`1px solid ${c.border}`}}/><span style={{fontSize:9,color:T.text3}}>{l}</span></div>);})}
              <span style={{fontSize:9,color:T.text4,marginLeft:6}}>· Box size = total dividends received · Colour = yield on cost %</span>
            </>}
          </div>
          {/* ... rest of view switcher unchanged */}
        </div>

        <main style={{padding:"12px 14px"}}>
          {view==="treemap"&&(
            <div className="tm-wrap" style={{display:"flex",gap:12,alignItems:"flex-start",flexWrap:isMob?"wrap":"nowrap"}}>
              <div ref={mapRef} style={{flex:"1 1 280px",width:isMob?"100%":"auto",height:isMob?"calc(100vw - 28px)":440,position:"relative",borderRadius:12,overflow:"hidden",border:`1px solid ${T.border}`,background:T.bg3,minWidth:200}}>
                {rects.map(r=>{
                  const c=tmSlider!=null&&sliderRects!=null?gainColor(r.gainPct??0,dark):(tmMode==="performance"?gainColor(r.gainPct,dark):tmMode==="day"?dayColor(r.dayGainPct,dark):divColor(r.divYieldOnCost,dark));
                  const area=r.w*r.h;
                  const minDim = Math.min(r.w, r.h);
                  const baseFont = Math.max(8, Math.min(19, minDim / 7));
                  const tickerSize = baseFont;
                  const pctSize = Math.max(7, baseFont * 0.7);
                  const showExtra = area > 3000;
                  return(
                    <div key={r.ticker} onClick={()=>setSelected(r.ticker===selected?null:r.ticker)}
                      style={{position:"absolute",left:r.x+1,top:r.y+1,width:r.w-2,height:r.h-2,background:c.bg,border:`1px solid ${c.border}`,borderRadius:5,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",cursor:"pointer",overflow:"hidden",outline:r.ticker===selected?`2px solid ${c.text}`:"none",transition:"filter .12s"}}
                      onMouseEnter={e=>e.currentTarget.style.filter="brightness(1.2)"}
                      onMouseLeave={e=>e.currentTarget.style.filter="brightness(1)"}
                    >
                      <span style={{fontSize:tickerSize,fontFamily:"'Space Mono',monospace",fontWeight:700,color:c.text,letterSpacing:.5,textAlign:"center",padding:"0 2px",lineHeight:1.1}}>{r.ticker}</span>
                      <span style={{fontSize:pctSize,fontFamily:"'Space Mono',monospace",color:c.text,opacity:.9,marginTop:1}}>
                        {tmMode==="performance"?fmtPct(r.gainPct):tmMode==="day"?fmtPct(r.dayGainPct):tmShowVal?FC(r.totalDividends,true):fmtPct(r.divYieldOnCost)+" yld"}
                      </span>
                      {showExtra&&tmMode==="day"&&tmShowVal&&<span style={{fontSize:9,fontFamily:"'Space Mono',monospace",color:c.text,opacity:.6,marginTop:1}}>{FG(r.dayGain)}</span>}
                      {showExtra&&tmMode==="dividend"&&tmShowVal&&<span style={{fontSize:9,fontFamily:"'Space Mono',monospace",color:c.text,opacity:.6,marginTop:1}}>{fmtPct(r.divYieldOnCost)} yld</span>}
                      {showExtra&&tmMode==="dividend"&&!tmShowVal&&totalPortfolioDivs>0&&<span style={{fontSize:9,fontFamily:"'Space Mono',monospace",color:c.text,opacity:.6,marginTop:1}}>{(r.totalDividends/totalPortfolioDivs*100).toFixed(1)}% of total</span>}
                      {r.isBondPct&&showExtra&&<span style={{fontSize:7,color:c.text,opacity:.5,marginTop:1}}>BOND</span>}
                    </div>
                  );
                })}
                {rects.length===0&&<div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",color:T.text4,fontFamily:"'Space Mono',monospace",fontSize:11,textAlign:"center",padding:20}}>{tmMode==="dividend"?"No dividends recorded yet":"No holdings — tap + Add"}</div>}
              </div>
              {/* ... detail panel unchanged */}
            </div>
          )}
          {/* Table and Chart views unchanged */}
        </main>
        {/* Modals unchanged */}
      </div>
    </ErrorBoundary>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
