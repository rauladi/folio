function toAUD(amount, currency, rates) {
  if (currency === "IDR") return amount / rates.AUD_IDR;
  if (currency === "USD") return amount / rates.AUD_USD;
  return amount;
}
function fromAUD(amount, currency, rates) {
  if (currency === "IDR") return amount * rates.AUD_IDR;
  if (currency === "USD") return amount * rates.AUD_USD;
  return amount;
}
function fmtIDR(n) { return Math.round(n).toLocaleString("id-ID"); }
function fmtAUD(n) { return n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
function fmtCurrency(audAmount, displayCur, rates, compact = false) {
  const val = fromAUD(audAmount, displayCur, rates);
  if (displayCur === "IDR") {
    const abs = Math.abs(val);
    if (compact && abs >= 1e9) return `Rp${(val/1e9).toFixed(1)}M`;
    if (compact && abs >= 1e6) return `Rp${(val/1e6).toFixed(1)}Jt`;
    if (compact && abs >= 1e3) return `Rp${(val/1e3).toFixed(0)}Rb`;
    return `Rp ${fmtIDR(val)}`;
  }
  if (displayCur === "USD") {
    const abs = Math.abs(val);
    if (compact && abs >= 1e6) return `$${(val/1e6).toFixed(2)}M`;
    if (compact && abs >= 1e3) return `$${(val/1e3).toFixed(1)}K`;
    return `$${fmtAUD(val)}`;
  }
  const abs = Math.abs(val);
  if (compact && abs >= 1e6) return `A$${(val/1e6).toFixed(2)}M`;
  if (compact && abs >= 1e3) return `A$${(val/1e3).toFixed(1)}K`;
  return `A$${fmtAUD(val)}`;
}
function fmtGain(audAmount, displayCur, rates) {
  const val = fromAUD(audAmount, displayCur, rates);

  if (displayCur === "USD") return `${sign}$${fmtAUD(Math.abs(val))}`;
  return `${sign}A$${fmtAUD(Math.abs(val))}`;
}

function computeHolding(holding, prices, prevPrices, rates) {
  let qty = 0, costBasisLocal = 0, realizedLocal = 0;
  let lots = [];
  const txs = [...holding.transactions].sort((a,b)=>new Date(a.date)-new Date(b.date));
  for (const tx of txs) {
    if (tx.type === "buy") {
      lots.push({ qty: tx.qty, price: tx.price });
      qty += tx.qty;
      costBasisLocal += tx.qty * tx.price;
    } else if (tx.type === "sell") {
      let rem = tx.qty;
      qty -= tx.qty;
      while (rem > 0 && lots.length) {
        const lot = lots[0];
        const used = Math.min(lot.qty, rem);
        realizedLocal += used * (tx.price - lot.price);
        costBasisLocal -= used * lot.price;
        lot.qty -= used;
        rem -= used;
        if (lot.qty === 0) lots.shift();
      }
    }
  }
  const divsLocal = txs.filter(t=>t.type==="dividend").reduce((s,t)=>s+(t.totalAmount||0),0);
  const currentPrice = prices[holding.ticker] || 0;
  const prevClose = prevPrices[holding.ticker] || currentPrice;
  const currentValueLocal = qty * currentPrice;
  const unrealizedLocal = currentValueLocal - costBasisLocal;
  const dayGainLocal = (currentPrice - prevClose) * qty;
  const dayPct = prevClose ? ((currentPrice - prevClose) / prevClose) * 100 : 0;
  
  const currentValueAUD = toAUD(currentValueLocal, holding.currency, rates);
  const costBasisAUD = toAUD(costBasisLocal, holding.currency, rates);
  const unrealizedAUD = toAUD(unrealizedLocal, holding.currency, rates);
  const realizedAUD = toAUD(realizedLocal, holding.currency, rates);
  const dividendsAUD = toAUD(divsLocal, holding.currency, rates);
  const totalGainAUD = unrealizedAUD + realizedAUD + dividendsAUD;
  const totalInvestedAUD = toAUD(costBasisLocal, holding.currency, rates);
  const gainPct = totalInvestedAUD > 0 ? (totalGainAUD / totalInvestedAUD) * 100 : 0;
  const dayGainAUD = toAUD(dayGainLocal, holding.currency, rates);
  const divYieldOnCost = totalInvestedAUD > 0 ? (dividendsAUD / totalInvestedAUD) * 100 : 0;
  
  return { ...holding, qty, costBasis: costBasisAUD, currentPrice, prevClose, currentValue: currentValueAUD,
    unrealizedGain: unrealizedAUD, realizedGain: realizedAUD, totalDividends: dividendsAUD, totalGain: totalGainAUD,
    gainPct, dayGain: dayGainAUD, dayGainPct: dayPct, divYieldOnCost, totalInvested: totalInvestedAUD };
}

    return { bg: "#fecaca", text: "#991b1b", border: "#f87171" };
  }
}

  constructor(props) { super(props); this.state = { hasError: false, error: null }; }

    if (this.state.hasError) {

        React.createElement("h2", {}, "Something went wrong"),
        React.createElement("pre", {}, this.state.error?.stack),
        React.createElement("button", { onClick: () => window.location.reload() }, "Reload")
      );
    }
    return this.props.children;
  }
}
