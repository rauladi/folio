<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover" />
    <title>SAUDAGAR KAPITALIS — Investment Dashboard</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html,
        body {
            height: 100%;
            width: 100%;
            overflow-x: hidden;
        }
        body {
            min-height: 100vh;
            font-family: 'Roboto', 'Segoe UI', system-ui, sans-serif;
            font-size: 14px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
        }
        #root {
            width: 100%;
            overflow-x: hidden;
        }
        input,
        select {
            font-family: inherit;
        }
        input[type=number]::-webkit-inner-spin-button {
            -webkit-appearance: none;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
        button {
            cursor: pointer;
            font-family: inherit;
            transition: background-color .15s, transform .1s, box-shadow .15s;
            border: none;
            outline: none;
        }
        button:active {
            transform: scale(.97);
        }
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            border-radius: 4px;
            background: #555;
        }
        .light ::-webkit-scrollbar-thumb {
            background: #ccc;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .spin {
            display: inline-block;
            animation: spin .9s linear infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: .5;
            }
        }
        .pulse {
            animation: pulse 1.5s ease-in-out infinite;
        }

                display: none !important;
            }
            .hdr-mobile {
                display: flex !important;
            }
            .tm-wrap {

            }
            .detail-panel {
                width: 100% !important;

            }
            .chart-row {

            }

            }
            .adj-row .diff-label {

            .whatif-left {

        .risk-card .label {
            font-size: 9px;

            margin-top: 1px;
            font-weight: 400;
        }
        .chart-annotation-legend {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 6px;
            font-size: 10px;
            color: var(--text3, #9aa0a6);
        }
        .chart-annotation-legend .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 4px;

        .gradient-bar {

        /* Sticky Table Styles */
        .table-container {
            overflow: auto;
            max-height: 600px;
            border-radius: 12px;
            border: 1px solid var(--border, #3d3d3d);
        }
        .table-container table {
            border-collapse: separate;
            border-spacing: 0;
            width: 100%;
        }
        .table-container thead th {
            position: sticky;
            top: 0;
            z-index: 10;
            background: var(--bg2, #1e1e1e);
            border-bottom: 2px solid var(--border, #3d3d3d);
        }
        .table-container tbody td:first-child {
            position: sticky;
            left: 0;
            z-index: 5;
            background: var(--bg3, #2a2a2a);
        }
        .table-container thead th:first-child {
            z-index: 15;
            left: 0;
            background: var(--bg2, #1e1e1e);
        }
        .light .table-container tbody td:first-child {
            background: var(--bg3, #f8f9fa);
        }
        .light .table-container thead th {
            background: var(--bg2, #ffffff);
        }
        .light .table-container thead th:first-child {
            background: var(--bg2, #ffffff);
        }
        .table-container tbody tr:hover td {
            background: var(--hover-bg, #333333);
        }
        .light .table-container tbody tr:hover td {
            background: var(--hover-bg, #f1f3f4);
        }
        .light .table-container tbody tr:hover td:first-child {
            background: var(--hover-bg, #f1f3f4);
        }
        /* What-If Styles */
        .whatif-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .whatif-holdings {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
        }
        .whatif-slider {
            width: 100%;
            accent-color: var(--green-btn, #34a853);
        }
        .scenario-card {
            border-radius: 10px;
            padding: 12px 14px;
            border: 1px solid var(--border, #3d3d3d);
            background: var(--bg3, #2a2a2a);
        }
        .scenario-card.active {
            border-color: var(--green-btn, #34a853);
            box-shadow: 0 0 0 2px var(--green-btn, #34a853);
        }
        /* Compact What-If adjustment rows */
        .adj-row {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 5px 8px;
            border-radius: 6px;
            border: 1px solid var(--border, #3d3d3d);
            background: var(--bg4, #333333);
            flex-wrap: nowrap;
            min-height: 38px;
        }
        .adj-row .ticker {
            font-weight: 700;
            font-size: 12px;
            min-width: 48px;
            color: var(--text, #e8eaed);
            letter-spacing: .2px;
            flex-shrink: 0;
        }
        .adj-row .value {
            font-size: 11px;
            min-width: 60px;
            text-align: right;
            color: var(--text2, #bdc1c6);
            font-weight: 500;
            flex-shrink: 0;
        }
        .adj-row input[type="number"] {
            width: 56px;
            background: var(--bg, #121212);
            border: 1px solid var(--border, #3d3d3d);
            border-radius: 4px;
            padding: 3px 4px;
            font-size: 12px;
            color: var(--text, #e8eaed);
            text-align: center;
            font-weight: 600;
            flex-shrink: 0;
        }
        .adj-row .adj-btn {
            background: var(--bg2, #1e1e1e);
            border: 1px solid var(--border, #3d3d3d);
            border-radius: 4px;
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text, #e8eaed);
            cursor: pointer;
            font-size: 16px;
            transition: background 0.15s;
            flex-shrink: 0;
            font-weight: 700;
        }
        .adj-row .adj-btn:hover {
            background: var(--bg5, #555);
        }
        .adj-row .diff-label {
            font-size: 10px;
            min-width: 40px;
            text-align: right;
            color: var(--text3, #9aa0a6);
            font-weight: 600;
            flex-shrink: 0;
        }

        /* What-If layout */
        .whatif-layout {
            display: flex;
            gap: 14px;
            width: 100%;
            align-items: stretch;
            min-height: 420px;
        }
        .whatif-left {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }
        .whatif-left .left-card {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            min-height: 0;
        }

            flex: 1;
            overflow-y: auto;

            min-height: 0;

            grid-template-columns: 1fr 1fr;
            gap: 5px;

            display: flex;
            flex-direction: column;
        }
        .whatif-right .treemap-block .treemap-container {

            min-height: 180px;

            border-radius: 12px;

            background: var(--bg3, #2a2a2a);
        }
        .whatif-right .chart-block canvas {
            width: 100% !important;
            height: 100% !important;
        }
        .whatif-right .treemap-block .treemap-container {
            height: 100%;
            min-height: 180px;
        }

        /* Income Risk styles */
        .income-risk-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-top: 6px;
        }
        .income-risk-card {
            border-radius: 8px;
            padding: 10px 12px;

            color: var(--text3, #9aa0a6);

            margin-top: 2px;

            margin-top: 1px;
            font-weight: 400;
        }

            height: 4px;
            border-radius: 2px;
            background: var(--bg4, #333);

            overflow: hidden;
        }
        .income-risk-card .bar-fill {
            height: 100%;
            border-radius: 2px;

        // ─── Treemap ──────────────────────────────────────────────────────────────────
        function squarify(items, x, y, w, h) {
            if (!items.length) return [];
            const r = [];
            _layout(items, x, y, w, h, items.reduce((s, i) => s + i.value, 0), r);
            return r;
        }

        function _layout(it, x, y, w, h, tot, r) {
            if (!it.length) return;
            if (it.length === 1) { r.push({ ...it[0], x, y, w, h }); return; }
            const hz = w >= h,
                dim = hz ? w : h;
            let row = [],
                rt = 0,
                best = Infinity;
            for (let i = 0; i < it.length; i++) {
                row.push(it[i]);
                rt += it[i].value;
                const rd = (rt / tot) * dim;
                let worst = 0;
                for (const ri of row) { const od = (ri.value / rt) * (hz ? h : w); const ra = Math.max(rd / od, od / rd); if (ra >
                        worst) worst = ra; }
                if (worst > best) { row.pop();
                    rt -= it[i].value; break; }
                best = worst;
            }
            const rd = (rt / tot) * dim;
            let cur = hz ? y : x;
            for (const ri of row) { const sz = (ri.value / rt) * (hz ? h : w); hz ? r.push({ ...ri, x, y: cur, w: rd, h: sz }) :
                    r.push({ ...ri, x: cur, y, w: sz, h: rd });
                cur += sz; }
            const rem = it.slice(row.length);
            if (!rem.length) return;
            const remT = tot - rt;
            hz ? _layout(rem, x + rd, y, w - rd, h, remT, r) : _layout(rem, x, y + rd, w, h - rd, remT, r);
        }

        async function fetchWithProxyRaw(url, timeoutMs = 10000) {
            return new Promise((resolve, reject) => {
                let settled = false;
                let pending = PROXIES.length;
                PROXIES.forEach(proxy => {
                    fetch(proxy(url), { signal: AbortSignal.timeout(timeoutMs) })
                        .then(async r => {
                            if (!r.ok) throw new Error("HTTP " + r.status);
                            const t = await r.text();
                            if (!t || t.length < 10) throw new Error("Empty");
                            if (t.trim().startsWith("{") && t.includes('"contents"')) {
                                try { const j = JSON.parse(t); if (j.contents) { if (!settled) { settled =
                                        true;
                                        resolve(j.contents); } return; } } catch (e) {}
                            }
                            if (!settled) { settled = true;
                                resolve(t); }
                        })
                        .catch(() => {
                            pending--;
                            if (pending === 0 && !settled) reject(new Error("All proxies failed (raw)"));
                        });
                });
            });
        }

        async function tryProxy(proxyUrl, timeoutMs) {
            const r = await fetch(proxyUrl, { signal: AbortSignal.timeout(timeoutMs) });
            if (!r.ok) throw new Error("HTTP " + r.status);
            const t = await r.text();
            if (!t || t.length < 10) throw new Error("Empty response");
            let parsed = JSON.parse(t);
            if (parsed?.contents && typeof parsed.contents === "string") parsed = JSON.parse(parsed.contents);
            return parsed;
        }

        async function fetchWithProxy(url, timeoutMs = 10000) {
            return new Promise((resolve, reject) => {
                let settled = false;
                let pending = PROXIES.length;
                const errors = [];
                PROXIES.forEach(proxy => {
                    tryProxy(proxy(url), timeoutMs)
                        .then(data => {
                            if (!settled) { settled = true;
                                resolve(data); }
                        })
                        .catch(e => {
                            errors.push(e.message);
                            pending--;
                            if (pending === 0 && !settled) reject(new Error("All proxies failed: " + url.split(
                                "?")[0].split("/").pop()));
                        });
                });
            });

            const s = yahooSymbol.toUpperCase();
            if (s.endsWith(".AX")) return s.replace(".AX", ".AU").toLowerCase();
            if (s.endsWith(".JK")) return s.replace(".JK", ".ID").toLowerCase();
            if (s.endsWith("-AUD")) return s.replace("-AUD", "-AUD.CRYPTO").toLowerCase();
            if (s.endsWith("-USD")) return s.replace("-USD", "-USD.CRYPTO").toLowerCase();
            if (s.endsWith("-BTC")) return s.replace("-BTC", "-BTC.CRYPTO").toLowerCase();
            if (s === "GC=F") return "gc.f";
            if (s === "SI=F") return "si.f";
            if (s === "CL=F") return "cl.f";
            if (s === "NG=F") return "ng.f";
            if (s.endsWith(".L")) return s.toLowerCase();
            if (s.endsWith(".SI")) return s.toLowerCase();
            if (s.endsWith(".TO")) return s.toLowerCase();
            if (s.endsWith(".HK")) return s.toLowerCase();
            if (!s.includes(".") && !s.includes("-") && !s.includes("=")) return s.toLowerCase() + ".us";
            return null;
        }

        async function fetchStooq(yahooSymbol) {
            const stooq = toStooqSymbol(yahooSymbol);
            if (!stooq) throw new Error("No Stooq symbol for " + yahooSymbol);
            const now = new Date();
            const d1 = new Date(now);
            d1.setDate(d1.getDate() - 7);
            const fmt = d => `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;
            const url = `https://stooq.com/q/d/l/?s=${stooq}&d1=${fmt(d1)}&d2=${fmt(now)}&i=d`;
            const raw = await fetchWithProxyRaw(url);
            const allLines = raw.trim().split("\n").map(l => l.trim()).filter(Boolean);
            if (allLines.length < 2) throw new Error("Stooq: no data for " + stooq);
            const header = allLines[0].toLowerCase().split(",");
            const closeIdx = header.indexOf("close");
            if (closeIdx < 0) throw new Error("Stooq: no Close col");
            const dataLines = allLines.slice(1).filter(l => !/no data/i.test(l));
            if (!dataLines.length) throw new Error("Stooq: empty data");
            dataLines.sort((a, b) => a.split(",")[0].localeCompare(b.split(",")[0]));
            const parseClose = l => parseFloat(l.split(",")[closeIdx]) || 0;
            const cur = parseClose(dataLines[dataLines.length - 1]);
            const prev = dataLines.length > 1 ? parseClose(dataLines[dataLines.length - 2]) : cur;
            if (!cur) throw new Error("Stooq: zero price");
            return { current: cur, prev };
        }

        async function fetchYahooPrice(symbol) {
            const sym = encodeURIComponent(symbol);
            const isJK = symbol.endsWith(".JK");

            const parseQuote = (d) => {
                const quote = d?.quoteResponse?.result?.[0] || d?.result?.[0];
                if (quote && quote.regularMarketPrice) {
                    const prev = quote.regularMarketPreviousClose;
                    if (prev && prev !== quote.regularMarketPrice) {
                        return { current: quote.regularMarketPrice, prev: prev };
                    }
                    return { current: quote.regularMarketPrice, prev: null };
                }
                return null;
            };

            const parseChartForPrevClose = (d) => {
                const res = d?.chart?.result?.[0];
                if (!res) return null;
                const timestamps = res.timestamp;
                const closes = res.indicators?.quote?.[0]?.close;
                if (!timestamps || !closes || timestamps.length < 2) return null;
                const prevClose = closes[closes.length - 2];
                const current = closes[closes.length - 1];
                if (prevClose && current) return { current, prev: prevClose };
                return null;
            };

            try {
                const quoteUrl =
                `https://query1.finance.yahoo.com/v8/finance/chart/${sym}?interval=1d&range=2d&includePrePost=false`;
                const data = await fetchWithProxy(quoteUrl);

                    console.log(`✅ ${symbol}: price from Yahoo v8`);
                    return result;
                }
            } catch (e) { console.warn(`Yahoo v8 failed for ${symbol}:`, e.message); }

            try {
                const quoteUrl = YAHOO_V7 + sym + "&fields=regularMarketPrice,regularMarketPreviousClose";
                const quoteData = await fetchWithProxy(quoteUrl);
                const result = parseQuote(quoteData);
                if (result && result.current > 0 && result.prev !== null) {
                    console.log(`✅ ${symbol}: price from Yahoo v7`);
                    return result;
                }

            const chartUrls = [
                YAHOO_BASE + sym + "?interval=1d&range=2d&includePrePost=false",
                YAHOO_BASE1 + sym + "?interval=1d&range=2d&includePrePost=false",
            ];
            for (const url of chartUrls) {
                try {
                    const chartData = await fetchWithProxy(url);
                    const result = parseChartForPrevClose(chartData);
                    if (result && result.current > 0 && result.prev > 0) {
                        console.log(`✅ ${symbol}: price from Yahoo chart`);
                        return result;
                    }
                } catch (e) { console.warn(`Yahoo chart endpoint failed for ${symbol}:`, e.message); }
            }

            try {
                const stooqResult = await fetchStooq(symbol);
                if (stooqResult?.current > 0) {
                    console.log(`⚠️ ${symbol}: using Stooq fallback`);
                    return stooqResult;
                }
            } catch (e) { console.warn(`Stooq fallback failed for ${symbol}:`, e.message); }

            if (isJK) {
                try {
                    const idxResult = await fetchIDXPrice(symbol);
                    if (idxResult?.current > 0) {
                        console.log(`⚠️ ${symbol}: using IDX fallback`);
                        return idxResult;
                    }
                } catch (e) { console.warn(`IDX fallback failed for ${symbol}:`, e.message); }
            }

            throw new Error(`All price sources failed for ${symbol}`);
        }

        // ─── Compute Holding ──────────────────────────────────────────────────────────
        function computeHolding(h, prices, prevPrices, R) {
            let qty = 0,
                cbL = 0,
                rgL = 0,
                lots = [],
                divL = 0;
            const txs = [...h.transactions].sort((a, b) => new Date(a.date) - new Date(b.date));
            for (const tx of txs) {
                if (tx.type === "buy") { lots.push({ qty: tx.qty, price: tx.price });
                    qty += tx.qty;
                    cbL += tx.qty * tx.price; } else if (tx.type === "sell") { let rem = tx.qty;
                    qty -= tx.qty; while (rem > 0 && lots.length) { const lot = lots[0],
                            used = Math.min(lot.qty, rem);
                        rgL += used * (tx.price - lot.price);
                        cbL -= used * lot.price;
                        lot.qty -= used;
                        rem -= used; if (lot.qty === 0) lots.shift(); } } else if (tx.type === "dividend") { divL += tx
                        .totalAmount || 0; }
            }
            const cpL = prices[h.ticker] ?? 0,
                pcL = prevPrices[h.ticker] ?? cpL;
            const cvL = qty * cpL,
                ugL = cvL - cbL,
                dgL = (cpL - pcL) * qty,
                dgPct = pcL > 0 ? (cpL - pcL) / pcL * 100 : 0;
            const cv = toAUD(cvL, h.currency, R),
                cb = toAUD(cbL, h.currency, R),
                ug = toAUD(ugL, h.currency, R);
            const rg = toAUD(rgL, h.currency, R),
                divs = toAUD(divL, h.currency, R),
                dg = toAUD(dgL, h.currency, R);
            const totalInv = txs.filter(t => t.type === "buy").reduce((s, t) => s + toAUD(t.qty * t.price, h.currency, R), 0);
            const totalGain = ug + rg + divs,
                gainPct = totalInv > 0 ? (totalGain / totalInv) * 100 : 0;
            const divYoc = totalInv > 0 ? (divs / totalInv) * 100 : 0;
            return { ...h, qty, costBasis: cb, currentPrice: cpL, prevClose: pcL, currentValue: cv, unrealizedGain: ug,
                realizedGain: rg, totalDividends: divs, totalGain, gainPct, dayGain: dg, dayGainPct: dgPct,
                divYieldOnCost: divYoc, totalInvested: totalInv };
        }

                if (!Array.isArray(tx)) tx = [];
                tx = [...tx];
                tx = tx.filter(t => t && typeof t === "object");
                return { ...h, id, transactions: tx };
            });
            return result;

            return <div style={{ height, position: "relative" }}><canvas ref={ref} /></div>;
        }

        function ChartDoughnut({ labels, data, colors, T, height = 230 }) {
            const ref = useRef(null);
            const inst = useRef(null);
            useEffect(() => {
                if (!ref.current || typeof Chart === "undefined") return;
                if (inst.current) inst.current.destroy();
                inst.current = new Chart(ref.current, { type: "doughnut", data: { labels, datasets: [{ data,
                            backgroundColor: colors, borderColor: T.bg2, borderWidth: 2 }] },
                    options: { responsive: true, maintainAspectRatio: false, cutout: "62%", plugins: { legend: { position: "right",
                                labels: { color: T.text2, font: { family: "Roboto", size: 10, weight: "500" },
                                    boxWidth: 10, padding: 8 } }, tooltip: { backgroundColor: T.bg2,
                                borderColor: T.border, borderWidth: 1, titleColor: T.text, bodyColor: T.text2,
                                padding: 10, cornerRadius: 8 } } } });
                return () => { if (inst.current) inst.current.destroy(); };
            }, [labels, data, colors, T]);
            return <div style={{ height, position: "relative" }}><canvas ref={ref} /></div>;
        }

        function ChartWaterfall({ data, T, yFmt, height = 240 }) {
            const ref = useRef(null);
            const inst = useRef(null);
            useEffect(() => {
                if (!ref.current || typeof Chart === "undefined" || !data.length) return;
                if (inst.current) inst.current.destroy();
                const labels = data.map(d => d.label);
                let running = data.length > 0 ? data[0].value : 0;
                const bases = [],
                    tops = [],
                    bgColors = [],
                    borderColors = [];
                const intermediateMins = [],
                    intermediateMaxs = [];
                data.forEach(d => {
                    if (d.type === "pos" || d.type === "neg") {
                        intermediateMins.push(Math.min(running, running + d.value));
                        intermediateMaxs.push(Math.max(running, running + d.value));
                    }
                });
                running = data.length > 0 ? data[0].value : 0;
                data.forEach(d => {
                    if (d.type === "start") {
                        bases.push(0);
                        tops.push(d.value);
                        bgColors.push("#6366f177");
                        borderColors.push("#6366f1");
                    } else if (d.type === "total") {
                        bases.push(0);
                        tops.push(d.value);
                        bgColors.push(d.value >= (data[0]?.value ?? 0) ? "#6366f1" : "#ef4444");
                        borderColors.push(d.value >= (data[0]?.value ?? 0) ? "#818cf8" : "#f87171");
                    } else if (d.type === "pos") {
                        bases.push(running);
                        tops.push(running + d.value);
                        bgColors.push("#34a853");
                        borderColors.push("#66bb6a");
                        running += d.value;
                    } else {
                        bases.push(running + d.value);
                        tops.push(running);
                        bgColors.push("#ea4335");
                        borderColors.push("#f28b82");
                        running += d.value;
                    }
                });
                const floatData = bases.map((b, i) => [Math.min(b, tops[i]), Math.max(b, tops[i])]);
                const allIntermediate = intermediateMins.concat(intermediateMaxs);
                const interMin = allIntermediate.length ? Math.min(...allIntermediate) : 0;
                const interMax = allIntermediate.length ? Math.max(...allIntermediate) : 0;
                const interRange = interMax - interMin;
                const startVal = data[0]?.value ?? 0;
                const endVal = data[data.length - 1]?.value ?? 0;
                const bigVal = Math.max(startVal, endVal);
                const useCompressed = interRange > 0 && interRange / bigVal < 0.15 && bigVal > 0;
                const yMin = useCompressed ? Math.max(0, interMin - interRange * 2) : 0;
                const yMax = useCompressed ? Math.min(bigVal, interMax + interRange * 2) : bigVal * 1.05;
                inst.current = new Chart(ref.current, {
                    type: "bar",
                    data: { labels, datasets: [{
                            data: floatData,
                            backgroundColor: bgColors,
                            borderColor: borderColors,
                            borderWidth: 1.5,
                            borderRadius: 4,
                            borderSkipped: false,
                        }] },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                backgroundColor: T.bg2,
                                borderColor: T.border,
                                borderWidth: 1,
                                titleColor: T.text,
                                bodyColor: T.text2,
                                padding: 10,
                                cornerRadius: 8,
                                callbacks: { label: (ctx) => {
                                        const d2 = data[ctx.dataIndex];
                                        const v = d2.value;
                                        const sign = v >= 0 ? "+" : "";
                                        const pct = data[0]?.value ? ((v / Math.abs(data[0].value)) * 100).toFixed(
                                            1) : 0;
                                        return `${sign}${yFmt?yFmt(Math.abs(v)):"A$"+(Math.abs(v)/1000).toFixed(1)+"K"} (${sign}${pct}%)`;
                                    } },
                            },
                            annotation: useCompressed ? {
                                annotations: {
                                    breakTop: { type: "line", yMin: yMax, yMax: yMax, borderColor: T.border,
                                        borderWidth: 1, borderDash: [4, 4] },
                                    breakBot: { type: "line", yMin: yMin, yMax: yMin, borderColor: T.border,
                                        borderWidth: 1, borderDash: [4, 4] },
                                    note: { type: "label", xValue: 0, yValue: yMax,
                                        content: "* Start/End bars compressed for scale", color: T.text3,
                                        font: { size: 9, weight: "400" } },
                                }
                            } : {},
                        },
                        scales: {
                            x: { grid: { color: "transparent" }, ticks: { color: T.chartTick, font: { size: 10,
                                        weight: "500" } }, border: { color: T.border } },
                            y: {
                                grid: { color: T.chartGrid },
                                ticks: { color: T.chartTick, font: { size: 10, weight: "500" }, callback: yFmt ||
                                        (v => `A$${(v/1000).toFixed(0)}K`) },
                                border: { color: T.border },
                                ...(useCompressed ? { min: yMin, max: yMax } : {}),
                            },
                        },
                    }
                });
                return () => { if (inst.current) inst.current.destroy(); };
            }, [data, T, yFmt]);
            return (
                <div style={{ height, position: "relative" }}>
                    {data.length ?
                        <canvas ref={ref} /> :
                        <div style={{ height, display: "flex", alignItems: "center", justifyContent: "center",
                            color: T.text3, fontSize: 12, fontWeight: "500" }}>No data for selected period</div>
                    }
                </div>
            );
        }

        // ─── Import / Export ─────────────────────────────────────────────────────────
        const COL = {
            ticker: ["ticker", "symbol", "stock code", "scrip", "stock ticker", "asx code", "idx code",
                "security code"],
            name: ["name", "company", "company name", "security name", "description", "instrument", "issuer"],
            type: ["type", "transaction type", "tx type", "txtype", "tx_type", "action", "trade type"],
            date: ["date", "trade date", "settlement date", "payment date", "tx date", "transaction date",
                "value date"],

            price: ["price", "unit price", "trade price", "cost price", "nav", "purchase price", "sale price"],
            currency: ["currency", "ccy", "cur", "denomination"],
            assetType: ["asset type", "asset_type", "asset class", "category", "class", "security type",
                "instrument type"],
            exchange: ["exchange", "market", "listing", "exchange code", "exch", "bourse"],
            yahooSymbol: ["yahoo", "yahoo symbol", "yahoo_symbol", "yfinance", "yf symbol", "yahoo finance"],
            faceValue: ["face value", "face_value", "nominal", "nominal value", "par value", "par"],
            isBondPct: ["is bond", "isbond", "bond pct", "bond %", "fixed rate bond", "is_bond"],
            entitledQty: ["entitled qty", "entitled units", "entitled shares", "entitled", "ex date units",
                "qualifying units", "qualifying shares"
            ],
            amountPerShare: ["amount per share", "div per share", "coupon per unit", "dividend per share",
                "dividend rate", "coupon rate", "div rate", "rate per unit", "distribution per unit"
            ],
            totalAmount: ["total amount", "total dividend", "total coupon", "gross amount", "total distribution",
                "dividend total"
            ],
        };

        function resolveHeader(raw) {
            if (!raw && raw !== 0) return null;
            const norm = s => String(s).toLowerCase().trim().replace(/[_\-]/g, " ").replace(/\s+/g, " ");
            const lo = norm(raw);
            for (const [field, aliases] of Object.entries(COL)) {
                if (aliases.map(norm).includes(lo)) return field;
            }
            for (const [field, aliases] of Object.entries(COL)) {
                for (const a of aliases) {
                    const na = norm(a);
                    const re = new RegExp("(^|[\\s/])" + na.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "([\\s/]|$)");
                    if (re.test(lo)) return field;
                }
            }
            return null;
        }

        function normaliseType(raw = "") {
            const lo = raw.toLowerCase().trim();
            if (["buy", "purchase", "bought", "b", "top up", "topup", "top-up", "add"].includes(lo)) return "buy";
            if (["sell", "sale", "sold", "s", "disposal", "withdraw"].includes(lo)) return "sell";
            if (["div", "dividend", "dividends", "income", "distribution", "coupon", "interest", "yield", "d"].includes(lo))
                return "dividend";
            return null;
        }

        function normaliseDate(raw = "") {
            if (!raw) return "";
            if (typeof raw === "number") {
                const d = new Date(Math.round((raw - 25569) * 86400 * 1000));
                return d.toISOString().slice(0, 10);
            }
            const s = String(raw).trim();
            if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
            const m1 = s.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{4})/);
            if (m1) {
                const [, d, mo, y] = m1;
                return `${y}-${mo.padStart(2,"0")}-${d.padStart(2,"0")}`;
            }
            const dt = new Date(s);
            if (!isNaN(dt)) return dt.toISOString().slice(0, 10);
            return s;
        }

        function normaliseCurrency(raw = "") {
            const lo = String(raw).toUpperCase().trim();
            if (["AUD", "A$", "AU"].includes(lo)) return "AUD";
            if (["IDR", "RP", "RUPIAH"].includes(lo)) return "IDR";
            if (["USD", "US$", "$"].includes(lo)) return "USD";
            return lo || "AUD";
        }

        function normaliseAssetType(raw = "") {
            const lo = raw.toLowerCase().trim();
            const map = {
                "shares": "Shares / Stocks",
                "stocks": "Shares / Stocks",
                "share": "Shares / Stocks",
                "stock": "Shares / Stocks",

                "deposit": "Cash / Term Deposit",
            };
            for (const [k, v] of Object.entries(map)) { if (lo.includes(k)) return v; }
            return ASSET_TYPES.find(t => t.toLowerCase() === lo) || raw || "Shares / Stocks";
        }

        function parseRows(rawRows) {
            if (!rawRows.length) return { rows: [], errors: [], fieldMap: {} };
            const sampleKeys = Object.keys(rawRows[0]);
            const fieldMap = {};
            sampleKeys.forEach(k => { const f = resolveHeader(k); if (f) fieldMap[f] = k; });
            const rows = [],
                errors = [];
            rawRows.forEach((raw, i) => {
                const row = {};
                const R = n => fieldMap[n] ? String(raw[fieldMap[n]] ?? "").trim() : "";
                const RN = n => fieldMap[n] ? parseFloat(String(raw[fieldMap[n]] ?? "").replace(/[^\d.\-]/g, "")) ||
                    0 : 0;
                row.ticker = (R("ticker") || "").toUpperCase();
                row.type = normaliseType(R("type"));
                row.date = normaliseDate(fieldMap["date"] ? raw[fieldMap["date"]] : "");
                row.qty = RN("qty");
                row.price = RN("price");
                row.name = R("name") || row.ticker;
                row.currency = normaliseCurrency(R("currency"));
                row.assetType = normaliseAssetType(R("assetType"));
                row.exchange = R("exchange");
                row.yahooSymbol = R("yahooSymbol");
                row.faceValue = RN("faceValue") || null;
                row.isBondPct = ["true", "yes", "1", "y"].includes(R("isBondPct").toLowerCase());
                row.entitledQty = RN("entitledQty") || null;
                row.amountPerShare = RN("amountPerShare");
                row.totalAmount = RN("totalAmount");
                const errs = [];
                if (!row.ticker) errs.push("Missing ticker");
                if (!row.type) errs.push(`Unknown type "${R("type")}"`);
                if (!row.date) errs.push("Missing date");
                if (row.type === "buy" || row.type === "sell") {
                    if (!row.qty || row.qty <= 0) errs.push("qty must be > 0");
                    if (!row.price || row.price <= 0) errs.push("price must be > 0");
                }
                if (row.type === "dividend") {
                    if (!row.amountPerShare && !row.totalAmount) errs.push("Need amount per share or total amount");
                }
                row._rowNum = i + 2;
                row._errors = errs;
                rows.push(row);
                if (errs.length) errors.push({ rowNum: i + 2, ticker: row.ticker, errs });
            });
            return { rows, errors, fieldMap };
        }

        function buildPortfolioFromRows(parsedRows, existingPortfolio = []) {
            const repaired = repairPortfolio(existingPortfolio);
            const portfolio = repaired.map(h => ({ ...h, transactions: [...h.transactions] }));
            const valid = parsedRows.filter(r => !r._errors.length);
            valid.forEach(row => {
                let holding = portfolio.find(h => h.ticker === row.ticker);
                if (!holding) {
                    holding = {
                        id: Date.now() + Math.random() * 1000,
                        ticker: row.ticker,
                        name: row.name || row.ticker,
                        currency: row.currency || "AUD",
                        assetType: row.assetType || "Shares / Stocks",
                        exchange: row.exchange || "",
                        yahooSymbol: row.yahooSymbol || suggestYahoo(row.ticker, row.exchange, row.assetType),
                        transactions: [],
                    };
                    if (row.isBondPct) holding.isBondPct = true;
                    if (row.faceValue) holding.faceValue = row.faceValue;
                    portfolio.push(holding);
                }
                if (row.type === "buy" || row.type === "sell") {
                    holding.transactions.push({ type: row.type, qty: row.qty, price: row.price, date: row.date });
                } else if (row.type === "dividend") {
                    const entQ = row.entitledQty || row.qty || null;
                    let total = row.totalAmount || 0;
                    if (!total && row.amountPerShare && entQ) total = row.amountPerShare * entQ;
                    holding.transactions.push({
                        type: "dividend",
                        amountPerShare: row.amountPerShare,
                        totalAmount: total,
                        ...(entQ ? { entitledQty: entQ } : {}),
                        date: row.date,
                    });
                }
            });
            portfolio.forEach(h => h.transactions.sort((a, b) => new Date(a.date) - new Date(b.date)));
            return repairPortfolio(portfolio);
        }

        function readFileAsRows(file) {
            return new Promise((resolve, reject) => {
                const ext = file.name.split(".").pop().toLowerCase();
                if (ext === "csv" || ext === "txt") {
                    const reader = new FileReader();
                    reader.onload = e => {
                        const result = Papa.parse(e.target.result, { header: true, skipEmptyLines: true,
                            dynamicTyping: false });
                        resolve(result.data);
                    };
                    reader.onerror = reject;
                    reader.readAsText(file);
                } else if (["xlsx", "xls", "ods"].includes(ext)) {
                    const reader = new FileReader();
                    reader.onload = e => {
                        const wb = XLSX.read(e.target.result, { type: "array", cellDates: false });
                        const ws = wb.Sheets[wb.SheetNames[0]];
                        const data = XLSX.utils.sheet_to_json(ws, { defval: "", raw: true });
                        resolve(data);
                    };
                    reader.onerror = reject;
                    reader.readAsArrayBuffer(file);
                } else {
                    reject(new Error("Unsupported file type: ." + ext + ". Use .csv, .xlsx or .xls"));
                }
            });
        }

        // ─── Export Transactions ─────────────────────────────────────────────────────
        function exportTransactionsCSV(portfolio) {
            const rows = [];
            const header = [
                "ticker", "name", "type", "date", "qty", "price",
                "amount_per_share", "entitled_qty", "total_amount",
                "currency", "asset_type", "exchange", "yahoo_symbol",
                "face_value", "is_bond"
            ];
            rows.push(header);

            for (const h of portfolio) {
                for (const tx of h.transactions) {
                    const row = [
                        h.ticker,
                        h.name || "",
                        tx.type,
                        tx.date || "",
                        tx.type === "dividend" ? "" : (tx.qty ?? ""),
                        tx.type === "dividend" ? "" : (tx.price ?? ""),
                        tx.type === "dividend" ? (tx.amountPerShare ?? "") : "",
                        tx.type === "dividend" ? (tx.entitledQty ?? "") : "",
                        tx.type === "dividend" ? (tx.totalAmount ?? "") : "",
                        h.currency || "AUD",
                        h.assetType || "",
                        h.exchange || "",
                        h.yahooSymbol || "",
                        h.faceValue ?? "",
                        h.isBondPct ? "true" : "",
                    ];
                    rows.push(row);
                }
            }

            const csv = rows.map(r => r.map(v => String(v).includes(",") ? `"${v}"` : v).join(",")).join("\n");
            const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" });
            const a = document.createElement("a");
            const dateStr = new Date().toISOString().slice(0, 10);
            a.download = `folio_transactions_${dateStr}.csv`;
            a.href = URL.createObjectURL(blob);
            a.click();
            URL.revokeObjectURL(a.href);
        }

        // ─── Risk Metrics ────────────────────────────────────────────────────────────
        function computeRiskMetrics(historyData) {
            if (!historyData || historyData.length < 3) {
                return { volatility: null, maxDrawdown: null, bestMonth: null, worstMonth: null };
            }
            const sorted = [...historyData].sort((a, b) => new Date(a.date) - new Date(b.date));
            const values = sorted.map(d => d.totalValueAUD);
            const returns = [];
            for (let i = 1; i < values.length; i++) {
                if (values[i - 1] > 0) {
                    let ret = (values[i] - values[i - 1]) / values[i - 1];
                    if (ret > 1) ret = 1;
                    if (ret < -1) ret = -1;
                    returns.push(ret);
                }
            }
            if (returns.length < 2) {
                return { volatility: null, maxDrawdown: null, bestMonth: null, worstMonth: null };
            }
            const meanRet = returns.reduce((s, r) => s + r, 0) / returns.length;
            const variance = returns.reduce((s, r) => s + (r - meanRet) ** 2, 0) / returns.length;
            const monthlyStd = Math.sqrt(variance);
            const volatility = monthlyStd * Math.sqrt(12);
            let peak = values[0];
            let maxDrawdown = 0;
            for (const v of values) {
                if (v > peak) peak = v;
                const dd = peak > 0 ? (peak - v) / peak : 0;
                if (dd > maxDrawdown) maxDrawdown = dd;
            }
            const monthlyRet = [];
            const sortedDates = sorted.map(d => d.date);
            for (let i = 1; i < values.length; i++) {
                let ret = values[i - 1] > 0 ? (values[i] - values[i - 1]) / values[i - 1] : 0;
                if (ret > 1) ret = 1;
                if (ret < -1) ret = -1;
                monthlyRet.push({ date: sortedDates[i], ret });
            }
            const best = monthlyRet.reduce((a, b) => a.ret > b.ret ? a : b, { ret: -Infinity });
            const worst = monthlyRet.reduce((a, b) => a.ret < b.ret ? a : b, { ret: Infinity });
            return {
                volatility: volatility * 100,
                maxDrawdown: maxDrawdown * 100,
                bestMonth: best.ret !== -Infinity ? { date: best.date, ret: best.ret * 100 } : null,
                worstMonth: worst.ret !== Infinity ? { date: worst.date, ret: worst.ret * 100 } : null,
            };
        }

        // ─── Income Risk Metrics (FIXED) ─────────────────────────────────────────────
        function computeIncomeRiskMetrics(portfolio, rates, displayCur) {
            // Filter to dividend-paying holdings that are NOT excluded
            const divHoldings = portfolio.filter(h =>
                DIVIDEND_PAYING_TYPES.has(h.assetType) &&
                !INCOME_RISK_EXCLUDED_TICKERS.has(h.ticker)
            );
            if (divHoldings.length === 0) {
                return { totalIncome: 0, stability: null, payoutRisk: null, cutProb: null, concentration: null,
                    incomeVolatility: null, incomeDrawdown: null, dividendGrowth: null };
            }

            // Collect monthly dividend income per holding
            const monthlyIncome = {};
            const monthlyByHolding = {};
            const holdingTotalIncome = {};
            const yearlyIncome = {};

            for (const h of divHoldings) {
                const divTxs = h.transactions.filter(t => t.type === "dividend" && t.date);
                for (const tx of divTxs) {
                    const date = tx.date.slice(0, 7); // YYYY-MM
                    const year = tx.date.slice(0, 4);
                    const amountAUD = toAUD(tx.totalAmount || 0, h.currency, rates);
                    if (!monthlyIncome[date]) monthlyIncome[date] = 0;
                    monthlyIncome[date] += amountAUD;
                    if (!monthlyByHolding[date]) monthlyByHolding[date] = {};
                    if (!monthlyByHolding[date][h.ticker]) monthlyByHolding[date][h.ticker] = 0;
                    monthlyByHolding[date][h.ticker] += amountAUD;
                    if (!holdingTotalIncome[h.ticker]) holdingTotalIncome[h.ticker] = 0;
                    holdingTotalIncome[h.ticker] += amountAUD;
                    if (!yearlyIncome[year]) yearlyIncome[year] = 0;
                    yearlyIncome[year] += amountAUD;
                }
            }

            const dates = Object.keys(monthlyIncome).sort();
            if (dates.length < 3) {
                return { totalIncome: 0, stability: null, payoutRisk: null, cutProb: null, concentration: null,
                    incomeVolatility: null, incomeDrawdown: null, dividendGrowth: null };
            }

            const incomeValues = dates.map(d => monthlyIncome[d]);
            const mean = incomeValues.reduce((a, b) => a + b, 0) / incomeValues.length;
            const stdDev = Math.sqrt(incomeValues.reduce((s, v) => s + (v - mean) ** 2, 0) / incomeValues.length);
            // Stability: 1 - coefficient of variation (capped at 0)
            const cv = mean > 0 ? stdDev / mean : 1;
            const stability = Math.max(0, Math.min(1, 1 - Math.min(cv, 1)));

            // Payout Risk: based on dividend volatility and stability
            const rawPayoutRisk = cv;
            const payoutRisk = Math.min(1, Math.max(0, rawPayoutRisk * 0.8 + 0.1));

            // Cut Probability: based on payout risk and stability
            let cutProb;
            if (payoutRisk < 0.3 && stability > 0.7) cutProb = "Low";
            else if (payoutRisk < 0.5 && stability > 0.5) cutProb = "Low–Medium";
            else if (payoutRisk < 0.6) cutProb = "Medium";
            else if (payoutRisk < 0.75) cutProb = "Medium–High";
            else cutProb = "High";

            // Concentration: top 3 holdings % of total income
            const sortedIncome = Object.values(holdingTotalIncome).sort((a, b) => b - a);
            const top3 = sortedIncome.slice(0, 3).reduce((s, v) => s + v, 0);
            const totalIncome = sortedIncome.reduce((s, v) => s + v, 0);
            const concentration = totalIncome > 0 ? top3 / totalIncome : 0;

            // Income Volatility (coefficient of variation of monthly income)
            const incomeVolatility = mean > 0 ? stdDev / mean : 0;

            // Income Drawdown (max decline from peak monthly income)
            let peakIncome = -Infinity;
            let maxIncomeDrawdown = 0;
            for (const v of incomeValues) {
                if (v > peakIncome) peakIncome = v;
                if (peakIncome > 0) {
                    const dd = (peakIncome - v) / peakIncome;
                    if (dd > maxIncomeDrawdown) maxIncomeDrawdown = dd;
                }
            }

            // Dividend Growth: CAGR of annual dividend income
            const years = Object.keys(yearlyIncome).sort();
            let dividendGrowth = null;
            if (years.length >= 2) {
                const firstY = years[0];
                const lastY = years[years.length - 1];
                const firstVal = yearlyIncome[firstY];
                const lastVal = yearlyIncome[lastY];
                const numYears = parseInt(lastY) - parseInt(firstY);
                if (numYears > 0 && firstVal > 0 && lastVal > 0) {
                    dividendGrowth = (Math.pow(lastVal / firstVal, 1 / numYears) - 1) * 100;
                }
            }

            return {
                totalIncome,
                stability,
                payoutRisk,
                cutProb,
                concentration,
                incomeVolatility,
                incomeDrawdown: maxIncomeDrawdown,
                dividendGrowth,
                meanMonthlyIncome: mean,
                stdDevMonthly: stdDev,
                dates,
                incomeValues,
                monthlyByHolding,
                holdingTotalIncome,
                yearlyIncome,
            };
        }

        // ─── Chart Annotations Plugin — FIXED: uses rawDates for exact matching ─────
        function createAnnotationPlugin(annotationData, T) {
            return {
                id: 'customAnnotations',
                afterDraw(chart) {
                    const ctx = chart.ctx;
                    const xAxis = chart.scales.x;
                    const yAxis = chart.scales.y;
                    if (!xAxis || !yAxis) return;

                    const rawDates = chart.data.rawDates || [];
                    const labels = chart.data.labels || [];

                    const dateToIndex = {};
                    rawDates.forEach((d, i) => {
                        if (d) dateToIndex[d] = i;
                    });

                    const findIndex = (dateStr) => {
                        if (!dateStr) return -1;
                        // Exact match by raw date
                        if (dateToIndex[dateStr] !== undefined) return dateToIndex[dateStr];
                        // Try formatted label match
                        const label = fmtMonShort(dateStr);
                        const idx = labels.indexOf(label);
                        if (idx !== -1) return idx;
                        // Fuzzy fallback: day/month proximity
                        const d = new Date(dateStr + "T12:00:00");
                        const txDay = d.getDate();
                        const txMonth = d.getMonth();
                        let best = -1,
                            bestScore = Infinity;
                        const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov",
                            "Dec"
                        ];
                        for (let i = 0; i < labels.length; i++) {
                            const parts = labels[i].split(' ');
                            if (parts.length < 2) continue;
                            const day = parseInt(parts[0]);
                            const month = monthNames.indexOf(parts[1]);
                            if (isNaN(day) || month === -1) continue;
                            const score = Math.abs(month - txMonth) * 30 + Math.abs(day - txDay);
                            if (score < bestScore) { bestScore = score;
                                best = i; }
                        }
                        return (bestScore < 45) ? best : -1;
                    };

                    const drawMarker = (item, drawFn) => {
                        if (!item) return;
                        const idx = findIndex(item.date);
                        if (idx === -1) return;
                        const x = xAxis.getPixelForValue(idx);
                        // Use the value from annotation data, but clamp to visible range
                        let y = yAxis.getPixelForValue(item.value);
                        if (y === undefined || !isFinite(y) || y < yAxis.top || y > yAxis.bottom) {
                            y = (item.value > 0) ? yAxis.top + 12 : yAxis.bottom - 12;
                        }
                        y = Math.max(yAxis.top + 4, Math.min(yAxis.bottom - 4, y));
                        drawFn(ctx, x, y, yAxis);
                    };

                    // Buy markers
                    (annotationData.buys || []).forEach(item => {
                        drawMarker(item, (ctx, x, y, ya) => {
                            ctx.save();
                            const size = 8;
                            const yPos = y - size - 4;
                            const grad = ctx.createRadialGradient(x, yPos, 0, x, yPos, size * 2);
                            grad.addColorStop(0, 'rgba(52,168,83,0.3)');
                            grad.addColorStop(1, 'rgba(52,168,83,0)');
                            ctx.fillStyle = grad;
                            ctx.beginPath();
                            ctx.arc(x, yPos, size * 2, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.fillStyle = '#34a853';
                            ctx.shadowColor = 'rgba(52,168,83,0.4)';
                            ctx.shadowBlur = 10;
                            ctx.beginPath();
                            ctx.moveTo(x, yPos - 7);
                            ctx.lineTo(x - 6, yPos + 4);
                            ctx.lineTo(x + 6, yPos + 4);
                            ctx.closePath();
                            ctx.fill();
                            ctx.shadowBlur = 0;
                            ctx.fillStyle = '#ffffff';
                            ctx.font = 'bold 5px sans-serif';
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';
                            ctx.fillText('B', x, yPos + 1);
                            ctx.restore();
                        });
                    });

                    // Dividend markers
                    (annotationData.dividends || []).forEach(item => {
                        drawMarker(item, (ctx, x, y, ya) => {
                            ctx.save();
                            const size = 7;
                            const yPos = y - size - 4;
                            const grad = ctx.createRadialGradient(x, yPos, 0, x, yPos, size * 1.8);
                            grad.addColorStop(0, 'rgba(249,168,37,0.3)');
                            grad.addColorStop(1, 'rgba(249,168,37,0)');
                            ctx.fillStyle = grad;
                            ctx.beginPath();
                            ctx.arc(x, yPos, size * 1.8, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.fillStyle = '#f9a825';
                            ctx.shadowColor = 'rgba(249,168,37,0.4)';
                            ctx.shadowBlur = 10;
                            ctx.beginPath();
                            ctx.arc(x, yPos, size * 0.5, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.shadowBlur = 0;
                            ctx.fillStyle = '#ffffff';
                            ctx.font = 'bold 5px sans-serif';
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';
                            ctx.fillText('D', x, yPos + 0.5);
                            ctx.restore();
                        });
                    });

                    // Event markers
                    (annotationData.events || []).forEach(event => {
                        drawMarker(event, (ctx, x, y, ya) => {
                            const yMin = ya.top;
                            const yMax = ya.bottom;
                            ctx.save();
                            ctx.setLineDash([3, 4]);
                            ctx.strokeStyle = event.color || '#fdd663';
                            ctx.lineWidth = 1.5;
                            ctx.globalAlpha = 0.5;
                            ctx.beginPath();
                            ctx.moveTo(x, yMin);
                            ctx.lineTo(x, yMax);
                            ctx.stroke();
                            ctx.globalAlpha = 1;
                            ctx.setLineDash([]);
                            ctx.fillStyle = event.color || '#fdd663';
                            ctx.font = 'bold 7px sans-serif';
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'top';
                            const label = event.label || '';
                            const tw = ctx.measureText(label).width;
                            const pad = 5;
                            const rectX = x - tw / 2 - pad;
                            const rectY = yMin + 3;
                            ctx.fillStyle = T.bg2 + 'dd';
                            ctx.shadowColor = 'rgba(0,0,0,0.3)';
                            ctx.shadowBlur = 6;
                            const r = 3;
                            const w = tw + pad * 2;
                            const h = 13;
                            ctx.beginPath();
                            ctx.moveTo(rectX + r, rectY);
                            ctx.arcTo(rectX + w, rectY, rectX + w, rectY + h, r);
                            ctx.arcTo(rectX + w, rectY + h, rectX, rectY + h, r);
                            ctx.arcTo(rectX, rectY + h, rectX, rectY, r);
                            ctx.arcTo(rectX, rectY, rectX + w, rectY, r);
                            ctx.closePath();
                            ctx.fill();
                            ctx.shadowBlur = 0;
                            ctx.fillStyle = event.color || '#fdd663';
                            ctx.textBaseline = 'middle';
                            ctx.fillText(label, x, rectY + 6.5);
                            ctx.restore();
                        });
                    });
                }
            };
        }

                        let divAUD = 0;
                        portfolio.forEach(h => {
                            h.transactions.filter(t => t.type === "dividend" && t.date <= s.date)
                                .forEach(t => {
                                    divAUD += toAUD(t.totalAmount || 0, h.currency, rates);
                                });
                        });
                        return fromAUD(divAUD, displayCur, rates);
                    });
                }
                const baseSnap = allSorted.filter(s => new Date(s.date) < cutoff).slice(-1)[0];
                const monthly = {};
                const monthlyByTicker = {};
                const palette = ["#6366f1", "#34a853", "#1a73e8", "#f59e0b", "#ea4335", "#8b5cf6", "#ec4899",
                    "#14b8a6", "#f97316", "#84cc16", "#3b82f6", "#a78bfa"
                ];
                portfolio.forEach(h => {
                    h.transactions.filter(t => t.type === "dividend" && new Date(t.date) >= cutoff).forEach(
                    t => {
                        const m = t.date.slice(0, 7);
                        const val = fromAUD(toAUD(t.totalAmount || 0, h.currency, rates), displayCur,
                            rates);
                        monthly[m] = (monthly[m] || 0) + val;
                        if (!monthlyByTicker[h.ticker]) monthlyByTicker[h.ticker] = {};
                        monthlyByTicker[h.ticker][m] = (monthlyByTicker[h.ticker][m] || 0) + val;
                    });
                });
                const mKeys = Object.keys(monthly).sort();
                const divTickers = Object.keys(monthlyByTicker).sort((a, b) => {
                    const totA = Object.values(monthlyByTicker[a]).reduce((s, v) => s + v, 0);
                    const totB = Object.values(monthlyByTicker[b]).reduce((s, v) => s + v, 0);
                    return totB - totA;
                });
                const mDatasets = divTickers.map((ticker, i) => ({
                    label: ticker,
                    data: mKeys.map(m => monthlyByTicker[ticker][m] || 0),
                    backgroundColor: palette[i % palette.length] + "aa",
                    borderColor: palette[i % palette.length],
                    borderWidth: 1,
                    borderRadius: 3,
                }));
                const byType = {};
                holdings.forEach(h => { const k = h.assetType || "Other";
                    byType[k] = (byType[k] || 0) + fromAUD(h.currentValue, displayCur, rates); });
                const byCur = {};
                holdings.forEach(h => { byCur[h.currency] = (byCur[h.currency] || 0) + fromAUD(h.currentValue,
                        displayCur, rates); });
                const startVal = vals.length ? vals[0] : (baseSnap ? fromAUD(baseSnap.totalValueAUD, displayCur,
                    rates) : 0);
                const endVal = vals.length ? vals[vals.length - 1] : fromAUD(totVal, displayCur, rates);
                const topUps = portfolio.reduce((s, h) => s + h.transactions.filter(t => t.type === "buy" && new Date(t
                        .date) >= cutoff).reduce((ss, t) => ss + fromAUD(toAUD(t.qty * t.price, h.currency, rates),
                        displayCur, rates), 0), 0);
                const divInPeriod = portfolio.reduce((s, h) => s + h.transactions.filter(t => t.type === "dividend" &&
                    new Date(t.date) >= cutoff).reduce((ss, t) => ss + fromAUD(toAUD(t.totalAmount || 0, h.currency,
                        rates), displayCur, rates), 0), 0);
                const netSales = portfolio.reduce((s, h) => s + h.transactions.filter(t => t.type === "sell" && new Date(
                        t.date) >= cutoff).reduce((ss, t) => ss + fromAUD(toAUD(t.qty * t.price, h.currency, rates),
                        displayCur, rates), 0), 0);
                const capitalGain = endVal - startVal - topUps + netSales - divInPeriod;
                const waterfallData = [
                    { label: "Start Value", value: startVal, type: "start" },
                    capitalGain >= 0 ? { label: "Capital Gain", value: capitalGain, type: "pos" } : { label: "Capital Loss",
                        value: capitalGain, type: "neg" },
                    { label: "Top-Ups", value: topUps, type: "pos" },
                    { label: "Dividends", value: divInPeriod, type: "pos" },
                    netSales > 0 ? { label: "Sales", value: -netSales, type: "neg" } : null,
                    { label: "End Value", value: endVal, type: "total" },
                ].filter(Boolean);
                const divByYear = {};
                portfolio.forEach(h => {
                    h.transactions.filter(t => t.type === "dividend").forEach(t => {
                        const y = t.date.slice(0, 4);
                        const val = fromAUD(toAUD(t.totalAmount || 0, h.currency, rates), displayCur,
                            rates);
                        divByYear[y] = (divByYear[y] || 0) + val;
                    });
                });
                const divYears = Object.keys(divByYear).sort();
                let divCAGR_ = null,
                    divCAGRYears = 0;
                if (divYears.length >= 2) {
                    const firstY = divYears[0],
                        lastY = divYears[divYears.length - 1];
                    const firstVal = divByYear[firstY],
                        lastVal = divByYear[lastY];
                    divCAGRYears = parseInt(lastY) - parseInt(firstY);
                    if (divCAGRYears > 0 && firstVal > 0 && lastVal > 0) {
                        divCAGR_ = (Math.pow(lastVal / firstVal, 1 / divCAGRYears) - 1) * 100;
                    }
                }
                return {
                    labels,
                    rawDates,
                    vals,
                    divCumul,
                    mLabels: mKeys.map(fmtMon),
                    mVals: mKeys.map(k => monthly[k]),
                    mDatasets,
                    divCAGR: divCAGR_,
                    divCAGRYears,
                    tLabels: Object.keys(byType),
                    tVals: Object.values(byType),
                    palette,
                    byCurLabels: Object.keys(byCur),
                    byCurVals: Object.values(byCur),
                    byCurColors: ["#34a853", "#1a73e8", "#f59e0b", "#8b5cf6"],
                    waterfallData,
                    startVal,
                    endVal,
                    bmLabels,
                    bmSeries,
                    bmPortfolio,
                };
            }, [history, holdings, displayCur, rates, portfolio, chartPeriod, periodCutoff, benchmarks, totVal, dark,
                prices
            ]);

                const date = new Date().toISOString().slice(0, 10);

                    b.date)).slice(-90));

            const histH = modal?.mode === "history" ? portfolio.find(p => p.id === modal.holding.id) : null;
            const histC = histH ? computeHolding(histH, prices, prevPrices, rates) : null;

            const card = (x = {}) => ({ background: T.cardBg || T.bg3, border: "1px solid " + T.border, borderRadius: 12,
                boxShadow: T.shadow, padding: 16, ...x });
            const bS = (bg, col, x = {}) => ({ padding: "8px 16px", border: "none", borderRadius: 20, background: bg,
                color: col, fontSize: 12, fontWeight: 600, transition: "background .2s", ...x });
            const bO = (col, x = {}) => ({ padding: "8px 14px", border: "1px solid " + T.border2, borderRadius: 20,
                background: "transparent", color: col, fontSize: 12, fontWeight: 500, transition: "background .2s",
                ...x });
            const inp = () => ({ width: "100%", background: T.bg, border: "1px solid " + T.border2, borderRadius: 8,
                padding: "10px 14px", color: T.text, fontSize: 13, outline: "none", transition: "border .2s" });
            const lbl = (x = {}) => ({ display: "block", fontSize: 10, letterSpacing: 1.2, color: T.text3,
                textTransform: "uppercase", marginBottom: 6, fontWeight: 600, ...x });
            const fmtNativePrice = (h, v) => { const cur = h.currency; if (!v && v !== 0) return "—"; if (cur ===
                    "IDR") return `Rp ${fmtIDR(v)}`; if (cur === "USD") return `US$${fmtAUD(v)}`; return `A$${fmtAUD(v)}`; };
            const fetchBarColor = fetchSt.loading ? T.amber : Object.keys(fetchSt.errors).length > 0 ? T.amber : fetchSt
                .lastUpdate ? T.green : T.text3;

            // ─── What-If Logic ──────────────────────────────────────────────────────
            const runSimulation = useCallback(() => {
                if (!holdings.length) return null;
                const { growthRate, reinvestRatio, fxRate, simulationYears, adjustments } = whatIf;

                let adjustedDivs = 0;
                let adjustedValue = 0;
                let totalAdjValue = 0;
                const adjustedHoldings = holdings.map(h => {
                    const factor = adjustments[h.ticker] || 1.0;
                    const adjVal = h.currentValue * factor;
                    const adjDiv = h.totalDividends * factor;
                    totalAdjValue += adjVal;
                    return { ...h, adjustedValue: adjVal, adjustedDividends: adjDiv };
                });

                let divPortValue = 0,
                    divPortDivs = 0;
                adjustedHoldings.forEach(h => {
                    if (h.assetType && DIVIDEND_PAYING_TYPES.has(h.assetType)) {
                        divPortValue += h.adjustedValue;
                        divPortDivs += h.adjustedDividends;
                    }
                });
                const currentYield = divPortValue > 0 ? (divPortDivs / divPortValue) * 100 : 0;

                const totalAdjustedDivs = adjustedHoldings.reduce((s, h) => s + h.adjustedDividends, 0);
                const totalAdjustedValue = adjustedHoldings.reduce((s, h) => s + h.adjustedValue, 0);

                const years = [];
                const projectedDivs = [];
                const projectedReinvested = [];
                let div = totalAdjustedDivs;

                for (let i = 0; i <= simulationYears; i++) {
                    years.push(new Date().getFullYear() + i);
                    projectedDivs.push(div);
                    const reinvested = div * (reinvestRatio / 100);
                    projectedReinvested.push(reinvested);
                    div = div * (1 + growthRate / 100) + reinvested * (growthRate / 100) * 0.5;
                }

                const finalDiv = projectedDivs[projectedDivs.length - 1] || totalAdjustedDivs;
                const cagr = totalAdjustedDivs > 0 ? (Math.pow(finalDiv / totalAdjustedDivs, 1 / simulationYears) - 1) *
                100 : 0;

                const maxHolding = adjustedHoldings.reduce((max, h) => h.adjustedValue > max ? h.adjustedValue : max, 0);
                const riskConcentration = totalAdjustedValue > 0 ? (maxHolding / totalAdjustedValue) * 100 : 0;

                return {
                    adjustedDivs: totalAdjustedDivs,
                    adjustedValue: totalAdjustedValue,
                    currentYield,
                    finalDiv,
                    cagr,
                    riskConcentration,
                    years,
                    projectedDivs,
                    projectedReinvested,
                    adjustedHoldings,
                };
            }, [holdings, whatIf]);

            const simulationResult = useMemo(() => runSimulation(), [runSimulation]);

            const whatIfItems = useMemo(() => {
                if (!simulationResult) return [];
                return simulationResult.adjustedHoldings.map(h => ({ ...h, value: h.adjustedValue }));
            }, [simulationResult]);

                if (!sorted.length) return [];

                const h = Math.max(whatIfTmSize.h, 120);
                return squarify(sorted, 0, 0, w, h);

                                                gap: 4 }}>
                                            {holdings.map(h => {

                                                return (
                                                    <div key={h.ticker} className="adj-row" style={{ background: T.bg4,

                                                        <span className="ticker" style={{ fontSize: 11,
                                                                minWidth: 44, fontWeight: 700, color: T
                                                                .text, flexShrink: 0 }}>{h.ticker}</span>

                                                            onClick={() => setWhatIf(w => ({ ...w, adjustments: { ...w.adjustments, [h.ticker]: Math.max(0.5, factor - 0.05) } }))}>−</button>
                                                        <input type="number" style={{ width: 48, background: T

                                                        <button className="adj-btn" style={{ background: T
