<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FOLIO — Portfolio Dashboard (Stable)</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Roboto', sans-serif; background: #0b0e14; color: #eef2ff; transition: 0.2s; }
    button { cursor: pointer; font-family: inherit; }
    input, select { font-family: inherit; }
    .card { background: #0f111a; border: 1px solid #252b3c; border-radius: 12px; }
    .btn-primary { background: #22c55e; border: none; border-radius: 8px; padding: 6px 12px; color: white; font-weight: 700; }
    .btn-secondary { background: transparent; border: 1px solid #2a3048; border-radius: 8px; padding: 6px 12px; color: #e8ecff; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid #252b3c; }
    th { color: #9098b8; font-size: 9px; letter-spacing: 1px; text-transform: uppercase; background: #0b0d16; }
    input, select { background: #0f1120; border: 1px solid #1e2438; border-radius: 8px; padding: 8px 10px; color: white; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .modal-content { background: #0f111a; border-radius: 16px; padding: 24px; max-width: 500px; width: 90%; border: 1px solid #252b3c; }
    @media (max-width: 768px) { .hide-mobile { display: none; } }
  </style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.2.0/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.development.js"></script>
<script>
// ---------- SIMPLE TREEMAP (squarify) ----------
function squarify(items, x, y, w, h) {
  if (!items.length) return [];
  const result = [];
  function layout(arr, cx, cy, cw, ch, total, out) {
    if (!arr.length) return;
    if (arr.length === 1) {
      out.push({ ...arr[0], x: cx, y: cy, w: cw, h: ch });
      return;
    }
    const horiz = cw >= ch;
    const dim = horiz ? cw : ch;
    let row = [], rowSum = 0, best = Infinity;
    for (let i = 0; i < arr.length; i++) {
      row.push(arr[i]);
      rowSum += arr[i].value;
      const curSize = (rowSum / total) * dim;
      let worst = 0;
      for (let r of row) {
        const otherDim = (r.value / rowSum) * (horiz ? ch : cw);
        const ratio = Math.max(curSize / otherDim, otherDim / curSize);
        if (ratio > worst) worst = ratio;
      }
      if (worst > best) {
        row.pop();
        rowSum -= arr[i].value;
        break;
      }
      best = worst;
    }
    const blockSize = (rowSum / total) * dim;
    let curPos = horiz ? cy : cx;
    for (let r of row) {
      const segSize = (r.value / rowSum) * (horiz ? ch : cw);
      if (horiz) out.push({ ...r, x: cx, y: curPos, w: blockSize, h: segSize });
      else out.push({ ...r, x: curPos, y: cy, w: segSize, h: blockSize });
      curPos += segSize;
    }
    const remaining = arr.slice(row.length);
    if (!remaining.length) return;
    const remainingTotal = total - rowSum;
    if (horiz) layout(remaining, cx + blockSize, cy, cw - blockSize, ch, remainingTotal, out);
    else layout(remaining, cx, cy + blockSize, cw, ch - blockSize, remainingTotal, out);
  }
  layout(items, x, y, w, h, items.reduce((s,i)=>s+i.value,0), result);
  return result;
}

// ---------- Portfolio helpers ----------
const CURRENCIES = ["AUD","IDR","USD"];
const toAUD = (amount, cur, rates) => {
  if (cur === "IDR") return amount / rates.AUD_IDR;
  if (cur === "USD") return amount / rates.AUD_USD;
  return amount;
};
const fromAUD = (amount, cur, rates) => {
  if (cur === "IDR") return amount * rates.AUD_IDR;
  if (cur === "USD") return amount * rates.AUD_USD;
  return amount;
};
const fmtIDR = n => Math.round(n).toLocaleString("id-ID");
const fmtAUD = n => n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
const fmtCur = (aud, cur, rates, compact) => {
  const val = fromAUD(aud, cur, rates);
  if (cur === "IDR") return `Rp ${fmtIDR(val)}`;
  if (cur === "USD") return `$${fmtAUD(val)}`;
  return `A$${fmtAUD(val)}`;
};
const fmtPct = n => `${n>=0?"+":""}${n.toFixed(2)}%`;

function computeHolding(holding, prices, prevPrices, rates) {
  let qty = 0, costLocal = 0, realizedLocal = 0, lots = [], divLocal = 0;
  const txs = [...holding.transactions].sort((a,b)=>new Date(a.date)-new Date(b.date));
  for (let tx of txs) {
    if (tx.type === "buy") {
      lots.push({qty: tx.qty, price: tx.price});
      qty += tx.qty;
      costLocal += tx.qty * tx.price;
    } else if (tx.type === "sell") {
      let rem = tx.qty;
      qty -= tx.qty;
      while (rem > 0 && lots.length) {
        let lot = lots[0];
        let used = Math.min(lot.qty, rem);
        realizedLocal += used * (tx.price - lot.price);
        costLocal -= used * lot.price;
        lot.qty -= used;
        rem -= used;
        if (lot.qty === 0) lots.shift();
      }
    } else if (tx.type === "dividend") {
      divLocal += tx.totalAmount || 0;
    }
  }
  const curPrice = prices[holding.ticker] || 0;
  const prevClose = prevPrices[holding.ticker] || curPrice;
  const curValueLocal = qty * curPrice;
  const dayGainLocal = (curPrice - prevClose) * qty;
  const dayPct = prevClose ? ((curPrice - prevClose)/prevClose)*100 : 0;
  const curValueAUD = toAUD(curValueLocal, holding.currency, rates);
  const costAUD = toAUD(costLocal, holding.currency, rates);
  const unrealizedAUD = toAUD(curValueLocal - costLocal, holding.currency, rates);
  const realizedAUD = toAUD(realizedLocal, holding.currency, rates);
  const divAUD = toAUD(divLocal, holding.currency, rates);
  const totalGainAUD = unrealizedAUD + realizedAUD + divAUD;
  const investedAUD = toAUD(costLocal, holding.currency, rates);
  const gainPct = investedAUD ? (totalGainAUD / investedAUD)*100 : 0;
  const dayGainAUD = toAUD(dayGainLocal, holding.currency, rates);
  const divYield = investedAUD ? (divAUD / investedAUD)*100 : 0;
  return {
    ...holding, qty, costBasis: costAUD, currentPrice: curPrice, prevClose,
    currentValue: curValueAUD, unrealizedGain: unrealizedAUD, realizedGain: realizedAUD,
    totalDividends: divAUD, totalGain: totalGainAUD, gainPct, dayGain: dayGainAUD,
    dayGainPct: dayPct, divYieldOnCost: divYield, totalInvested: investedAUD
  };
}

// Seed data
const INIT_RATES = { AUD_IDR: 10550, AUD_USD: 0.645 };
const SEED_HOLDINGS = [
  { id: 1, ticker: "BHP", name: "BHP Group Ltd", currency: "AUD", assetType: "Shares / Stocks", exchange: "ASX", yahooSymbol: "BHP.AX", transactions: [
      { type: "buy", qty: 50, price: 42, date: "2022-06-10" },
      { type: "buy", qty: 30, price: 44, date: "2023-01-15" },
      { type: "dividend", amountPerShare: 1.30, totalAmount: 104, date: "2022-09-20" }
    ] },
  { id: 2, ticker: "CBA", name: "Commonwealth Bank", currency: "AUD", assetType: "Shares / Stocks", exchange: "ASX", yahooSymbol: "CBA.AX", transactions: [
      { type: "buy", qty: 20, price: 98, date: "2022-08-01" },
      { type: "dividend", amountPerShare: 2.40, totalAmount: 48, date: "2022-09-30" }
    ] },
  { id: 3, ticker: "BBCA", name: "Bank Central Asia", currency: "IDR", assetType: "Shares / Stocks", exchange: "IDX", yahooSymbol: "BBCA.JK", transactions: [
      { type: "buy", qty: 10000, price: 8500, date: "2022-09-01" }
    ] }
];
const INIT_PRICES = { BHP: 46.5, CBA: 128, BBCA: 10050 };
const INIT_PREV = { BHP: 45.8, CBA: 126.5, BBCA: 9950 };

// React App
const { useState, useEffect, useMemo } = React;

function App() {
  const load = (key, def) => { try { return JSON.parse(localStorage.getItem(key)) || def; } catch { return def; } };
  const [portfolio, setPortfolio] = useState(() => load("folio_portfolio", SEED_HOLDINGS));
  const [prices, setPrices] = useState(() => load("folio_prices", INIT_PRICES));
  const [prevPrices, setPrevPrices] = useState(() => load("folio_prev", INIT_PREV));
  const [rates, setRates] = useState(() => load("folio_rates", INIT_RATES));
  const [displayCur, setDisplayCur] = useState(() => load("folio_cur", "AUD"));
  const [darkMode, setDarkMode] = useState(() => load("folio_dark", true));
  const [view, setView] = useState("table"); // table, treemap
  const [modal, setModal] = useState(null);
  const [form, setForm] = useState({});
  const [selected, setSelected] = useState(null);
  const [tmSize, setTmSize] = useState({ w: 600, h: 400 });
  const mapRef = useCallback(node => { if (node) new ResizeObserver(([e]) => setTmSize({ w: e.contentRect.width, h: e.contentRect.height })).observe(node); }, []);

  useEffect(() => {
    localStorage.setItem("folio_portfolio", JSON.stringify(portfolio));
    localStorage.setItem("folio_prices", JSON.stringify(prices));
    localStorage.setItem("folio_prev", JSON.stringify(prevPrices));
    localStorage.setItem("folio_rates", JSON.stringify(rates));
    localStorage.setItem("folio_cur", JSON.stringify(displayCur));
    localStorage.setItem("folio_dark", JSON.stringify(darkMode));
  }, [portfolio, prices, prevPrices, rates, displayCur, darkMode]);

  const holdings = useMemo(() => portfolio.map(h => computeHolding(h, prices, prevPrices, rates)).filter(h => h.qty > 0), [portfolio, prices, prevPrices, rates]);
  const totalValue = holdings.reduce((s,h) => s + h.currentValue, 0);
  const totalGain = holdings.reduce((s,h) => s + h.totalGain, 0);
  const totalInvested = holdings.reduce((s,h) => s + h.totalInvested, 0);
  const totalGainPct = totalInvested ? (totalGain / totalInvested) * 100 : 0;
  const totalDividends = holdings.reduce((s,h) => s + h.totalDividends, 0);
  const dayGainTotal = holdings.reduce((s,h) => s + h.dayGain, 0);
  const dayPctTotal = (totalValue - dayGainTotal) ? (dayGainTotal / (totalValue - dayGainTotal)) * 100 : 0;

  const fmtVal = (aud) => fmtCur(aud, displayCur, rates, true);
  const fmtGain = (aud) => {
    const val = fromAUD(aud, displayCur, rates);
    const sign = val >= 0 ? "+" : "-";
    if (displayCur === "IDR") return `${sign}Rp ${fmtIDR(Math.abs(val))}`;
    if (displayCur === "USD") return `${sign}$${fmtAUD(Math.abs(val))}`;
    return `${sign}A$${fmtAUD(Math.abs(val))}`;
  };

  // Treemap rects
  const rects = useMemo(() => {
    const items = holdings.map(h => ({ ...h, value: h.currentValue })).sort((a,b)=>b.value - a.value);
    return squarify(items, 0, 0, tmSize.w, tmSize.h);
  }, [holdings, tmSize]);

  // Modal handlers
  const closeModal = () => setModal(null);
  const openAdd = () => { setModal("add"); setForm({ ticker: "", name: "", qty: "", price: "", date: new Date().toISOString().slice(0,10), currency: "AUD" }); };
  const submitAdd = () => {
    const { ticker, name, qty, price, date, currency } = form;
    if (!ticker || !qty || !price) return;
    const newTicker = ticker.toUpperCase();
    if (portfolio.find(h => h.ticker === newTicker)) {
      setPortfolio(prev => prev.map(h => h.ticker === newTicker ? { ...h, transactions: [...h.transactions, { type: "buy", qty: parseFloat(qty), price: parseFloat(price), date }] } : h));
    } else {
      const newH = { id: Date.now(), ticker: newTicker, name: name || newTicker, currency, assetType: "Shares / Stocks", exchange: "", yahooSymbol: "", transactions: [{ type: "buy", qty: parseFloat(qty), price: parseFloat(price), date }] };
      setPortfolio(prev => [...prev, newH]);
      setPrices(prev => ({ ...prev, [newTicker]: parseFloat(price) }));
      setPrevPrices(prev => ({ ...prev, [newTicker]: parseFloat(price) }));
    }
    closeModal();
  };
  const openTrade = (h, type) => { setModal({ mode: "trade", holding: h, tradeType: type }); setForm({ qty: "", price: h.currentPrice, date: new Date().toISOString().slice(0,10) }); };
  const submitTrade = () => {
    const { holding, tradeType, qty, price, date } = form;
    setPortfolio(prev => prev.map(h => h.id === holding.id ? { ...h, transactions: [...h.transactions, { type: tradeType, qty: parseFloat(qty), price: parseFloat(price), date }] } : h));
    closeModal();
  };
  const openDiv = (h) => { setModal({ mode: "dividend", holding: h }); setForm({ amountPerShare: "", entitledQty: h.qty, date: new Date().toISOString().slice(0,10) }); };
  const submitDiv = () => {
    const { holding, amountPerShare, entitledQty, date } = form;
    const total = parseFloat(amountPerShare) * parseFloat(entitledQty);
    setPortfolio(prev => prev.map(h => h.id === holding.id ? { ...h, transactions: [...h.transactions, { type: "dividend", amountPerShare: parseFloat(amountPerShare), totalAmount: total, entitledQty: parseFloat(entitledQty), date }] } : h));
    closeModal();
  };
  const openManualPrice = () => {
    const f = {};
    holdings.forEach(h => { f[`c_${h.ticker}`] = prices[h.ticker]; f[`p_${h.ticker}`] = prevPrices[h.ticker]; });
    setModal("price"); setForm(f);
  };
  const submitManualPrice = () => {
    const newPrices = { ...prices }, newPrev = { ...prevPrices };
    Object.entries(form).forEach(([k,v]) => {
      if (k.startsWith("c_") && v !== "") newPrices[k.slice(2)] = parseFloat(v);
      if (k.startsWith("p_") && v !== "") newPrev[k.slice(2)] = parseFloat(v);
    });
    setPrices(newPrices); setPrevPrices(newPrev);
    closeModal();
  };

  // Table View
  const TableView = () => (
    <div className="card" style={{ overflowX: "auto", padding: "1px 0" }}>
      <table>
        <thead><tr>{["Ticker","Name","CCY","Units","Price","Day G/L","Value","Total G/L","G/L%","Actions"].map(h => <th key={h}>{h}</th>)}</tr></thead>
        <tbody>
          {holdings.map(h => {
            const gainColor = h.gainPct >= 0 ? "#22c55e" : "#ef4444";
            return <tr key={h.ticker}>
              <td style={{ fontFamily: "'Space Mono', monospace", fontWeight: 700 }}>{h.ticker}</td>
              <td>{h.name}</td>
              <td>{h.currency}</td>
              <td>{h.qty.toFixed(4)}</td>
              <td>{h.currency === "IDR" ? `Rp ${fmtIDR(h.currentPrice)}` : `$${h.currentPrice.toFixed(2)}`}</td>
              <td style={{ color: h.dayGain >= 0 ? "#22c55e" : "#ef4444" }}>{fmtGain(h.dayGain)} ({fmtPct(h.dayGainPct)})</td>
              <td style={{ fontWeight: 600 }}>{fmtVal(h.currentValue)}</td>
              <td style={{ color: h.totalGain >= 0 ? "#22c55e" : "#ef4444" }}>{fmtGain(h.totalGain)}</td>
              <td><span style={{ background: gainColor + "20", color: gainColor, padding: "2px 8px", borderRadius: 20, fontSize: 10 }}>{fmtPct(h.gainPct)}</span></td>
              <td><div style={{ display: "flex", gap: 4 }}><button onClick={()=>openTrade(h,"buy")} style={{ background: "#22c55e", border: "none", borderRadius: 4, padding: "4px 8px", color: "white" }}>B</button><button onClick={()=>openTrade(h,"sell")} style={{ background: "#ef4444", border: "none", borderRadius: 4, padding: "4px 8px", color: "white" }}>S</button><button onClick={()=>openDiv(h)} style={{ background: "#0d9488", border: "none", borderRadius: 4, padding: "4px 8px", color: "white" }}>D</button></div></td>
            </tr>;
          })}
        </tbody>
      </table>
    </div>
  );

  const TreemapView = () => (
    <div ref={mapRef} style={{ width: "100%", height: 500, position: "relative", background: "#0f111a", borderRadius: 12, border: "1px solid #252b3c", overflow: "hidden" }}>
      {rects.map(r => {
        const col = r.gainPct >= 0 ? "#22c55e" : "#ef4444";
        const bg = r.gainPct >= 3 ? "#166534" : r.gainPct > 0 ? "#14532d" : r.gainPct > -1 ? "#7f1d1d" : "#991b1b";
        return <div key={r.ticker} onClick={() => setSelected(r.ticker === selected ? null : r.ticker)} style={{ position: "absolute", left: r.x, top: r.y, width: r.w, height: r.h, background: bg, border: `1px solid ${col}`, borderRadius: 4, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", cursor: "pointer", overflow: "hidden" }}>
          <span style={{ fontFamily: "'Space Mono', monospace", fontWeight: 700, fontSize: r.w > 80 ? 14 : 10, color: "white" }}>{r.ticker}</span>
          <span style={{ fontSize: 10, color: "#bbf7d0" }}>{fmtPct(r.gainPct)}</span>
        </div>;
      })}
    </div>
  );

  // Simple Header
  const Header = () => (
    <div style={{ background: "#0f111a", borderBottom: "1px solid #252b3c", padding: "12px 16px", display: "flex", justifyContent: "space-between", flexWrap: "wrap", gap: 12 }}>
      <div style={{ fontFamily: "'Space Mono', monospace", fontSize: 20, fontWeight: 700, background: "linear-gradient(135deg,#22c55e,#06b6d4)", WebkitBackgroundClip: "text", backgroundClip: "text", color: "transparent" }}>FOLIO</div>
      <div style={{ display: "flex", gap: 20 }}>
        <div><div style={{ fontSize: 9, color: "#9098b8" }}>TOTAL VALUE</div><div style={{ fontFamily: "'Space Mono', monospace", fontSize: 16, fontWeight: 700 }}>{fmtVal(totalValue)}</div></div>
        <div><div style={{ fontSize: 9, color: "#9098b8" }}>TOTAL G/L</div><div style={{ fontFamily: "'Space Mono', monospace", fontSize: 14, color: totalGain >= 0 ? "#22c55e" : "#ef4444" }}>{fmtGain(totalGain)} ({fmtPct(totalGainPct)})</div></div>
        <div><div style={{ fontSize: 9, color: "#9098b8" }}>DAY G/L</div><div style={{ fontFamily: "'Space Mono', monospace", fontSize: 14, color: dayGainTotal >= 0 ? "#22c55e" : "#ef4444" }}>{fmtGain(dayGainTotal)} ({fmtPct(dayPctTotal)})</div></div>
        <div><div style={{ fontSize: 9, color: "#9098b8" }}>DIVIDENDS</div><div style={{ fontFamily: "'Space Mono', monospace", fontSize: 14, color: "#2dd4bf" }}>{fmtVal(totalDividends)}</div></div>
      </div>
      <div style={{ display: "flex", gap: 8 }}>
        <button onClick={() => setDarkMode(!darkMode)} className="btn-secondary">{darkMode ? "☀️" : "🌙"}</button>
        <button onClick={openManualPrice} className="btn-secondary">✏️ Prices</button>
        <button onClick={openAdd} className="btn-primary">+ Add</button>
      </div>
      <div style={{ display: "flex", gap: 6, background: "#1a1f2e", borderRadius: 8, padding: 2 }}>
        <button onClick={() => setView("table")} style={{ padding: "4px 12px", borderRadius: 6, border: "none", background: view === "table" ? "#0f111a" : "transparent", color: view === "table" ? "white" : "#9098b8" }}>Table</button>
        <button onClick={() => setView("treemap")} style={{ padding: "4px 12px", borderRadius: 6, border: "none", background: view === "treemap" ? "#0f111a" : "transparent", color: view === "treemap" ? "white" : "#9098b8" }}>Treemap</button>
      </div>
    </div>
  );

  const ModalOverlay = () => {
    if (!modal) return null;
    let content;
    if (modal === "add") {
      content = <div className="modal-content"><h3>Add Holding</h3><div style={{ display: "grid", gap: 10, marginTop: 12 }}><input placeholder="Ticker" value={form.ticker||""} onChange={e=>setForm({...form, ticker: e.target.value.toUpperCase()})} /><input placeholder="Name" value={form.name||""} onChange={e=>setForm({...form, name: e.target.value})} /><select value={form.currency||"AUD"} onChange={e=>setForm({...form, currency: e.target.value})}>{CURRENCIES.map(c=><option key={c}>{c}</option>)}</select><input type="number" placeholder="Quantity" value={form.qty||""} onChange={e=>setForm({...form, qty: e.target.value})} /><input type="number" placeholder="Price" value={form.price||""} onChange={e=>setForm({...form, price: e.target.value})} /><input type="date" value={form.date||""} onChange={e=>setForm({...form, date: e.target.value})} /></div><div style={{ display: "flex", gap: 8, justifyContent: "flex-end", marginTop: 16 }}><button className="btn-secondary" onClick={closeModal}>Cancel</button><button className="btn-primary" onClick={submitAdd}>Add</button></div></div>;
    } else if (modal?.mode === "trade") {
      content = <div className="modal-content">
