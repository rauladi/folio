<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover" />
<meta name="theme-color" content="#0a0e14" />
<title>SAUDAGAR KAPITALIS — Investment Dashboard</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;width:100%;overflow-x:hidden}
  body{
    font-family:'Inter','Roboto','Segoe UI',system-ui,-apple-system,sans-serif;
    font-size:14px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
    background:var(--bg);color:var(--text);overflow-x:hidden;
  }
  #root{width:100%;min-height:100vh}
  input,select,button{font-family:inherit}
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
  input[type=number]{-moz-appearance:textfield}
  button{cursor:pointer;border:none;outline:none;background:none;color:inherit;transition:background .15s,transform .1s,color .15s,opacity .15s}
  button:active{transform:scale(.97)}
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--border-light);border-radius:4px}
  ::-webkit-scrollbar-thumb:hover{background:var(--text-3)}

  :root{
    --bg:#0a0e14;--bg-card:#11161f;--bg-elevated:#161c26;--bg-hover:#1c232f;--bg-input:#0e131a;
    --border:#222b38;--border-light:#2d3746;
    --text:#e6edf3;--text-2:#8b949e;--text-3:#6b7684;
    --green:#22c55e;--green-dim:#16a34a;--green-bg:rgba(34,197,94,.12);
    --red:#ef4444;--red-bg:rgba(239,68,68,.12);
    --blue:#3b82f6;--blue-bg:rgba(59,130,246,.12);
    --amber:#f59e0b;--amber-bg:rgba(245,158,11,.12);
    --teal:#14b8a6;--teal-bg:rgba(20,184,166,.12);
    --purple:#a855f7;--purple-bg:rgba(168,85,247,.12);
    --radius:14px;--radius-sm:10px;
    --shadow:0 1px 2px rgba(0,0,0,.3);--shadow-lg:0 12px 32px rgba(0,0,0,.5);
    --chart-grid:rgba(255,255,255,.05);--chart-tick:#6b7684;
  }
  html[data-theme="light"]{
    --bg:#f4f6fa;--bg-card:#ffffff;--bg-elevated:#f7f9fc;--bg-hover:#eef2f7;--bg-input:#f4f6fa;
    --border:#e2e8f0;--border-light:#cbd5e1;
    --text:#0d1520;--text-2:#475569;--text-3:#94a3b8;
    --green:#16a34a;--green-dim:#15803d;--green-bg:rgba(22,163,74,.1);
    --red:#dc2626;--red-bg:rgba(220,38,38,.1);
    --blue:#2563eb;--blue-bg:rgba(37,99,235,.1);
    --amber:#d97706;--amber-bg:rgba(217,119,6,.1);
    --teal:#0d9488;--teal-bg:rgba(13,148,136,.1);
    --purple:#9333ea;--purple-bg:rgba(147,51,234,.1);
    --shadow:0 1px 3px rgba(15,23,42,.06);--shadow-lg:0 12px 32px rgba(15,23,42,.12);
    --chart-grid:rgba(15,23,42,.06);--chart-tick:#64748b;
  }

  .app{display:flex;flex-direction:column;min-height:100vh;background:var(--bg)}

  /* HEADER */
  .header{position:sticky;top:0;z-index:40;background:var(--bg-card);border-bottom:1px solid var(--border);padding:10px 20px;backdrop-filter:blur(12px)}
  .header-inner{display:flex;align-items:center;gap:16px;max-width:1600px;margin:0 auto;width:100%}
  .logo{display:flex;align-items:center;gap:10px;flex-shrink:0}
  .logo-mark{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--green) 0%,var(--green-dim) 100%);box-shadow:0 4px 12px rgba(34,197,94,.25)}
  .logo-text{display:flex;flex-direction:column;line-height:1.1}
  .logo-text b{font-size:14px;font-weight:800;letter-spacing:.6px;color:var(--text)}
  .logo-text span{font-size:9px;color:var(--text-3);font-weight:500;letter-spacing:.3px;margin-top:1px}
  .header-nav{display:flex;gap:4px;flex:1;justify-content:center}
  .nav-tab{padding:8px 16px;border-radius:9px;font-size:13px;font-weight:600;color:var(--text-2);display:flex;align-items:center;gap:7px;white-space:nowrap}
  .nav-tab:hover{background:var(--bg-hover);color:var(--text)}
  .nav-tab.active{background:var(--green-bg);color:var(--green)}
  .header-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
  .icon-btn{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--text-2);border:1px solid transparent}
  .icon-btn:hover{background:var(--bg-hover);color:var(--text);border-color:var(--border)}
  .icon-btn:disabled{opacity:.5;cursor:not-allowed}
  .avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--purple));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;overflow:hidden;border:2px solid var(--border);flex-shrink:0}
  .avatar img{width:100%;height:100%;object-fit:cover}
  .currency-pill{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:9px;background:var(--bg-elevated);border:1px solid var(--border);font-size:12px;font-weight:600;color:var(--text)}
  .currency-pill select{background:transparent;border:none;color:inherit;font-size:12px;font-weight:600;outline:none;cursor:pointer;appearance:none;padding-right:4px}
  .currency-pill select option{background:var(--bg-card);color:var(--text)}

  /* MAIN */
  .main{flex:1;width:100%;max-width:1600px;margin:0 auto;padding:18px 20px 40px}
  .greeting{margin-bottom:18px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .greeting h1{font-size:22px;font-weight:800;color:var(--text);letter-spacing:-.4px}
  .greeting p{font-size:12px;color:var(--text-3);margin-top:3px;font-weight:500}
  .greeting-quote{font-size:12px;color:var(--text-2);font-style:italic;max-width:280px;text-align:right;line-height:1.5}
  .greeting-quote span{display:block;font-style:normal;color:var(--text-3);font-size:11px;margin-top:2px}

  /* CARDS */
  .card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);transition:border-color .15s}
  .card:hover{border-color:var(--border-light)}
  .card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px;flex-wrap:wrap}
  .card-title{font-size:13px;font-weight:700;color:var(--text)}
  .card-sub{font-size:11px;color:var(--text-3);font-weight:500;margin-top:2px}

  /* KPI */
  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
  .kpi-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden;transition:border-color .15s}
  .kpi-card:hover{border-color:var(--border-light)}
  .kpi-top{display:flex;align-items:center;gap:9px}
  .kpi-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .kpi-icon.green{background:var(--green-bg);color:var(--green)}
  .kpi-icon.blue{background:var(--blue-bg);color:var(--blue)}
  .kpi-icon.amber{background:var(--amber-bg);color:var(--amber)}
  .kpi-icon.teal{background:var(--teal-bg);color:var(--teal)}
  .kpi-icon.red{background:var(--red-bg);color:var(--red)}
  .kpi-label{font-size:11px;color:var(--text-3);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
  .kpi-value{font-size:22px;font-weight:800;color:var(--text);letter-spacing:-.5px;font-variant-numeric:tabular-nums;line-height:1.1}
  .kpi-delta{font-size:11px;font-weight:700;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
  .kpi-delta.up{color:var(--green)}
  .kpi-delta.down{color:var(--red)}
  .kpi-delta.neutral{color:var(--text-3)}
  .kpi-delta span{color:var(--text-3);font-weight:500}
  .kpi-progress{height:4px;border-radius:2px;background:var(--bg-elevated);overflow:hidden;margin-top:2px}
  .kpi-progress-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--green),var(--teal));transition:width .5s}

  /* GRID ROWS */
  .row-2{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:16px}
  .row-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}

  /* PERIOD TABS */
  .period-tabs{display:flex;gap:2px;background:var(--bg-elevated);padding:3px;border-radius:9px;border:1px solid var(--border)}
  .period-tab{padding:5px 11px;border-radius:6px;font-size:11px;font-weight:600;color:var(--text-3)}
  .period-tab:hover{color:var(--text)}
  .period-tab.active{background:var(--green);color:#fff;box-shadow:0 2px 6px rgba(34,197,94,.3)}

  /* SNAPSHOT LIST */
  .snapshot-list{display:flex;flex-direction:column;gap:2px}
  .snapshot-row{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-radius:8px;transition:background .15s}
  .snapshot-row:hover{background:var(--bg-elevated)}
  .snapshot-row .lbl{font-size:12px;color:var(--text-2);font-weight:500}
  .snapshot-row .val{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
  .snapshot-row .val.up{color:var(--green)}
  .snapshot-row .val.down{color:var(--red)}

  /* ALLOC */
  .alloc-legend{display:flex;flex-direction:column;gap:6px}
  .alloc-legend-item{display:flex;align-items:center;gap:8px;font-size:11px}
  .alloc-dot{width:8px;height:8px;border-radius:3px;flex-shrink:0}
  .alloc-legend-item .name{flex:1;color:var(--text-2);font-weight:500}
  .alloc-legend-item .pct{color:var(--text);font-weight:700;font-variant-numeric:tabular-nums}

  /* RISK */
  .risk-gauge{position:relative;width:160px;height:90px;margin:0 auto}
  .risk-gauge svg{width:100%;height:100%;display:block}
  .risk-gauge-label{position:absolute;left:0;right:0;bottom:6px;text-align:center}
  .risk-gauge-label .lvl{font-size:12px;font-weight:800;letter-spacing:1px}
  .risk-gauge-label .sub{font-size:9px;color:var(--text-3);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-top:1px}
  .risk-metrics{width:100%;display:flex;flex-direction:column;gap:5px;margin-top:10px}
  .risk-metric{display:flex;justify-content:space-between;font-size:11px;padding:5px 8px;border-radius:6px;background:var(--bg-elevated)}
  .risk-metric .k{color:var(--text-3);font-weight:500}
  .risk-metric .v{color:var(--text);font-weight:700;font-variant-numeric:tabular-nums}

  /* TABLE */
  .table-wrap{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
  .table-toolbar{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
  .search-input{flex:1;min-width:160px;display:flex;align-items:center;gap:8px;background:var(--bg-input);border:1px solid var(--border);border-radius:9px;padding:7px 12px;color:var(--text)}
  .search-input input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:12px}
  .search-input input::placeholder{color:var(--text-3)}
  .table-scroll{overflow:auto;max-height:calc(100vh - 320px)}
  .modern-table{width:100%;border-collapse:collapse;font-size:12px}
  .modern-table thead th{position:sticky;top:0;z-index:5;background:var(--bg-elevated);padding:10px 14px;text-align:left;font-size:10px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid var(--border);white-space:nowrap}
  .modern-table tbody td{padding:12px 14px;border-bottom:1px solid var(--border);color:var(--text-2);font-weight:500;white-space:nowrap}
  .modern-table tbody tr:hover td{background:var(--bg-elevated)}
  .modern-table tbody tr:last-child td{border-bottom:none}
  .ticker-cell{display:flex;align-items:center;gap:10px}
  .ticker-badge{width:32px;height:32px;border-radius:8px;background:var(--bg-elevated);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;color:var(--text);letter-spacing:.3px;flex-shrink:0;border:1px solid var(--border)}
  .ticker-info{display:flex;flex-direction:column;line-height:1.3}
  .ticker-info .t{font-weight:700;color:var(--text);font-size:12px}
  .ticker-info .n{font-size:10px;color:var(--text-3);font-weight:500;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .num-cell{font-variant-numeric:tabular-nums;font-weight:600;color:var(--text)}
  .pill{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:6px;font-size:10px;font-weight:700;font-variant-numeric:tabular-nums}
  .pill.up{background:var(--green-bg);color:var(--green)}
  .pill.down{background:var(--red-bg);color:var(--red)}
  .pill.neutral{background:var(--bg-elevated);color:var(--text-2)}
  .row-actions{display:flex;gap:4px}
  .row-action{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:var(--bg-elevated);color:var(--text-2);font-size:11px;font-weight:700}
  .row-action:hover{background:var(--bg-hover);color:var(--text)}
  .row-action.buy:hover{background:var(--green-bg);color:var(--green)}
  .row-action.sell:hover{background:var(--red-bg);color:var(--red)}
  .row-action.div:hover{background:var(--teal-bg);color:var(--teal)}

  /* TREEMAP */
  .treemap{position:relative;width:100%;border-radius:var(--radius);overflow:hidden;background:var(--bg-elevated);border:1px solid var(--border)}
  .treemap-cell{position:absolute;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;transition:filter .12s;padding:2px;text-align:center}
  .treemap-cell:hover{filter:brightness(1.12)}
  .treemap-cell .tk{font-weight:800;font-family:'Space Mono',monospace;letter-spacing:.2px;line-height:1.1}
  .treemap-cell .pct{font-family:'Space Mono',monospace;opacity:.9;line-height:1.1;margin-top:1px}
  .treemap-cell .sub{font-family:'Space Mono',monospace;opacity:.7;line-height:1.1;margin-top:1px}

  /* VIEW TOGGLE */
  .view-toggle{display:flex;gap:3px;background:var(--bg-elevated);padding:3px;border-radius:9px;border:1px solid var(--border)}
  .view-toggle button{padding:5px 12px;border-radius:6px;font-size:11px;font-weight:600;color:var(--text-3);display:flex;align-items:center;gap:5px}
  .view-toggle button.active{background:var(--bg-card);color:var(--text);box-shadow:var(--shadow)}
  .view-toggle button:hover:not(.active){color:var(--text-2)}

  /* BUTTONS */
  .btn{padding:9px 16px;border-radius:9px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:all .15s}
  .btn-primary{background:var(--green);color:#fff;box-shadow:0 2px 8px rgba(34,197,94,.25)}
  .btn-primary:hover{background:var(--green-dim);box-shadow:0 4px 12px rgba(34,197,94,.35)}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed}
  .btn-ghost{background:var(--bg-elevated);color:var(--text-2);border:1px solid var(--border)}
  .btn-ghost:hover{background:var(--bg-hover);color:var(--text);border-color:var(--border-light)}
  .btn-danger{background:var(--red);color:#fff}
  .btn-danger:hover{background:#dc2626}
  .btn-sm{padding:6px 12px;font-size:11px;border-radius:8px}

  /* INPUTS */
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
  .field label{font-size:10px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.6px}
  .field input,.field select{width:100%;background:var(--bg-input);border:1px solid var(--border);border-radius:9px;padding:10px 12px;color:var(--text);font-size:13px;outline:none;transition:border-color .15s}
  .field input:focus,.field select:focus{border-color:var(--green)}
  .field input::placeholder{color:var(--text-3)}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .field-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

  /* BOTTOM NAV */
  .bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--bg-card);border-top:1px solid var(--border);padding:6px 8px calc(6px + env(safe-area-inset-bottom));backdrop-filter:blur(12px)}
  .bottom-nav-inner{display:flex;justify-content:space-around;max-width:500px;margin:0 auto}
  .bottom-nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 4px;border-radius:10px;color:var(--text-3);transition:color .15s,background .15s}
  .bottom-nav-item span{font-size:10px;font-weight:600}
  .bottom-nav-item.active{color:var(--green)}

  /* MODAL */
  .modal-overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .15s ease}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .modal{background:var(--bg-card);border:1px solid var(--border);border-radius:18px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:slideUp .2s ease}
  @keyframes slideUp{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
  .modal-lg{max-width:760px}
  .modal-header{padding:18px 20px 14px;border-bottom:1px solid var(--border)}
  .modal-header h2{font-size:16px;font-weight:800;color:var(--text)}
  .modal-header p{font-size:11px;color:var(--text-3);margin-top:3px;font-weight:500}
  .modal-body{padding:18px 20px}
  .modal-footer{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--border)}

  /* IMPORT */
  .import-drop{border:2px dashed var(--border-light);border-radius:14px;padding:36px 20px;text-align:center;background:var(--bg-elevated);transition:all .2s;cursor:pointer}
  .import-drop.dragover{border-color:var(--green);background:var(--green-bg)}
  .import-drop .ico{font-size:36px;margin-bottom:10px;opacity:.5}
  .import-drop .ttl{font-size:14px;font-weight:700;color:var(--text);margin-bottom:4px}
  .import-drop .desc{font-size:11px;color:var(--text-3);margin-bottom:14px}

  @keyframes spin{to{transform:rotate(360deg)}}
  .spin{display:inline-block;animation:spin .9s linear infinite}

  /* RESPONSIVE */
  @media(max-width:1100px){.row-4{grid-template-columns:1fr 1fr}}
  @media(max-width:900px){
    .header-nav{display:none}
    .row-2{grid-template-columns:1fr}
    .greeting-quote{display:none}
  }
  @media(max-width:768px){
    .header{padding:8px 12px}
    .main{padding:14px 12px 100px}
    .greeting h1{font-size:19px}
    .kpi-grid{grid-template-columns:1fr 1fr;gap:10px}
    .kpi-card{padding:12px}
    .kpi-value{font-size:18px}
    .row-4{grid-template-columns:1fr;gap:10px}
    .bottom-nav{display:block}
    .logo-text span{display:none}
    .logo-mark{width:30px;height:30px}
    .card{padding:14px}
    .table-scroll{max-height:calc(100vh - 260px)}
    .modern-table tbody td{padding:10px 12px}
    .modern-table thead th{padding:8px 12px}
  }
  @media(max-width:480px){
    .kpi-grid{grid-template-columns:1fr 1fr;gap:8px}
    .kpi-value{font-size:16px}
    .main{padding:12px 10px 100px}
    .field-row,.field-row-3{grid-template-columns:1fr}
    .greeting h1{font-size:17px}
  }
</style>
</head>

// ─── Treemap ──────────────────────────────────────────────────────────────
function squarify(items,x,y,w,h){
  if(!items.length)return[];
  const r=[];
  _layout(items,x,y,w,h,items.reduce((s,i)=>s+i.value,0),r);
  return r;
}
function _layout(it,x,y,w,h,tot,r){
  if(!it.length)return;
  if(it.length===1){r.push({...it[0],x,y,w,h});return;}
  const hz=w>=h,dim=hz?w:h;
  let row=[],rt=0,best=Infinity;
  for(let i=0;i<it.length;i++){
    row.push(it[i]);rt+=it[i].value;
    const rd=(rt/tot)*dim;
    let worst=0;
    for(const ri of row){const od=(ri.value/rt)*(hz?h:w);const ra=Math.max(rd/od,od/rd);if(ra>worst)worst=ra;}
    if(worst>best){row.pop();rt-=it[i].value;break;}
    best=worst;
  }
  const rd=(rt/tot)*dim;
  let cur=hz?y:x;
  for(const ri of row){const sz=(ri.value/rt)*(hz?h:w);hz?r.push({...ri,x,y:cur,w:rd,h:sz}):r.push({...ri,x:cur,y,w:sz,h:rd});cur+=sz;}
  const rem=it.slice(row.length);
  if(!rem.length)return;
  const remT=tot-rt;
  hz?_layout(rem,x+rd,y,w-rd,h,remT,r):_layout(rem,x,y+rd,w,h-rd,remT,r);
}

function getPerformanceColor(pct,dark){
  const maxAbs=10;const clamped=Math.max(-maxAbs,Math.min(maxAbs,pct));const ratio=clamped/maxAbs;
  if(Math.abs(pct)<0.05)return{bg:dark?"#2d3746":"#e2e8f0",text:dark?"#8b949e":"#475569",border:dark?"#3d4b5c":"#cbd5e1"};
  const hue=((ratio+1)/2)*120;const sat=70;const light=dark?32:45;
  const bg=`hsl(${hue}, ${sat}%, ${light}%)`;const text="#ffffff";
  const borderLight=dark?22:35;const border=`hsl(${hue}, ${sat}%, ${borderLight}%)`;
  return{bg,text,border};
}
function getDividendColor(yieldPct,dark){

  if(yieldPct<=0.01)return{bg:dark?"#2d3746":"#e2e8f0",text:dark?"#8b949e":"#475569",border:dark?"#3d4b5c":"#cbd5e1"};

}

const toAUD=(a,cur,R)=>{if(cur==="IDR")return a/R.AUD_IDR;if(cur==="USD")return a/R.AUD_USD;return a;};

function fmtIDR(n){try{return Math.round(n).toLocaleString("id-ID");}catch{return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,".");}}
function fmtAUD(n){return Math.abs(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,",");}
function fmtCur(audAmt,dc,R,compact=false){
  const a=fromAUD(audAmt,dc,R);
  if(dc==="IDR"){const abs=Math.abs(a);if(compact&&abs>=1e9)return`Rp${(a/1e9).toFixed(1)}M`;if(compact&&abs>=1e6)return`Rp${(a/1e6).toFixed(1)}Jt`;if(compact&&abs>=1e3)return`Rp${(a/1e3).toFixed(0)}Rb`;return`Rp ${fmtIDR(a)}`;}
  if(dc==="USD"){const abs=Math.abs(a);if(compact&&abs>=1e6)return`US$${(a/1e6).toFixed(2)}M`;if(compact&&abs>=1e3)return`US$${(a/1e3).toFixed(1)}K`;return`US$${fmtAUD(a)}`;}
  const abs=Math.abs(a);
  if(compact&&abs>=1e6)return`A$${(a/1e6).toFixed(2)}M`;
  if(compact&&abs>=1e3)return`A$${(a/1e3).toFixed(1)}K`;
  return`A$${fmtAUD(a)}`;
}
function fmtGain(audAmt,dc,R){

async function tryProxy(proxyUrl,timeoutMs){
  const r=await fetch(proxyUrl,{signal:AbortSignal.timeout(timeoutMs)});
  if(!r.ok)throw new Error("HTTP "+r.status);
  const t=await r.text();if(!t||t.length<10)throw new Error("Empty");
  let parsed=JSON.parse(t);
  if(parsed?.contents&&typeof parsed.contents==="string")parsed=JSON.parse(parsed.contents);
  return parsed;
}
async function fetchWithProxy(url,timeoutMs=10000){
  return new Promise((resolve,reject)=>{
    let settled=false;let pending=PROXIES.length;
    PROXIES.forEach(proxy=>{
      tryProxy(proxy(url),timeoutMs).then(data=>{if(!settled){settled=true;resolve(data);}})
        .catch(()=>{pending--;if(pending===0&&!settled)reject(new Error("All proxies failed"));});
    });
  });
}
async function fetchYahooPrice(symbol){
  const sym=encodeURIComponent(symbol);
  const parseChart=d=>{
    const res=d?.chart?.result?.[0];if(!res)return null;
    const closes=res.indicators?.quote?.[0]?.close;
    if(!closes||closes.length<2)return null;
    const prev=closes[closes.length-2];const cur=closes[closes.length-1];
    if(prev&&cur)return{current:cur,prev};
    return null;
  };
  const urls=[`https://query1.finance.yahoo.com/v8/finance/chart/${sym}?interval=1d&range=2d`,YAHOO_BASE+sym+"?interval=1d&range=2d"];
  for(const url of urls){
    try{const d=await fetchWithProxy(url);const r=parseChart(d);if(r&&r.current>0&&r.prev>0)return r;}catch(e){}
  }
  throw new Error("Price fetch failed for "+symbol);
}
async function fetchBenchmark(symbol){
  const sym=encodeURIComponent(symbol);
  const url=YAHOO_BASE+sym+"?interval=1mo&range=5y";
  const d=await fetchWithProxy(url);
  const res=d?.chart?.result?.[0];
  if(!res)throw new Error("No data");
  const ts=res.timestamp||[];const closes=res.indicators?.quote?.[0]?.close||[];
  if(!ts.length||!closes.length)throw new Error("Empty data");
  const base=closes.find(v=>v!=null)||1;
  return{labels:ts.map(t=>new Date(t*1000).toISOString().slice(0,10)),pct:closes.map(v=>v!=null?((v-base)/base)*100:null)};
}
async function fetchHoldingHistory(yahooSymbol){
  const sym=encodeURIComponent(yahooSymbol);
  try{
    const d=await fetchWithProxy(YAHOO_BASE+sym+"?interval=1mo&range=5y");
    const res=d?.chart?.result?.[0];if(!res)return null;
    const ts=res.timestamp||[];const closes=res.indicators?.quote?.[0]?.close||[];
    if(!ts.length||!closes.length)return null;
    const priceMap={};
    ts.forEach((t,i)=>{if(closes[i]!=null)priceMap[new Date(t*1000).toISOString().slice(0,10)]=closes[i];});
    return{priceMap,currency:res.meta?.currency||"AUD"};
  }catch(e){return null;}
}
async function fetchExchangeRates(){

  const d=await r.json();

}
