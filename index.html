  // RENDER: ANALYTICS (What-If)
  // ═══════════════════════════════════════════════════════════════════════════
  const renderAnalytics=()=>{
    if(!holdings.length){
      return(
        <>
          <div className="greeting"><div><h1>Analytics</h1><p>What-if simulator</p></div></div>
          <div className="card" style={{padding:40,textAlign:"center",color:T.text3}}>Add holdings first to use the What-If simulator.</div>
        </>
      );
    }
    const sr=simulationResult;
    if(!sr)return null;
    const{finalPortfolioValue,avgAnnualDividend,dividendCAGR,riskConcentration,weightedAvgYield,totalValue,growthRate,reinvestDividends,fxRate,simulationYears}=sr;

    const updateTargetPct=(ticker,value)=>{
      const newPct=parseFloat(value);
      if(isNaN(newPct)||newPct<0)return;
      const current={...whatIf.targetPct};current[ticker]=newPct;
      setWhatIf(w=>({...w,targetPct:current}));
    };

    return(
      <>
        <div className="greeting">
          <div>
            <h1>Analytics</h1>
            <p>What-if simulator · project your portfolio forward</p>
          </div>
        </div>

        {/* Market settings */}
        <div className="card" style={{marginBottom:12}}>
          <div className="card-header">
            <div className="card-title">📈 Market Settings</div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:isMob?"1fr 1fr":"repeat(4,1fr)",gap:12}}>
            <div>
              <div style={{fontSize:10,color:T.text3,fontWeight:600,textTransform:"uppercase",letterSpacing:.5,marginBottom:6}}>Growth Rate (annual)</div>
              <input type="range" className="whatif-slider" min="0" max="15" step="0.5" value={whatIf.growthRate} onChange={e=>setWhatIf(w=>({...w,growthRate:parseFloat(e.target.value)}))} style={{width:"100%",accentColor:T.green}}/>
              <div style={{textAlign:"center",fontWeight:700,fontSize:13,color:T.text,fontFamily:"'Space Mono',monospace",marginTop:4}}>{whatIf.growthRate}%</div>
            </div>
            <div>
              <div style={{fontSize:10,color:T.text3,fontWeight:600,textTransform:"uppercase",letterSpacing:.5,marginBottom:6}}>Reinvest Dividends</div>
              <div style={{display:"flex",gap:6,marginTop:6}}>
                <button onClick={()=>setWhatIf(w=>({...w,reinvestDividends:true}))} className={`btn btn-sm ${whatIf.reinvestDividends?"btn-primary":"btn-ghost"}`}>Yes</button>
                <button onClick={()=>setWhatIf(w=>({...w,reinvestDividends:false}))} className={`btn btn-sm ${!whatIf.reinvestDividends?"btn-primary":"btn-ghost"}`}>No</button>
              </div>
            </div>
            <div>
              <div style={{fontSize:10,color:T.text3,fontWeight:600,textTransform:"uppercase",letterSpacing:.5,marginBottom:6}}>FX Change (%)</div>
              <input type="range" className="whatif-slider" min="-10" max="10" step="0.5" value={whatIf.fxRate} onChange={e=>setWhatIf(w=>({...w,fxRate:parseFloat(e.target.value)}))} style={{width:"100%",accentColor:T.green}}/>
              <div style={{textAlign:"center",fontWeight:700,fontSize:13,color:T.text,fontFamily:"'Space Mono',monospace",marginTop:4}}>{whatIf.fxRate>=0?"+":""}{whatIf.fxRate}%</div>
            </div>
            <div>
              <div style={{fontSize:10,color:T.text3,fontWeight:600,textTransform:"uppercase",letterSpacing:.5,marginBottom:6}}>Years</div>
              <input type="range" className="whatif-slider" min="5" max="10" step="1" value={whatIf.simulationYears} onChange={e=>setWhatIf(w=>({...w,simulationYears:parseInt(e.target.value)}))} style={{width:"100%",accentColor:T.green}}/>
              <div style={{textAlign:"center",fontWeight:700,fontSize:13,color:T.text,fontFamily:"'Space Mono',monospace",marginTop:4}}>{whatIf.simulationYears}y</div>
            </div>
          </div>
        </div>

        {/* Projection + Adjustments */}
        <div style={{display:"grid",gridTemplateColumns:isMob?"1fr":"1.2fr 1fr",gap:12,marginBottom:12}}>
          <div className="card">
            <div className="card-header">
              <div className="card-title">📊 Projected Outcome</div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
              {[
                {label:"Portfolio Value",value:FC(finalPortfolioValue,true),sub:`in ${simulationYears} years`,color:T.text},
                {label:"Annual Income",value:FC(avgAnnualDividend,true),sub:"avg dividend/coupon",color:T.teal},
                {label:"Dividend CAGR",value:dividendCAGR!=null?fmtPct(dividendCAGR):"—",sub:`over ${simulationYears} years`,color:dividendCAGR!=null&&dividendCAGR>=0?T.green:T.red},
                {label:"Concentration",value:riskConcentration.toFixed(0)+"%",sub:"top holding",color:riskConcentration>30?T.red:riskConcentration>20?T.amber:T.green},
              ].map((c,i)=>(
                <div key={i} style={{background:T.bg3,border:`1px solid ${T.border}`,borderRadius:10,padding:"10px 12px"}}>
                  <div style={{fontSize:9,color:T.text3,textTransform:"uppercase",fontWeight:600,letterSpacing:.5}}>{c.label}</div>
                  <div style={{fontSize:16,fontWeight:800,color:c.color,fontFamily:"'Space Mono',monospace",marginTop:2}}>{c.value}</div>
                  <div style={{fontSize:10,color:T.text3,marginTop:2}}>{c.sub}</div>
                </div>
              ))}
            </div>
            <div style={{display:"flex",gap:8,fontSize:10,color:T.text3,justifyContent:"center",flexWrap:"wrap",paddingTop:8,borderTop:`1px solid ${T.border}`}}>
              <span>Growth: {growthRate}%</span><span>·</span>
              <span>Reinvest: {reinvestDividends?"Yes":"No"}</span><span>·</span>
              <span>FX: {fxRate>=0?"+":""}{fxRate}%</span><span>·</span>
              <span>Yield: {(weightedAvgYield*100).toFixed(2)}%</span>
            </div>
          </div>

          <div className="card">
            <div className="card-header">
              <div className="card-title">📊 Adjusted Allocation</div>
            </div>
            <div ref={whatIfTmRef} className="treemap" style={{height:isMob?180:220}}>
              {whatIfRects.map(r=>{
                const c=getPerformanceColor(r.gainPct||0,dark);
                const minDim=Math.min(r.w,r.h);
                const fontSize=Math.max(8,Math.min(14,minDim/6));
                const pct=r.targetPct!==undefined?r.targetPct:0;
                return(
                  <div key={r.ticker} className="treemap-cell" style={{left:r.x,top:r.y,width:r.w,height:r.h,background:c.bg,border:`1px solid ${c.border}`}}>
                    <span className="tk" style={{fontSize,color:c.text}}>{r.ticker}</span>
                    <span className="pct" style={{fontSize:fontSize*.75,color:c.text}}>{FC(r.adjustedValue,true)}</span>
                    <span className="sub" style={{fontSize:fontSize*.7,color:c.text}}>{pct.toFixed(0)}%</span>
                  </div>
                );
              })}
              {whatIfRects.length===0&&<div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",color:T.text3,fontSize:11}}>No holdings</div>}
            </div>
          </div>
        </div>

        {/* Asset Modifiers */}
        <div className="card" style={{marginBottom:12}}>
          <div className="card-header">
            <div>
              <div className="card-title">⚙️ Asset Modifiers</div>
              <div className="card-sub">Adjust target allocation % for each holding</div>
            </div>
            <button className="btn btn-ghost btn-sm" onClick={()=>{
              const pctMap={};const total=holdings.reduce((s,h)=>s+h.currentValue,0);
              if(total<=0)return;
              holdings.forEach(h=>{pctMap[h.ticker]=(h.currentValue/total)*100;});
              setWhatIf(w=>({...w,targetPct:pctMap}));
            }}>Reset to Current</button>
          </div>
          <div style={{display:"grid",gridTemplateColumns:isMob?"1fr":"1fr 1fr 1fr",gap:8}}>
            {holdings.map(h=>{
              const currentPct=(h.currentValue/totalValue)*100;
              const target=whatIf.targetPct&&whatIf.targetPct[h.ticker]!==undefined?whatIf.targetPct[h.ticker]:currentPct;
              const pct=Math.round(target);
              const diff=pct-currentPct;
              return(
                <div key={h.ticker} style={{display:"flex",alignItems:"center",gap:6,padding:"8px 10px",borderRadius:9,background:T.bg3,border:`1px solid ${T.border}`}}>
                  <span style={{fontWeight:800,fontSize:12,color:T.text,minWidth:50,fontFamily:"'Space Mono',monospace"}}>{h.ticker}</span>
                  <span style={{fontSize:10,color:T.text3,minWidth:44,textAlign:"right",fontWeight:600}}>{currentPct.toFixed(0)}%</span>
                  <button onClick={()=>updateTargetPct(h.ticker,Math.max(0,target-2))} style={{width:24,height:24,borderRadius:6,background:T.bg4,color:T.text,fontWeight:700,fontSize:14,display:"flex",alignItems:"center",justifyContent:"center"}}>−</button>
                  <input type="number" value={pct} min="0" max="100" onChange={e=>{const val=parseFloat(e.target.value);if(!isNaN(val)&&val>=0)updateTargetPct(h.ticker,val);}} style={{width:50,background:T.bg,border:`1px solid ${T.border}`,borderRadius:6,padding:"4px 6px",fontSize:12,color:T.text,textAlign:"center",fontWeight:700,outline:"none"}}/>
                  <button onClick={()=>updateTargetPct(h.ticker,Math.min(100,target+2))} style={{width:24,height:24,borderRadius:6,background:T.bg4,color:T.text,fontWeight:700,fontSize:14,display:"flex",alignItems:"center",justifyContent:"center"}}>+</button>
                  <span style={{fontSize:10,fontWeight:700,minWidth:36,textAlign:"right",color:diff>0?T.green:diff<0?T.red:T.text3}}>
                    {diff>0?`+${diff.toFixed(0)}`:diff<0?diff.toFixed(0):'0'}
                  </span>
                </div>
              );
            })}
          </div>
        </div>

        {/* Scenarios */}
        <div className="card">
          <div className="card-header">
            <div>
              <div className="card-title">💾 Scenarios</div>
              <div className="card-sub">Save and reload your simulations</div>
            </div>
            <div style={{display:"flex",gap:6}}>
              <input placeholder="Scenario name" value={whatIf.scenarioName||""} onChange={e=>setWhatIf(w=>({...w,scenarioName:e.target.value}))} style={{background:T.bg,border:`1px solid ${T.border}`,borderRadius:8,padding:"6px 10px",fontSize:12,color:T.text,outline:"none",width:150}}/>
              <button className="btn btn-primary btn-sm" onClick={()=>{
                if(!whatIf.scenarioName)return;
                const newScenario={id:Date.now(),name:whatIf.scenarioName,growthRate:whatIf.growthRate,reinvestDividends:whatIf.reinvestDividends,fxRate:whatIf.fxRate,targetPct:whatIf.targetPct,simulationYears:whatIf.simulationYears,result:simulationResult};
                setWhatIf(w=>({...w,scenarios:[...w.scenarios,newScenario],scenarioName:""}));
              }}>Save</button>
            </div>
          </div>
          {whatIf.scenarios.length>0?(
            <div style={{display:"grid",gridTemplateColumns:isMob?"1fr":"repeat(3,1fr)",gap:8}}>
              {whatIf.scenarios.slice().reverse().map(s=>(
                <div key={s.id} style={{border:`1px solid ${T.border}`,borderRadius:10,padding:"10px 12px",background:T.bg3}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                    <span style={{fontWeight:700,fontSize:12,color:T.text}}>{s.name}</span>
                    <button onClick={()=>setWhatIf(w=>({...w,scenarios:w.scenarios.filter(sc=>sc.id!==s.id)}))} style={{color:T.red,fontSize:12}}><Icon name="x" size={12}/></button>
                  </div>
                  <div style={{fontSize:10,color:T.text3,lineHeight:1.6}}>
                    Growth: {s.growthRate}% · Reinvest: {s.reinvestDividends?"Yes":"No"}<br/>
                    FX: {s.fxRate}% · {s.simulationYears}y
                  </div>
                  <button className="btn btn-ghost btn-sm" style={{marginTop:8,width:"100%"}} onClick={()=>{
                    setWhatIf(w=>({...w,growthRate:s.growthRate,reinvestDividends:s.reinvestDividends,fxRate:s.fxRate,targetPct:s.targetPct,simulationYears:s.simulationYears,activeScenario:s.id}));
                  }}>Load Scenario</button>
                </div>
              ))}
            </div>
          ):(
            <div style={{padding:20,textAlign:"center",color:T.text3,fontSize:11}}>No saved scenarios yet.</div>
          )}
        </div>
      </>
    );
  };

  // ═══════════════════════════════════════════════════════════════════════════
  // RENDER: MODALS
  // ═══════════════════════════════════════════════════════════════════════════
  const renderImportModal=()=>{
    const IS=importSt;
    const valid=IS.parsed.filter(r=>!r._errors.length);
    const invalid=IS.parsed.filter(r=>r._errors.length);
    const tickers=[...new Set(valid.map(r=>r.ticker))];
    return(
      <>
        <div className="modal-header">
          <h2>📥 Import Transactions</h2>
          <p>Upload CSV or Excel with your buy, sell and dividend history</p>
        </div>
        <div className="modal-body">
          <div style={{display:"flex",gap:8,marginBottom:16,flexWrap:"wrap"}}>
            <button className="btn btn-ghost btn-sm" onClick={downloadTemplateCSV}><Icon name="download"/>Template CSV</button>
          </div>
          <input ref={importFileRef} type="file" accept=".csv,.xlsx,.xls,.ods,.txt" style={{display:"none"}} onChange={e=>{if(e.target.files[0])handleImportFile(e.target.files[0]);e.target.value="";}}/>
          {(IS.step==="idle"||IS.step==="parsing")&&(
            <div className={`import-drop ${IS.dragOver?"dragover":""}`}
              onDragOver={e=>{e.preventDefault();setImportSt(s=>({...s,dragOver:true}));}}
              onDragLeave={()=>setImportSt(s=>({...s,dragOver:false}))}
              onDrop={e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f)handleImportFile(f);}}
              onClick={()=>importFileRef.current&&importFileRef.current.click()}>
              <div className="ico">📂</div>
              <div className="ttl">{IS.step==="parsing"?"Parsing file…":"Drag & drop your file here"}</div>
              <div className="desc">or click to browse · CSV, XLSX, XLS supported</div>
            </div>
          )}
          {IS.step==="error"&&(
            <div style={{background:T.redBg,border:`1px solid ${T.red}55`,borderRadius:10,padding:"14px 16px",color:T.red}}>
              <div style={{fontWeight:700,marginBottom:4}}>Could not read file</div>
              <div style={{fontSize:12}}>{IS.errorMsg}</div>
              <button className="btn btn-ghost btn-sm" style={{marginTop:10}} onClick={()=>setImportSt(s=>({...s,step:"idle"}))}>Try again</button>
            </div>
          )}
          {IS.step==="preview"&&(
            <>
              <div style={{display:"flex",gap:8,marginBottom:12,flexWrap:"wrap"}}>
                {[[IS.parsed.length+" rows",T.text],[valid.length+" valid",T.green],...(invalid.length?[[invalid.length+" errors",T.amber]]:[]),[tickers.length+" tickers",T.blue]].map(([l,c])=>(
                  <span key={l} style={{fontSize:11,fontWeight:600,color:c,background:T.bg3,border:`1px solid ${T.border}`,borderRadius:6,padding:"3px 10px"}}>{l}</span>
                ))}
              </div>
              <div style={{display:"flex",gap:8,alignItems:"center",background:T.bg3,border:`1px solid ${T.border}`,borderRadius:10,padding:"10px 14px",marginBottom:12,flexWrap:"wrap"}}>
                <span style={{fontSize:12,fontWeight:600,color:T.text}}>Mode:</span>
                {[["merge","Merge"],["replace","Replace"]].map(([v,l])=>(
                  <button key={v} className={`btn btn-sm ${IS.mergeMode===v?"btn-primary":"btn-ghost"}`} onClick={()=>setImportSt(s=>({...s,mergeMode:v}))}>{l}</button>
                ))}
              </div>
              <div style={{overflowX:"auto",borderRadius:8,border:`1px solid ${T.border}`,marginBottom:12,maxHeight:260,overflowY:"auto"}}>
                <table className="modern-table" style={{fontSize:11}}>
                  <thead><tr><th>Row</th><th>Ticker</th><th>Type</th><th>Date</th><th>Qty</th><th>Price</th><th>Ccy</th></tr></thead>
                  <tbody>
                    {IS.parsed.map((r,i)=>(
                      <tr key={i} style={{background:r._errors.length?(dark?"#2a1500":"#fff7ed"):"transparent"}}>
                        <td style={{color:T.text3,fontSize:10}}>{r._rowNum}</td>
                        <td style={{fontFamily:"'Space Mono',monospace",fontWeight:700,color:T.text}}>{r.ticker}</td>
                        <td>{r.type&&<span className={`pill ${r.type==="buy"?"up":r.type==="sell"?"down":"neutral"}`}>{r.type.toUpperCase()}</span>}</td>
                        <td style={{color:T.text2,fontSize:10}}>{r.date}</td>
                        <td>{r.qty||"—"}</td>
                        <td>{r.price||"—"}</td>
                        <td style={{color:T.text3}}>{r.currency}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </>
          )}
          {IS.step==="done"&&(
            <div style={{textAlign:"center",padding:"24px 0"}}>
              <div style={{fontSize:48,marginBottom:12}}>🎉</div>
              <div style={{fontSize:18,fontWeight:700,color:T.green,marginBottom:8}}>Import complete!</div>
              <div style={{fontSize:13,color:T.text2,marginBottom:8}}>{IS.importedCount} transactions imported.</div>
              <div style={{fontSize:11,color:T.text3}}>Click 🔄 Live Prices to fetch current prices for new holdings.</div>
            </div>
          )}
        </div>
        <div className="modal-footer">
          {IS.step==="preview"&&<>
            <button className="btn btn-ghost" onClick={()=>setImportSt(s=>({...s,step:"idle",parsed:[],rows:[],errors:[]}))}>Upload different file</button>
            <button className="btn btn-ghost" onClick={closeModal}>Cancel</button>
            <button className="btn btn-primary" disabled={!valid.length} onClick={confirmImport}>Import {valid.length} rows</button>
          </>}
          {IS.step==="done"&&<button className="btn btn-primary" onClick={closeModal}>Done</button>}
          {(IS.step==="idle"||IS.step==="error")&&<button className="btn btn-ghost" onClick={closeModal}>Cancel</button>}
        </div>
      </>
    );
  };

  const renderModals=()=>{
    if(!modal)return null;
    return(
      <div className="modal-overlay" onClick={closeModal}>
        <div className={`modal ${modal.mode==="import"?"modal-lg":""}`} onClick={e=>e.stopPropagation()}>
          {modal.mode==="add"&&(
            <>
              <div className="modal-header"><h2>Add New Position</h2></div>
              <div className="modal-body">
                <div className="field-row">
                  <div className="field"><label>Ticker *</label><input placeholder="e.g. PBS032" value={form.ticker||""} onChange={e=>setForm(f=>({...f,ticker:e.target.value,yahooSymbol:suggestYahoo(e.target.value,f.exchange,f.assetType)}))}/></div>
                  <div className="field"><label>Currency *</label><select value={form.currency||"AUD"} onChange={e=>setForm(f=>({...f,currency:e.target.value}))}>{CURRENCIES.map(c=><option key={c}>{c}</option>)}</select></div>
                </div>
                <div className="field"><label>Name</label><input placeholder="e.g. PBS 032 – Sukuk Negara" value={form.name||""} onChange={e=>setForm(f=>({...f,name:e.target.value}))}/></div>
                <div className="field-row">
                  <div className="field"><label>Asset Type</label><select value={form.assetType||"Shares / Stocks"} onChange={e=>setForm(f=>({...f,assetType:e.target.value,isBondPct:e.target.value.includes("Bond")||e.target.value.includes("Sukuk"),faceValue:(e.target.value.includes("Bond")||e.target.value.includes("Sukuk"))?"1000000":f.faceValue}))}>{ASSET_TYPES.map(a=><option key={a}>{a}</option>)}</select></div>
                  <div className="field"><label>Exchange</label><input placeholder="IDX, ASX, Crypto…" value={form.exchange||""} onChange={e=>setForm(f=>({...f,exchange:e.target.value,yahooSymbol:suggestYahoo(f.ticker,e.target.value,f.assetType)}))}/></div>
                </div>
                <div className="field"><label>Yahoo Symbol</label><input placeholder="e.g. BHP.AX" value={form.yahooSymbol||""} onChange={e=>setForm(f=>({...f,yahooSymbol:e.target.value}))}/></div>
                <div className="field-row-3">
                  <div className="field"><label>Quantity *</label><input type="number" placeholder="Units" value={form.qty||""} onChange={e=>setForm(f=>({...f,qty:e.target.value}))}/></div>
                  <div className="field"><label>Price *</label><input type="number" placeholder="Per unit" value={form.price||""} onChange={e=>setForm(f=>({...f,price:e.target.value}))}/></div>
                  <div className="field"><label>Date</label><input type="date" value={form.date||""} onChange={e=>setForm(f=>({...f,date:e.target.value}))}/></div>
                </div>
              </div>
              <div className="modal-footer">
                <button className="btn btn-ghost" onClick={closeModal}>Cancel</button>
                <button className="btn btn-primary" onClick={submitAdd}>Add Position</button>
              </div>
            </>
          )}

          {modal.mode==="trade"&&(
            <>
              <div className="modal-header"><h2>{modal.tradeType==="buy"?"Buy More":"Sell"} — {modal.holding.ticker}</h2><p>{modal.holding.name} · Held: {modal.holding.qty.toFixed(4)}</p></div>
              <div className="modal-body">
                <div className="field-row-3">
                  <div className="field"><label>Quantity</label><input type="number" value={form.qty||""} onChange={e=>setForm(f=>({...f,qty:e.target.value}))}/></div>
                  <div className="field"><label>Price ({modal.holding.currency})</label><input type="number" value={form.price||""} onChange={e=>setForm(f=>({...f,price:e.target.value}))}/></div>
                  <div className="field"><label>Date</label><input type="date" value={form.date||""} onChange={e=>setForm(f=>({...f,date:e.target.value}))}/></div>
                </div>
              </div>
              <div className="modal-footer">
                <button className="btn btn-ghost" onClick={closeModal}>Cancel</button>
                <button className={`btn ${modal.tradeType==="buy"?"btn-primary":"btn-danger"}`} onClick={submitTrade}>Confirm</button>
              </div>
            </>
          )}

          {modal.mode==="dividend"&&(
            <>
              <div className="modal-header"><h2>{modal.holding.isBondPct?"🏦 Record Coupon":"💰 Record Dividend"} — {modal.holding.ticker}</h2><p>{modal.holding.name}</p></div>
              <div className="modal-body">
                <div className="field-row-3">
                  <div className="field"><label>{modal.holding.isBondPct?"Coupon/Unit":"Div/Unit"}</label><input type="number" value={form.amountPerShare||""} onChange={e=>setForm(f=>({...f,amountPerShare:e.target.value}))}/></div>
                  <div className="field"><label>Entitled Units</label><input type="number" value={form.entitledQty||""} onChange={e=>setForm(f=>({...f,entitledQty:e.target.value}))}/></div>
                  <div className="field"><label>Date</label><input type="date" value={form.date||""} onChange={e=>setForm(f=>({...f,date:e.target.value}))}/></div>
                </div>
                {form.amountPerShare&&form.entitledQty&&(
                  <div style={{background:T.tealBg,border:`1px solid ${T.teal}55`,borderRadius:8,padding:"10px 12px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <span style={{fontSize:11,color:T.teal,fontWeight:600}}>Total:</span>
                    <strong style={{fontFamily:"'Space Mono',monospace",fontSize:14,color:T.teal}}>
                      {modal.holding.currency==="IDR"?`Rp ${fmtIDR(+form.amountPerShare*+form.entitledQty)}`:modal.holding.currency==="USD"?`US$${(+form.amountPerShare*+form.entitledQty).toFixed(2)}`:`A$${(+form.amountPerShare*+form.entitledQty).toFixed(2)}`}
                    </strong>
                  </div>
                )}
              </div>
              <div className="modal-footer">
                <button className="btn btn-ghost" onClick={closeModal}>Cancel</button>
                <button className="btn btn-primary" onClick={submitDiv} disabled={!form.amountPerShare||!form.entitledQty}>Record</button>
              </div>
            </>
          )}

          {modal.mode==="history"&&histH&&histC&&(
            <>
              <div className="modal-header"><h2>📋 Transaction History</h2><p>{modal.holding.ticker} — {modal.holding.name}</p></div>
              <div className="modal-body">
                <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap"}}>
                  {[["Market Value",FC(histC.currentValue),T.text],["Total G/L",`${FG(histC.totalGain)} (${fmtPct(histC.gainPct)})`,pColor(histC.totalGain)],["Div/Coupons",FC(histC.totalDividends),T.teal]].map(([l,v,c])=>(
                    <div key={l} style={{background:T.bg3,border:`1px solid ${T.border}`,borderRadius:8,padding:"8px 12px",flex:"1 1 100px"}}>
                      <div style={{fontSize:9,color:T.text3,textTransform:"uppercase",fontWeight:600,letterSpacing:.5}}>{l}</div>
                      <div style={{fontSize:12,fontWeight:700,color:c,fontFamily:"'Space Mono',monospace",marginTop:2}}>{v}</div>
                    </div>
                  ))}
                </div>
                <div style={{overflowX:"auto",borderRadius:8,border:`1px solid ${T.border}`}}>
                  <table className="modern-table" style={{fontSize:11}}>
                    <thead><tr><th>Date</th><th>Type</th><th>Units</th><th>Price</th><th>Total</th><th></th></tr></thead>
                    <tbody>
                      {[...histH.transactions].sort((a,b)=>new Date(b.date)-new Date(a.date)).map((tx,i)=>{
                        const origIdx=histH.transactions.indexOf(tx);
                        const tmap={buy:{l:"BUY",c:T.green},sell:{l:"SELL",c:T.red},dividend:{l:histH.isBondPct?"COUPON":"DIV",c:T.teal}};
                        const t=tmap[tx.type]||tmap.buy;
                        const cur=histH.currency;
                        const fL=v=>cur==="IDR"?`Rp ${fmtIDR(v)}`:cur==="USD"?`US$${v.toFixed(2)}`:`A$${v.toFixed(2)}`;
                        const units=tx.type==="dividend"?`${(tx.amountPerShare||0).toFixed(tx.amountPerShare>1?2:4)}/u`:`${tx.qty||"—"}`;
                        const price=fL(tx.type==="dividend"?(tx.amountPerShare||0):(tx.price||0));
                        const total=fL(tx.type==="dividend"?(tx.totalAmount||0):((tx.qty||0)*(tx.price||0)));
                        return(
                          <tr key={i}>
                            <td style={{color:T.text2,fontSize:10}}>{fmtDate(tx.date)}</td>
                            <td><span className={`pill ${tx.type==="buy"?"up":tx.type==="sell"?"down":"neutral"}`} style={{background:t.c+"22",color:t.c}}>{t.l}</span></td>
                            <td>{units}</td>
                            <td>{price}</td>
                            <td style={{color:t.c,fontWeight:700}}>{total}</td>
                            <td>
                              <div style={{display:"flex",gap:3}}>
                                <button className="row-action" onClick={()=>setEditTx({holdingId:histH.id,txIndex:origIdx,tx:{...tx}})}>✏️</button>
                                <button className="row-action" onClick={()=>{if(!confirm("Delete this transaction?"))return;setPortfolioRepaired(p=>p.map(h=>h.id===histH.id?{...h,transactions:h.transactions.filter((_,j)=>j!==origIdx)}:h));}}>🗑️</button>
                              </div>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
              <div className="modal-footer"><button className="btn btn-ghost" onClick={closeModal}>Close</button></div>
            </>
          )}

          {modal.mode==="price"&&(
            <>
              <div className="modal-header"><h2>✏️ Manual Price Override</h2><p>Override prices or edit Yahoo symbols</p></div>
              <div className="modal-body">
                <div className="field" style={{maxWidth:200}}>
                  <label>Display Currency</label>
                  <select value={form.displayCur||displayCur} onChange={e=>setForm(f=>({...f,displayCur:e.target.value}))}>{CURRENCIES.map(c=><option key={c}>{c}</option>)}</select>
                </div>
                {holdings.map(h=>(
                  <div key={h.ticker} style={{marginBottom:14,paddingBottom:14,borderBottom:`1px solid ${T.border}`}}>
                    <div style={{fontSize:12,fontWeight:700,color:T.text,fontFamily:"'Space Mono',monospace",marginBottom:6}}>{h.ticker}<span style={{fontFamily:"Inter",color:T.text3,fontWeight:400}}> — {h.name}</span></div>
                    <div className="field-row-3">
                      <div className="field"><label>Current Price</label><input type="number" placeholder={String(prices[h.ticker]||"")} value={form["c_"+h.ticker]||""} onChange={e=>setForm(f=>({...f,["c_"+h.ticker]:e.target.value}))}/></div>
                      <div className="field"><label>Prev Close</label><input type="number" placeholder={String(prevPrices[h.ticker]||"")} value={form["p_"+h.ticker]||""} onChange={e=>setForm(f=>({...f,["p_"+h.ticker]:e.target.value}))}/></div>
                      <div className="field"><label>Yahoo Symbol</label><input value={form["ys_"+h.ticker]??h.yahooSymbol??""} onChange={e=>setForm(f=>({...f,["ys_"+h.ticker]:e.target.value}))}/></div>
                    </div>
                  </div>
                ))}
              </div>
              <div className="modal-footer">
                <button className="btn btn-ghost" onClick={closeModal}>Cancel</button>
                <button className="btn btn-primary" onClick={submitManualPrice}>💾 Save</button>
              </div>
            </>
          )}

          {modal.mode==="import"&&renderImportModal()}
        </div>
      </div>
    );
  };

  // ═══════════════════════════════════════════════════════════════════════════
  // MAIN RENDER
  // ═══════════════════════════════════════════════════════════════════════════
  return(
    <ErrorBoundary>
      <div className="app">
        <header className="header">
          <div className="header-inner">
            <div className="logo">
              <div className="logo-mark">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                  <path d="M4 20 L8 12 L12 16 L20 4" stroke="#fff" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" fill="none"/>
                  <circle cx="20" cy="4" r="2" fill="#fff"/>
                </svg>
              </div>
              <div className="logo-text">
                <b>SAUDAGAR KAPITALIS</b>
                <span>Invest. Grow. Freedom.</span>
              </div>
            </div>
            <nav className="header-nav">
              {[["dashboard","Dashboard","dashboard"],["portfolio","Portfolio","wallet"],["analytics","Analytics","chart"]].map(([v,l,ic])=>(
                <button key={v} className={`nav-tab ${view===v?"active":""}`} onClick={()=>setView(v)}>
                  <Icon name={ic} size={15}/>{l}
                </button>
              ))}
            </nav>
            <div className="header-actions">
              <div className="currency-pill">
                <select value={displayCur} onChange={e=>setDisplayCur(e.target.value)}>
                  {CURRENCIES.map(c=><option key={c}>{c}</option>)}
                </select>
              </div>
              <button className="icon-btn" title={valuesHidden?"Show values":"Hide values"} onClick={()=>setValuesHidden(v=>!v)}>
                <Icon name={valuesHidden?"eye-off":"eye"} size={16}/>
              </button>
              <button className="icon-btn" title="Passive income settings" onClick={()=>setShowPassiveModal(true)}>
                <Icon name="settings" size={16}/>
              </button>
              <button className="icon-btn" title={dark?"Light mode":"Dark mode"} onClick={()=>setDark(d=>!d)}>
                <Icon name={dark?"sun":"moon"} size={16}/>
              </button>
              <button className="icon-btn" title="Refresh prices" onClick={autoRefresh} disabled={fetchSt.loading}>
                <span className={fetchSt.loading?"spin":""}><Icon name="refresh" size={16}/></span>
              </button>
              <button className="icon-btn" title="Manual price override" onClick={openManualPrice}>
                <Icon name="edit" size={16}/>
              </button>
              <button className="icon-btn" title="Import" onClick={openImport}>
                <Icon name="download" size={16}/>
              </button>
              <button className="icon-btn" title="Export" onClick={handleExport}>
                <Icon name="upload" size={16}/>
              </button>
              {FB_CONFIGURED?(
                fbUser?(
                  <>
                    <button className="icon-btn" title="Load from cloud" onClick={()=>cloudLoadAll()} disabled={syncSt==="loading"||syncSt==="saving"}>
                      <span className={syncSt==="loading"?"spin":""}><Icon name="cloud" size={16}/></span>
                    </button>
                    <button className="icon-btn" title="Save to cloud" onClick={()=>cloudSaveAll()} disabled={syncSt==="loading"||syncSt==="saving"}>
                      <Icon name="check" size={16}/>
                    </button>
                    <button className="avatar" title={fbUser.displayName||fbUser.email} onClick={handleSignOut}>
                      {fbUser.photoURL?<img src={fbUser.photoURL} alt=""/>:(fbUser.displayName||"U").slice(0,1).toUpperCase()}
                    </button>
                  </>
                ):(
                  <button className="icon-btn" title="Sign in" onClick={handleSignIn}>
                    <Icon name="cloud" size={16}/>
                  </button>
                )
              ):null}
            </div>
          </div>
        </header>

        <main className="main">
          {view==="dashboard"&&renderDashboard()}
          {view==="portfolio"&&renderPortfolio()}
          {view==="analytics"&&renderAnalytics()}
        </main>

        <nav className="bottom-nav">
          <div className="bottom-nav-inner">
            {[["dashboard","Dashboard","dashboard"],["portfolio","Portfolio","wallet"],["analytics","Analytics","chart"]].map(([v,l,ic])=>(
              <button key={v} className={`bottom-nav-item ${view===v?"active":""}`} onClick={()=>setView(v)}>
                <Icon name={ic} size={20}/>
                <span>{l}</span>
              </button>
            ))}
          </div>
        </nav>

        {renderModals()}

        {/* Edit transaction modal */}
        {editTx&&(()=>{
          const h=portfolio.find(p=>p.id===editTx.holdingId);
          if(!h)return null;
          const tx=editTx.tx;
          const cur=h.currency||"AUD";
          const save=()=>{
            setPortfolioRepaired(p=>p.map(holding=>holding.id===editTx.holdingId?{...holding,transactions:holding.transactions.map((t,j)=>j===editTx.txIndex?{...editTx.tx}:t)}:holding));
            setEditTx(null);
          };
          return(
            <div className="modal-overlay" onClick={()=>setEditTx(null)}>
              <div className="modal" onClick={e=>e.stopPropagation()} style={{maxWidth:380}}>
                <div className="modal-header"><h2>✏️ Edit Transaction</h2><p>{h.ticker} — {tx.type?.toUpperCase()}</p></div>
                <div className="modal-body">
                  <div className="field"><label>Date</label><input type="date" value={tx.date??""} onChange={e=>setEditTx(s=>({...s,tx:{...s.tx,date:e.target.value}}))}/></div>
                  {tx.type!=="dividend"&&<>
                    <div className="field"><label>Units</label><input type="number" value={tx.qty??""} onChange={e=>setEditTx(s=>({...s,tx:{...s.tx,qty:parseFloat(e.target.value)||0}}))}/></div>
                    <div className="field"><label>Price ({cur})</label><input type="number" value={tx.price??""} onChange={e=>setEditTx(s=>({...s,tx:{...s.tx,price:parseFloat(e.target.value)||0}}))}/></div>
                  </>}
                  {tx.type==="dividend"&&<>
                    <div className="field"><label>Amount per Unit ({cur})</label><input type="number" value={tx.amountPerShare??""} onChange={e=>setEditTx(s=>({...s,tx:{...s.tx,amountPerShare:parseFloat(e.target.value)||0}}))}/></div>
                    <div className="field"><label>Entitled Units</label><input type="number" value={tx.entitledQty??""} onChange={e=>setEditTx(s=>({...s,tx:{...s.tx,entitledQty:parseFloat(e.target.value)||0}}))}/></div>
                    <div className="field"><label>Total Amount ({cur})</label><input type="number" value={tx.totalAmount??""} onChange={e=>setEditTx(s=>({...s,tx:{...s.tx,totalAmount:parseFloat(e.target.value)||0}}))}/></div>
                  </>}
                </div>
                <div className="modal-footer">
                  <button className="btn btn-ghost" onClick={()=>setEditTx(null)}>Cancel</button>
                  <button className="btn btn-primary" onClick={save}>Save</button>
                </div>
              </div>
            </div>
          );
        })()}

        {/* Passive income settings modal */}
        {showPassiveModal&&(
          <div className="modal-overlay" onClick={()=>setShowPassiveModal(false)}>
            <div className="modal" onClick={e=>e.stopPropagation()} style={{maxWidth:400}}>
              <div className="modal-header"><h2>⚙️ Passive Income Settings</h2><p>Set your monthly target & super draw rate</p></div>
              <div className="modal-body">
                <div className="field"><label>Monthly Target (AUD)</label><input type="number" step="100" value={monthlyTargetAud} onChange={e=>setMonthlyTargetAud(parseFloat(e.target.value)||0)} placeholder="e.g. 5000"/></div>
                <div className="field"><label>Super Annual Draw Rate (%)</label><input type="number" step="0.1" value={superDrawRate} onChange={e=>setSuperDrawRate(parseFloat(e.target.value)||0)} placeholder="e.g. 4.0"/><div style={{fontSize:10,color:T.text3,marginTop:4}}>Applied to NUL5339AU + NUL7270AU</div></div>
                <div className="field"><label>Average Super Balance (AUD)</label><input type="number" step="1000" value={avgSuperBalanceAud} onChange={e=>setAvgSuperBalanceAud(parseFloat(e.target.value)||0)} placeholder="e.g. 100000"/></div>
              </div>
              <div className="modal-footer"><button className="btn btn-primary" onClick={()=>setShowPassiveModal(false)}>Save</button></div>
            </div>
          </div>
        )}

        {/* Toast */}
        {toast&&(
          <div style={{
            position:"fixed",bottom:80,left:"50%",transform:"translateX(-50%)",zIndex:200,
            background:toast.type==="warn"?T.amberBg:T.greenBg,
            border:`1px solid ${toast.type==="warn"?T.amber:T.green}66`,
            color:toast.type==="warn"?T.amber:T.green,
            padding:"10px 18px",borderRadius:12,fontSize:12,fontWeight:600,
            boxShadow:"0 8px 24px rgba(0,0,0,.4)",animation:"slideUp .2s ease",
            maxWidth:"90vw",textAlign:"center"
          }}>{toast.msg}</div>
        )}
      </div>
    </ErrorBoundary>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
