<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover" />
<meta name="theme-color" content="#0a0e14" />
<title>SAUDAGAR KAPITALIS — Investment Dashboard</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;width:100%;overflow-x:hidden}
  body{
    font-family:'Inter','Roboto','Segoe UI',system-ui,-apple-system,sans-serif;
    font-size:14px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
    background:var(--bg);color:var(--text);overflow-x:hidden;
  }
  #root{width:100%;min-height:100vh}
  input,select,button{font-family:inherit}
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
  input[type=number]{-moz-appearance:textfield}
  button{cursor:pointer;border:none;outline:none;background:none;color:inherit;transition:background .15s,transform .1s,color .15s,opacity .15s}
  button:active{transform:scale(.97)}
  a{color:inherit;text-decoration:none}
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--border-light);border-radius:4px}
  ::-webkit-scrollbar-thumb:hover{background:var(--text-3)}

  :root{
    --bg:#0a0e14;
    --bg-card:#11161f;
    --bg-elevated:#161c26;
    --bg-hover:#1c232f;
    --bg-input:#0e131a;
    --border:#222b38;
    --border-light:#2d3746;
    --text:#e6edf3;
    --text-2:#8b949e;
    --text-3:#6b7684;
    --green:#22c55e;
    --green-dim:#16a34a;
    --green-bg:rgba(34,197,94,.12);
    --red:#ef4444;
    --red-bg:rgba(239,68,68,.12);
    --blue:#3b82f6;
    --blue-bg:rgba(59,130,246,.12);
    --amber:#f59e0b;
    --amber-bg:rgba(245,158,11,.12);
    --teal:#14b8a6;
    --teal-bg:rgba(20,184,166,.12);
    --purple:#a855f7;
    --purple-bg:rgba(168,85,247,.12);
    --radius:14px;
    --radius-sm:10px;
    --radius-xs:6px;
    --shadow:0 1px 2px rgba(0,0,0,.3);
    --shadow-lg:0 12px 32px rgba(0,0,0,.5);
    --chart-grid:rgba(255,255,255,.05);
    --chart-tick:#6b7684;
  }
  [data-theme="light"]{
    --bg:#f4f6fa;
    --bg-card:#ffffff;
    --bg-elevated:#f7f9fc;
    --bg-hover:#eef2f7;
    --bg-input:#f4f6fa;
    --border:#e2e8f0;
    --border-light:#cbd5e1;
    --text:#0d1520;
    --text-2:#475569;
    --text-3:#94a3b8;
    --green:#16a34a;
    --green-dim:#15803d;
    --green-bg:rgba(22,163,74,.1);
    --red:#dc2626;
    --red-bg:rgba(220,38,38,.1);
    --blue:#2563eb;
    --blue-bg:rgba(37,99,235,.1);
    --amber:#d97706;
    --amber-bg:rgba(217,119,6,.1);
    --teal:#0d9488;
    --teal-bg:rgba(13,148,136,.1);
    --purple:#9333ea;
    --purple-bg:rgba(147,51,234,.1);
    --shadow:0 1px 3px rgba(15,23,42,.06);
    --shadow-lg:0 12px 32px rgba(15,23,42,.12);
    --chart-grid:rgba(15,23,42,.06);
    --chart-tick:#64748b;
  }

  /* ---------- Layout ---------- */
  .app{display:flex;flex-direction:column;min-height:100vh;background:var(--bg);padding-bottom:env(safe-area-inset-bottom)}

  /* ---------- Header ---------- */
  .header{
    position:sticky;top:0;z-index:40;background:var(--bg-card);
    border-bottom:1px solid var(--border);
    padding:10px 20px;backdrop-filter:blur(12px);
  }
  .header-inner{display:flex;align-items:center;gap:16px;max-width:1600px;margin:0 auto;width:100%}
  .logo{display:flex;align-items:center;gap:10px;flex-shrink:0}
  .logo-mark{
    width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--green) 0%,var(--green-dim) 100%);
    box-shadow:0 4px 12px rgba(34,197,94,.25);
  }
  .logo-text{display:flex;flex-direction:column;line-height:1.1}
  .logo-text b{font-size:14px;font-weight:800;letter-spacing:.6px;color:var(--text)}
  .logo-text span{font-size:9px;color:var(--text-3);font-weight:500;letter-spacing:.3px;margin-top:1px}
  .header-nav{display:flex;gap:4px;flex:1;justify-content:center}
  .nav-tab{
    padding:8px 16px;border-radius:9px;font-size:13px;font-weight:600;color:var(--text-2);
    display:flex;align-items:center;gap:7px;white-space:nowrap;
  }
  .nav-tab:hover{background:var(--bg-hover);color:var(--text)}
  .nav-tab.active{background:var(--green-bg);color:var(--green)}
  .nav-tab svg{width:15px;height:15px}
  .header-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
  .icon-btn{
    width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    color:var(--text-2);border:1px solid transparent;
  }
  .icon-btn:hover{background:var(--bg-hover);color:var(--text);border-color:var(--border)}
  .icon-btn svg{width:16px;height:16px}
  .avatar{
    width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--purple));
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;overflow:hidden;
    border:2px solid var(--border);flex-shrink:0;
  }
  .avatar img{width:100%;height:100%;object-fit:cover}
  .currency-pill{
    display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:9px;
    background:var(--bg-elevated);border:1px solid var(--border);font-size:12px;font-weight:600;color:var(--text);
  }
  .currency-pill select{background:transparent;border:none;color:inherit;font-size:12px;font-weight:600;outline:none;cursor:pointer;appearance:none;padding-right:4px}
  .currency-pill select option{background:var(--bg-card);color:var(--text)}

  /* ---------- Main ---------- */
  .main{flex:1;width:100%;max-width:1600px;margin:0 auto;padding:18px 20px 40px}
  .greeting{margin-bottom:18px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .greeting h1{font-size:22px;font-weight:800;color:var(--text);letter-spacing:-.4px}
  .greeting p{font-size:12px;color:var(--text-3);margin-top:3px;font-weight:500}
  .greeting-quote{font-size:12px;color:var(--text-2);font-style:italic;max-width:280px;text-align:right;line-height:1.5}
  .greeting-quote span{display:block;font-style:normal;color:var(--text-3);font-size:11px;margin-top:2px}

  /* ---------- Cards ---------- */
  .card{
    background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px;box-shadow:var(--shadow);transition:border-color .15s;
  }
  .card:hover{border-color:var(--border-light)}
  .card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px;flex-wrap:wrap}
  .card-title{font-size:13px;font-weight:700;color:var(--text);letter-spacing:-.1px}
  .card-sub{font-size:11px;color:var(--text-3);font-weight:500;margin-top:2px}

  /* ---------- KPI ---------- */
  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
  .kpi-card{
    background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px 16px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden;
    transition:border-color .15s,transform .15s;
  }
  .kpi-card:hover{border-color:var(--border-light)}
  .kpi-top{display:flex;align-items:center;gap:9px}
  .kpi-icon{
    width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .kpi-icon svg{width:16px;height:16px}
  .kpi-icon.green{background:var(--green-bg);color:var(--green)}
  .kpi-icon.blue{background:var(--blue-bg);color:var(--blue)}
  .kpi-icon.amber{background:var(--amber-bg);color:var(--amber)}
  .kpi-icon.teal{background:var(--teal-bg);color:var(--teal)}
  .kpi-icon.purple{background:var(--purple-bg);color:var(--purple)}
  .kpi-icon.red{background:var(--red-bg);color:var(--red)}
  .kpi-label{font-size:11px;color:var(--text-3);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
  .kpi-value{font-size:22px;font-weight:800;color:var(--text);letter-spacing:-.5px;font-variant-numeric:tabular-nums;line-height:1.1}
  .kpi-delta{font-size:11px;font-weight:700;display:flex;align-items:center;gap:4px}
  .kpi-delta.up{color:var(--green)}
  .kpi-delta.down{color:var(--red)}
  .kpi-delta.neutral{color:var(--text-3)}
  .kpi-delta span{color:var(--text-3);font-weight:500}
  .kpi-progress{height:4px;border-radius:2px;background:var(--bg-elevated);overflow:hidden;margin-top:2px}
  .kpi-progress-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--green),var(--teal));transition:width .5s}

  /* ---------- Grid rows ---------- */
  .row-2{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:16px}
  .row-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}

  /* ---------- Period selector ---------- */
  .period-tabs{display:flex;gap:2px;background:var(--bg-elevated);padding:3px;border-radius:9px;border:1px solid var(--border)}
  .period-tab{
    padding:5px 11px;border-radius:6px;font-size:11px;font-weight:600;color:var(--text-3);
    transition:all .15s;
  }
  .period-tab:hover{color:var(--text)}
  .period-tab.active{background:var(--green);color:#fff;box-shadow:0 2px 6px rgba(34,197,94,.3)}

  /* ---------- Performance snapshot ---------- */
  .snapshot-list{display:flex;flex-direction:column;gap:2px}
  .snapshot-row{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-radius:8px;transition:background .15s}
  .snapshot-row:hover{background:var(--bg-elevated)}
  .snapshot-row .lbl{font-size:12px;color:var(--text-2);font-weight:500}
  .snapshot-row .val{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
  .snapshot-row .val.up{color:var(--green)}
  .snapshot-row .val.down{color:var(--red)}

  /* ---------- Allocation grid ---------- */
  .alloc-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .alloc-legend{display:flex;flex-direction:column;gap:6px;margin-top:8px}
  .alloc-legend-item{display:flex;align-items:center;gap:8px;font-size:11px}
  .alloc-dot{width:8px;height:8px;border-radius:3px;flex-shrink:0}
  .alloc-legend-item .name{flex:1;color:var(--text-2);font-weight:500}
  .alloc-legend-item .pct{color:var(--text);font-weight:700;font-variant-numeric:tabular-nums}

  /* ---------- Risk gauge ---------- */
  .risk-gauge-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 0}
  .risk-gauge{position:relative;width:160px;height:90px}
  .risk-gauge svg{width:100%;height:100%;display:block}
  .risk-gauge-label{position:absolute;left:0;right:0;bottom:6px;text-align:center}
  .risk-gauge-label .lvl{font-size:12px;font-weight:800;letter-spacing:1px}
  .risk-gauge-label .sub{font-size:9px;color:var(--text-3);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-top:1px}
  .risk-metrics{width:100%;display:flex;flex-direction:column;gap:5px;margin-top:6px}
  .risk-metric{display:flex;justify-content:space-between;font-size:11px;padding:5px 8px;border-radius:6px;background:var(--bg-elevated)}
  .risk-metric .k{color:var(--text-3);font-weight:500}
  .risk-metric .v{color:var(--text);font-weight:700;font-variant-numeric:tabular-nums}

  /* ---------- Table ---------- */
  .table-wrap{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
  .table-toolbar{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
  .search-input{
    flex:1;min-width:160px;display:flex;align-items:center;gap:8px;background:var(--bg-input);
    border:1px solid var(--border);border-radius:9px;padding:7px 12px;color:var(--text);
  }
  .search-input input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:12px}
  .search-input input::placeholder{color:var(--text-3)}
  .search-input svg{width:14px;height:14px;color:var(--text-3);flex-shrink:0}
  .table-scroll{overflow:auto;max-height:calc(100vh - 320px)}
  .modern-table{width:100%;border-collapse:collapse;font-size:12px}
  .modern-table thead th{
    position:sticky;top:0;z-index:5;background:var(--bg-elevated);
    padding:10px 14px;text-align:left;font-size:10px;font-weight:700;color:var(--text-3);
    text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid var(--border);white-space:nowrap;
  }
  .modern-table tbody td{padding:12px 14px;border-bottom:1px solid var(--border);color:var(--text-2);font-weight:500;white-space:nowrap}
  .modern-table tbody tr:hover td{background:var(--bg-elevated)}
  .modern-table tbody tr:last-child td{border-bottom:none}
  .ticker-cell{display:flex;align-items:center;gap:10px}
  .ticker-badge{
    width:32px;height:32px;border-radius:8px;background:var(--bg-elevated);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;color:var(--text);
    letter-spacing:.3px;flex-shrink:0;border:1px solid var(--border);
  }
  .ticker-info{display:flex;flex-direction:column;line-height:1.3}
  .ticker-info .t{font-weight:700;color:var(--text);font-size:12px}
  .ticker-info .n{font-size:10px;color:var(--text-3);font-weight:500;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .num-cell{font-variant-numeric:tabular-nums;font-weight:600;color:var(--text)}
  .pill{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:6px;font-size:10px;font-weight:700;font-variant-numeric:tabular-nums}
  .pill.up{background:var(--green-bg);color:var(--green)}
  .pill.down{background:var(--red-bg);color:var(--red)}
  .pill.neutral{background:var(--bg-elevated);color:var(--text-2)}
  .row-actions{display:flex;gap:4px}
  .row-action{
    width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;
    background:var(--bg-elevated);color:var(--text-2);font-size:11px;font-weight:700;
  }
  .row-action:hover{background:var(--bg-hover);color:var(--text)}
  .row-action.buy:hover{background:var(--green-bg);color:var(--green)}
  .row-action.sell:hover{background:var(--red-bg);color:var(--red)}
  .row-action.div:hover{background:var(--teal-bg);color:var(--teal)}

  /* ---------- Treemap ---------- */
  .treemap{position:relative;width:100%;border-radius:var(--radius);overflow:hidden;background:var(--bg-elevated);border:1px solid var(--border)}
  .treemap-cell{
    position:absolute;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    cursor:pointer;overflow:hidden;transition:filter .12s;padding:2px;text-align:center;
  }
  .treemap-cell:hover{filter:brightness(1.12)}
  .treemap-cell .tk{font-weight:800;font-family:'Space Mono',monospace;letter-spacing:.2px;line-height:1.1}
  .treemap-cell .pct{font-family:'Space Mono',monospace;opacity:.9;line-height:1.1;margin-top:1px}
  .treemap-cell .sub{font-family:'Space Mono',monospace;opacity:.7;line-height:1.1;margin-top:1px}

  /* ---------- View toggle ---------- */
  .view-toggle{display:flex;gap:3px;background:var(--bg-elevated);padding:3px;border-radius:9px;border:1px solid var(--border)}
  .view-toggle button{padding:5px 12px;border-radius:6px;font-size:11px;font-weight:600;color:var(--text-3);display:flex;align-items:center;gap:5px}
  .view-toggle button.active{background:var(--bg-card);color:var(--text);box-shadow:var(--shadow)}
  .view-toggle button:hover:not(.active){color:var(--text-2)}
  .view-toggle svg{width:13px;height:13px}

  /* ---------- Buttons ---------- */
  .btn{
    padding:9px 16px;border-radius:9px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px;
    transition:all .15s;
  }
  .btn-primary{background:var(--green);color:#fff;box-shadow:0 2px 8px rgba(34,197,94,.25)}
  .btn-primary:hover{background:var(--green-dim);box-shadow:0 4px 12px rgba(34,197,94,.35)}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed}
  .btn-ghost{background:var(--bg-elevated);color:var(--text-2);border:1px solid var(--border)}
  .btn-ghost:hover{background:var(--bg-hover);color:var(--text);border-color:var(--border-light)}
  .btn-danger{background:var(--red);color:#fff}
  .btn-danger:hover{background:#dc2626}
  .btn-sm{padding:6px 12px;font-size:11px;border-radius:8px}
  .btn svg{width:14px;height:14px}

  /* ---------- Inputs ---------- */
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
  .field label{font-size:10px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.6px}
  .field input,.field select,.field textarea{
    width:100%;background:var(--bg-input);border:1px solid var(--border);border-radius:9px;
    padding:10px 12px;color:var(--text);font-size:13px;outline:none;transition:border-color .15s;
  }
  .field input:focus,.field select:focus{border-color:var(--green)}
  .field input::placeholder{color:var(--text-3)}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .field-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

  /* ---------- Bottom nav (mobile) ---------- */
  .bottom-nav{
    display:none;position:fixed;bottom:0;left:0;right:0;z-index:50;
    background:var(--bg-card);border-top:1px solid var(--border);
    padding:6px 8px calc(6px + env(safe-area-inset-bottom));backdrop-filter:blur(12px);
  }
  .bottom-nav-inner{display:flex;justify-content:space-around;max-width:500px;margin:0 auto}
  .bottom-nav-item{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 4px;border-radius:10px;
    color:var(--text-3);transition:color .15s,background .15s;
  }
  .bottom-nav-item svg{width:20px;height:20px}
  .bottom-nav-item span{font-size:10px;font-weight:600}
  .bottom-nav-item.active{color:var(--green)}
  .bottom-nav-item.active svg{filter:drop-shadow(0 0 8px rgba(34,197,94,.4))}

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .15s ease;
  }
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .modal{
    background:var(--bg-card);border:1px solid var(--border);border-radius:18px;
    width:100%;max-width:460px;max-height:90vh;overflow-y:auto;
    box-shadow:var(--shadow-lg);animation:slideUp .2s ease;
  }
  @keyframes slideUp{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
  .modal-lg{max-width:760px}
  .modal-header{padding:18px 20px 14px;border-bottom:1px solid var(--border)}
  .modal-header h2{font-size:16px;font-weight:800;color:var(--text);letter-spacing:-.2px}
  .modal-header p{font-size:11px;color:var(--text-3);margin-top:3px;font-weight:500}
  .modal-body{padding:18px 20px}
  .modal-footer{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--border)}

  /* ---------- Import preview ---------- */
  .import-drop{
    border:2px dashed var(--border-light);border-radius:14px;padding:36px 20px;text-align:center;
    background:var(--bg-elevated);transition:all .2s;cursor:pointer;
  }
  .import-drop.dragover{border-color:var(--green);background:var(--green-bg)}
  .import-drop .ico{font-size:36px;margin-bottom:10px;opacity:.5}
  .import-drop .ttl{font-size:14px;font-weight:700;color:var(--text);margin-bottom:4px}
  .import-drop .desc{font-size:11px;color:var(--text-3);margin-bottom:14px}

  /* ---------- Snackbar / status ---------- */
  .status-chip{
    display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;
    font-size:10px;font-weight:600;background:var(--bg-elevated);border:1px solid var(--border);color:var(--text-2);
  }

  /* ---------- Spinner ---------- */
  @keyframes spin{to{transform:rotate(360deg)}}
  .spin{display:inline-block;animation:spin .9s linear infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  .pulse{animation:pulse 1.5s ease-in-out infinite}

  /* ---------- Responsive ---------- */
  @media(max-width:1100px){
    .row-4{grid-template-columns:1fr 1fr}
  }
  @media(max-width:900px){
    .header-nav{display:none}
    .row-2{grid-template-columns:1fr}
    .greeting-quote{display:none}
  }

// ─── Treemap ──────────────────────────────────────────────────────────────────
function squarify(items,x,y,w,h){
  if(!items.length)return[];
  const r=[];
  _layout(items,x,y,w,h,items.reduce((s,i)=>s+i.value,0),r);
  return r;
}
function _layout(it,x,y,w,h,tot,r){
  if(!it.length)return;
  if(it.length===1){r.push({...it[0],x,y,w,h});return;}
  const hz=w>=h,dim=hz?w:h;
  let row=[],rt=0,best=Infinity;
  for(let i=0;i<it.length;i++){
    row.push(it[i]);rt+=it[i].value;
    const rd=(rt/tot)*dim;
    let worst=0;
    for(const ri of row){const od=(ri.value/rt)*(hz?h:w);const ra=Math.max(rd/od,od/rd);if(ra>worst)worst=ra;}
    if(worst>best){row.pop();rt-=it[i].value;break;}
    best=worst;
  }
  const rd=(rt/tot)*dim;
  let cur=hz?y:x;
  for(const ri of row){const sz=(ri.value/rt)*(hz?h:w);hz?r.push({...ri,x,y:cur,w:rd,h:sz}):r.push({...ri,x:cur,y,w:sz,h:rd});cur+=sz;}
  const rem=it.slice(row.length);
  if(!rem.length)return;
  const remT=tot-rt;
  hz?_layout(rem,x+rd,y,w-rd,h,remT,r):_layout(rem,x,y+rd,w,h-rd,remT,r);
}

  const bg=`hsl(${hue}, ${sat}%, ${light}%)`;const text="#ffffff";

async function fetchWithProxyRaw(url,timeoutMs=10000){
  return new Promise((resolve,reject)=>{
    let settled=false;let pending=PROXIES.length;
    PROXIES.forEach(proxy=>{
      fetch(proxy(url),{signal:AbortSignal.timeout(timeoutMs)}).then(async r=>{
        if(!r.ok)throw new Error("HTTP "+r.status);
        const t=await r.text();if(!t||t.length<10)throw new Error("Empty");
        if(t.trim().startsWith("{")&&t.includes('"contents"')){try{const j=JSON.parse(t);if(j.contents){if(!settled){settled=true;resolve(j.contents);}return;}}catch(e){}}
        if(!settled){settled=true;resolve(t);}
      }).catch(()=>{pending--;if(pending===0&&!settled)reject(new Error("All proxies failed (raw)"));});
    });
  });
}
async function tryProxy(proxyUrl,timeoutMs){
  const r=await fetch(proxyUrl,{signal:AbortSignal.timeout(timeoutMs)});
  if(!r.ok)throw new Error("HTTP "+r.status);
  const t=await r.text();if(!t||t.length<10)throw new Error("Empty response");
  let parsed=JSON.parse(t);
  if(parsed?.contents&&typeof parsed.contents==="string")parsed=JSON.parse(parsed.contents);
  return parsed;
}
async function fetchWithProxy(url,timeoutMs=10000){
  return new Promise((resolve,reject)=>{
    let settled=false;let pending=PROXIES.length;const errors=[];
    PROXIES.forEach(proxy=>{
      tryProxy(proxy(url),timeoutMs).then(data=>{if(!settled){settled=true;resolve(data);}})
        .catch(e=>{errors.push(e.message);pending--;if(pending===0&&!settled)reject(new Error("All proxies failed: "+url.split("?")[0].split("/").pop()));});
    });
  });
}
async function fetchIDXPrice(stockCode){
  const code=stockCode.toUpperCase().replace(".JK","").trim();
  const endpoints=[`https://api-apps.idx.co.id/api/Stock/GetStockSummary?StockCode=${code}`,`https://api-apps.idx.co.id/api/Stock/GetStockData?StockCode=${code}`,`https://api-apps.idx.co.id/api/Stock/GetTradingResult?StockCode=${code}`,`https://api.stockbit.com/v2.4/fundamental/financialsummary/${code}`,`https://api.markets.ft.com/data/prices/v1/series/symbol/${code}.JK`];
  for(const url of endpoints){
    try{

      const item=d?.data||d?.Data||d;

      if(cur>0){const prev=parseFloat(item?.PreviousPrice??item?.previousPrice??item?.OpenPrice??cur);return{current:cur,prev};}
      const arr=Array.isArray(item)?item:(item?.stockData||item?.result||[]);
      if(arr.length){const r=arr[0];const cur2=parseFloat(r?.ClosePrice??r?.closePrice??r?.LastPrice??0);if(cur2>0)return{current:cur2,prev:parseFloat(r?.PreviousPrice??cur2)};}
    }catch(e){}

  throw new Error("IDX: "+code+" not found");
}
function toStooqSymbol(yahooSymbol){
  const s=yahooSymbol.toUpperCase();
  if(s.endsWith(".AX"))return s.replace(".AX",".AU").toLowerCase();
  if(s.endsWith(".JK"))return s.replace(".JK",".ID").toLowerCase();
  if(s.endsWith("-AUD"))return s.replace("-AUD","-AUD.CRYPTO").toLowerCase();
  if(s.endsWith("-USD"))return s.replace("-USD","-USD.CRYPTO").toLowerCase();
  if(s.endsWith("-BTC"))return s.replace("-BTC","-BTC.CRYPTO").toLowerCase();
  if(s==="GC=F")return"gc.f";if(s==="SI=F")return"si.f";if(s==="CL=F")return"cl.f";if(s==="NG=F")return"ng.f";
  if(s.endsWith(".L"))return s.toLowerCase();if(s.endsWith(".SI"))return s.toLowerCase();if(s.endsWith(".TO"))return s.toLowerCase();if(s.endsWith(".HK"))return s.toLowerCase();
  if(!s.includes(".")&&!s.includes("-")&&!s.includes("="))return s.toLowerCase()+".us";
  return null;
}
async function fetchStooq(yahooSymbol){
  const stooq=toStooqSymbol(yahooSymbol);if(!stooq)throw new Error("No Stooq symbol for "+yahooSymbol);
  const now=new Date();const d1=new Date(now);d1.setDate(d1.getDate()-7);
  const fmt=d=>`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;
  const url=`https://stooq.com/q/d/l/?s=${stooq}&d1=${fmt(d1)}&d2=${fmt(now)}&i=d`;
  const raw=await fetchWithProxyRaw(url);
  const allLines=raw.trim().split("\n").map(l=>l.trim()).filter(Boolean);
  if(allLines.length<2)throw new Error("Stooq: no data for "+stooq);
  const header=allLines[0].toLowerCase().split(",");const closeIdx=header.indexOf("close");
  if(closeIdx<0)throw new Error("Stooq: no Close col");
  const dataLines=allLines.slice(1).filter(l=>!/no data/i.test(l));
  if(!dataLines.length)throw new Error("Stooq: empty data");
  dataLines.sort((a,b)=>a.split(",")[0].localeCompare(b.split(",")[0]));
  const parseClose=l=>parseFloat(l.split(",")[closeIdx])||0;
  const cur=parseClose(dataLines[dataLines.length-1]);
  const prev=dataLines.length>1?parseClose(dataLines[dataLines.length-2]):cur;
  if(!cur)throw new Error("Stooq: zero price");
  return{current:cur,prev};
}
async function fetchYahooPrice(symbol){

  const parseChartForPrevClose=d=>{const res=d?.chart?.result?.[0];if(!res)return null;const timestamps=res.timestamp;const closes=res.indicators?.quote?.[0]?.close;if(!timestamps||!closes||timestamps.length<2)return null;const prevClose=closes[closes.length-2];const current=closes[closes.length-1];if(prevClose&&current)return{current,prev:prevClose};return null;};
  try{const quoteUrl=`https://query1.finance.yahoo.com/v8/finance/chart/${sym}?interval=1d&range=2d&includePrePost=false`;const data=await fetchWithProxy(quoteUrl);const result=parseChartForPrevClose(data);if(result&&result.current>0&&result.prev>0)return result;}catch(e){}
  try{const quoteUrl=YAHOO_V7+sym+"&fields=regularMarketPrice,regularMarketPreviousClose";const quoteData=await fetchWithProxy(quoteUrl);const result=parseQuote(quoteData);if(result&&result.current>0&&result.prev!==null)return result;}catch(e){}

  try{const stooqResult=await fetchStooq(symbol);if(stooqResult?.current>0)return stooqResult;}catch(e){}

  throw new Error(`All price sources failed for ${symbol}`);
}
async function fetchBenchmark(symbol){
  const sym=encodeURIComponent(symbol);
  const candidates=[YAHOO_BASE+sym+"?interval=1mo&range=5y",YAHOO_BASE1+sym+"?interval=1mo&range=5y",YAHOO_BASE+sym+"?interval=1mo&range=3y"];

// ─── Compute Holding ──────────────────────────────────────────────────────────
function computeHolding(h,prices,prevPrices,R){
  let qty=0,cbL=0,rgL=0,lots=[],divL=0;
  const txs=[...h.transactions].sort((a,b)=>new Date(a.date)-new Date(b.date));
  for(const tx of txs){
    if(tx.type==="buy"){lots.push({qty:tx.qty,price:tx.price});qty+=tx.qty;cbL+=tx.qty*tx.price;}
    else if(tx.type==="sell"){
      let rem=tx.qty;qty-=tx.qty;
      while(rem>0&&lots.length){const lot=lots[0],used=Math.min(lot.qty,rem);rgL+=used*(tx.price-lot.price);cbL-=used*lot.price;lot.qty-=used;rem-=used;if(lot.qty===0)lots.shift();}
    }else if(tx.type==="dividend"){divL+=tx.totalAmount||0;}
  }
  const cpL=prices[h.ticker]??0,pcL=prevPrices[h.ticker]??cpL;
  const cvL=qty*cpL,ugL=cvL-cbL,dgL=(cpL-pcL)*qty,dgPct=pcL>0?(cpL-pcL)/pcL*100:0;
  const cv=toAUD(cvL,h.currency,R),cb=toAUD(cbL,h.currency,R),ug=toAUD(ugL,h.currency,R);
  const rg=toAUD(rgL,h.currency,R),divs=toAUD(divL,h.currency,R),dg=toAUD(dgL,h.currency,R);
  const totalInv=txs.filter(t=>t.type==="buy").reduce((s,t)=>s+toAUD(t.qty*t.price,h.currency,R),0);
  const totalGain=ug+rg+divs,gainPct=totalInv>0?(totalGain/totalInv)*100:0;
  const divYoc=totalInv>0?(divs/totalInv)*100:0;
  return{...h,qty,costBasis:cb,currentPrice:cpL,prevClose:pcL,currentValue:cv,unrealizedGain:ug,realizedGain:rg,totalDividends:divs,totalGain,gainPct,dayGain:dg,dayGainPct:dgPct,divYieldOnCost:divYoc,totalInvested:totalInv};
}

let globalIdCounter=Date.now();
function repairPortfolio(portfolio){
  if(!Array.isArray(portfolio))return[];
  const seenIds=new Set();
  return portfolio.map(h=>{
    let id=h.id;
    if(!id||typeof id!=="number"||isNaN(id)||seenIds.has(id)){id=++globalIdCounter;}
    seenIds.add(id);
    let tx=h.transactions;if(!Array.isArray(tx))tx=[];tx=[...tx];tx=tx.filter(t=>t&&typeof t==="object");
    return{...h,id,transactions:tx};
  });
}

// ─── Risk Gauge (SVG semicircle) ─────────────────────────────────────────────
function RiskGauge({score,label,T}){
  const size=160;
  const R=62;
  const cx=size/2;
  const cy=size-16;
  const startAngle=Math.PI;
  const endAngle=0;
  const pct=Math.max(0,Math.min(1,score));
  const angle=startAngle-(startAngle-endAngle)*pct;
  const arcStartX=cx+R*Math.cos(startAngle);
  const arcStartY=cy+R*Math.sin(startAngle);
  const arcEndX=cx+R*Math.cos(angle);
  const arcEndY=cy+R*Math.sin(angle);
  const largeArc=pct>0.5?1:0;
  const track=`M ${cx-R} ${cy} A ${R} ${R} 0 0 1 ${cx+R} ${cy}`;
  const fill=`M ${arcStartX} ${arcStartY} A ${R} ${R} 0 ${largeArc} 1 ${arcEndX} ${arcEndY}`;
  let color="#22c55e";
  if(pct>0.66)color="#ef4444";
  else if(pct>0.33)color="#f59e0b";
  return(
    <div className="risk-gauge">
      <svg viewBox={`0 0 ${size} ${size-8}`}>
        <defs>
          <linearGradient id="rg" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stopColor="#22c55e"/>
            <stop offset="50%" stopColor="#f59e0b"/>
            <stop offset="100%" stopColor="#ef4444"/>
          </linearGradient>
        </defs>
        <path d={track} stroke={T.bg4} strokeWidth="12" fill="none" strokeLinecap="round"/>
        <path d={fill} stroke="url(#rg)" strokeWidth="12" fill="none" strokeLinecap="round"/>
        <circle cx={cx} cy={cy} r="3" fill={T.text}/>
      </svg>
      <div className="risk-gauge-label">
        <div className="lvl" style={{color}}>{label}</div>
        <div className="sub">Risk Score</div>
      </div>
    </div>
  );
}

const COL={

  name:["name","company","company name","security name","description","instrument","issuer"],
  type:["type","transaction type","tx type","txtype","tx_type","action","trade type"],
  date:["date","trade date","settlement date","payment date","tx date","transaction date","value date"],
  qty:["qty","quantity","units","volume","lots","number of shares","number of units","unit count"],
  price:["price","unit price","trade price","cost price","nav","purchase price","sale price"],
  currency:["currency","ccy","cur","denomination"],
  assetType:["asset type","asset_type","asset class","category","class","security type","instrument type"],
  exchange:["exchange","market","listing","exchange code","exch","bourse"],
  yahooSymbol:["yahoo","yahoo symbol","yahoo_symbol","yfinance","yf symbol","yahoo finance"],
  faceValue:["face value","face_value","nominal","nominal value","par value","par"],

  entitledQty:["entitled qty","entitled units","entitled shares","entitled","ex date units","qualifying units","qualifying shares"],
  amountPerShare:["amount per share","div per share","coupon per unit","dividend per share","dividend rate","coupon rate","div rate","rate per unit","distribution per unit"],
  totalAmount:["total amount","total dividend","total coupon","gross amount","total distribution","dividend total"],
};
function resolveHeader(raw){
  if(!raw&&raw!==0)return null;
  const norm=s=>String(s).toLowerCase().trim().replace(/[_\-]/g," ").replace(/\s+/g," ");
  const lo=norm(raw);
  for(const[field,aliases]of Object.entries(COL)){if(aliases.map(norm).includes(lo))return field;}
  for(const[field,aliases]of Object.entries(COL)){for(const a of aliases){const na=norm(a);const re=new RegExp("(^|[\\s/])"+na.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"([\\s/]|$)");if(re.test(lo))return field;}}
  return null;
}
function normaliseType(raw=""){
  const lo=raw.toLowerCase().trim();
  if(["buy","purchase","bought","b","top up","topup","top-up","add"].includes(lo))return"buy";
  if(["sell","sale","sold","s","disposal","withdraw"].includes(lo))return"sell";
  if(["div","dividend","dividends","income","distribution","coupon","interest","yield","d"].includes(lo))return"dividend";
  return null;
}
function normaliseDate(raw=""){
  if(!raw)return"";
  if(typeof raw==="number"){const d=new Date(Math.round((raw-25569)*86400*1000));return d.toISOString().slice(0,10);}
  const s=String(raw).trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);
  const m1=s.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{4})/);
  if(m1){const[,d,mo,y]=m1;return`${y}-${mo.padStart(2,"0")}-${d.padStart(2,"0")}`;}
  const dt=new Date(s);if(!isNaN(dt))return dt.toISOString().slice(0,10);
  return s;
}
function normaliseCurrency(raw=""){
  const lo=String(raw).toUpperCase().trim();
  if(["AUD","A$","AU"].includes(lo))return"AUD";
  if(["IDR","RP","RUPIAH"].includes(lo))return"IDR";
  if(["USD","US$","$"].includes(lo))return"USD";
  return lo||"AUD";
}
function normaliseAssetType(raw=""){
  const lo=raw.toLowerCase().trim();
  const map={"shares":"Shares / Stocks","stocks":"Shares / Stocks","share":"Shares / Stocks","stock":"Shares / Stocks","equity":"Shares / Stocks","etf":"ETF","exchange traded fund":"ETF","mutual fund":"Mutual Fund","unit trust":"Mutual Fund","reksadana":"Mutual Fund","index fund":"Index Fund","super":"Superannuation","superannuation":"Superannuation","bond":"Bond – Government","govt bond":"Bond – Government","government bond":"Bond – Government","sbn":"Bond – Indonesia (SBN)","sukuk":"Bond – Sharia (Sukuk)","sharia bond":"Bond – Sharia (Sukuk)","pbs":"Bond – Sharia (Sukuk)","commodity":"Commodity","commodities":"Commodity","gold":"Commodity","silver":"Commodity","crypto":"Cryptocurrency","cryptocurrency":"Cryptocurrency","bitcoin":"Cryptocurrency","token":"Cryptocurrency","forex":"Forex","fx":"Forex","currency":"Forex","reit":"REIT / Property","property":"REIT / Property","real estate":"REIT / Property","cash":"Cash / Term Deposit","td":"Cash / Term Deposit","term deposit":"Cash / Term Deposit","deposit":"Cash / Term Deposit"};
  for(const[k,v]of Object.entries(map)){if(lo.includes(k))return v;}
  return ASSET_TYPES.find(t=>t.toLowerCase()===lo)||raw||"Shares / Stocks";
}
function parseRows(rawRows){
  if(!rawRows.length)return{rows:[],errors:[],fieldMap:{}};
  const sampleKeys=Object.keys(rawRows[0]);
  const fieldMap={};
  sampleKeys.forEach(k=>{const f=resolveHeader(k);if(f)fieldMap[f]=k;});
  const rows=[],errors=[];
  rawRows.forEach((raw,i)=>{
    const row={};
    const R=n=>fieldMap[n]?String(raw[fieldMap[n]]??"").trim():"";
    const RN=n=>fieldMap[n]?parseFloat(String(raw[fieldMap[n]]??"").replace(/[^\d.\-]/g,""))||0:0;
    row.ticker=(R("ticker")||"").toUpperCase();
    row.type=normaliseType(R("type"));
    row.date=normaliseDate(fieldMap["date"]?raw[fieldMap["date"]]:"");
    row.qty=RN("qty");row.price=RN("price");
    row.name=R("name")||row.ticker;
    row.currency=normaliseCurrency(R("currency"));
    row.assetType=normaliseAssetType(R("assetType"));
    row.exchange=R("exchange");row.yahooSymbol=R("yahooSymbol");
    row.faceValue=RN("faceValue")||null;
    row.isBondPct=["true","yes","1","y"].includes(R("isBondPct").toLowerCase());
    row.entitledQty=RN("entitledQty")||null;
    row.amountPerShare=RN("amountPerShare");row.totalAmount=RN("totalAmount");
    const errs=[];
    if(!row.ticker)errs.push("Missing ticker");
    if(!row.type)errs.push(`Unknown type "${R("type")}"`);
    if(!row.date)errs.push("Missing date");
    if(row.type==="buy"||row.type==="sell"){if(!row.qty||row.qty<=0)errs.push("qty must be > 0");if(!row.price||row.price<=0)errs.push("price must be > 0");}
    if(row.type==="dividend"){if(!row.amountPerShare&&!row.totalAmount)errs.push("Need amount per share or total amount");}
    row._rowNum=i+2;row._errors=errs;
    rows.push(row);
    if(errs.length)errors.push({rowNum:i+2,ticker:row.ticker,errs});
  });
  return{rows,errors,fieldMap};
}
function buildPortfolioFromRows(parsedRows,existingPortfolio=[]){
  const repaired=repairPortfolio(existingPortfolio);
  const portfolio=repaired.map(h=>({...h,transactions:[...h.transactions]}));
  const valid=parsedRows.filter(r=>!r._errors.length);
  valid.forEach(row=>{
    let holding=portfolio.find(h=>h.ticker===row.ticker);
    if(!holding){
      holding={id:Date.now()+Math.random()*1000,ticker:row.ticker,name:row.name||row.ticker,currency:row.currency||"AUD",assetType:row.assetType||"Shares / Stocks",exchange:row.exchange||"",yahooSymbol:row.yahooSymbol||suggestYahoo(row.ticker,row.exchange,row.assetType),transactions:[]};
      if(row.isBondPct)holding.isBondPct=true;
      if(row.faceValue)holding.faceValue=row.faceValue;
      portfolio.push(holding);
    }
    if(row.type==="buy"||row.type==="sell"){holding.transactions.push({type:row.type,qty:row.qty,price:row.price,date:row.date});}
    else if(row.type==="dividend"){
      const entQ=row.entitledQty||row.qty||null;
      let total=row.totalAmount||0;
      if(!total&&row.amountPerShare&&entQ)total=row.amountPerShare*entQ;
      holding.transactions.push({type:"dividend",amountPerShare:row.amountPerShare,totalAmount:total,...(entQ?{entitledQty:entQ}:{}),date:row.date});
    }
  });
  portfolio.forEach(h=>h.transactions.sort((a,b)=>new Date(a.date)-new Date(b.date)));
  return repairPortfolio(portfolio);
}
function readFileAsRows(file){

      reader.onload=e=>{const result=Papa.parse(e.target.result,{header:true,skipEmptyLines:true,dynamicTyping:false});resolve(result.data);};

}

// ─── Risk Metrics ────────────────────────────────────────────────────────────
function computeRiskMetrics(historyData){
  if(!historyData||historyData.length<3)return{volatility:null,maxDrawdown:null,bestMonth:null,worstMonth:null};
  const sorted=[...historyData].sort((a,b)=>new Date(a.date)-new Date(b.date));
  const values=sorted.map(d=>d.totalValueAUD);
  const returns=[];
  for(let i=1;i<values.length;i++){if(values[i-1]>0){let ret=(values[i]-values[i-1])/values[i-1];if(ret>1)ret=1;if(ret<-1)ret=-1;returns.push(ret);}}
  if(returns.length<2)return{volatility:null,maxDrawdown:null,bestMonth:null,worstMonth:null};
  const meanRet=returns.reduce((s,r)=>s+r,0)/returns.length;
  const variance=returns.reduce((s,r)=>s+(r-meanRet)**2,0)/returns.length;
  const volatility=Math.sqrt(variance)*Math.sqrt(12);
  let peak=values[0],maxDrawdown=0;
  for(const v of values){if(v>peak)peak=v;const dd=peak>0?(peak-v)/peak:0;if(dd>maxDrawdown)maxDrawdown=dd;}
  const monthlyRet=[];
  const sortedDates=sorted.map(d=>d.date);
  for(let i=1;i<values.length;i++){let ret=values[i-1]>0?(values[i]-values[i-1])/values[i-1]:0;if(ret>1)ret=1;if(ret<-1)ret=-1;monthlyRet.push({date:sortedDates[i],ret});}
  const best=monthlyRet.reduce((a,b)=>a.ret>b.ret?a:b,{ret:-Infinity});
  const worst=monthlyRet.reduce((a,b)=>a.ret<b.ret?a:b,{ret:Infinity});
  return{volatility:volatility*100,maxDrawdown:maxDrawdown*100,bestMonth:best.ret!==-Infinity?{date:best.date,ret:best.ret*100}:null,worstMonth:worst.ret!==Infinity?{date:worst.date,ret:worst.ret*100}:null};
}
function computeIncomeRiskMetrics(portfolio,rates,displayCur){
  if(!Array.isArray(portfolio))return{totalIncome:0,stability:null,payoutRisk:null,cutProb:null,concentration:null,incomeVolatility:null,incomeDrawdown:null,dividendGrowth:null};
  const divHoldings=portfolio.filter(h=>DIVIDEND_PAYING_TYPES.has(h.assetType)&&!INCOME_RISK_EXCLUDED_TICKERS.has(h.ticker));
  if(divHoldings.length===0)return{totalIncome:0,stability:null,payoutRisk:null,cutProb:null,concentration:null,incomeVolatility:null,incomeDrawdown:null,dividendGrowth:null};
  const quarterlyIncome={};const holdingTotalIncome={};const yearlyIncome={};
  for(const h of divHoldings){
    const divTxs=h.transactions.filter(t=>t.type==="dividend"&&t.date);
    for(const tx of divTxs){
      const date=new Date(tx.date);const quarter=Math.floor(date.getMonth()/3)+1;const quarterKey=`${date.getFullYear()}-Q${quarter}`;const year=String(date.getFullYear());
      const amountAUD=toAUD(tx.totalAmount||0,h.currency,rates);
      if(!quarterlyIncome[quarterKey])quarterlyIncome[quarterKey]=0;quarterlyIncome[quarterKey]+=amountAUD;
      if(!yearlyIncome[year])yearlyIncome[year]=0;yearlyIncome[year]+=amountAUD;
      if(!holdingTotalIncome[h.ticker])holdingTotalIncome[h.ticker]=0;holdingTotalIncome[h.ticker]+=amountAUD;
    }
  }
  const quarterKeys=Object.keys(quarterlyIncome).sort();
  if(quarterKeys.length<3)return{totalIncome:0,stability:null,payoutRisk:null,cutProb:null,concentration:null,incomeVolatility:null,incomeDrawdown:null,dividendGrowth:null};
  const incomeValues=quarterKeys.map(k=>quarterlyIncome[k]);
  const mean=incomeValues.reduce((a,b)=>a+b,0)/incomeValues.length;
  const stdDev=Math.sqrt(incomeValues.reduce((s,v)=>s+(v-mean)**2,0)/incomeValues.length);
  const cv=mean>0?stdDev/mean:1;
  const stability=Math.max(0,Math.min(1,1-Math.min(cv,1)));
  let peak=-Infinity,maxDrawdown=0;
  for(const v of incomeValues){if(v>peak)peak=v;if(peak>0){const dd=(peak-v)/peak;if(dd>maxDrawdown)maxDrawdown=dd;}}
  const payoutRisk=Math.min(1,maxDrawdown);
  let cutProb;
  if(stability>0.7&&payoutRisk<0.3)cutProb="Low";
  else if(stability>0.5&&payoutRisk<0.5)cutProb="Low–Medium";
  else if(payoutRisk<0.6)cutProb="Medium";
  else if(payoutRisk<0.75)cutProb="Medium–High";
  else cutProb="High";
  const sortedIncome=Object.values(holdingTotalIncome).sort((a,b)=>b-a);
  const top3=sortedIncome.slice(0,3).reduce((s,v)=>s+v,0);
  const totalIncome=sortedIncome.reduce((s,v)=>s+v,0);
  const concentration=totalIncome>0?top3/totalIncome:0;
  const years=Object.keys(yearlyIncome).sort();
  let dividendGrowth=null;
  if(years.length>=2){
    const firstY=years[0],lastY=years[years.length-1];
    const firstVal=yearlyIncome[firstY],lastVal=yearlyIncome[lastY];
    const numYears=parseInt(lastY)-parseInt(firstY);
    if(numYears>0&&firstVal>0&&lastVal>0){dividendGrowth=(Math.pow(lastVal/firstVal,1/numYears)-1)*100;}
  }
  return{totalIncome,stability,payoutRisk,cutProb,concentration,incomeVolatility:cv,incomeDrawdown:maxDrawdown,dividendGrowth,meanQuarterlyIncome:mean,stdDevQuarterly:stdDev,quarters:quarterKeys,incomeValues,holdingTotalIncome,yearlyIncome};
}

        const ok=BM_DEFS.map((b,i)=>results[i].status==="fulfilled"?b.label+"✓":null).filter(Boolean);

    const errors={};let successes=0;

              {label:"Cut Probability",value:ir.cutProb,sub:ir.cutProb==="Low"?"✅ Low risk":ir.cutProb==="Low–Medium"?"⚡ Monitor":ir.cutProb==="Medium"?"⚠️ Elevated":"🚨 High",color:ir.cutProb==="Low"?T.green:ir.cutProb==="Low–Medium"||ir.cutProb==="Medium"?T.amber:T.red,bar:ir.cutProb==="Low"?20:ir.cutProb==="Low–Medium"?40:ir.cutProb==="Medium"?60:85},
              {label:"Concentration",value:(ir.concentration*100).toFixed(0)+"%",sub:ir.concentration<0.4?"Diversified":ir.concentration<0.6?"Moderate":"Concentrated",color:ir.concentration<0.4?T.green:ir.concentration<0.6?T.amber:T.red,bar:ir.concentration*100},
              {label:"Dividend Growth",value:ir.dividendGrowth!=null?ir.dividendGrowth.toFixed(1)+"%":"—",sub:ir.dividendGrowth!=null?(ir.dividendGrowth>0?`+${ir.dividendGrowth.toFixed(1)}% CAGR`:`${ir.dividendGrowth.toFixed(1)}% CAGR`):"N/A",color:ir.dividendGrowth!=null?(ir.dividendGrowth>0?T.green:T.red):T.text3,bar:ir.dividendGrowth!=null?Math.min(Math.max(ir.dividendGrowth+10,0),100):50},
            ];
            return(
              <div style={{display:"grid",gridTemplateColumns:isMob?"1fr 1fr":"repeat(5,1fr)",gap:8}}>
                {cards.map((c,i)=>(
                  <div key={i} style={{background:T.bg3,border:`1px solid ${T.border}`,borderRadius:10,padding:"10px 12px",textAlign:"center"}}>
                    <div style={{fontSize:9,color:T.text3,textTransform:"uppercase",letterSpacing:.5,fontWeight:600,marginBottom:4}}>{c.label}</div>

                    </div>
                  </div>
                ))}
              </div>
            );
          })():(
            <div style={{padding:20,textAlign:"center",color:T.text3,fontSize:11}}>
              {incomeRiskMetrics.totalIncome===0?"No dividend income recorded yet.":"Not enough quarterly data (need at least 3 quarters)."}

  };
