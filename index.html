class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { hasError: false, error: null }; }
  static getDerivedStateFromError(error) { return { hasError: true, error }; }
  componentDidCatch(error, info) { console.error("React error boundary caught:", error, info); }
  render() {
    if (this.state.hasError) {
      return (
        <div style={{ padding: 20, color: "red", background: "#fff", fontFamily: "monospace" }}>
          <h2>Something went wrong.</h2>
          <pre>{this.state.error?.stack}</pre>
          <button onClick={() => window.location.reload()}>Reload</button>
        </div>
      );
    }
    return this.props.children;
  }
}

function ChartWaterfall({data,T,yFmt,height=240}){
  const ref=useRef(null);const inst=useRef(null);
  useEffect(()=>{
    if(!ref.current || typeof Chart==="undefined" || !data || data.length===0){
      if(inst.current){ inst.current.destroy(); inst.current=null; }
      return;
    }
    if(inst.current) inst.current.destroy();
    const labels=data.map(d=>d.label);
    let running=data.length>0?data[0].value:0;
    const bases=[],tops=[],bgColors=[],borderColors=[];
    const intermediateMins=[],intermediateMaxs=[];
    data.forEach(d=>{
      if(d.type==="pos"||d.type==="neg"){
        intermediateMins.push(Math.min(running,running+d.value));
        intermediateMaxs.push(Math.max(running,running+d.value));
      }
    });
    running=data.length>0?data[0].value:0;
    data.forEach(d=>{
      if(d.type==="start"){
        bases.push(0);tops.push(d.value);
        bgColors.push("#6366f177");borderColors.push("#6366f1");
      }else if(d.type==="total"){
        bases.push(0);tops.push(d.value);
        bgColors.push(d.value>=(data[0]?.value??0)?"#6366f1":"#ef4444");
        borderColors.push(d.value>=(data[0]?.value??0)?"#818cf8":"#f87171");
      }else if(d.type==="pos"){
        bases.push(running);tops.push(running+d.value);
        bgColors.push("#22c55e");borderColors.push("#4ade80");
        running+=d.value;
      }else{
        bases.push(running+d.value);tops.push(running);
        bgColors.push("#ef4444");borderColors.push("#f87171");
        running+=d.value;
      }
    });
    const floatData=bases.map((b,i)=>[Math.min(b,tops[i]),Math.max(b,tops[i])]);
    const allIntermediate=intermediateMins.concat(intermediateMaxs);
    const interMin=allIntermediate.length?Math.min(...allIntermediate):0;
    const interMax=allIntermediate.length?Math.max(...allIntermediate):0;
    const interRange=interMax-interMin;
    const startVal=data[0]?.value??0;
    const endVal=data[data.length-1]?.value??0;
    const bigVal=Math.max(startVal,endVal);
    const useCompressed=interRange>0&&interRange/bigVal<0.15&&bigVal>0;
    const yMin=useCompressed?Math.max(0,interMin-interRange*2):0;
    const yMax=useCompressed?Math.min(bigVal,interMax+interRange*2):bigVal*1.05;
    inst.current=new Chart(ref.current,{
      type:"bar",
      data:{labels,datasets:[{
        data:floatData,
        backgroundColor:bgColors,
        borderColor:borderColors,
        borderWidth:1.5,
        borderRadius:4,
        borderSkipped:false,
      }]},
      options:{
        responsive:true,maintainAspectRatio:false,
        plugins:{
          legend:{display:false},
          tooltip:{
            backgroundColor:T.bg3,borderColor:T.border,borderWidth:1,
            titleColor:T.text,bodyColor:T.text2,padding:10,cornerRadius:8,
            callbacks:{label:(ctx)=>{
              const d2=data[ctx.dataIndex];
              const v=d2.value;
              const sign=v>=0?"+":"";
              const pct=data[0]?.value?((v/Math.abs(data[0].value))*100).toFixed(1):0;
              return`${sign}${yFmt?yFmt(Math.abs(v)):"A$"+(Math.abs(v)/1000).toFixed(1)+"K"} (${sign}${pct}%)`;
            }},
          },
          annotation:useCompressed?{annotations:{
            breakTop:{type:"line",yMin:yMax,yMax:yMax,borderColor:T.border,borderWidth:1,borderDash:[4,4]},
            breakBot:{type:"line",yMin:yMin,yMax:yMin,borderColor:T.border,borderWidth:1,borderDash:[4,4]},
            note:{type:"label",xValue:0,yValue:yMax,content:"* Start/End bars compressed for scale",color:T.text3,font:{size:9}},
          }}:{},
        },
        scales:{
          x:{grid:{color:"transparent"},ticks:{color:T.chartTick,font:{size:10}},border:{color:T.border}},
          y:{
            grid:{color:T.chartGrid},
            ticks:{color:T.chartTick,font:{size:10},callback:yFmt||(v=>`A$${(v/1000).toFixed(0)}K`)},
            border:{color:T.border},
            ...(useCompressed?{min:yMin,max:yMax}:{}),
          },
        },
      }
    });
    return()=>{if(inst.current)inst.current.destroy();};
  },[data,T,yFmt]);
  const hasData = data && data.length>0;
  return (
    <div style={{height,position:"relative",background:T.bg3,borderRadius:8}}>
      {hasData ? <canvas ref={ref} style={{background:T.bg3}}/> : 
       <div style={{height:"100%",display:"flex",alignItems:"center",justifyContent:"center",color:T.text3,fontSize:12}}>No data for selected period</div>}
    </div>
  );
}

    const numYears = parseInt(lastYear) - parseInt(firstYear);

                  ].map(([l,v,c,ic,fullRow])=>(
                    <div key={l} style={{...card({padding:"14px 16px"}),gridColumn:fullRow&&isMob?"1 / -1":"auto"}}>
                      <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:6}}>
                        <span style={{fontSize:16}}>{ic}</span>
                        <span style={{fontSize:10,color:T.text3,letterSpacing:1,textTransform:"uppercase",fontWeight:600}}>{l}</span>
                      </div>
                      <div style={{fontFamily:"'Space Mono',monospace",fontSize:13,fontWeight:700,color:c,whiteSpace:"pre-line",lineHeight:1.6}}>{v}</div>
                    </div>
                  ));
                })()}
              </div>
              <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                <span style={{fontSize:11,color:T.text3,fontWeight:500}}>Time period:</span>
                <div style={{display:"flex",gap:3,background:T.bg3,padding:3,borderRadius:10,border:`1px solid ${T.border}`}}>
                  {["1M","3M","6M","YTD","1Y","5Y"].map(p=>(
                    <button key={p} onClick={()=>setChartPeriod(p)} style={{padding:"5px 12px",borderRadius:7,border:"none",background:chartPeriod===p?`linear-gradient(135deg,#22c55e,#06b6d4)`:"transparent",color:chartPeriod===p?"#fff":T.text3,fontSize:11,fontWeight:chartPeriod===p?700:500,transition:"all .15s",cursor:"pointer"}}>{p}</button>
                  ))}
                </div>
                <span style={{fontSize:10,color:T.text3,marginLeft:4}}>{chartData.labels.length} data points</span>
              </div>
              <div className="chart-row" style={{display:"flex",gap:12,flexWrap:isMob?"wrap":"nowrap"}}>
                <div style={{flex:"2 1 280px",...card({padding:16})}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
                    <div>
                      <div style={{fontSize:12,fontWeight:600,color:T.text,marginBottom:2}}>Portfolio Value Over Time</div>
                      <div style={{fontSize:11,color:T.text3}}>{displayCur} · {chartPeriod} view</div>
                    </div>
                    {chartData.labels.length>=2&&<div style={{textAlign:"right"}}>
                      <div style={{fontSize:10,color:T.text3}}>Period return</div>
                      <div style={{fontFamily:"'Space Mono',monospace",fontSize:12,fontWeight:700,color:pColor(chartData.endVal-chartData.startVal)}}>{fmtPct(chartData.startVal>0?(chartData.endVal-chartData.startVal)/chartData.startVal*100:0)}</div>
                    </div>}
                  </div>
                  <ChartLine labels={chartData.labels} datasets={[
                    {label:"Portfolio Value",data:chartData.vals,borderColor:dark?"#22c55e":"#16a34a",backgroundColor:dark?"rgba(34,197,94,.07)":"rgba(22,163,74,.06)",fill:true,borderWidth:2,yAxisID:"y"},
                    {label:"Cum. Dividends / Coupons",data:chartData.divCumul,borderColor:dark?"#06b6d4":"#0891b2",backgroundColor:"transparent",borderDash:[5,4],borderWidth:1.5,yAxisID:"y2"}
                  ]} T={T} yFmt={yFmtD} y2Fmt={yFmtD} height={isMob?170:230}/>
                </div>
                <div style={{flex:"1 1 200px",...card({padding:16})}}>
                  <div style={{fontSize:12,fontWeight:600,color:T.text,marginBottom:2}}>Asset Allocation</div>
                  <div style={{fontSize:11,color:T.text3,marginBottom:12}}>by type · {displayCur}</div>
                  <ChartDoughnut labels={chartData.tLabels} data={chartData.tVals} colors={chartData.palette} T={T} height={isMob?180:230}/>
                </div>
              </div>
              <div className="chart-row" style={{display:"flex",gap:12,flexWrap:isMob?"wrap":"nowrap"}}>
                <div style={{flex:"2 1 280px",...card({padding:16})}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
                    <div>
                      <div style={{fontSize:12,fontWeight:600,color:T.text,marginBottom:2}}>Monthly Income — Div &amp; Coupons</div>
                      <div style={{fontSize:11,color:T.text3}}>{chartData.mLabels.length} months · {chartPeriod} · {displayCur}</div>
                    </div>
                    {chartData.divCAGR!=null&&<div style={{textAlign:"right"}}>
                      <div style={{fontSize:9,color:T.text3,letterSpacing:.5,textTransform:"uppercase"}}>Dividend CAGR</div>
                      <div style={{fontFamily:"'Space Mono',monospace",fontSize:13,fontWeight:700,color:chartData.divCAGR>=0?T.green:T.red}}>{chartData.divCAGR>=0?"+":""}{chartData.divCAGR.toFixed(1)}%</div>
                      <div style={{fontSize:9,color:T.text3}}>{chartData.divCAGRYears}yr growth</div>
                    </div>}
                  </div>
                  <ChartBar labels={chartData.mLabels} datasets={chartData.mDatasets&&chartData.mDatasets.length?chartData.mDatasets:[{label:"Income",data:chartData.mVals,backgroundColor:dark?"rgba(6,182,212,.72)":"rgba(8,145,178,.6)",borderColor:dark?"#06b6d4":"#0891b2",borderWidth:1,borderRadius:5}]} T={T} yFmt={yFmtD} height={isMob?160:210} stacked={!!(chartData.mDatasets&&chartData.mDatasets.length>1)}/>
                </div>
                <div style={{flex:"1 1 200px",...card({padding:16})}}>
                  <div style={{fontSize:12,fontWeight:600,color:T.text,marginBottom:2}}>Currency Split</div>
                  <div style={{fontSize:11,color:T.text3,marginBottom:12}}>by holding currency · {displayCur}</div>
                  <ChartDoughnut labels={chartData.byCurLabels} data={chartData.byCurVals} colors={chartData.byCurColors} T={T} height={isMob?160:210}/>
                </div>
              </div>
              <div style={{...card({padding:16})}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12,flexWrap:"wrap",gap:8}}>
                  <div>
                    <div style={{fontSize:12,fontWeight:600,color:T.text,marginBottom:2}}>📊 Growth Contributors — {chartPeriod}</div>
                    <div style={{fontSize:11,color:T.text3}}>Breakdown of what drove your portfolio value change</div>
                  </div>
                  <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>
                    {[["Start / End","#6366f155"],["Capital Gain","#22c55e"],["Capital Loss","#ef4444"],["Top-Up (Buy)","#22c55e"],["Dividends","#22c55e"]].map(([l,c])=>(
                      <div key={l} style={{display:"flex",alignItems:"center",gap:4}}>
                        <div style={{width:10,height:10,borderRadius:2,background:c}}/>
                        <span style={{fontSize:10,color:T.text3}}>{l}</span>
                      </div>
                    ))}
                  </div>
                </div>
                <ChartWaterfall data={chartData.waterfallData} T={T} yFmt={yFmtD} height={isMob?220:270}/>
                {chartData.waterfallData.length>1&&(()=>{
                  const wf=chartData.waterfallData;
                  const capItem=wf.find(d=>d.label==="Capital Gain"||d.label==="Capital Loss");
                  const topUp=wf.find(d=>d.label==="Top-Ups");
                  const divItem=wf.find(d=>d.label==="Dividends");
                  const total=chartData.endVal-chartData.startVal;
                  const pct=(v)=>total!==0?(v/Math.abs(total)*100).toFixed(0)+"%":"—";
                  return(
                    <div style={{display:"flex",gap:8,marginTop:12,flexWrap:"wrap"}}>
                      {[
                        ["💹 Capital G/L",capItem?.value??0,capItem?.value>=0?"#22c55e":"#ef4444",pct(capItem?.value??0)],
                        ["💸 Top-Ups",topUp?.value??0,"#6366f1",pct(topUp?.value??0)],
                        ["🌱 Dividends",divItem?.value??0,T.teal,pct(divItem?.value??0)],
                      ].map(([l,v,c,p])=>(
                        <div key={l} style={{background:T.bg4,border:`1px solid ${T.border}`,borderRadius:8,padding:"8px 12px",flex:"1 1 100px",minWidth:100}}>
                          <div style={{fontSize:10,color:T.text3,marginBottom:3}}>{l}</div>
                          <div style={{fontFamily:"'Space Mono',monospace",fontSize:12,fontWeight:700,color:c}}>{FC(v,true)}</div>
                          <div style={{fontSize:10,color:T.text3,marginTop:1}}>{p} of change</div>
                        </div>
                      ))}
                    </div>
                  );
                })()}
              </div>
              <div style={{...card({padding:16})}}>
                <div style={{marginBottom:12}}>
                  <div style={{fontSize:12,fontWeight:600,color:T.text,marginBottom:2}}>📐 Benchmark Comparison — {chartPeriod}</div>
                  <div style={{fontSize:11,color:T.text3,marginBottom:10}}>Your portfolio vs selected benchmarks · % return from period start</div>
                  {(()=>{
                    const BM_DEF=[
                      {key:"sp500",   label:"S&P 500",       color:"#6366f1"},
                      {key:"brk",     label:"BRK-B",         color:"#f59e0b"},
                      {key:"jkse",    label:"IDX Composite", color:"#ef4444"},
                      {key:"eido",    label:"EIDO",          color:"#8b5cf6"},
                      {key:"vas",     label:"VAS",           color:"#06b6d4"},
                    ];
                    return(
                      <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:10}}>
                        {BM_DEF.map(({key,label,color})=>{
                          const on=bmVisible[key];
                          const hasData=benchmarks.series[key]?.some(v=>v!=null);
                          return(
                            <button key={key} onClick={()=>setBmVisible(v=>({...v,[key]:!v[key]}))}
                              style={{padding:"4px 10px",borderRadius:20,border:`1.5px solid ${color}`,
                                background:on?color:"transparent",color:on?"#fff":color,
                                fontSize:10,fontWeight:600,cursor:"pointer",opacity:hasData?1:0.4,
                                transition:"all .15s"}}>
                              {label}{!hasData?" ✗":""}
                            </button>
                          );
                        })}
                      </div>
                    );
                  })()}
                  {!fetchSt.lastUpdate&&<div style={{display:"flex",alignItems:"center",gap:6,background:T.bg4,border:`1px solid ${T.amber}44`,borderRadius:8,padding:"6px 12px",marginBottom:8}}>
                    <span style={{fontSize:11,color:T.amber}}>⚠️ Click <b>🔄 Live Prices</b> to load benchmark data</span>
                  </div>}
                </div>
                {chartData.bmLabels.length>1?(()=>{
                  const BM_DEF=[
                    {key:"sp500", label:"S&P 500",       color:"#6366f1", dash:[]},
                    {key:"brk",   label:"BRK-B",         color:"#f59e0b", dash:[4,3]},
                    {key:"jkse",  label:"IDX Composite", color:"#ef4444", dash:[2,2]},
                    {key:"eido",  label:"EIDO",          color:"#8b5cf6", dash:[6,2]},
                    {key:"vas",   label:"VAS (ASX)",     color:"#06b6d4", dash:[4,2]},
                  ];
                  const portPoints=chartData.bmPortfolio.filter(v=>v!=null).length;
                  const holdingPricesLoaded=Object.keys(benchmarks.holdingPrices||{}).length>0;
                  const datasets=[
                    {label:"Your Portfolio",data:chartData.bmPortfolio,borderColor:dark?"#22c55e":"#16a34a",backgroundColor:dark?"rgba(34,197,94,.07)":"rgba(22,163,74,.06)",fill:true,borderWidth:2.5,borderDash:[],spanGaps:false},
                    ...BM_DEF.filter(b=>bmVisible[b.key]).map(b=>({
                      label:b.label,data:chartData.bmSeries[b.key]||[],
                      borderColor:b.color,backgroundColor:"transparent",
                      borderWidth:2,borderDash:b.dash,spanGaps:false,
                    }))
                  ];
                  const lastPort=chartData.bmPortfolio.filter(v=>v!=null).slice(-1)[0]??0;
                  return(<>
                    {!holdingPricesLoaded&&<div style={{fontSize:10,color:T.amber,background:T.bg4,border:`1px solid ${T.amber}44`,borderRadius:6,padding:"6px 10px",marginBottom:8}}>
                      ⏳ Fetching historical prices for each holding… Click 🔄 if this doesn't appear.
                    </div>}
                    {holdingPricesLoaded&&portPoints<2&&<div style={{fontSize:10,color:T.amber,background:T.bg4,border:`1px solid ${T.amber}44`,borderRadius:6,padding:"6px 10px",marginBottom:8}}>
                      ⚠️ Not enough historical price data found for your holdings for this period.
                    </div>}
                    {holdingPricesLoaded&&portPoints>=2&&<div style={{fontSize:10,color:T.text3,background:T.bg4,border:`1px solid ${T.border}`,borderRadius:6,padding:"6px 10px",marginBottom:8}}>
                      ℹ️ Holdings without live price history (PBS032, PBS033, NUL5339AU, NUL7270AU) use current price as a flat approximation.
                    </div>}
                    <ChartLine labels={chartData.bmLabels} datasets={datasets}
                      T={T} yFmt={v=>`${v>=0?"+":""}${v.toFixed(1)}%`} height={isMob?220:280} spanGaps={false}/>
                    <div style={{display:"flex",gap:6,marginTop:12,flexWrap:"wrap"}}>
                      <div style={{background:T.bg4,border:"1.5px solid "+(dark?"#22c55e":"#16a34a"),borderRadius:8,padding:"8px 12px",flex:"1 1 80px"}}>
                        <div style={{fontSize:9,color:T.text3,marginBottom:2}}>Your Portfolio</div>
                        <div style={{fontFamily:"'Space Mono',monospace",fontSize:12,fontWeight:700,color:dark?"#22c55e":"#16a34a"}}>{lastPort>=0?"+":""}{lastPort.toFixed(2)}%</div>
                      </div>
                      {BM_DEF.filter(b=>bmVisible[b.key]&&(chartData.bmSeries[b.key]||[]).some(v=>v!=null)).map(b=>{
                        const last=(chartData.bmSeries[b.key]||[]).filter(v=>v!=null).slice(-1)[0]??0;
                        const diff=lastPort-last;
                        return(
                          <div key={b.key} style={{background:T.bg4,border:`1.5px solid ${b.color}`,borderRadius:8,padding:"8px 12px",flex:"1 1 80px"}}>
                            <div style={{fontSize:9,color:T.text3,marginBottom:2}}>{b.label}</div>
                            <div style={{fontFamily:"'Space Mono',monospace",fontSize:12,fontWeight:700,color:b.color}}>{last>=0?"+":""}{last.toFixed(2)}%</div>
                            <div style={{fontSize:9,color:diff>=0?T.green:T.red,marginTop:2}}>{diff>=0?"▲ ":"▼ "}{Math.abs(diff).toFixed(1)}% vs you</div>
                          </div>
                        );
                      })}
                    </div>
                  </>);
                })():(
                  <div style={{height:200,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:10,color:T.text3}}>
                    <div style={{fontSize:32,opacity:.3}}>📐</div>
                    <div style={{fontSize:13,fontWeight:500}}>Benchmark data not loaded yet</div>
                    <div style={{fontSize:11}}>Hit <b style={{color:T.text2}}>🔄 Live Prices</b> to fetch benchmark data</div>
                  </div>
                )}
              </div>
            </div>
          )}
        </main>

        {/* ─── Modals ────────────────────────────────────────────────────────── */}
        {modal && (
          <div onClick={closeModal} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.78)",backdropFilter:"blur(8px)",zIndex:100,display:"flex",alignItems:"center",justifyContent:"center",padding:12}}>
            <div onClick={e=>e.stopPropagation()} style={{background:T.bg2,border:`1px solid ${T.border}`,borderRadius:14,padding:22,width:"100%",maxWidth:modal?.mode==="import"?720:520,maxHeight:"92vh",overflowY:"auto",boxShadow:T.shadow}}>
              {modal.mode==="add" && ( ... ) /* unchanged */}
              {modal.mode==="trade" && ( ... ) /* unchanged */}
              {modal.mode==="dividend" && ( ... ) /* unchanged */}
              {modal.mode==="history" && ( ... ) /* unchanged */}
              {modal.mode==="price" && ( ... ) /* unchanged */}
              {modal.mode==="import" && ( ... ) /* unchanged */}
              {modal.mode==="firebaseSetup" && ( ... ) /* unchanged */}
            </div>
          </div>
        )}
        {editTx && ( ... ) /* unchanged */}
        {showPassiveModal && ( ... ) /* unchanged */}
      </div>
    </ErrorBoundary>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<!-- ✅ Babel transform with classic runtime -->
<script>
  (function() {
    const codeEl = document.getElementById('babel-script');
    if (!codeEl) return;
    const code = codeEl.textContent;
    try {
      const result = Babel.transform(code, {
        plugins: [['transform-react-jsx', { runtime: 'classic' }]],
        sourceType: 'script',
        compact: false,
      });
      eval(result.code);
    } catch (err) {
      console.error('Babel transform failed:', err);
      document.body.innerHTML = `<pre style="color:red;padding:20px;font-family:monospace;">${err.message}</pre>`;
    }
  })();
</script>
</body>
</html>
