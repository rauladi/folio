                <input style={inp()} placeholder={suggestYahoo(form.ticker||"",form.exchange||"",form.assetType||"")||"e.g. BHP.AX"} value={form.yahooSymbol||""} onChange={e=>setForm(f=>({...f,yahooSymbol:e.target.value}))}/>
              </div>
            )}
            <div className="modal-g3" style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:12}}>
              <div><label style={lbl()}>Quantity *</label><input style={inp()} type="number" placeholder="Units" value={form.qty||""} onChange={e=>setForm(f=>({...f,qty:e.target.value}))}/></div>
              <div><label style={lbl()}>Price ({form.currency||"AUD"}) *</label><input style={inp()} type="number" placeholder="Per unit" value={form.price||""} onChange={e=>setForm(f=>({...f,price:e.target.value}))}/></div>
              <div><label style={lbl()}>Date</label><input style={inp()} type="date" value={form.date||""} onChange={e=>setForm(f=>({...f,date:e.target.value}))}/></div>
            </div>
            {form.qty&&form.price&&<div style={{background:T.bg4,border:`1px solid ${T.border}`,borderRadius:8,padding:"9px 12px",fontSize:12,color:T.text2,marginBottom:12}}>
              Total: <strong style={{color:T.text}}>{form.currency==="IDR"?`Rp ${fmtIDR(+form.qty*+form.price)}`:form.currency==="USD"?`US$${(+form.qty*+form.price).toFixed(2)}`:`A$${(+form.qty*+form.price).toFixed(2)}`}</strong>
            </div>}
            <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}><button style={bO(T.text2)} onClick={closeModal}>Cancel</button><button style={bS(T.greenBtn,"#fff")} onClick={submitAdd}>Add Position</button></div>
          </>)}

          {/* BUY / SELL */}
          {modal.mode==="trade"&&(<>
            <h2 style={{fontFamily:"'Space Mono',monospace",fontSize:15,fontWeight:700,color:T.text,marginBottom:6}}>{modal.tradeType==="buy"?"Buy More —":"Sell —"} {modal.holding.ticker}</h2>
            <p style={{color:T.text3,fontSize:12,marginBottom:16}}>{modal.holding.name} · {modal.holding.assetType} · Held: {modal.holding.qty.toFixed(4)}</p>
            <div className="modal-g3" style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:12}}>
              {[["Quantity","qty","number","Units"],["Price ("+modal.holding.currency+")","price","number","Per unit"],["Date","date","date",""]].map(([l,k,t,ph])=>(
                <div key={k}><label style={lbl()}>{l}</label><input style={inp()} type={t} placeholder={ph} value={form[k]||""} onChange={e=>setForm(f=>({...f,[k]:e.target.value}))}/></div>
              ))}
            </div>
            {form.qty&&form.price&&<div style={{background:T.bg4,border:`1px solid ${T.border}`,borderRadius:8,padding:"9px 12px",fontSize:12,color:T.text2,marginBottom:12}}>
              Total: <strong style={{color:T.text}}>{modal.holding.currency==="IDR"?`Rp ${fmtIDR(+form.qty*+form.price)}`:modal.holding.currency==="USD"?`US$${(+form.qty*+form.price).toFixed(2)}`:`A$${(+form.qty*+form.price).toFixed(2)}`}</strong>
            </div>}
            <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}><button style={bO(T.text2)} onClick={closeModal}>Cancel</button><button style={bS(modal.tradeType==="buy"?T.greenBtn:T.redBtn,"#fff")} onClick={submitTrade}>Confirm {modal.tradeType==="buy"?"Purchase":"Sale"}</button></div>
          </>)}

          {/* DIVIDEND / COUPON */}
          {modal.mode==="dividend"&&(<>
            <h2 style={{fontFamily:"'Space Mono',monospace",fontSize:15,fontWeight:700,color:T.text,marginBottom:4}}>
              {modal.holding.isBondPct?"🏦 Record Coupon":"💰 Record Dividend"} — {modal.holding.ticker}
            </h2>
            <p style={{color:T.text3,fontSize:12,marginBottom:14}}>
              {modal.holding.name} · {modal.holding.currency}
              {modal.holding.isBondPct&&` · Face value: Rp ${fmtIDR(modal.holding.faceValue||1000000)}/unit`}
            </p>

            {/* Ex-dividend info banner */}
            <div style={{background:dark?"#0f1120":"#f8f9ff",border:`1px solid ${T.border2}`,borderRadius:10,padding:"10px 14px",marginBottom:14,fontSize:11,color:T.text2,lineHeight:1.6}}>
              <b style={{color:T.text}}>📅 Ex-Dividend Date tip:</b> If you bought shares <em>after</em> the ex-date, those shares do not qualify. Reduce the entitled units below accordingly. Total holding: <b style={{color:T.text,fontFamily:"'Space Mono',monospace"}}>{computeHolding(modal.holding,prices,prevPrices,rates).qty.toFixed(4)}</b> units.
            </div>

            <div className="modal-g3" style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:10}}>
              <div>
                <label style={lbl()}>{modal.holding.isBondPct?"Coupon / Unit":"Dividend / Unit"} ({modal.holding.currency})</label>
                <input style={inp()} type="number" placeholder={modal.holding.isBondPct?"e.g. 33750":"e.g. 1.25"}
                  value={form.amountPerShare||""} onChange={e=>setForm(f=>({...f,amountPerShare:e.target.value}))}/>
                {modal.holding.isBondPct&&<div style={{fontSize:9,color:T.text3,marginTop:3}}>Semi-annual coupon per unit</div>}
              </div>
              <div>
                <label style={lbl()}>Entitled Units</label>
                <input style={{...inp(),borderColor:form.entitledQty&&+form.entitledQty<computeHolding(modal.holding,prices,prevPrices,rates).qty?T.amber:T.border}}
                  type="number" placeholder="Units entitled to div"
                  value={form.entitledQty||""} onChange={e=>setForm(f=>({...f,entitledQty:e.target.value}))}/>
                <div style={{fontSize:9,marginTop:3,color:form.entitledQty&&+form.entitledQty<computeHolding(modal.holding,prices,prevPrices,rates).qty?T.amber:T.text3}}>
                  {form.entitledQty&&+form.entitledQty<computeHolding(modal.holding,prices,prevPrices,rates).qty
                    ?`⚠️ ${(computeHolding(modal.holding,prices,prevPrices,rates).qty-+form.entitledQty).toFixed(4)} units excluded (post ex-date)`
                    :"Defaults to full holding"}
                </div>
              </div>
              <div>
                <label style={lbl()}>Payment Date</label>
                <input style={inp()} type="date" value={form.date||""} onChange={e=>setForm(f=>({...f,date:e.target.value}))}/>
              </div>
            </div>

            {/* Live total preview */}
            {form.amountPerShare&&form.entitledQty&&(()=>{
              const total=+form.amountPerShare * +form.entitledQty;
              const cur=modal.holding.currency;
              const totalFmt=cur==="IDR"?`Rp ${fmtIDR(total)}`:cur==="USD"?`US$${total.toFixed(2)}`:`A$${total.toFixed(2)}`;
              const fullQty=computeHolding(modal.holding,prices,prevPrices,rates).qty;
              const isPartial=+form.entitledQty<fullQty;
              return(
                <div style={{background:dark?"#041824":"#e0f9f8",border:`1px solid ${T.teal}55`,borderRadius:8,padding:"10px 14px",marginBottom:14}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:6}}>
                    <div>
                      <span style={{fontSize:11,color:T.teal}}>Total {modal.holding.isBondPct?"coupon":"dividend"}: </span>
                      <strong style={{fontFamily:"'Space Mono',monospace",fontSize:14,color:T.teal}}>{totalFmt}</strong>
                    </div>
                    {isPartial&&(
                      <div style={{fontSize:10,color:T.amber,background:dark?"#1a1000":"#fffbeb",border:`1px solid ${T.amber}44`,borderRadius:6,padding:"3px 8px"}}>
                        ✂️ Partial — {form.entitledQty} of {fullQty.toFixed(4)} units
                      </div>
                    )}
                  </div>
                  <div style={{fontSize:10,color:T.text3,marginTop:4}}>
                    {form.amountPerShare} × {form.entitledQty} units = {totalFmt}
                  </div>
                </div>
              );
            })()}

            <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
              <button style={bO(T.text2)} onClick={closeModal}>Cancel</button>
              <button style={bS(T.tealBtn,"#fff")} onClick={submitDiv}
                disabled={!form.amountPerShare||!form.entitledQty}
                onMouseEnter={e=>e.currentTarget.style.opacity=".85"} onMouseLeave={e=>e.currentTarget.style.opacity="1"}>
                Record {modal.holding.isBondPct?"Coupon":"Dividend"}
              </button>
            </div>
          </>)}

          {/* MANUAL PRICE OVERRIDE */}
          {modal.mode==="price"&&(<>
            <h2 style={{fontFamily:"'Space Mono',monospace",fontSize:15,fontWeight:700,color:T.text,marginBottom:4}}>✏️ Manual Price Override</h2>
            <p style={{color:T.text3,fontSize:11,marginBottom:12}}>Override prices or edit Yahoo symbols. Auto-fetch skips holdings with no Yahoo symbol.</p>

            {/* Info boxes */}
            <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:16}}>
              <div style={{background:dark?"#040e18":"#f0f9ff",border:`1px solid ${T.teal}44`,borderRadius:10,padding:"9px 14px",fontSize:11,color:T.teal}}>
                <b>🏦 PBS032 / PBS033 (Sukuk Negara):</b> Auto-fetched from <b>DJPPR Kemenkeu</b> (Indonesian government bond portal). If the fetch fails, enter the IDR price per unit manually (e.g. Rp 1,010,000 = 101% of face value).
              </div>
              <div style={{background:dark?"#040e18":"#f0f9ff",border:`1px solid ${T.teal}44`,borderRadius:10,padding:"9px 14px",fontSize:11,color:T.teal}}>
                <b>📊 NUL7270AU:</b> Fetched from <b>Morningstar AU</b> (security ID 46182). &nbsp;<b>NUL5339AU:</b> Fetched from <b>FE fundinfo</b> (moneymanagement.com.au). If either fails, enter the AUD unit price manually.
              </div>
              <div style={{background:dark?"#14100a":"#fffbeb",border:`1px solid ${T.amber}44`,borderRadius:10,padding:"9px 14px",fontSize:11,color:T.amber}}>
                <b>📌 Gold (GC=F):</b> Fetches USD spot price from COMEX futures. Enter price in AUD manually if needed.
              </div>
            </div>

            <div style={{marginBottom:16}}>
              <label style={lbl()}>Display Currency</label>
              <select style={{...inp(),background:T.bg,width:"auto",minWidth:120}} value={form.displayCur||displayCur} onChange={e=>setForm(f=>({...f,displayCur:e.target.value}))}>{CURRENCIES.map(c=><option key={c}>{c}</option>)}</select>
            </div>
            {holdings.map(h=>(
              <div key={h.ticker} style={{marginBottom:16,paddingBottom:16,borderBottom:`1px solid ${T.border}`}}>
                <div style={{fontSize:11,color:T.text,fontWeight:700,fontFamily:"'Space Mono',monospace",marginBottom:8}}>
                  {h.ticker}
                  <span style={{fontFamily:"'Roboto',sans-serif",color:T.text3,fontWeight:400}}> — {h.name}</span>
                  {h.isBondPct&&<span style={{marginLeft:6,fontSize:9,background:dark?"#041020":"#e0f9ff",color:T.teal,padding:"2px 6px",borderRadius:4,border:`1px solid ${T.teal}44`}}>BOND</span>}
                  {!h.yahooSymbol&&<span style={{marginLeft:6,fontSize:9,background:dark?"#1a100a":"#fff7ed",color:T.amber,padding:"2px 6px",borderRadius:4,border:`1px solid ${T.amber}44`}}>✏️ Manual only</span>}
                  <span style={{marginLeft:6,fontSize:9,color:T.text3}}>({h.currency})</span>
                </div>
                <div className="modal-g3" style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
                  <div><label style={lbl()}>Current Price</label><input style={inp()} type="number" placeholder={String(prices[h.ticker]||"")} value={form["c_"+h.ticker]||""} onChange={e=>setForm(f=>({...f,["c_"+h.ticker]:e.target.value}))}/></div>
                  <div><label style={lbl()}>Prev Close</label><input style={inp()} type="number" placeholder={String(prevPrices[h.ticker]||"")} value={form["p_"+h.ticker]||""} onChange={e=>setForm(f=>({...f,["p_"+h.ticker]:e.target.value}))}/></div>
                  <div>
                    <label style={lbl()}>Yahoo Symbol</label>
                    <input style={{...inp(),fontFamily:"'Space Mono',monospace",fontSize:11}} placeholder={suggestYahoo(h.ticker,h.exchange,h.assetType)} value={form["ys_"+h.ticker]??h.yahooSymbol??""} onChange={e=>setForm(f=>({...f,["ys_"+h.ticker]:e.target.value}))}/>
                  </div>
                </div>
                {fetchSt.errors[h.ticker]&&<div style={{fontSize:10,color:T.amber,marginTop:4}}>⚠️ Last auto-fetch: {fetchSt.errors[h.ticker]}</div>}
              </div>
            ))}
            <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:4}}>
              <button style={bO(T.text2)} onClick={closeModal}>Cancel</button>
              <button style={bS(T.greenBtn,"#fff")} onClick={submitManualPrice}>💾 Save & Snapshot</button>
            </div>
          </>)}

          {/* HISTORY */}
          {modal.mode==="history"&&histH&&histC&&(<>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14,gap:10}}>
              <div>
                <h2 style={{fontFamily:"'Space Mono',monospace",fontSize:15,fontWeight:700,color:T.text,marginBottom:4}}>📋 Transaction History</h2>
                <p style={{fontSize:11,color:T.text3}}>{modal.holding.ticker} — {modal.holding.name}</p>
              </div>
            </div>
            <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap"}}>
              {[["Market Value",FC(histC.currentValue),T.text],["Total G/L",`${FG(histC.totalGain)} (${fmtPct(histC.gainPct)})`,pColor(histC.totalGain)],["Div/Coupons",FC(histC.totalDividends),T.teal]].map(([l,v,c])=>(
                <div key={l} style={{background:T.bg4,border:`1px solid ${T.border}`,borderRadius:8,padding:"7px 12px",flex:"1 1 100px"}}>

            <div style={{overflowX:"auto",borderRadius:8,border:`1px solid ${T.border}`}}>
              <table style={{width:"100%",borderCollapse:"collapse"}}>

                  <th key={c} style={{padding:"8px 10px",textAlign:"left",fontSize:8,letterSpacing:1.5,color:T.text3,textTransform:"uppercase",background:T.bg,borderBottom:`1px solid ${T.border}`,whiteSpace:"nowrap"}}>{c}</th>
                ))}</tr></thead>
                <tbody>
                  {[...histH.transactions].sort((a,b)=>new Date(b.date)-new Date(a.date)).map((tx,i)=>{
                    const tmap={buy:{l:"BUY",c:T.green,bg:dark?"#0d3d2833":"#dcfce7"},sell:{l:"SELL",c:T.red,bg:dark?"#3d0a0a33":"#fee2e2"},dividend:{l:histH.isBondPct?"COUPON":"DIV",c:T.teal,bg:dark?"#04182833":"#cffafe"}};
                    const t=tmap[tx.type]||tmap.buy;const cur=histH.currency;
                    const fL=(v)=>cur==="IDR"?`Rp ${fmtIDR(v)}`:cur==="USD"?`US$${v.toFixed(2)}`:`A$${v.toFixed(2)}`;
                    const units=tx.type==="dividend"
                      ?`${(tx.amountPerShare||0).toFixed(tx.amountPerShare>1?2:4)}/unit${tx.entitledQty!=null?` · ${tx.entitledQty} entitled`:""}`
                      :String(tx.qty||"—");
                    const price=fL(tx.type==="dividend"?(tx.amountPerShare||0):(tx.price||0));
                    const total=fL(tx.type==="dividend"?(tx.totalAmount||0):((tx.qty||0)*(tx.price||0)));
                    return(
                      <tr key={i} style={{background:i%2===0?T.bg3:T.bg2}}>
                        <td style={{padding:"8px 10px",fontFamily:"'Space Mono',monospace",fontSize:10,color:T.text2,borderBottom:`1px solid ${T.border}`,whiteSpace:"nowrap"}}>{fmtDate(tx.date)}</td>
                        <td style={{padding:"8px 10px",borderBottom:`1px solid ${T.border}`}}><span style={{padding:"2px 7px",borderRadius:4,background:t.bg,color:t.c,fontFamily:"'Space Mono',monospace",fontSize:9,fontWeight:700}}>{t.l}</span></td>
                        <td style={{padding:"8px 10px",fontFamily:"'Space Mono',monospace",fontSize:10,color:T.text2,borderBottom:`1px solid ${T.border}`}}>{units}</td>
                        <td style={{padding:"8px 10px",fontFamily:"'Space Mono',monospace",fontSize:10,color:T.text2,borderBottom:`1px solid ${T.border}`}}>{price}</td>
                        <td style={{padding:"8px 10px",fontFamily:"'Space Mono',monospace",fontSize:11,fontWeight:700,color:t.c,borderBottom:`1px solid ${T.border}`}}>{total}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:12}}>
              <span style={{fontSize:10,color:T.text3}}>{histH.transactions.length} transactions total</span>
              <button style={bO(T.text2)} onClick={closeModal}>Close</button>
            </div>
          </>)}

          {/* ── IMPORT ── */}
          {modal.mode==="import"&&(()=>{
            const IS=importSt;
            const valid=IS.parsed.filter(r=>!r._errors.length);
            const invalid=IS.parsed.filter(r=>r._errors.length);
            const tickers=[...new Set(valid.map(r=>r.ticker))];

            const dropZoneStyle={
              border:`2px dashed ${IS.dragOver?T.greenBtn:T.border2}`,
              borderRadius:12,padding:"32px 20px",textAlign:"center",
              background:IS.dragOver?(dark?"#0d2a18":"#f0fff4"):T.bg4,
              transition:"all .2s",cursor:"pointer",
            };

            return(<>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:4}}>
                <h2 style={{fontFamily:"'Space Mono',monospace",fontSize:15,fontWeight:700,color:T.text}}>📥 Import Transactions</h2>
                {IS.step==="preview"&&<span style={{fontSize:11,color:T.text3}}>{IS.fileName}</span>}
              </div>
              <p style={{fontSize:11,color:T.text3,marginBottom:16,lineHeight:1.6}}>
                Upload a CSV or Excel file with your buy, sell and dividend history. Download a template below to see the exact format.
              </p>

              {/* Template downloads */}
              <div style={{display:"flex",gap:8,marginBottom:18,flexWrap:"wrap"}}>
                <button onClick={downloadTemplateCSV}  style={{...bO(T.teal,{fontSize:11,padding:"6px 12px"})}}>⬇ Template CSV</button>
                <button onClick={downloadTemplateXLSX} style={{...bO(T.teal,{fontSize:11,padding:"6px 12px"})}}>⬇ Template Excel (.xlsx)</button>
                <span style={{fontSize:10,color:T.text3,alignSelf:"center",marginLeft:4}}>See "Field Reference" tab in Excel</span>
              </div>

              {/* Hidden file input — triggered by buttons/drop zone */}
              <input ref={importFileRef} type="file" accept=".csv,.xlsx,.xls,.ods,.txt"
                style={{display:"none"}}
                onChange={e=>{if(e.target.files[0])handleImportFile(e.target.files[0]);e.target.value="";}}/>

              {/* ── IDLE / DROP ZONE ── */}
              {(IS.step==="idle"||IS.step==="parsing")&&(
                <div style={dropZoneStyle}
                  onDragOver={e=>{e.preventDefault();setImportSt(s=>({...s,dragOver:true}));}}
                  onDragLeave={()=>setImportSt(s=>({...s,dragOver:false}))}
                  onDrop={e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f)handleImportFile(f);}}
                  onClick={()=>importFileRef.current&&importFileRef.current.click()}
                >
                  <div style={{fontSize:36,marginBottom:10,opacity:.5}}>📂</div>
                  <div style={{fontSize:14,fontWeight:600,color:T.text,marginBottom:4}}>
                    {IS.step==="parsing"?"⟳ Parsing file…":"Drag & drop your file here"}
                  </div>
                  <div style={{fontSize:12,color:T.text3,marginBottom:16}}>or click to browse · CSV, XLSX, XLS supported</div>
                  {IS.step!=="parsing"&&(
                    <button style={{...bS(T.greenBtn,"#fff",{fontSize:12,padding:"8px 20px"})}}
                      onClick={e=>{e.stopPropagation();importFileRef.current&&importFileRef.current.click();}}>
                      Choose File
                    </button>
                  )}
                </div>
              )}

              {/* ── ERROR ── */}
              {IS.step==="error"&&(
                <div style={{background:dark?"#2d0a0a":"#fee2e2",border:`1px solid ${T.redBtn}55`,borderRadius:10,padding:"14px 16px",color:T.red}}>
                  <div style={{fontWeight:700,marginBottom:4}}>Could not read file</div>
                  <div style={{fontSize:12}}>{IS.errorMsg}</div>
                  <button style={{...bO(T.red,{fontSize:11,marginTop:10})}} onClick={()=>setImportSt(s=>({...s,step:"idle"}))}>Try again</button>
                </div>
              )}

              {/* ── PREVIEW ── */}
              {IS.step==="preview"&&(
                <div>
                  {/* Detected column mapping */}
              {IS.fieldMap&&Object.keys(IS.fieldMap).length>0&&(
                <div style={{background:T.bg4,border:`1px solid ${T.border}`,borderRadius:10,padding:"10px 14px",marginBottom:14}}>
                  <div style={{fontSize:10,fontWeight:700,color:T.text2,letterSpacing:1.2,textTransform:"uppercase",marginBottom:7}}>Detected Column Mapping</div>
                  <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                    {Object.entries(IS.fieldMap).map(([field,col])=>(
                      <span key={field} style={{fontSize:10,background:T.bg2,border:`1px solid ${T.border2}`,borderRadius:5,padding:"2px 8px",color:T.text2}}>
                        <span style={{color:T.text3}}>{col}</span>
                        <span style={{color:T.border2,margin:"0 4px"}}>→</span>
                        <span style={{color:T.teal,fontWeight:600}}>{field}</span>
                      </span>
                    ))}
                  </div>
                  {!IS.fieldMap.ticker&&(
                    <div style={{marginTop:8,fontSize:11,color:T.amber}}>⚠️ No <b>ticker</b> column detected — rename your ticker column to exactly <code style={{background:T.bg3,padding:"1px 4px",borderRadius:3}}>ticker</code></div>
                  )}
                  {!IS.fieldMap.type&&(
                    <div style={{marginTop:4,fontSize:11,color:T.amber}}>⚠️ No <b>type</b> column detected — rename your transaction type column to <code style={{background:T.bg3,padding:"1px 4px",borderRadius:3}}>type</code> with values: buy, sell, dividend</div>
                  )}
                </div>
              )}

              {/* Summary pills */}
                  <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap"}}>
                    {[
                      [IS.parsed.length+" rows",T.text],
                      [valid.length+" valid",T.green],
                      ...(invalid.length?[[invalid.length+" errors",T.amber]]:[]),
                      [tickers.length+" tickers",T.teal],
                      [valid.filter(r=>r.type==="buy").length+" buys",T.text2],
                      [valid.filter(r=>r.type==="sell").length+" sells",T.text2],
                      [valid.filter(r=>r.type==="dividend").length+" dividends",T.teal],
                    ].map(([l,c])=>(
                      <span key={l} style={{fontSize:11,fontWeight:600,color:c,background:T.bg4,border:`1px solid ${T.border}`,borderRadius:6,padding:"3px 10px"}}>{l}</span>
                    ))}
                  </div>

                  {/* Merge mode */}
                  <div style={{display:"flex",alignItems:"center",gap:10,background:T.bg4,border:`1px solid ${T.border}`,borderRadius:10,padding:"10px 14px",marginBottom:14,flexWrap:"wrap"}}>
                    <span style={{fontSize:12,fontWeight:600,color:T.text}}>Import mode:</span>
                    {[["merge","Merge with existing"],["replace","Replace all data"]].map(([v,l])=>(
                      <button key={v} onClick={()=>setImportSt(s=>({...s,mergeMode:v}))}
                        style={{padding:"5px 14px",borderRadius:7,border:`1px solid ${IS.mergeMode===v?T.greenBtn:T.border}`,
                          background:IS.mergeMode===v?(dark?"#0a2e1e":"#dcfce7"):"transparent",
                          color:IS.mergeMode===v?T.greenBtn:T.text3,fontSize:12,fontWeight:IS.mergeMode===v?700:400}}>
                        {l}
                      </button>
                    ))}
                    <span style={{fontSize:10,color:IS.mergeMode==="replace"?T.amber:T.text3}}>
                      {IS.mergeMode==="merge"?"Adds new tickers, appends transactions to existing":"Clears ALL current portfolio data first"}
                    </span>
                  </div>

                  {/* Validation errors */}
                  {IS.errors.length>0&&(
                    <div style={{background:dark?"#1a1200":"#fffbeb",border:`1px solid ${T.amber}55`,borderRadius:10,padding:"10px 14px",marginBottom:14}}>
                      <div style={{fontSize:12,fontWeight:700,color:T.amber,marginBottom:6}}>{IS.errors.length} rows will be skipped</div>
                      <div style={{maxHeight:80,overflowY:"auto"}}>
                        {IS.errors.map(e=>(
                          <div key={e.rowNum} style={{fontSize:10,color:T.amber,marginBottom:2}}>
                            Row {e.rowNum}{e.ticker?" ["+e.ticker+"]":""}: {e.errs.join(" · ")}
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* Preview table */}
                  <div style={{overflowX:"auto",borderRadius:8,border:`1px solid ${T.border}`,marginBottom:14,maxHeight:260,overflowY:"auto"}}>
                    <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>
                      <thead style={{position:"sticky",top:0}}>
                        <tr>{["","Row","Ticker","Type","Date","Qty","Price","Ccy","Div/Unit","Entitled"].map(c=>(
                          <th key={c} style={{padding:"7px 10px",textAlign:"left",fontSize:8,letterSpacing:1.2,color:T.text3,textTransform:"uppercase",background:T.bg2,borderBottom:`1px solid ${T.border}`,whiteSpace:"nowrap"}}>{c}</th>
                        ))}</tr>
                      </thead>
                      <tbody>
                        {IS.parsed.map((r,i)=>{
                          const ok=!r._errors.length;
                          const bg=ok?(i%2===0?T.bg3:T.bg2):(dark?"#2a1500":"#fff7ed");
                          const typeColor=r.type==="buy"?T.green:r.type==="sell"?T.red:T.teal;
                          const typeBg=r.type==="buy"?(dark?"#0a2e1e":"#dcfce7"):r.type==="sell"?(dark?"#2d0a0a":"#fee2e2"):(dark?"#041824":"#cffafe");
                          return(
                            <tr key={i} style={{background:bg}}>
                              <td style={{padding:"6px 8px",borderBottom:`1px solid ${T.border}`}}>{ok?"✅":"⚠️"}</td>
                              <td style={{padding:"6px 8px",color:T.text3,fontSize:9,borderBottom:`1px solid ${T.border}`}}>{r._rowNum}</td>
                              <td style={{padding:"6px 8px",fontFamily:"'Space Mono',monospace",fontWeight:700,color:T.text,borderBottom:`1px solid ${T.border}`}}>{r.ticker}</td>
                              <td style={{padding:"6px 8px",borderBottom:`1px solid ${T.border}`}}>
                                {r.type&&<span style={{padding:"1px 6px",borderRadius:4,fontSize:9,fontWeight:700,background:typeBg,color:typeColor}}>{r.type.toUpperCase()}</span>}
                              </td>
                              <td style={{padding:"6px 8px",color:T.text2,borderBottom:`1px solid ${T.border}`,whiteSpace:"nowrap"}}>{r.date}</td>
                              <td style={{padding:"6px 8px",fontFamily:"'Space Mono',monospace",color:T.text2,borderBottom:`1px solid ${T.border}`}}>{r.qty||"—"}</td>
                              <td style={{padding:"6px 8px",fontFamily:"'Space Mono',monospace",color:T.text2,borderBottom:`1px solid ${T.border}`}}>{r.price||"—"}</td>
                              <td style={{padding:"6px 8px",color:T.text3,borderBottom:`1px solid ${T.border}`}}>{r.currency}</td>
                              <td style={{padding:"6px 8px",fontFamily:"'Space Mono',monospace",color:T.teal,borderBottom:`1px solid ${T.border}`}}>{r.amountPerShare||"—"}</td>
                              <td style={{padding:"6px 8px",color:T.text2,borderBottom:`1px solid ${T.border}`}}>{r.entitledQty||"—"}</td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>

                  {valid.length===0&&(
                    <div style={{textAlign:"center",padding:"8px 0",color:T.red,fontSize:12,marginBottom:12}}>No valid rows found. Fix the errors and re-upload.</div>
                  )}

                  <div style={{display:"flex",gap:8,justifyContent:"space-between",alignItems:"center",flexWrap:"wrap"}}>
                    <button style={bO(T.text2,{fontSize:11})} onClick={()=>setImportSt(s=>({...s,step:"idle",parsed:[],rows:[],errors:[]}))}>Upload different file</button>
                    <div style={{display:"flex",gap:8}}>
                      <button style={bO(T.text2)} onClick={closeModal}>Cancel</button>
                      <button style={{...bS(T.greenBtn,"#fff"),opacity:valid.length?1:.4,cursor:valid.length?"pointer":"not-allowed"}}
                        disabled={!valid.length} onClick={confirmImport}>
                        Import {valid.length} rows {IS.mergeMode==="replace"?"(replace all)":"(merge)"}
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* ── DONE ── */}
              {IS.step==="done"&&(
                <div style={{textAlign:"center",padding:"24px 0"}}>
                  <div style={{fontSize:48,marginBottom:12}}>🎉</div>
                  <div style={{fontSize:18,fontWeight:700,color:T.green,marginBottom:8}}>Import complete!</div>
                  <div style={{fontSize:13,color:T.text2,marginBottom:8}}>{IS.importedCount} transactions imported.</div>
                  <div style={{fontSize:11,color:T.text3,marginBottom:24}}>Click the 🔄 Live Prices button to fetch current prices for new holdings.</div>
                  <button style={bS(T.greenBtn,"#fff",{padding:"9px 28px",fontSize:13})} onClick={closeModal}>Done</button>
                </div>
              )}
            </>);
          })()}

          {/* ── Firebase Setup Modal ── */}
          {modal.mode==="firebaseSetup"&&(()=>{
            const [cfg,setCfg]=React.useState({
              apiKey:"",authDomain:"",projectId:"",storageBucket:"",messagingSenderId:"",appId:""
            });
            const fields=[
              ["apiKey","API Key","AIzaSy..."],
              ["authDomain","Auth Domain","your-project.firebaseapp.com"],
              ["projectId","Project ID","your-project-id"],
              ["storageBucket","Storage Bucket","your-project.appspot.com"],
              ["messagingSenderId","Messaging Sender ID","123456789"],
              ["appId","App ID","1:123456789:web:abc123"],
            ];
            return(
              <div style={{maxWidth:500,width:"100%",...card({padding:24})}}>
                <h2 style={{fontFamily:"'Space Mono',monospace",fontSize:15,fontWeight:700,color:T.text,marginBottom:4}}>☁️ Set Up Cloud Sync</h2>
                <p style={{fontSize:11,color:T.text3,marginBottom:16,lineHeight:1.6}}>
                  Enter your Firebase project credentials below. These are saved only in your browser's localStorage — never sent anywhere except Firebase itself.
                </p>
                <div style={{background:T.bg4,border:`1px solid ${T.border}`,borderRadius:8,padding:12,marginBottom:16,fontSize:11,color:T.text2,lineHeight:1.7}}>
                  <b style={{color:T.teal}}>Don't have a Firebase project yet?</b><br/>
                  1. Go to <b>console.firebase.google.com</b><br/>
                  2. Click <b>Add project</b> → name it (e.g. "folio-sync") → Continue<br/>
                  3. Go to <b>Project Settings</b> (⚙️) → <b>Your apps</b> → click <b>&lt;/&gt;</b> (web)<br/>
                  4. Register app → copy the config values below<br/>
                  5. In Firebase console → <b>Authentication</b> → Sign-in method → enable <b>Google</b><br/>
                  6. In Firebase console → <b>Firestore Database</b> → Create database → Start in test mode
                </div>
                <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:16}}>
                  {fields.map(([key,label,ph])=>(
                    <div key={key}>
                      <label style={{fontSize:10,color:T.text3,letterSpacing:1,textTransform:"uppercase"}}>{label}</label>
                      <input style={{...inp(),marginTop:2}} placeholder={ph} value={cfg[key]}
                        onChange={e=>setCfg(c=>({...c,[key]:e.target.value}))}/>
                    </div>
                  ))}
                </div>
                <div style={{fontSize:10,color:T.amber,marginBottom:12}}>
                  ⚠️ After saving, you need to <b>reload the page</b> for Firebase to initialise.
                </div>
                <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
                  <button style={bO(T.text2)} onClick={closeModal}>Cancel</button>
                  <button style={bS(T.teal,"#fff")} onClick={()=>{
                    // Save config to localStorage — user will reload page
                    try{
                      localStorage.setItem("f6_fbcfg",JSON.stringify(cfg));
                      // Inject config into page by rewriting and reloading
                      const src=document.documentElement.outerHTML;
                      const updated=src
                        .replace(/"YOUR_API_KEY"/,`"${cfg.apiKey}"`)
                        .replace(/"YOUR_PROJECT_ID\.firebaseapp\.com"/,`"${cfg.authDomain}"`)
                        .replace(/("YOUR_PROJECT_ID")/g,`"${cfg.projectId}"`)
                        .replace(/"YOUR_PROJECT_ID\.appspot\.com"/,`"${cfg.storageBucket}"`)
                        .replace(/"YOUR_MESSAGING_SENDER_ID"/,`"${cfg.messagingSenderId}"`)
                        .replace(/"YOUR_APP_ID"/,`"${cfg.appId}"`);
                      const blob=new Blob([updated],{type:"text/html"});
                      const a=document.createElement("a");
                      a.href=URL.createObjectURL(blob);
                      a.download="folio-dashboard.html";
                      a.click();
                      alert("✅ New file downloaded with your Firebase config!\n\nOpen the downloaded file — cloud sync will be ready.");
                      closeModal();
                    }catch(e){alert("Error: "+e.message);}
                  }}>💾 Save & Download</button>
                </div>
              </div>
            );
          })()}

        </div>
      </div>
    )}
  </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
