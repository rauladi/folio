                                                            onClick={() => setWhatIf(w => ({ ...w, adjustments: { ...w.adjustments, [h.ticker]: Math.min(1.5, factor + 0.05) } }))}>+</button>
                                                        <span className="diff-label" style={{ fontSize: 9,
                                                                minWidth: 34, textAlign: "right",
                                                                color: pct > 100 ? T.green : pct < 100 ?
                                                                T.red : T.text3, fontWeight: 600,
                                                                flexShrink: 0 }}>
                                                            {pct > 100 ? `+${pct-100}%` : pct < 100 ? `${pct-100}%` : '0%'}
                                                        </span>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                    <div style={{ display: "flex", gap: 4, marginTop: 5 }}>
                                        <button onClick={() => setWhatIf(w => ({ ...w, adjustments: {} }))} style={bO(T
                                            .text2, { fontSize: 9, padding: "2px 8px" })}>Reset</button>
                                    </div>
                                </div>
                            </div>

                            {/* Right: Chart + Treemap stacked */}
                            <div className="whatif-right" style={{ flex: 1, minWidth: 0, display: "flex",
                                    flexDirection: "column", gap: 12, minHeight: isMob ? 'auto' : 420 }}>
                                {/* Chart block */}
                                <div className="chart-block" style={{ flex: "1 1 40%", minHeight: chartHeight,
                                        display: "flex", flexDirection: "column" }}>
                                    <div style={{ ...card({ padding: 10 }), flex: 1, display: "flex",
                                            flexDirection: "column" }}>
                                        <div style={{ fontSize: 11, fontWeight: 600, color: T.text, marginBottom: 2 }}>
                                            Dividend Income Projection
                                        </div>
                                        <div style={{ flex: 1 }}>
                                            <ChartLine labels={chartLabels} datasets={divDatasets} T={T} yFmt={yFmtD}
                                                height={chartHeight} />
                                        </div>
                                    </div>
                                </div>

                                {/* Treemap block */}
                                <div className="treemap-block" style={{ flex: "1 1 60%", minHeight: treemapHeight,
                                        display: "flex", flexDirection: "column" }}>
                                    <div style={{ ...card({ padding: 10 }), flex: 1, display: "flex",
                                            flexDirection: "column", height: "100%" }}>
                                        <div style={{ fontSize: 11, fontWeight: 600, color: T.text, marginBottom: 2 }}>
                                            Adjusted Allocation
                                        </div>
                                        <div className="treemap-container" ref={whatIfTmRef} style={{ flex: 1,
                                                width: "100%", minHeight: treemapHeight, position: "relative",
                                                borderRadius: 10, overflow: "hidden", border: "1px solid " + T.border,
                                                background: T.bg3 }}>
                                            {whatIfRects.map(r => {
                                                const c = getPerformanceColor(r.gainPct || 0, dark);
                                                const minDim = Math.min(r.w, r.h);
                                                const fontSize = Math.max(8, Math.min(14, minDim / 6));
                                                return (
                                                    <div key={r.ticker} style={{ position: "absolute", left: r.x,
                                                            top: r.y, width: r.w, height: r.h,
                                                            background: c.bg, border: "1px solid " + c
                                                            .border, display: "flex", flexDirection: "column",
                                                            alignItems: "center", justifyContent: "center",
                                                            fontSize: fontSize, fontWeight: 700, color: c
                                                            .text, padding: 2, textAlign: "center",
                                                            overflow: "hidden" }}>
                                                        <span style={{ fontSize: fontSize, fontWeight: 700 }}>{r
                                                            .ticker}</span>
                                                        <span style={{ fontSize: fontSize * 0.8, opacity: 0.9 }}>{FC(
                                                                r.adjustedValue, true)}</span>
                                                        <span style={{ fontSize: fontSize * 0.7, opacity: 0.7 }}>{fmtPct(
                                                                r.gainPct || 0)}</span>
                                                    </div>
                                                );
                                            })}
                                            {whatIfRects.length === 0 && <div style={{ position: "absolute",
                                                    inset: 0, display: "flex", alignItems: "center",
                                                    justifyContent: "center", color: T.text3,
                                                fontSize: 11 }}>No holdings</div>}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Bottom: KPIs and Scenarios */}
                        <div style={{ display: "grid", gridTemplateColumns: isMob ? "1fr 1fr" : "1fr 1fr 1fr 1fr",
                                gap: 6 }}>
                            <div style={card({ padding: 8, textAlign: "center" })}>
                                <div style={{ fontSize: 7, color: T.text3, textTransform: "uppercase", fontWeight: 600 }}>Proj. Annual Div</div>
                                <div style={{ fontSize: 14, fontWeight: 700, color: T.text, fontFamily: "'Space Mono',monospace" }}>{FC(adjustedDivs, true)}</div>
                                <div style={{ fontSize: 8, color: T.text3 }}>→ {FC(finalDiv, true)} in {whatIf.simulationYears}y</div>
                            </div>
                            <div style={card({ padding: 8, textAlign: "center" })}>
                                <div style={{ fontSize: 7, color: T.text3, textTransform: "uppercase", fontWeight: 600 }}>Yield (div‑paying)</div>
                                <div style={{ fontSize: 14, fontWeight: 700, color: T.text, fontFamily: "'Space Mono',monospace" }}>{currentYield.toFixed(2)}%</div>
                                <div style={{ fontSize: 8, color: T.text3 }}>{whatIf.reinvestRatio}% reinvested</div>
                            </div>
                            <div style={card({ padding: 8, textAlign: "center" })}>
                                <div style={{ fontSize: 7, color: T.text3, textTransform: "uppercase", fontWeight: 600 }}>Reinvested Income</div>
                                <div style={{ fontSize: 14, fontWeight: 700, color: T.teal, fontFamily: "'Space Mono',monospace" }}>{FC(projectedReinvested.reduce((a, b) => a + b, 0) / whatIf.simulationYears, true)}</div>
                                <div style={{ fontSize: 8, color: T.text3 }}>avg per year</div>
                            </div>
                            <div style={card({ padding: 8, textAlign: "center" })}>
                                <div style={{ fontSize: 7, color: T.text3, textTransform: "uppercase", fontWeight: 600 }}>Risk Concentration</div>
                                <div style={{ fontSize: 14, fontWeight: 700, color: riskConcentration > 30 ? T.red :
                                        riskConcentration > 20 ? T.amber : T.green, fontFamily: "'Space Mono',monospace" }}>{riskConcentration.toFixed(1)}%</div>
                                <div style={{ fontSize: 8, color: T.text3 }}>top holding</div>
                            </div>
                        </div>

                        {/* Scenarios */}
                        <div style={card({ padding: 10 })}>
                            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center",
                                    marginBottom: 4, flexWrap: "wrap", gap: 3 }}>
                                <div>
                                    <div style={{ fontSize: 10, fontWeight: 600, color: T.text }}>📊 Scenarios</div>
                                    <div style={{ fontSize: 8, color: T.text3 }}>Save and compare</div>
                                </div>
                                <div style={{ display: "flex", gap: 3 }}>
                                    <input style={{ ...inp(), padding: "4px 8px", fontSize: 10, width: 120 }}
                                        placeholder="Name" value={whatIf.scenarioName || ""}
                                        onChange={e => setWhatIf(w => ({ ...w, scenarioName: e.target.value }))} />
                                    <button onClick={() => {
                                            if (!whatIf.scenarioName) return;
                                            const newScenario = {
                                                id: Date.now(),
                                                name: whatIf.scenarioName,
                                                growthRate: whatIf.growthRate,
                                                reinvestRatio: whatIf.reinvestRatio,
                                                fxRate: whatIf.fxRate,
                                                adjustments: whatIf.adjustments,
                                                simulationYears: whatIf.simulationYears,
                                                result: simulationResult,
                                            };
                                            setWhatIf(w => ({ ...w, scenarios: [...w.scenarios, newScenario],
                                                scenarioName: "" }));
                                        }} style={bS(T.greenBtn, "#fff", { fontSize: 9, padding: "3px 10px" })}>Save</button>
                                </div>
                            </div>
                            {whatIf.scenarios.length > 0 && (
                                <div style={{ display: "grid", gridTemplateColumns: isMob ? "1fr" : "1fr 1fr 1fr",
                                        gap: 4 }}>
                                    {whatIf.scenarios.slice().reverse().map(s => (
                                        <div key={s.id} className="scenario-card" style={{ border: "1px solid " + T.border,
                                                borderRadius: 5, padding: "6px 8px", background: T.bg3 }}>
                                            <div style={{ display: "flex", justifyContent: "space-between",
                                                    alignItems: "center" }}>
                                                <span style={{ fontWeight: 700, fontSize: 10, color: T.text }}>{s
                                                    .name}</span>
                                                <button onClick={() => {
                                                        setWhatIf(w => ({ ...w, scenarios: w.scenarios
                                                                .filter(sc => sc.id !== s.id) }));
                                                    }} style={{ background: "transparent", border: "none",
                                                        color: T.red, cursor: "pointer", fontSize: 9 }}>✕</button>
                                            </div>
                                            <div style={{ fontSize: 7, color: T.text3 }}>
                                                Yield: {s.result.currentYield.toFixed(1)}% · CAGR: {s.result.cagr
                                                    .toFixed(1)}% · Risk: {s.result.riskConcentration.toFixed(0)}%
                                            </div>
                                            <button onClick={() => {
                                                    setWhatIf(w => ({
                                                        ...w,
                                                        growthRate: s.growthRate,
                                                        reinvestRatio: s.reinvestRatio,
                                                        fxRate: s.fxRate,
                                                        adjustments: s.adjustments,
                                                        simulationYears: s.simulationYears,
                                                        activeScenario: s.id,
                                                    }));
                                                }} style={bO(T.teal, { fontSize: 8, padding: "1px 6px",
                                                    marginTop: 3 })}>Load</button>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            const renderImportModal = () => {
                const IS = importSt;
                const valid = IS.parsed.filter(r => !r._errors.length);
                const invalid = IS.parsed.filter(r => r._errors.length);
                const tickers = [...new Set(valid.map(r => r.ticker))];
                const dropZoneStyle = { border: "2px dashed " + (IS.dragOver ? T.greenBtn : T.border2), borderRadius: 12,
                    padding: "32px 20px", textAlign: "center", background: IS.dragOver ? (dark ? "#1e2a1e" :
                        "#e8f5e9") : T.bg4, transition: "all .2s", cursor: "pointer" };
                return (
                    <div>
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start",
                                marginBottom: 4 }}><h2 style={{ fontFamily: "'Space Mono',monospace", fontSize: 15,
                                    fontWeight: 700, color: T.text }}>📥 Import Transactions</h2>{IS.step ===
                                "preview" && <span style={{ fontSize: 11, color: T.text3 }}>{IS.fileName}</span>}</div>
                        <p style={{ fontSize: 11, color: T.text3, marginBottom: 16, lineHeight: 1.6 }}>Upload a CSV or
                            Excel file with your buy, sell and dividend history. Download a template below to see the
                            exact format.</p>
                        <div style={{ display: "flex", gap: 8, marginBottom: 18, flexWrap: "wrap" }}><button onClick={
                                downloadTemplateCSV} style={{ ...bO(T.teal, { fontSize: 11, padding: "6px 12px" }) }}>⬇
                                Template CSV</button><button onClick={downloadTemplateXLSX} style={{ ...bO(T.teal, {
                                    fontSize: 11, padding: "6px 12px" }) }}>⬇ Template Excel (.xlsx)</button><span
                                style={{ fontSize: 10, color: T.text3, alignSelf: "center", marginLeft: 4 }}>See "Field
                                Reference" tab in Excel</span></div>
                        <input ref={importFileRef} type="file" accept=".csv,.xlsx,.xls,.ods,.txt" style={{ display: "none" }}
                            onChange={e => { if (e.target.files[0]) handleImportFile(e.target.files[0]);
                                e.target.value = ""; }} />
                        {(IS.step === "idle" || IS.step === "parsing") && (<div style={dropZoneStyle} onDragOver={e => {
                                    e.preventDefault();
                                    setImportSt(s => ({ ...s, dragOver: true })); }}
                                onDragLeave={() => setImportSt(s => ({ ...s, dragOver: false }))} onDrop={e => {
                                    e.preventDefault();
                                    const f = e.dataTransfer.files[0];
                                    if (f) handleImportFile(f);
                                }} onClick={() => importFileRef.current && importFileRef.current.click()}><div style={{
                                        fontSize: 36, marginBottom: 10, opacity: .5 }}>📂</div><div style={{
                                        fontSize: 14, fontWeight: 600, color: T.text, marginBottom: 4 }}>{IS
                                        .step === "parsing" ? "⟳ Parsing file…" : "Drag & drop your file here"}</div><div
                                    style={{ fontSize: 12, color: T.text3, marginBottom: 16 }}>or click to browse · CSV,
                                    XLSX, XLS supported</div>{IS.step !== "parsing" && (<button style={{ ...bS(
                                        T.greenBtn, "#fff", { fontSize: 12, padding: "8px 20px" }) }} onClick={e => {
                                        e.stopPropagation();
                                        importFileRef.current && importFileRef.current.click();
                                    }}>Choose File</button>)}</div>)}
                        {IS.step === "error" && (<div style={{ background: dark ? "#2d0a0a" : "#fee2e2",
                                    border: "1px solid " + T.redBtn + "55", borderRadius: 10, padding: "14px 16px",
                                    color: T.red }}><div style={{ fontWeight: 700, marginBottom: 4 }}>Could not read
                                    file</div><div style={{ fontSize: 12 }}>{IS.errorMsg}</div><button style={{ ...bO(
                                        T.red, { fontSize: 11, marginTop: 10 }) }} onClick={() => setImportSt(s =>
                                        ({ ...s, step: "idle" }))}>Try again</button></div>)}
                        {IS.step === "preview" && (<div>{IS.fieldMap && Object.keys(IS.fieldMap).length > 0 && (<div
                                    style={{ background: T.bg4, border: "1px solid " + T.border, borderRadius: 10,
                                        padding: "10px 14px", marginBottom: 14 }}><div style={{ fontSize: 10,
                                            fontWeight: 700, color: T.text2, letterSpacing: 1.2,
                                            textTransform: "uppercase", marginBottom: 7 }}>Detected Column
                                        Mapping</div><div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>{Object
                                            .entries(IS.fieldMap).map(([field, col]) => (<span key={field}
                                                style={{ fontSize: 10, background: T.bg2,
                                                    border: "1px solid " + T.border2, borderRadius: 5,
                                                    padding: "2px 8px", color: T.text2 }}><span style={{
                                                        color: T.text3 }}>{col}</span><span style={{
                                                        color: T.border2, margin: "0 4px" }}>→</span><span
                                                    style={{ color: T.teal, fontWeight: 600 }}>{field}</span></span>))}</div>{!IS
                                        .fieldMap.ticker && (<div style={{ marginTop: 8, fontSize: 11, color: T
                                                    .amber }}>⚠️ No <b>ticker</b> column detected — rename your
                                            ticker column to exactly <code style={{ background: T.bg3,
                                                    padding: "1px 4px", borderRadius: 3 }}>ticker</code></div>)}{!IS
                                        .fieldMap.type && (<div style={{ marginTop: 4, fontSize: 11, color: T
                                                    .amber }}>⚠️ No <b>type</b> column detected — rename your
                                            transaction type column to <code style={{ background: T.bg3,
                                                    padding: "1px 4px", borderRadius: 3 }}>type</code> with values:
                                            buy, sell, dividend</div>)}</div>)}<div style={{ display: "flex", gap: 8,
                                        marginBottom: 14, flexWrap: "wrap" }}>{[
                                        [IS.parsed.length + " rows", T.text],
                                        [valid.length + " valid", T.green],
                                        ...(invalid.length ? [[invalid.length + " errors", T.amber]] : []),
                                        [tickers.length + " tickers", T.teal],
                                        [valid.filter(r => r.type === "buy").length + " buys", T.text2],
                                        [valid.filter(r => r.type === "sell").length + " sells", T.text2],
                                        [valid.filter(r => r.type === "dividend").length + " dividends", T.teal],
                                    ].map(([l, c]) => (<span key={l} style={{ fontSize: 11, fontWeight: 600,
                                            color: c, background: T.bg4, border: "1px solid " + T.border,
                                            borderRadius: 6, padding: "3px 10px" }}>{l}</span>))}</div><div
                                        style={{ display: "flex", alignItems: "center", gap: 10, background: T.bg4,
                                            border: "1px solid " + T.border, borderRadius: 10, padding: "10px 14px",
                                            marginBottom: 14, flexWrap: "wrap" }}><span style={{ fontSize: 12,
                                                fontWeight: 600, color: T.text }}>Import mode:</span>{[
                                            ["merge", "Merge with existing"],
                                            ["replace", "Replace all data"]
                                        ].map(([v, l]) => (<button key={v} onClick={() => setImportSt(s => ({ ...s,
                                                    mergeMode: v }))} style={{ padding: "5px 14px", borderRadius: 7,
                                                border: "1px solid " + (IS.mergeMode === v ? T.greenBtn : T.border),
                                                background: IS.mergeMode === v ? (dark ? "#0a2e1e" : "#dcfce7") :
                                                    "transparent", color: IS.mergeMode === v ? T.greenBtn : T
                                                    .text3, fontSize: 12, fontWeight: IS.mergeMode === v ? 700 :
                                                    400 }}>{l}</button>))}<span style={{ fontSize: 10, color: IS
                                                .mergeMode === "replace" ? T.amber : T.text3 }}>{IS.mergeMode ===
                                                "merge" ? "Adds new tickers, appends transactions to existing" :
                                                "Clears ALL current portfolio data first"}</span></div>{IS.errors
                                        .length > 0 && (<div style={{ background: dark ? "#1a1200" : "#fffbeb",
                                                border: "1px solid " + T.amber + "55", borderRadius: 10,
                                                padding: "10px 14px", marginBottom: 14 }}><div style={{
                                                    fontSize: 12, fontWeight: 700, color: T.amber,
                                                marginBottom: 6 }}>{IS.errors.length} rows will be skipped</div><div
                                                style={{ maxHeight: 80, overflowY: "auto" }}>{IS.errors.map(e => (
                                                    <div key={e.rowNum} style={{ fontSize: 10, color: T.amber,
                                                            marginBottom: 2 }}>Row {e.rowNum}{e.ticker ? " [" + e
                                                            .ticker + "]" : ""}: {e.errs.join(" · ")}</div>))}</div></div>)}<div
                                        style={{ overflowX: "auto", borderRadius: 8, border: "1px solid " + T.border,
                                            marginBottom: 14, maxHeight: 260, overflowY: "auto" }}><table
                                            style={{ width: "100%", borderCollapse: "collapse", fontSize: 11 }}><thead
                                                style={{ position: "sticky", top: 0 }}><tr>{[
                                                    "",
                                                    "Row",
                                                    "Ticker",
                                                    "Type",
                                                    "Date",
                                                    "Qty",
                                                    "Price",
                                                    "Ccy",
                                                    "Div/Unit",
                                                    "Entitled"
                                                ].map(c => (<th key={c} style={{ padding: "7px 10px",
                                                        textAlign: "left", fontSize: 8, letterSpacing: 1.2,
                                                        color: T.text3, textTransform: "uppercase",
                                                        background: T.bg2, borderBottom: "1px solid " + T.border,
                                                        whiteSpace: "nowrap" }}>{c}</th>))}</tr></thead><tbody>{IS
                                                    .parsed.map((r, i) => {
                                                        const ok = !r._errors.length;
                                                        const bg = ok ? (i % 2 === 0 ? T.bg3 : T.bg2) :
                                                            (dark ? "#2a1500" : "#fff7ed");
                                                        const typeColor = r.type === "buy" ? T.green : r
                                                            .type === "sell" ? T.red : T.teal;
                                                        const typeBg = r.type === "buy" ? (dark ?
                                                                "#0a2e1e" : "#dcfce7") : r
                                                            .type === "sell" ? (dark ? "#2d0a0a" :
                                                                "#fee2e2") : (dark ? "#041824" :
                                                                "#cffafe");
                                                        return (<tr key={i} style={{ background: bg }}><td
                                                                style={{ padding: "6px 8px",
                                                                    borderBottom: "1px solid " + T.border }}>{ok ?
                                                                    "✅" : "⚠️"}</td><td style={{ padding: "6px 8px",
                                                                    color: T.text3, fontSize: 9,
                                                                    borderBottom: "1px solid " + T.border }}>{r
                                                                    ._rowNum}</td><td style={{ padding: "6px 8px",
                                                                    fontFamily: "'Space Mono',monospace",
                                                                    fontWeight: 700, color: T.text,
                                                                    borderBottom: "1px solid " + T.border }}>{r
                                                                    .ticker}</td><td style={{ padding: "6px 8px",
                                                                    borderBottom: "1px solid " + T.border }}>{r
                                                                    .type && <span style={{ padding: "1px 6px",
                                                                        borderRadius: 4, fontSize: 9,
                                                                        fontWeight: 700, background: typeBg,
                                                                        color: typeColor }}>{r.type
                                                                        .toUpperCase()}</span>}</td><td
                                                                style={{ padding: "6px 8px", color: T.text2,
                                                                    borderBottom: "1px solid " + T.border,
                                                                    whiteSpace: "nowrap" }}>{r.date}</td><td
                                                                style={{ padding: "6px 8px",
                                                                    fontFamily: "'Space Mono',monospace",
                                                                    color: T.text2,
                                                                    borderBottom: "1px solid " + T.border }}>{r
                                                                    .qty || "—"}</td><td style={{ padding: "6px 8px",
                                                                    fontFamily: "'Space Mono',monospace",
                                                                    color: T.text2,
                                                                    borderBottom: "1px solid " + T.border }}>{r
                                                                    .price || "—"}</td><td style={{ padding: "6px 8px",
                                                                    color: T.text3,
                                                                    borderBottom: "1px solid " + T.border }}>{r
                                                                    .currency}</td><td style={{ padding: "6px 8px",
                                                                    fontFamily: "'Space Mono',monospace",
                                                                    color: T.teal,
                                                                    borderBottom: "1px solid " + T.border }}>{r
                                                                    .amountPerShare || "—"}</td><td
                                                                style={{ padding: "6px 8px", color: T.text2,
                                                                    borderBottom: "1px solid " + T.border }}>{r
                                                                    .entitledQty || "—"}</td></tr>);
                                                    })}</tbody></table></div>{valid.length === 0 && (<div
                                        style={{ textAlign: "center", padding: "8px 0", color: T.red, fontSize: 12,
                                            marginBottom: 12 }}>No valid rows found. Fix the errors and
                                        re-upload.</div>)}<div style={{ display: "flex", gap: 8,
                                        justifyContent: "space-between", alignItems: "center", flexWrap: "wrap" }}><button
                                            style={bO(T.text2, { fontSize: 11 })} onClick={() => setImportSt(s => ({ ...s,
                                                step: "idle", parsed: [], rows: [], errors: [] }))}>Upload different
                                            file</button><div style={{ display: "flex", gap: 8 }}><button style={bO(
                                                T.text2)} onClick={closeModal}>Cancel</button><button style={{ ...bS(
                                                T.greenBtn, "#fff"), opacity: valid.length ? 1 : .4, cursor: valid
                                                .length ? "pointer" : "not-allowed" }} disabled={!valid.length}
                                                onClick={confirmImport}>Import {valid.length} rows {IS.mergeMode ===
                                                "replace" ? "(replace all)" : "(merge)"}</button></div></div></div>)}
                        {IS.step === "done" && (<div style={{ textAlign: "center", padding: "24px 0" }}><div
                                style={{ fontSize: 48, marginBottom: 12 }}>🎉</div><div style={{ fontSize: 18,
                                    fontWeight: 700, color: T.green, marginBottom: 8 }}>Import complete!</div><div
                                style={{ fontSize: 13, color: T.text2, marginBottom: 8 }}>{IS.importedCount} transactions
                                imported.</div><div style={{ fontSize: 11, color: T.text3, marginBottom: 24 }}>Click the
                                🔄 Live Prices button to fetch current prices for new holdings.</div><button style={bS(
                                T.greenBtn, "#fff", { padding: "9px 28px", fontSize: 13 })} onClick={closeModal}>Done</button></div>)}
                    </div>
                );
            };

            // ─── JSX ────────────────────────────────────────────────────────────────────
            return (
                <ErrorBoundary>
                    <div style={{ minHeight: "100vh", background: T.bg, color: T.text }}>
                        {/* Header - Two rows */}
                        <header style={{ background: T.bg2, borderBottom: "1px solid " + T.border, position: "sticky",
                                top: 0, zIndex: 20, boxShadow: T.shadow, padding: "6px 12px" }}>
                            {/* Row 1: Logo + KPIs */}
                            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between",
                                    flexWrap: "wrap", gap: 6, marginBottom: 2 }}>
                                <div className="logo-area" style={{ display: "flex", alignItems: "center", flexShrink: 0 }}>
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" width={isMob ? 130 : 190}
                                        height={isMob ? 34 : 44} style={{ display: "block" }}>
                                        <defs><linearGradient id="hbg2" x1="0%" y1="100%" x2="100%" y2="0%"><stop
                                                    offset="0%" stopColor="#34a853" /><stop offset="55%"
                                                    stopColor="#1a73e8" /><stop offset="100%"
                                                    stopColor="#8ab4f8" /></linearGradient>
                                            <linearGradient id="htg2" x1="0%" y1="0%" x2="100%" y2="0%"><stop

                                                    Currency</label><select style={{ ...inp(), background: T
                                                        .bg, width: "auto", minWidth: 100 }} value={form
                                                        .displayCur || displayCur} onChange={e => setForm(
                                                        f => ({ ...f, displayCur: e.target
                                                        .value }))}>{CURRENCIES.map(c => <option
                                                            key={c}>{c}</option>)}</select></div>
                                            {holdings.map(h => (<div key={h.ticker} style={{ marginBottom: 12,
                                                        paddingBottom: 12, borderBottom: "1px solid " + T.border }}><div
                                                        style={{ fontSize: 10, color: T.text,
                                                            fontWeight: 700, fontFamily: "'Space Mono',monospace",
                                                        marginBottom: 6 }}>{h.ticker}<span style={{
                                                                fontFamily: "'Roboto',sans-serif",
                                                                color: T.text3, fontWeight: 400 }}> — {h
                                                                .name}</span>{h.isBondPct && <span
                                                                style={{ marginLeft: 4, fontSize: 8,
                                                                    background: dark ? "#041020" :
                                                                    "#e0f9ff", color: T.teal,
                                                                    padding: "1px 6px", borderRadius: 10,
                                                                    border: "1px solid " + T.teal + "44",
                                                                    fontWeight: 500 }}>BOND</span>}{!h
                                                            .yahooSymbol && <span style={{ marginLeft: 4,
                                                                fontSize: 8, background: dark ?
                                                                    "#1a100a" : "#fff7ed",
                                                                    color: T.amber, padding: "1px 6px",
                                                                    borderRadius: 10,
                                                                    border: "1px solid " + T.amber + "44",
                                                                    fontWeight: 500 }}>✏️ Manual</span>}<span style={{
                                                                marginLeft: 4, fontSize: 8, color: T.text3,
                                                                fontWeight: 400 }}>({h
                                                                .currency})</span></div><div className="modal-g3"
                                                        style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr",
                                                            gap: 6 }}><div><label style={lbl({ fontSize: 8 })}>Current
                                                                Price</label><input style={inp()}
                                                                type="number" placeholder={String(
                                                                    prices[h.ticker] || "")}
                                                                value={form["c_" + h.ticker] || ""}
                                                                onChange={e => setForm(f => ({ ...f,
                                                                    ["c_" + h.ticker]: e
                                                                    .target.value }))} /></div><div><label
                                                                    style={lbl({ fontSize: 8 })}>Prev Close</label><input
                                                                    style={inp()} type="number"
                                                                    placeholder={String(prevPrices[
                                                                        h.ticker] || "")}
                                                                    value={form["p_" + h.ticker] ||
                                                                    ""} onChange={e => setForm(
                                                                    f => ({ ...f, ["p_" + h
                                                                        .ticker]: e
                                                                        .target
                                                                        .value
                                                                    }))} /></div><div><label
                                                                    style={lbl({ fontSize: 8 })}>Yahoo Symbol</label><input
                                                                    style={{ ...inp(), fontFamily: "'Space Mono',monospace",
                                                                        fontSize: 10 }}
                                                                    placeholder={suggestYahoo(h
                                                                        .ticker, h.exchange,
                                                                        h.assetType)}
                                                                    value={form["ys_" + h.ticker] ??
                                                                    h.yahooSymbol ?? ""}
                                                                    onChange={e => setForm(f =>
                                                                        ({ ...f, ["ys_" + h
                                                                                .ticker]: e
                                                                                .target
                                                                                .value
                                                                            }))} /></div></div>{fetchSt
                                                        .errors[h.ticker] && <div style={{ fontSize: 9,
                                                                color: T.amber, marginTop: 3,
                                                                fontWeight: 500 }}>⚠️ Last
                                                            auto-fetch: {fetchSt.errors[h.ticker]}</div>}</div>))}
                                            <div style={{ display: "flex", gap: 6, justifyContent: "flex-end",
                                                    marginTop: 4 }}><button style={bO(T.text2, { fontSize: 10 })} onClick={
                                                    closeModal}>Cancel</button><button style={bS(T
                                                        .greenBtn, "#fff", { fontSize: 10 })} onClick={submitManualPrice}>💾
                                                    Save</button></div>
                                        </>
                                    )}
                                    {modal.mode === "import" && renderImportModal()}
                                    {modal.mode === "firebaseSetup" && (() => {
                                        const [cfg, setCfg] = React.useState({ apiKey: "",
                                            authDomain: "", projectId: "",
                                            storageBucket: "", messagingSenderId: "",
                                            appId: "" });
                                        const fields = [
                                            ["apiKey", "API Key",
                                                "AIzaSy..."
                                            ],
                                            ["authDomain", "Auth Domain",
                                                "your-project.firebaseapp.com"
                                            ],
                                            ["projectId", "Project ID",
                                                "your-project-id"
                                            ],
                                            ["storageBucket", "Storage Bucket",
                                                "your-project.appspot.com"
                                            ],
                                            ["messagingSenderId", "Messaging Sender ID",
                                                "123456789"
                                            ],
                                            ["appId", "App ID",
                                                "1:123456789:web:abc123"
                                            ],
                                        ];
                                        return (<div style={{ maxWidth: 480, width: "100%",
                                                    ...card({ padding: 20 }) }}><h2
                                                    style={{ fontFamily: "'Space Mono',monospace",
                                                        fontSize: 15, fontWeight: 700,
                                                        color: T.text,
                                                    marginBottom: 3 }}>☁️ Set Up Cloud
                                                Sync</h2><p style={{ fontSize: 10,
                                                        color: T.text3, marginBottom: 14,
                                                        lineHeight: 1.5, fontWeight: 500 }}>Enter your Firebase
                                                    project credentials below.</p><div
                                                    style={{ background: T.bg4, border: "1px solid " + T.border,
                                                        borderRadius: 6, padding: 10,
                                                        marginBottom: 14, fontSize: 10,
                                                        color: T.text2, lineHeight: 1.6, fontWeight: 500 }}><b
                                                        style={{ color: T.teal, fontWeight: 600 }}>Need a project?</b><br />
                                                    1. console.firebase.google.com → Add project<br />
                                                    2. Project Settings → Your apps → &lt;/&gt; (web)<br />
                                                    3. Enable Google Auth & Firestore (test mode)</div><div style={{
                                                        display: "flex", flexDirection: "column",
                                                        gap: 6,
                                                    marginBottom: 14 }}>{fields.map((
                                                        [key, label, ph]) => (<div key={
                                                            key }><label style={{
                                                                fontSize: 8,
                                                                color: T.text3,
                                                                letterSpacing: 1,
                                                                textTransform: "uppercase",
                                                                fontWeight: 600 }}>{label}</label><input
                                                                style={{ ...inp(),
                                                                    marginTop: 1 }}
                                                                placeholder={ph}
                                                                value={cfg[key]}
                                                                onChange={e => setCfg(
                                                                    c => ({ ...c,
                                                                        [key]: e
                                                                        .target
                                                                        .value }))} /></div>))}</div><div
                                                    style={{ fontSize: 9, color: T
                                                            .amber, marginBottom: 10, fontWeight: 500 }}>⚠️
                                                    Reload the page after downloading.</div><div style={{
                                                        display: "flex", gap: 6,
                                                        justifyContent: "flex-end" }}><button
                                                        style={bO(T.text2, { fontSize: 10 })} onClick={
                                                            closeModal}>Cancel</button><button
                                                        style={bS(T.teal, "#fff", { fontSize: 10 })}
                                                        onClick={() => { try { localStorage
                                                                    .setItem(
                                                                        "f6_fbcfg",
                                                                        JSON
                                                                        .stringify(
                                                                            cfg
                                                                            )
                                                                        );
                                                                const src = document
                                                                    .documentElement
                                                                    .outerHTML;
                                                                const updated =
                                                                    src.replace(
                                                                        /"YOUR_API_KEY"/,
                                                                        `"${cfg.apiKey}"`
                                                                        )
                                                                    .replace(
                                                                        /"YOUR_PROJECT_ID\.firebaseapp\.com"/,
                                                                        `"${cfg.authDomain}"`
                                                                        )
                                                                    .replace(
                                                                        /("YOUR_PROJECT_ID")/g,
                                                                        `"${cfg.projectId}"`
                                                                        )
                                                                    .replace(
                                                                        /"YOUR_PROJECT_ID\.appspot\.com"/,
                                                                        `"${cfg.storageBucket}"`
                                                                        )
                                                                    .replace(
                                                                        /"YOUR_MESSAGING_SENDER_ID"/,
                                                                        `"${cfg.messagingSenderId}"`
                                                                        )
                                                                    .replace(
                                                                        /"YOUR_APP_ID"/,
                                                                        `"${cfg.appId}"`
                                                                        );
                                                                const blob =
                                                                    new Blob(
                                                                        [updated],
                                                                        { type: "text/html" }
                                                                        );
                                                                const a =
                                                                    document
                                                                    .createElement(
                                                                        "a"
                                                                        );
                                                                a.href = URL
                                                                    .createObjectURL(
                                                                        blob
                                                                        );
                                                                a.download =
                                                                    "folio-dashboard.html";
                                                                a.click();
                                                                alert(
                                                                    "✅ New file downloaded with your Firebase config!\n\nOpen the downloaded file — cloud sync will be ready."
                                                                    );
                                                                closeModal();
                                                            } catch (e) { alert(
                                                                    "Error: " +
                                                                    e.message); } }}>💾
                                                    Save & Download</button></div></div>);
                                    })()}
                                </div>
                            </div>
                        )}
                        {editTx && (() => {
                            const h = portfolio.find(p => p.id === editTx.holdingId);
                            if (!h) return null;
                            const tx = editTx.tx;
                            const cur = h.currency || "AUD";
                            const save = () => { setPortfolioRepaired(p => p.map(holding =>
                                    holding.id === editTx.holdingId ? { ...holding,
                                        transactions: holding.transactions
                                        .map((t, j) => j === editTx
                                            .txIndex ? { ...editTx.tx } :
                                            t) } : holding));
                                setEditTx(null); };
                            const fi = (field, label, type = "text",
                            placeholder = "") => (<div key={field}><label
                                    style={{ fontSize: 9, color: T.text3,
                                        letterSpacing: 1,
                                        textTransform: "uppercase",
                                    fontWeight: 600 }}>{label}</label><input
                                    type={type} style={{ ...inp(), marginTop: 1 }}
                                    value={tx[field] ?? ""} placeholder={
                                        placeholder} onChange={e => { const v =
                                            type === "number" ? (parseFloat(
                                                e.target.value) || 0) : e
                                                .target.value;
                                        setEditTx(s => ({ ...s, tx: { ...s
                                                    .tx, [field]: v } })); }} /></div>);
                            return (<div onClick={() => setEditTx(null)} style={{ position: "fixed",
                                        inset: 0, background: "rgba(0,0,0,.82)",
                                        backdropFilter: "blur(6px)", zIndex: 200,
                                        display: "flex", alignItems: "center",
                                        justifyContent: "center", padding: 12 }}><div
                                        onClick={e => e.stopPropagation()} style={{
                                            background: T.bg2, border: "1px solid " + T.border,
                                            borderRadius: 14, padding: 20, width: "100%",
                                            maxWidth: 380, boxShadow: T.shadow }}><h2
                                            style={{ fontFamily: "'Space Mono',monospace",
                                                fontSize: 14, fontWeight: 700,
                                            color: T.text, marginBottom: 3 }}>✏️ Edit
                                            Transaction</h2><p style={{ fontSize: 10,
                                                color: T.text3, fontWeight: 500,
                                            marginBottom: 14 }}>{h.ticker} — {tx.type
                                                ?.toUpperCase()}</p><div style={{
                                                display: "flex", flexDirection: "column",
                                                gap: 8 }}>{fi("date", "Date",
                                                "date")}{tx.type !== "dividend" &&
                                                fi("qty", "Units / Quantity",
                                                    "number",
                                                "0")}{tx.type !== "dividend" &&
                                                fi("price", `Price (${cur})`,
                                                    "number",
                                                "0")}{tx.type === "dividend" &&
                                                fi("amountPerShare",
                                                    `Amount per Unit (${cur})`,
                                                    "number",
                                                "0")}{tx.type === "dividend" &&
                                                fi("entitledQty",
                                                    "Entitled Units",
                                                    "number",
                                                "0")}{tx.type === "dividend" &&
                                                fi("totalAmount",
                                                    `Total Amount (${cur})`,
                                                    "number", "0")}</div><div
                                                style={{ display: "flex", gap: 6,
                                                    justifyContent: "flex-end",
                                                marginTop: 14 }}><button style={bO(T
                                                        .text2, { fontSize: 10 })} onClick={() =>
                                                        setEditTx(null)}>Cancel</button><button
                                                    style={bS(T.greenBtn, "#fff", { fontSize: 10 })}
                                                    onClick={save}>Save</button></div></div></div>);
                        })()}
                        {showPassiveModal && (
                            <div onClick={() => setShowPassiveModal(false)} style={{ position: "fixed", inset: 0,
                                    background: "rgba(0,0,0,.7)", backdropFilter: "blur(6px)",
                                    zIndex: 200, display: "flex", alignItems: "center",
                                    justifyContent: "center", padding: 12 }}>
                                <div onClick={e => e.stopPropagation()} style={{ background: T.bg2,
                                        border: "1px solid " + T.border, borderRadius: 14,
                                        padding: 20, width: "100%", maxWidth: 380,
                                    boxShadow: T.shadow }}>
                                    <h2 style={{ fontFamily: "'Space Mono',monospace", fontSize: 15,
                                            fontWeight: 700, color: T.text,
                                        marginBottom: 3 }}>⚙️ Passive Income Settings</h2>
                                    <p style={{ fontSize: 10, color: T.text3, fontWeight: 500,
                                        marginBottom: 14 }}>Set your monthly target, super draw
                                        rate, and average super balance.</p>
                                    <div style={{ marginBottom: 10 }}><label style={{ fontSize: 9,
                                            color: T.text3, letterSpacing: 1,
                                        textTransform: "uppercase", fontWeight: 600 }}>Monthly Target
                                        (AUD)</label><input type="number" step="100"
                                            value={monthlyTargetAud} onChange={e => setMonthlyTargetAud(
                                                parseFloat(e.target.value) || 0)}
                                            style={{ ...inp(), marginTop: 2 }}
                                            placeholder="e.g. 5000" /></div>
                                    <div style={{ marginBottom: 10 }}><label style={{ fontSize: 9,
                                            color: T.text3, letterSpacing: 1,
                                        textTransform: "uppercase", fontWeight: 600 }}>Super Annual Draw
                                        Rate (%)</label><input type="number" step="0.1"
                                            value={superDrawRate} onChange={e => setSuperDrawRate(
                                                parseFloat(e.target.value) || 0)}
                                            style={{ ...inp(), marginTop: 2 }}
                                            placeholder="e.g. 4.0" /><div style={{ fontSize: 9,
                                                color: T.text3, marginTop: 3, fontWeight: 500 }}>Applied to
                                            NUL5339AU + NUL7270AU</div></div>
                                    <div style={{ marginBottom: 16 }}><label style={{ fontSize: 9,
                                            color: T.text3, letterSpacing: 1,
                                        textTransform: "uppercase", fontWeight: 600 }}>Average Super Balance
                                        (AUD)</label><input type="number" step="1000"
                                            value={avgSuperBalanceAud} onChange={e =>
                                                setAvgSuperBalanceAud(parseFloat(e.target
                                                    .value) || 0)} style={{ ...inp(),
                                                marginTop: 2 }} placeholder="e.g. 100000" /><div
                                            style={{ fontSize: 9, color: T.text3,
                                                marginTop: 3, fontWeight: 500 }}>Used to compare your super</div></div>
                                    <div style={{ display: "flex", gap: 6, justifyContent: "flex-end" }}>
                                        <button style={bO(T.text2, { fontSize: 10 })} onClick={() =>
                                                setShowPassiveModal(false)}>Cancel</button>
                                        <button style={bS(T.greenBtn, "#fff", { fontSize: 10 })} onClick={() =>
                                                setShowPassiveModal(false)}>Save</button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </ErrorBoundary>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>
</html>
