// ========== ERROR BOUNDARY ==========
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false, error: null };
  }
  static getDerivedStateFromError(error) {
    return { hasError: true, error };
  }
  componentDidCatch(error, info) {
    console.error("React error boundary caught:", error, info);
  }
  render() {
    if (this.state.hasError) {
      return (
        <div style={{ padding: 20, color: "red", background: "#fff", fontFamily: "monospace" }}>
          <h2>Something went wrong.</h2>
          <pre>{this.state.error?.stack}</pre>
          <button onClick={() => window.location.reload()}>Reload</button>
        </div>
      );
    }
    return this.props.children;
  }
}

// ─── Treemap ──────────────────────────────────────────────────────────────────
function squarify(items,x,y,w,h){
  if(!items.length)return[];
  const r=[];_layout(items,x,y,w,h,items.reduce((s,i)=>s+i.value,0),r);return r;
}
function _layout(it,x,y,w,h,tot,r){
  if(!it.length)return;
  if(it.length===1){r.push({...it[0],x,y,w,h});return;}
  const hz=w>=h,dim=hz?w:h;let row=[],rt=0,best=Infinity;
  for(let i=0;i<it.length;i++){
    row.push(it[i]);rt+=it[i].value;
    const rd=(rt/tot)*dim;let worst=0;
    for(const ri of row){const od=(ri.value/rt)*(hz?h:w);const ra=Math.max(rd/od,od/rd);if(ra>worst)worst=ra;}
    if(worst>best){row.pop();rt-=it[i].value;break;}best=worst;
  }
  const rd=(rt/tot)*dim;let cur=hz?y:x;
  for(const ri of row){const sz=(ri.value/rt)*(hz?h:w);hz?r.push({...ri,x,y:cur,w:rd,h:sz}):r.push({...ri,x:cur,y,w:sz,h:rd});cur+=sz;}
  const rem=it.slice(row.length);if(!rem.length)return;
  const remT=tot-rt;hz?_layout(rem,x+rd,y,w-rd,h,remT,r):_layout(rem,x,y+rd,w,h-rd,remT,r);
}

// ─── Compute Holding ──────────────────────────────────────────────────────────
function computeHolding(h,prices,prevPrices,R){
  let qty=0,cbL=0,rgL=0,lots=[],divL=0;
  const txs=[...h.transactions].sort((a,b)=>new Date(a.date)-new Date(b.date));
  for(const tx of txs){
    if(tx.type==="buy"){lots.push({qty:tx.qty,price:tx.price});qty+=tx.qty;cbL+=tx.qty*tx.price;}
    else if(tx.type==="sell"){let rem=tx.qty;qty-=tx.qty;while(rem>0&&lots.length){const lot=lots[0],used=Math.min(lot.qty,rem);rgL+=used*(tx.price-lot.price);cbL-=used*lot.price;lot.qty-=used;rem-=used;if(lot.qty===0)lots.shift();}}
    else if(tx.type==="dividend"){divL+=tx.totalAmount||0;}
  }
  const cpL=prices[h.ticker]??0,pcL=prevPrices[h.ticker]??cpL;
  const cvL=qty*cpL,ugL=cvL-cbL,dgL=(cpL-pcL)*qty,dgPct=pcL>0?(cpL-pcL)/pcL*100:0;
  const cv=toAUD(cvL,h.currency,R),cb=toAUD(cbL,h.currency,R),ug=toAUD(ugL,h.currency,R);
  const rg=toAUD(rgL,h.currency,R),divs=toAUD(divL,h.currency,R),dg=toAUD(dgL,h.currency,R);
  const totalInv=txs.filter(t=>t.type==="buy").reduce((s,t)=>s+toAUD(t.qty*t.price,h.currency,R),0);
  const totalGain=ug+rg+divs,gainPct=totalInv>0?(totalGain/totalInv)*100:0;
  const divYoc=totalInv>0?(divs/totalInv)*100:0;
  return{...h,qty,costBasis:cb,currentPrice:cpL,prevClose:pcL,currentValue:cv,unrealizedGain:ug,
    realizedGain:rg,totalDividends:divs,totalGain,gainPct,dayGain:dg,dayGainPct:dgPct,
    divYieldOnCost:divYoc,totalInvested:totalInv};
}

                  {form.amountPerShare&&form.entitledQty&&(()=>{const total=+form.amountPerShare * +form.entitledQty;const cur=modal.holding.currency;const totalFmt=cur==="IDR"?`Rp ${fmtIDR(total)}`:cur==="USD"?`US$${total.toFixed(2)}`:`A$${total.toFixed(2)}`;const fullQty=computeHolding(modal.holding,prices,prevPrices,rates).qty;const isPartial=+form.entitledQty<fullQty;return(<div style={{background:dark?"#041824":"#e0f9f8",border:`1px solid ${T.teal}55`,borderRadius:8,padding:"10px 14px",marginBottom:14}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:6}}><div><span style={{fontSize:11,color:T.teal}}>Total {modal.holding.isBondPct?"coupon":"dividend"}: </span><strong style={{fontFamily:"'Space Mono',monospace",fontSize:14,color:T.teal}}>{totalFmt}</strong></div>{isPartial&&<div style={{fontSize:10,color:T.amber,background:dark?"#1a1000":"#fffbeb",border:`1px solid ${T.amber}44`,borderRadius:6,padding:"3px 8px"}}>✂️ Partial — {form.entitledQty} of {fullQty.toFixed(4)} units</div>}</div><div style={{fontSize:10,color:T.text3,marginTop:4}}>{form.amountPerShare} × {form.entitledQty} units = {totalFmt}</div></div>);})()}

                  <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap"}}>{[["Market Value",FC(histC.currentValue),T.text],["Total G/L",`${FG(histC.totalGain)} (${fmtPct(histC.gainPct)})`,pColor(histC.totalGain)],["Div/Coupons",FC(histC.totalDividends),T.teal]].map(([l,v,c])=>(<div key={l} style={{background:T.bg4,border:`1px solid ${T.border}`,borderRadius:8,padding:"7px 12px",flex:"1 1 100px"}}><div style={{fontSize:8,color:T.text3,letterSpacing:1.2,textTransform:"uppercase"}}>{l}</div><div style={{fontFamily:"'Space Mono',monospace",fontSize:11,fontWeight:700,color:c,marginTop:3}}>{v}</div></div>))}</div>

hDomain}"`).replace(/("YOUR_PROJECT_ID")/g,`"${cfg.projectId}"`).replace(/"YOUR_PROJECT_ID\.appspot\.com"/,`"${cfg.storageBucket}"`).replace(/"YOUR_MESSAGING_SENDER_ID"/,`"${cfg.messagingSenderId}"`).replace(/"YOUR_APP_ID"/,`"${cfg.appId}"`);const blob=new Blob([updated],{type:"text/html"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="folio-dashboard.html";a.click();alert("✅ New file downloaded with your Firebase config!\n\nOpen the downloaded file — cloud sync will be ready.");closeModal();}catch(e){alert("Error: "+e.message);}}}>💾 Save & Download</button></div></div>);})()}
