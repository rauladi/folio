// ─── Error Boundary ──────────────────────────────────────────────────────────
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false, error: null };
  }
  static getDerivedStateFromError(error) {
    return { hasError: true, error };
  }
  componentDidCatch(error, info) {
    console.error("React error boundary caught:", error, info);
  }
  render() {
    if (this.state.hasError) {
      return (
        <div style={{ padding: 20, color:"red", background:"#fff", fontFamily:"monospace" }}>
          <h2>Something went wrong.</h2>
          <pre>{this.state.error?.stack}</pre>
          <button onClick={() => window.location.reload()}>Reload</button>
        </div>
      );
    }
    return this.props.children;
  }
}

// ─── Treemap ──────────────────────────────────────────────────────────────────
function squarify(items,x,y,w,h){
  if(!items.length)return[];
  const r=[];_layout(items,x,y,w,h,items.reduce((s,i)=>s+i.value,0),r);return r;
}
function _layout(it,x,y,w,h,tot,r){
  if(!it.length)return;
  if(it.length===1){r.push({...it[0],x,y,w,h});return;}
  const hz=w>=h,dim=hz?w:h;let row=[],rt=0,best=Infinity;
  for(let i=0;i<it.length;i++){
    row.push(it[i]);rt+=it[i].value;
    const rd=(rt/tot)*dim;let worst=0;
    for(const ri of row){const od=(ri.value/rt)*(hz?h:w);const ra=Math.max(rd/od,od/rd);if(ra>worst)worst=ra;}
    if(worst>best){row.pop();rt-=it[i].value;break;}best=worst;
  }
  const rd=(rt/tot)*dim;let cur=hz?y:x;
  for(const ri of row){const sz=(ri.value/rt)*(hz?h:w);hz?r.push({...ri,x,y:cur,w:rd,h:sz}):r.push({...ri,x:cur,y,w:sz,h:rd});cur+=sz;}
  const rem=it.slice(row.length);if(!rem.length)return;
  const remT=tot-rt;hz?_layout(rem,x+rd,y,w-rd,h,remT,r):_layout(rem,x,y+rd,w,h-rd,remT,r);
}

function fmtIDR(n){try{return Math.round(n).toLocaleString("id-ID");}catch{return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,".");}}
function fmtAUD(n){return Math.abs(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,",");}
function fmtCur(audAmt,dc,R,compact=false){
  const a=fromAUD(audAmt,dc,R);
  if(dc==="IDR"){const abs=Math.abs(a);if(compact&&abs>=1e9)return`Rp${(a/1e9).toFixed(1)}M`;if(compact&&abs>=1e6)return`Rp${(a/1e6).toFixed(1)}Jt`;if(compact&&abs>=1e3)return`Rp${(a/1e3).toFixed(0)}Rb`;return`Rp ${fmtIDR(a)}`;}

  const abs=Math.abs(a);if(compact&&abs>=1e6)return`A$${(a/1e6).toFixed(2)}M`;if(compact&&abs>=1e3)return`A$${(a/1e3).toFixed(1)}K`;return`A$${fmtAUD(a)}`;
}
function fmtGain(audAmt,dc,R){

  if(dc==="USD")return`${sign}US$${fmtAUD(a)}`;
  return`${sign}A$${fmtAUD(a)}`;
}

const PROXIES=[
  u=>"https://corsproxy.io/?"+encodeURIComponent(u),
  u=>"https://api.allorigins.win/raw?url="+encodeURIComponent(u),
  u=>"https://proxy.cors.sh/"+u,

];

async function fetchWithProxyRaw(url,timeoutMs=10000){
  return new Promise((resolve,reject)=>{
    let settled=false;let pending=PROXIES.length;
    PROXIES.forEach(proxy=>{
      fetch(proxy(url),{signal:AbortSignal.timeout(timeoutMs)})
        .then(async r=>{
          if(!r.ok)throw new Error("HTTP "+r.status);
          const t=await r.text();
          if(!t||t.length<10)throw new Error("Empty");
          if(t.trim().startsWith("{")&&t.includes('"contents"')){
            try{const j=JSON.parse(t);if(j.contents){if(!settled){settled=true;resolve(j.contents);}return;}}catch(e){}
          }
          if(!settled){settled=true;resolve(t);}
        })
        .catch(()=>{
          pending--;
          if(pending===0&&!settled)reject(new Error("All proxies failed (raw)"));
        });
    });
  });
}

async function tryProxy(proxyUrl, timeoutMs){
  const r=await fetch(proxyUrl,{signal:AbortSignal.timeout(timeoutMs)});
  if(!r.ok)throw new Error("HTTP "+r.status);
  const t=await r.text();
  if(!t||t.length<10)throw new Error("Empty response");
  let parsed=JSON.parse(t);
  if(parsed?.contents&&typeof parsed.contents==="string") parsed=JSON.parse(parsed.contents);
  return parsed;
}

async function fetchWithProxy(url, timeoutMs=10000){
  return new Promise((resolve,reject)=>{
    let settled=false;
    let pending=PROXIES.length;
    const errors=[];
    PROXIES.forEach(proxy=>{
      tryProxy(proxy(url), timeoutMs)
        .then(data=>{
          if(!settled){settled=true;resolve(data);}
        })
        .catch(e=>{
          errors.push(e.message);
          pending--;
          if(pending===0&&!settled) reject(new Error("All proxies failed: "+url.split("?")[0].split("/").pop()));
        });
    });
  });
}

async function fetchIDXPrice(stockCode){
  const code=stockCode.toUpperCase().replace(".JK","").trim();
  const endpoints=[
    `https://api-apps.idx.co.id/api/Stock/GetStockSummary?StockCode=${code}`,
    `https://api-apps.idx.co.id/api/Stock/GetStockData?StockCode=${code}`,
    `https://api-apps.idx.co.id/api/Stock/GetTradingResult?StockCode=${code}`,
    `https://api.stockbit.com/v2.4/fundamental/financialsummary/${code}`,
    `https://api.markets.ft.com/data/prices/v1/series/symbol/${code}.JK`,
  ];
  for(const url of endpoints){
    try{
      const d=await fetchWithProxy(url,8000);
      if(!d)continue;
      const item=d?.data||d?.Data||d;
      const cur=parseFloat(item?.ClosePrice??item?.closePrice??item?.LastPrice??item?.lastPrice??item?.price??0);
      if(cur>0){
        const prev=parseFloat(item?.PreviousPrice??item?.previousPrice??item?.OpenPrice??cur);
        return{current:cur,prev};
      }
      const arr=Array.isArray(item)?item:(item?.stockData||item?.result||[]);
      if(arr.length){
        const r=arr[0];
        const cur2=parseFloat(r?.ClosePrice??r?.closePrice??r?.LastPrice??0);
        if(cur2>0)return{current:cur2,prev:parseFloat(r?.PreviousPrice??cur2)};
      }
    }catch(e){}
  }
  throw new Error("IDX: "+code+" not found");
}

function toStooqSymbol(yahooSymbol){
  const s=yahooSymbol.toUpperCase();
  if(s.endsWith(".AX"))  return s.replace(".AX",".AU").toLowerCase();
  if(s.endsWith(".JK"))  return s.replace(".JK",".ID").toLowerCase();
  if(s.endsWith("-AUD")) return s.replace("-AUD","-AUD.CRYPTO").toLowerCase();
  if(s.endsWith("-USD")) return s.replace("-USD","-USD.CRYPTO").toLowerCase();
  if(s.endsWith("-BTC")) return s.replace("-BTC","-BTC.CRYPTO").toLowerCase();
  if(s==="GC=F")  return "gc.f";
  if(s==="SI=F")  return "si.f";
  if(s==="CL=F")  return "cl.f";
  if(s==="NG=F")  return "ng.f";
  if(s.endsWith(".L"))   return s.toLowerCase();
  if(s.endsWith(".SI"))  return s.toLowerCase();
  if(s.endsWith(".TO"))  return s.toLowerCase();
  if(s.endsWith(".HK"))  return s.toLowerCase();
  if(!s.includes(".")&&!s.includes("-")&&!s.includes("=")) return s.toLowerCase()+".us";
  return null;
}

async function fetchStooq(yahooSymbol){
  const stooq=toStooqSymbol(yahooSymbol);
  if(!stooq)throw new Error("No Stooq symbol for "+yahooSymbol);
  const now=new Date();
  const d1=new Date(now);d1.setDate(d1.getDate()-7);
  const fmt=d=>`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;
  const url=`https://stooq.com/q/d/l/?s=${stooq}&d1=${fmt(d1)}&d2=${fmt(now)}&i=d`;
  const raw=await fetchWithProxyRaw(url);
  const allLines=raw.trim().split("\n").map(l=>l.trim()).filter(Boolean);
  if(allLines.length<2)throw new Error("Stooq: no data for "+stooq);
  const header=allLines[0].toLowerCase().split(",");
  const closeIdx=header.indexOf("close");
  if(closeIdx<0)throw new Error("Stooq: no Close col");
  const dataLines=allLines.slice(1).filter(l=>!/no data/i.test(l));
  if(!dataLines.length)throw new Error("Stooq: empty data");
  dataLines.sort((a,b)=>a.split(",")[0].localeCompare(b.split(",")[0]));
  const parseClose=l=>parseFloat(l.split(",")[closeIdx])||0;
  const cur=parseClose(dataLines[dataLines.length-1]);
  const prev=dataLines.length>1?parseClose(dataLines[dataLines.length-2]):cur;
  if(!cur)throw new Error("Stooq: zero price");
  return{current:cur,prev};
}

  const parseQuote = (d) => {

    if (quote && quote.regularMarketPrice) {
      const prev = quote.regularMarketPreviousClose;
      if (prev && prev !== quote.regularMarketPrice) {
        return { current: quote.regularMarketPrice, prev: prev };
      }
      return { current: quote.regularMarketPrice, prev: null };
    }
    return null;
  };

  const parseChartForPrevClose = (d) => {
    const res = d?.chart?.result?.[0];
    if (!res) return null;
    const timestamps = res.timestamp;
    const closes = res.indicators?.quote?.[0]?.close;
    if (!timestamps || !closes || timestamps.length < 2) return null;
    const prevClose = closes[closes.length - 2];
    const current = closes[closes.length - 1];
    if (prevClose && current) return { current, prev: prevClose };
    return null;
  };

  try {
    const quoteUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${sym}?interval=1d&range=2d&includePrePost=false`;
    const data = await fetchWithProxy(quoteUrl);
    const result = parseChartForPrevClose(data);
    if (result && result.current > 0 && result.prev > 0) {
      console.log(`✅ ${symbol}: price from Yahoo v8`);
      return result;
    }
  } catch (e) { console.warn(`Yahoo v8 failed for ${symbol}:`, e.message); }

  try {
    const quoteUrl = YAHOO_V7 + sym + "&fields=regularMarketPrice,regularMarketPreviousClose";
    const quoteData = await fetchWithProxy(quoteUrl);
    const result = parseQuote(quoteData);
    if (result && result.current > 0 && result.prev !== null) {
      console.log(`✅ ${symbol}: price from Yahoo v7`);
      return result;
    }
  } catch (e) { console.warn(`Yahoo v7 quote failed for ${symbol}:`, e.message); }

  const chartUrls = [
    YAHOO_BASE + sym + "?interval=1d&range=2d&includePrePost=false",
    YAHOO_BASE1 + sym + "?interval=1d&range=2d&includePrePost=false",
  ];
  for (const url of chartUrls) {
    try {
      const chartData = await fetchWithProxy(url);
      const result = parseChartForPrevClose(chartData);
      if (result && result.current > 0 && result.prev > 0) {
        console.log(`✅ ${symbol}: price from Yahoo chart`);
        return result;
      }
    } catch (e) { console.warn(`Yahoo chart endpoint failed for ${symbol}:`, e.message); }
  }

  try {
    const stooqResult = await fetchStooq(symbol);
    if (stooqResult?.current > 0) {
      console.log(`⚠️ ${symbol}: using Stooq fallback`);
      return stooqResult;
    }
  } catch (e) { console.warn(`Stooq fallback failed for ${symbol}:`, e.message); }

  if (isJK) {
    try {
      const idxResult = await fetchIDXPrice(symbol);
      if (idxResult?.current > 0) {
        console.log(`⚠️ ${symbol}: using IDX fallback`);
        return idxResult;
      }
    } catch (e) { console.warn(`IDX fallback failed for ${symbol}:`, e.message); }
  }

  throw new Error(`All price sources failed for ${symbol}`);
}

async function fetchBenchmark(symbol) {
  const sym = encodeURIComponent(symbol);
  const candidates = [
    YAHOO_BASE + sym + "?interval=1mo&range=5y",
    YAHOO_BASE1 + sym + "?interval=1mo&range=5y",
    YAHOO_BASE + sym + "?interval=1mo&range=3y",
  ];
  let lastErr = "No data";
  for (const url of candidates) {
    try {
      const d = await fetchWithProxy(url);
      const res = d?.chart?.result?.[0];
      if (!res) continue;
      const ts = res.timestamp || [];
      const closes = res.indicators?.quote?.[0]?.close || [];
      if (!ts.length || !closes.length) continue;
      const base = closes.find(v => v != null) || 1;
      return {
        labels: ts.map(t => new Date(t * 1000).toISOString().slice(0, 10)),
        pct: closes.map(v => v != null ? ((v - base) / base) * 100 : null),
        raw: closes,
      };
    } catch (e) { lastErr = e.message; }
  }
  throw new Error(lastErr);
}

async function fetchDJPPRPrice(seriSBN){
  const sn=seriSBN.toUpperCase().trim();

  async function tryDirect(url, timeoutMs=6000){
    try{
      const r=await fetch(url,{signal:AbortSignal.timeout(timeoutMs)});
      if(r.ok){const t=await r.text();if(t&&t.length>10)return JSON.parse(t);}
    }catch(e){}
    return fetchWithProxy(url, timeoutMs);
  }

  function bondPrice(obj){
    if(!obj||typeof obj!=="object")return 0;
    const keys=Object.keys(obj);
    const find=(...names)=>{
      for(const n of names){
        const k=keys.find(k=>k.toLowerCase()===n.toLowerCase());
        if(k&&parseFloat(obj[k])>0)return parseFloat(obj[k]);
      }return 0;
    };
    return find("ClosePrice","LastPrice","Price","Close","Bid","Ask","HargaBid","HargaAsk","closeprice","lastprice","price");
  }

  const idxSingle=[
    `https://api-apps.idx.co.id/api/Bond/GetBondData?BondCode=${sn}`,

    `https://api-apps.idx.co.id/api/Stock/GetStockSummary?StockCode=${sn}`,
  ];
  for(const url of idxSingle){
    try{
      const d=await tryDirect(url);
      if(!d)continue;
      const item=d?.data||d?.Data||d;
      const arr=Array.isArray(item)?item:null;
      const obj=arr?arr[0]:item;
      if(obj&&typeof obj==="object"){
        const cur=bondPrice(obj);
        if(cur>0){
          const prev=bondPrice({PreviousPrice:obj.PreviousPrice??obj.previousPrice??obj.PreviousClose??cur})||cur;
          return{current:cur,prev};
        }
      }
    }catch(e){}
  }

  const idxAll=[
    "https://api-apps.idx.co.id/api/Bond/GetBondBursaAllData",
    "https://api-apps.idx.co.id/api/BondBursa/GetBondBursaAllData",
    "https://api-apps.idx.co.id/api/Bond/GetAllBondData",
  ];
  for(const url of idxAll){
    try{
      const d=await tryDirect(url,10000);
      const arr=Array.isArray(d)?d:Array.isArray(d?.data)?d.data:Array.isArray(d?.Data)?d.Data:[];
      const bond=arr.find(x=>Object.values(x).some(v=>String(v).toUpperCase()===sn));
      if(bond){const cur=bondPrice(bond);if(cur>0)return{current:cur,prev:cur};}
    }catch(e){}
  }

  try{
    const d=await fetchWithProxy(`https://www.phei.co.id/api/bond/price?code=${sn}`,6000);
    const item=d?.data||d;
    const cur=parseFloat(item?.price||item?.cleanPrice||item?.dirtyPrice||0);
    if(cur>0)return{current:cur,prev:parseFloat(item?.previousPrice||cur)};
  }catch(e){}

  try{
    const d=await fetchWithProxy(`https://api.bareksa.com/v2/fixed-income/product?isin_code=${sn}&type=sukuk`,6000);
    const item=d?.data?.[0]||d;
    const cur=parseFloat(item?.nav||item?.price||item?.lastPrice||0);
    if(cur>0)return{current:cur,prev:cur};
  }catch(e){}

  try{
    const raw=await fetchWithProxyRaw(`https://stooq.com/q/d/l/?s=${sn.toLowerCase()}.id&f=sd2ohlcv&e=csv`,6000);
    const lines=raw.trim().split("\n").filter(l=>l&&!l.startsWith("Symbol")&&!l.startsWith("Date")&&l.trim());
    if(lines.length){
      const p=lines[lines.length-1].split(",");const cur=parseFloat(p[5])||0;
      const prev=lines.length>1?(parseFloat(lines[lines.length-2].split(",")[5])||cur):cur;
      if(cur>0)return{current:cur,prev};
    }
  }catch(e){}

  throw new Error(sn+": bond price unavailable — enter manually");
}

// ─── Compute Holding ──────────────────────────────────────────────────────────
function computeHolding(h,prices,prevPrices,R){
  let qty=0,cbL=0,rgL=0,lots=[],divL=0;
  const txs=[...h.transactions].sort((a,b)=>new Date(a.date)-new Date(b.date));
  for(const tx of txs){
    if(tx.type==="buy"){lots.push({qty:tx.qty,price:tx.price});qty+=tx.qty;cbL+=tx.qty*tx.price;}
    else if(tx.type==="sell"){let rem=tx.qty;qty-=tx.qty;while(rem>0&&lots.length){const lot=lots[0],used=Math.min(lot.qty,rem);rgL+=used*(tx.price-lot.price);cbL-=used*lot.price;lot.qty-=used;rem-=used;if(lot.qty===0)lots.shift();}}
    else if(tx.type==="dividend"){divL+=tx.totalAmount||0;}
  }
  const cpL=prices[h.ticker]??0,pcL=prevPrices[h.ticker]??cpL;
  const cvL=qty*cpL,ugL=cvL-cbL,dgL=(cpL-pcL)*qty,dgPct=pcL>0?(cpL-pcL)/pcL*100:0;
  const cv=toAUD(cvL,h.currency,R),cb=toAUD(cbL,h.currency,R),ug=toAUD(ugL,h.currency,R);
  const rg=toAUD(rgL,h.currency,R),divs=toAUD(divL,h.currency,R),dg=toAUD(dgL,h.currency,R);
  const totalInv=txs.filter(t=>t.type==="buy").reduce((s,t)=>s+toAUD(t.qty*t.price,h.currency,R),0);
  const totalGain=ug+rg+divs,gainPct=totalInv>0?(totalGain/totalInv)*100:0;
  const divYoc=totalInv>0?(divs/totalInv)*100:0;
  return{...h,qty,costBasis:cb,currentPrice:cpL,prevClose:pcL,currentValue:cv,unrealizedGain:ug,
    realizedGain:rg,totalDividends:divs,totalGain,gainPct,dayGain:dg,dayGainPct:dgPct,
    divYieldOnCost:divYoc,totalInvested:totalInv};
}

function ChartWaterfall({data,T,yFmt,height=240}){
  const ref=useRef(null);const inst=useRef(null);
  useEffect(()=>{
    if(!ref.current||typeof Chart==="undefined"||!data.length)return;
    if(inst.current)inst.current.destroy();
    const labels=data.map(d=>d.label);
    let running=data.length>0?data[0].value:0;
    const bases=[],tops=[],bgColors=[],borderColors=[];
    const intermediateMins=[],intermediateMaxs=[];
    data.forEach(d=>{
      if(d.type==="pos"||d.type==="neg"){
        intermediateMins.push(Math.min(running,running+d.value));
        intermediateMaxs.push(Math.max(running,running+d.value));
      }
    });
    running=data.length>0?data[0].value:0;
    data.forEach(d=>{
      if(d.type==="start"){
        bases.push(0);tops.push(d.value);
        bgColors.push("#6366f177");borderColors.push("#6366f1");
      }else if(d.type==="total"){
        bases.push(0);tops.push(d.value);
        bgColors.push(d.value>=(data[0]?.value??0)?"#6366f1":"#ef4444");
        borderColors.push(d.value>=(data[0]?.value??0)?"#818cf8":"#f87171");
      }else if(d.type==="pos"){
        bases.push(running);tops.push(running+d.value);
        bgColors.push("#22c55e");borderColors.push("#4ade80");
        running+=d.value;
      }else{
        bases.push(running+d.value);tops.push(running);
        bgColors.push("#ef4444");borderColors.push("#f87171");
        running+=d.value;
      }
    });
    const floatData=bases.map((b,i)=>[Math.min(b,tops[i]),Math.max(b,tops[i])]);
    const allIntermediate=intermediateMins.concat(intermediateMaxs);
    const interMin=allIntermediate.length?Math.min(...allIntermediate):0;
    const interMax=allIntermediate.length?Math.max(...allIntermediate):0;
    const interRange=interMax-interMin;
    const startVal=data[0]?.value??0;
    const endVal=data[data.length-1]?.value??0;
    const bigVal=Math.max(startVal,endVal);
    const useCompressed=interRange>0&&interRange/bigVal<0.15&&bigVal>0;
    const yMin=useCompressed?Math.max(0,interMin-interRange*2):0;
    const yMax=useCompressed?Math.min(bigVal,interMax+interRange*2):bigVal*1.05;
    inst.current=new Chart(ref.current,{
      type:"bar",
      data:{labels,datasets:[{
        data:floatData,
        backgroundColor:bgColors,
        borderColor:borderColors,
        borderWidth:1.5,
        borderRadius:4,
        borderSkipped:false,
      }]},
      options:{
        responsive:true,maintainAspectRatio:false,
        plugins:{
          legend:{display:false},
          tooltip:{
            backgroundColor:T.bg3,borderColor:T.border,borderWidth:1,
            titleColor:T.text,bodyColor:T.text2,padding:10,cornerRadius:8,
            callbacks:{label:(ctx)=>{
              const d2=data[ctx.dataIndex];
              const v=d2.value;
              const sign=v>=0?"+":"";
              const pct=data[0]?.value?((v/Math.abs(data[0].value))*100).toFixed(1):0;
              return`${sign}${yFmt?yFmt(Math.abs(v)):"A$"+(Math.abs(v)/1000).toFixed(1)+"K"} (${sign}${pct}%)`;
            }},
          },
          annotation:useCompressed?{annotations:{
            breakTop:{type:"line",yMin:yMax,yMax:yMax,borderColor:T.border,borderWidth:1,borderDash:[4,4]},
            breakBot:{type:"line",yMin:yMin,yMax:yMin,borderColor:T.border,borderWidth:1,borderDash:[4,4]},
            note:{type:"label",xValue:0,yValue:yMax,content:"* Start/End bars compressed for scale",color:T.text3,font:{size:9}},
          }}:{},
        },
        scales:{
          x:{grid:{color:"transparent"},ticks:{color:T.chartTick,font:{size:10}},border:{color:T.border}},
          y:{
            grid:{color:T.chartGrid},
            ticks:{color:T.chartTick,font:{size:10},callback:yFmt||(v=>`A$${(v/1000).toFixed(0)}K`)},
            border:{color:T.border},
            ...(useCompressed?{min:yMin,max:yMax}:{}),
          },
        },
      }
    });
    return()=>{if(inst.current)inst.current.destroy();};
  },[data,T,yFmt]);
  return(
    <div style={{height,position:"relative"}}>
      {data.length
        ?<canvas ref={ref}/>
        :<div style={{height,display:"flex",alignItems:"center",justifyContent:"center",color:T.text3,fontSize:12}}>No data for selected period</div>
      }
    </div>
  );
}

function readFileAsRows(file){
  return new Promise((resolve,reject)=>{
    const ext=file.name.split(".").pop().toLowerCase();
    if(ext==="csv"||ext==="txt"){
      const reader=new FileReader();
      reader.onload=e=>{
        const result=Papa.parse(e.target.result,{header:true,skipEmptyLines:true,dynamicTyping:false});
        resolve(result.data);
      };
      reader.onerror=reject;
      reader.readAsText(file);
    }else if(["xlsx","xls","ods"].includes(ext)){
      const reader=new FileReader();
      reader.onload=e=>{
        const wb=XLSX.read(e.target.result,{type:"array",cellDates:false});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const data=XLSX.utils.sheet_to_json(ws,{defval:"",raw:true});
        resolve(data);
      };
      reader.onerror=reject;
      reader.readAsArrayBuffer(file);
    }else{
      reject(new Error("Unsupported file type: ."+ext+". Use .csv, .xlsx or .xls"));
    }
  });
}

              {FB_CONFIGURED?(
                fbUser?(
                  <div style={{display:"flex",alignItems:"center",gap:4}}>
                    <div style={{display:"flex",background:T.bg4,borderRadius:8,border:`1px solid ${T.border}`,overflow:"hidden"}}>
                      <button onClick={cloudLoadAll} disabled={syncSt==="loading"||syncSt==="saving"} title="Pull latest data from cloud" style={{padding:"6px 9px",fontSize:11,border:"none",background:"transparent",color:syncSt==="loading"?T.amber:T.teal,cursor:"pointer"}}>{syncSt==="loading"?"⟳":"⬇️"}</button>
                      <button onClick={cloudSaveAll} disabled={syncSt==="loading"||syncSt==="saving"} title="Push local data to cloud" style={{padding:"6px 9px",fontSize:11,border:"none",background:"transparent",color:syncSt==="saving"?T.amber:syncSt==="ok"?T.green:syncSt==="error"?T.red:T.teal,cursor:"pointer"}}>{syncSt==="saving"?"⟳":"⬆️"}</button>
                      <button onClick={()=>signOut()} title={"Signed in: "+fbUser.displayName+"\nClick to sign out"} style={{padding:"6px 9px",fontSize:11,border:"none",background:"transparent",color:T.text3,cursor:"pointer"}}>{fbUser.photoURL?<img src={fbUser.photoURL} style={{width:16,height:16,borderRadius:"50%",verticalAlign:"middle"}} alt=""/>:"👤"}</button>
                    </div>
                    {syncMsg&&!isMob&&<span style={{fontSize:9,color:syncSt==="error"?T.red:syncSt==="ok"?T.green:T.amber,maxWidth:120,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{syncMsg}</span>}
                  </div>
                ):(
                  <button onClick={()=>signInGoogle().then(u=>{setFbUser(u);cloudLoadAll();}).catch(e=>setSyncMsg(e.message))} style={{...bO(T.teal,{fontSize:11,padding:"6px 10px",display:"flex",alignItems:"center",gap:5})}}>☁️ {isMob?"":"Sync"}</button>
                )
              ):(
                <button onClick={()=>setModal({mode:"firebaseSetup"})} style={{...bO(T.text3,{fontSize:11,padding:"6px 10px"})}}>☁️ {isMob?"":"Setup Sync"}</button>
              )}
              <button onClick={openAdd} style={{...bS(T.greenBtn,"#fff",{padding:"7px 12px",fontSize:11})}}>+ Add</button>
            </div>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:10,padding:"4px 14px",background:T.bg,borderTop:`1px solid ${T.border}`,fontSize:10,color:T.text3,flexWrap:"wrap",minHeight:26}}>
            {/* ... status bar unchanged */}
          </div>
        </header>

        {/* View switcher */}
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"8px 14px",borderBottom:`1px solid ${T.border}`,background:T.bg2,flexWrap:"wrap",gap:8}}>
          <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
            {view==="treemap"&&tmMode==="performance"&&<>
              <span style={{fontSize:9,color:T.text3,letterSpacing:1,textTransform:"uppercase",marginRight:2}}>G/L to date:</span>
              {[[-4,"≤-3%"],[-2,"-1%"],[0,"0"],[1,"+1%"],[4,"+3%+"]].map(([p,l])=>{const c=gainColor(p,dark);return(<div key={l} style={{display:"flex",alignItems:"center",gap:3}}><div style={{width:11,height:11,borderRadius:2,background:c.bg,border:`1px solid ${c.border}`}}/><span style={{fontSize:9,color:T.text3}}>{l}</span></div>);})}
              <span style={{fontSize:9,color:T.text4,marginLeft:6}}>· Box size = current market value · Colour = total return %</span>
            </>}
            {view==="treemap"&&tmMode==="day"&&<>
              <span style={{fontSize:9,color:T.text3,letterSpacing:1,textTransform:"uppercase",marginRight:2}}>Day G/L %:</span>
              {[[-3,"≤-2%"],[-1,"-0.5%"],[0,"0"],[0.6,"+0.5%"],[3,"+2%+"]].map(([p,l])=>{const c=dayColor(p,dark);return(<div key={l} style={{display:"flex",alignItems:"center",gap:3}}><div style={{width:11,height:11,borderRadius:2,background:c.bg,border:`1px solid ${c.border}`}}/><span style={{fontSize:9,color:T.text3}}>{l}</span></div>);})}
              <span style={{fontSize:9,color:T.text4,marginLeft:6}}>· Box size = absolute $ day change · Colour = day return %</span>
            </>}
            {view==="treemap"&&tmMode==="dividend"&&<>
              <span style={{fontSize:9,color:T.text3,letterSpacing:1,textTransform:"uppercase",marginRight:2}}>Div yld/cost:</span>
              {[[-1,"0%"],[0.5,">0%"],[2,"+2%"],[4,"+4%"],[6,"+6%+"]].map(([y,l])=>{const c=divColor(y,dark);return(<div key={l} style={{display:"flex",alignItems:"center",gap:3}}><div style={{width:11,height:11,borderRadius:2,background:c.bg,border:`1px solid ${c.border}`}}/><span style={{fontSize:9,color:T.text3}}>{l}</span></div>);})}
              <span style={{fontSize:9,color:T.text4,marginLeft:6}}>· Box size = total dividends received · Colour = yield on cost %</span>
            </>}
          </div>
          <div style={{display:"flex",gap:6}}>
            {view==="treemap"&&(
              <div style={{display:"flex",gap:6,alignItems:"center"}}>
                <div style={{display:"flex",background:T.bg4,borderRadius:8,padding:2,border:`1px solid ${T.border}`}}>
                  {[["performance","📈 Perf"],["day","☀️ Day"],["dividend","💰 Div"]].map(([v,l])=>(
                    <button key={v} onClick={()=>setTmMode(v)} style={{padding:"4px 10px",borderRadius:6,border:"none",background:tmMode===v?T.bg2:"transparent",color:tmMode===v?T.text:T.text3,fontSize:10,transition:"all .15s"}}>{l}</button>
                  ))}
                </div>
                {(tmMode==="day"||tmMode==="dividend")&&(
                  <button onClick={()=>setTmShowVal(v=>!v)} title={tmShowVal?"Show % only":"Show % and value"} style={{padding:"4px 10px",borderRadius:8,border:`1px solid ${T.border}`,background:!tmShowVal?T.teal:T.bg4,color:!tmShowVal?"#fff":T.text3,fontSize:10,fontWeight:600,transition:"all .15s",whiteSpace:"nowrap"}}>{tmShowVal?"% only":"% + val"}</button>
                )}
              </div>
            )}
            <div style={{display:"flex",background:T.bg4,borderRadius:8,padding:2,border:`1px solid ${T.border}`}}>
              {[["treemap","Map"],["table","Table"],["chart","Charts"]].map(([v,l])=>(
                <button key={v} onClick={()=>setView(v)} style={{padding:"4px 10px",borderRadius:6,border:"none",background:view===v?T.bg2:"transparent",color:view===v?T.text:T.text3,fontSize:10,transition:"all .15s"}}>{l}</button>
              ))}
            </div>
          </div>
        </div>

        <main style={{padding:"12px 14px"}}>
          {view==="treemap"&&(
            <div className="tm-wrap" style={{display:"flex",gap:12,alignItems:"flex-start",flexWrap:isMob?"wrap":"nowrap"}}>
              <div ref={mapRef} style={{flex:"1 1 280px",width:isMob?"100%":"auto",height:isMob?"calc(100vw - 28px)":440,position:"relative",borderRadius:12,overflow:"hidden",border:`1px solid ${T.border}`,background:T.bg3,minWidth:200}}>
                {rects.map(r=>{
                  const c=tmSlider!=null&&sliderRects!=null?gainColor(r.gainPct??0,dark):(tmMode==="performance"?gainColor(r.gainPct,dark):tmMode==="day"?dayColor(r.dayGainPct,dark):divColor(r.divYieldOnCost,dark));
                  const area=r.w*r.h;
                  // Show ticker for all modes if area > 900 (ensures visibility)
                  const showTicker = area > 900;
                  // Show percentage for all modes if area > 800
                  const showPct = area > 800;
                  // Only for performance mode, show value when box is large enough
                  const showValue = tmMode==="performance" && area > 2500 && !valuesHidden;
                  return(
                    <div key={r.ticker} onClick={()=>setSelected(r.ticker===selected?null:r.ticker)}
                      style={{position:"absolute",left:r.x+1,top:r.y+1,width:r.w-2,height:r.h-2,background:c.bg,border:`1px solid ${c.border}`,borderRadius:5,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",cursor:"pointer",overflow:"hidden",outline:r.ticker===selected?`2px solid ${c.text}`:"none",transition:"filter .12s"}}
                      onMouseEnter={e=>e.currentTarget.style.filter="brightness(1.2)"}
                      onMouseLeave={e=>e.currentTarget.style.filter="brightness(1)"}
                    >
                      {showTicker && <span style={{fontSize:area>2500?15:area>1400?11:10,fontFamily:"'Space Mono',monospace",fontWeight:700,color:c.text,letterSpacing:.5,textAlign:"center",padding:"0 3px",lineHeight:1.2}}>{r.ticker}</span>}
                      {showPct && (
                        <span style={{fontSize:area>2500?12:9,fontFamily:"'Space Mono',monospace",color:c.text,opacity:.85,marginTop:1}}>
                          {tmMode==="performance"?fmtPct(r.gainPct):tmMode==="day"?fmtPct(r.dayGainPct):(tmShowVal?fmtPct(r.divYieldOnCost)+" yld":fmtPct(r.divYieldOnCost))}
                        </span>
                      )}
                      {showValue && <span style={{fontSize:area>3500?11:9,fontFamily:"'Space Mono',monospace",color:c.text,opacity:.7,marginTop:1}}>{FC(r.currentValue,true)}</span>}
                      {r.isBondPct && showTicker && <span style={{fontSize:7,color:c.text,opacity:.5,marginTop:1}}>BOND</span>}
                    </div>
                  );
                })}
                {rects.length===0&&<div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",color:T.text4,fontFamily:"'Space Mono',monospace",fontSize:11,textAlign:"center",padding:20}}>{tmMode==="dividend"?"No dividends recorded yet":"No holdings — tap + Add"}</div>}
              </div>
              <div className="detail-panel" style={{width:isMob?"100%":264,flexShrink:0,...card({padding:16,minHeight:isMob?0:200})}}>
                {/* ... detail panel unchanged */}
              </div>
            </div>
          )}
          {view==="table"&&(
            <div style={{overflowX:"auto",...card()}}>
              {/* ... table unchanged */}
            </div>
          )}
          {view==="chart"&&(
            <div style={{display:"flex",flexDirection:"column",gap:14}}>
              <div style={{display:"grid",gridTemplateColumns:isMob?"1fr 1fr":"repeat(5,1fr)",gap:10}}>
                {/* ... summary cards unchanged */}
              </div>
              <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                <span style={{fontSize:11,color:T.text3,fontWeight:500}}>Time period:</span>
                <div style={{display:"flex",gap:3,background:T.bg3,padding:3,borderRadius:10,border:`1px solid ${T.border}`}}>
                  {["1M","3M","6M","YTD","1Y","5Y"].map(p=>(
                    <button key={p} onClick={()=>setChartPeriod(p)} style={{padding:"5px 12px",borderRadius:7,border:"none",background:chartPeriod===p?`linear-gradient(135deg,#22c55e,#06b6d4)`:"transparent",color:chartPeriod===p?"#fff":T.text3,fontSize:11,fontWeight:chartPeriod===p?700:500,transition:"all .15s",cursor:"pointer"}}>{p}</button>
                  ))}
                </div>
                <span style={{fontSize:10,color:T.text3,marginLeft:4}}>{chartData.labels.length} data points</span>
              </div>
              <div className="chart-row" style={{display:"flex",gap:12,flexWrap:isMob?"wrap":"nowrap"}}>
                <div style={{flex:"2 1 280px",...card({padding:16})}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
                    <div>
                      <div style={{fontSize:12,fontWeight:600,color:T.text,marginBottom:2}}>Portfolio Value Over Time</div>
                      <div style={{fontSize:11,color:T.text3}}>{displayCur} · {chartPeriod} view</div>
                    </div>
                    {chartData.labels.length>=2&&<div style={{textAlign:"right"}}>
                      <div style={{fontSize:10,color:T.text3}}>Period return</div>
                      <div style={{fontFamily:"'Space Mono',monospace",fontSize:12,fontWeight:700,color:pColor(chartData.endVal-chartData.startVal)}}>{fmtPct(chartData.startVal>0?(chartData.endVal-chartData.startVal)/chartData.startVal*100:0)}</div>
                    </div>}
                  </div>
                  <ChartLine labels={chartData.labels} datasets={[
                    {label:"Portfolio Value",data:chartData.vals,borderColor:dark?"#22c55e":"#16a34a",backgroundColor:dark?"rgba(34,197,94,.07)":"rgba(22,163,74,.06)",fill:true,borderWidth:2,yAxisID:"y"},
                    {label:"Cum. Dividends / Coupons",data:chartData.divCumul,borderColor:dark?"#06b6d4":"#0891b2",backgroundColor:"transparent",borderDash:[5,4],borderWidth:1.5,yAxisID:"y2"}
                  ]} T={T} yFmt={yFmtD} y2Fmt={yFmtD} height={isMob?170:230}/>
                </div>
                <div style={{flex:"1 1 200px",...card({padding:16})}}>
                  <div style={{fontSize:12,fontWeight:600,color:T.text,marginBottom:2}}>Asset Allocation</div>
                  <div style={{fontSize:11,color:T.text3,marginBottom:12}}>by type · {displayCur}</div>
                  <ChartDoughnut labels={chartData.tLabels} data={chartData.tVals} colors={chartData.palette} T={T} height={isMob?180:230}/>
                </div>
              </div>
              {/* Dividend Contribution with cumulative line */}
              <div className="chart-row" style={{display:"flex",gap:12,flexWrap:isMob?"wrap":"nowrap"}}>
                <div style={{flex:"2 1 280px",...card({padding:16})}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
                    <div>
                      <div style={{fontSize:12,fontWeight:600,color:T.text,marginBottom:2}}>📈 Monthly Dividend & Coupon Contributions</div>
                      <div style={{fontSize:11,color:T.text3}}>{chartData.mLabels.length} months · {chartPeriod} · {displayCur}</div>
                    </div>
                    {chartData.divCAGR!=null&&<div style={{textAlign:"right"}}>
                      <div style={{fontSize:9,color:T.text3,letterSpacing:.5,textTransform:"uppercase"}}>Dividend CAGR</div>
                      <div style={{fontFamily:"'Space Mono',monospace",fontSize:13,fontWeight:700,color:chartData.divCAGR>=0?T.green:T.red}}>{chartData.divCAGR>=0?"+":""}{chartData.divCAGR.toFixed(1)}%</div>
                      <div style={{fontSize:9,color:T.text3}}>{chartData.divCAGRYears}yr growth</div>
                    </div>}
                  </div>
                  <ChartBar
                    labels={chartData.mLabels}
                    datasets={chartData.mDatasets && chartData.mDatasets.length ? chartData.mDatasets : [{label:"Income",data:chartData.mVals,backgroundColor:dark?"rgba(6,182,212,.72)":"rgba(8,145,178,.6)",borderColor:dark?"#06b6d4":"#0891b2",borderWidth:1,borderRadius:5}]}
                    T={T} yFmt={yFmtD} y2Fmt={yFmtD} height={isMob?160:210}
                    stacked={!!(chartData.mDatasets && chartData.mDatasets.length>1)}
                    lineDatasets={[
                      {label:"Cumulative",data:chartData.cumDividends,borderColor:dark?"#06b6d4":"#0891b2",backgroundColor:"transparent",borderWidth:2,pointRadius:2}
                    ]}
                  />
                  <div style={{fontSize:9,color:T.text3,marginTop:6}}>Teal line = cumulative total dividends</div>
                </div>
                <div style={{flex:"1 1 200px",...card({padding:16})}}>
                  <div style={{fontSize:12,fontWeight:600,color:T.text,marginBottom:2}}>Currency Split</div>
                  <div style={{fontSize:11,color:T.text3,marginBottom:12}}>by holding currency · {displayCur}</div>
                  <ChartDoughnut labels={chartData.byCurLabels} data={chartData.byCurVals} colors={chartData.byCurColors} T={T} height={isMob?160:210}/>
                </div>
              </div>
              {/* Net Buy Tracker – horizontal stacked bar */}
              <div style={{...card({padding:16})}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12,flexWrap:"wrap",gap:8}}>
                  <div>
                    <div style={{fontSize:12,fontWeight:600,color:T.text,marginBottom:2}}>📦 Net Buy Tracker — {chartPeriod}</div>
                    <div style={{fontSize:11,color:T.text3}}>Net purchases (buys minus sells) by asset class</div>
                  </div>
                </div>
                <ChartBar
                  labels={chartData.netBuyMonths}
                  datasets={chartData.netBuyDatasets}
                  T={T} yFmt={yFmtD}
                  height={isMob?220:260}
                  stacked={true}
                  horizontal={true}
                />
              </div>
              {/* Growth Contributors (Waterfall) */}
              <div style={{...card({padding:16})}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12,flexWrap:"wrap",gap:8}}>
                  <div>
                    <div style={{fontSize:12,fontWeight:600,color:T.text,marginBottom:2}}>📊 Growth Contributors — {chartPeriod}</div>
                    <div style={{fontSize:11,color:T.text3}}>Breakdown of what drove your portfolio value change</div>
                  </div>
                  <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>
                    {[["Start / End","#6366f155"],["Capital Gain","#22c55e"],["Capital Loss","#ef4444"],["Top-Up (Buy)","#22c55e"],["Dividends","#22c55e"]].map(([l,c])=>(
                      <div key={l} style={{display:"flex",alignItems:"center",gap:4}}>
                        <div style={{width:10,height:10,borderRadius:2,background:c}}/>
                        <span style={{fontSize:10,color:T.text3}}>{l}</span>
                      </div>
                    ))}
                  </div>
                </div>
                <ChartWaterfall data={chartData.waterfallData} T={T} yFmt={yFmtD} height={isMob?220:270}/>
                {chartData.waterfallData.length>1&&(()=>{
                  const wf=chartData.waterfallData;
                  const capItem=wf.find(d=>d.label==="Capital Gain"||d.label==="Capital Loss");
                  const topUp=wf.find(d=>d.label==="Top-Ups");
                  const divItem=wf.find(d=>d.label==="Dividends");
                  const total=chartData.endVal-chartData.startVal;
                  const pct=(v)=>total!==0?(v/Math.abs(total)*100).toFixed(0)+"%":"—";
                  return(
                    <div style={{display:"flex",gap:8,marginTop:12,flexWrap:"wrap"}}>
                      {[
                        ["💹 Capital G/L",capItem?.value??0,capItem?.value>=0?"#22c55e":"#ef4444",pct(capItem?.value??0)],
                        ["💸 Top-Ups",topUp?.value??0,"#6366f1",pct(topUp?.value??0)],
                        ["🌱 Dividends",divItem?.value??0,T.teal,pct(divItem?.value??0)],
                      ].map(([l,v,c,p])=>(
                        <div key={l} style={{background:T.bg4,border:`1px solid ${T.border}`,borderRadius:8,padding:"8px 12px",flex:"1 1 100px",minWidth:100}}>
                          <div style={{fontSize:10,color:T.text3,marginBottom:3}}>{l}</div>
                          <div style={{fontFamily:"'Space Mono',monospace",fontSize:12,fontWeight:700,color:c}}>{FC(v,true)}</div>
                          <div style={{fontSize:10,color:T.text3,marginTop:1}}>{p} of change</div>
                        </div>
                      ))}
                    </div>
                  );
                })()}
              </div>
              {/* Benchmark Comparison */}
              <div style={{...card({padding:16})}}>
                {/* ... benchmark comparison unchanged */}
              </div>
            </div>
          )}
        </main>

        {/* Modals (all unchanged) */}
        {/* ... */}
      </div>
    </ErrorBoundary>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
