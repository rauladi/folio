// ========== ERROR BOUNDARY ==========
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { hasError: false, error: null }; }
  static getDerivedStateFromError(error) { return { hasError: true, error }; }
  componentDidCatch(error, info) { console.error("React error boundary caught:", error, info); }
  render() {
    if (this.state.hasError) {
      return (
        <div style={{ padding: 20, color: "red", background: "#fff", fontFamily: "monospace" }}>
          <h2>Something went wrong.</h2>
          <pre>{this.state.error?.stack}</pre>
          <button onClick={() => window.location.reload()}>Reload</button>
        </div>
      );
    }
    return this.props.children;
  }
}

// ─── Treemap squarify ────────────────────────────────────────────────────
function squarify(items,x,y,w,h){
  if(!items.length)return[];
  const r=[];_layout(items,x,y,w,h,items.reduce((s,i)=>s+i.value,0),r);return r;
}
function _layout(it,x,y,w,h,tot,r){
  if(!it.length)return;
  if(it.length===1){r.push({...it[0],x,y,w,h});return;}
  const hz=w>=h,dim=hz?w:h;let row=[],rt=0,best=Infinity;
  for(let i=0;i<it.length;i++){
    row.push(it[i]);rt+=it[i].value;
    const rd=(rt/tot)*dim;let worst=0;
    for(const ri of row){const od=(ri.value/rt)*(hz?h:w);const ra=Math.max(rd/od,od/rd);if(ra>worst)worst=ra;}
    if(worst>best){row.pop();rt-=it[i].value;break;}best=worst;
  }
  const rd=(rt/tot)*dim;let cur=hz?y:x;
  for(const ri of row){const sz=(ri.value/rt)*(hz?h:w);hz?r.push({...ri,x,y:cur,w:rd,h:sz}):r.push({...ri,x:cur,y,w:sz,h:sz});cur+=sz;}
  const rem=it.slice(row.length);if(!rem.length)return;
  const remT=tot-rt;hz?_layout(rem,x+rd,y,w-rd,h,remT,r):_layout(rem,x,y+rd,w,h-rd,remT,r);
}

// ─── Currency ────────────────────────────────────────────────────────────
const toAUD=(a,cur,R)=>{if(cur==="IDR")return a/R.AUD_IDR;if(cur==="USD")return a/R.AUD_USD;return a;};
const fromAUD=(a,cur,R)=>{if(cur==="IDR")return a*R.AUD_IDR;if(cur==="USD")return a*R.AUD_USD;return a;};
function fmtIDR(n){try{return Math.round(n).toLocaleString("id-ID");}catch{return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,".");}}
function fmtAUD(n){return Math.abs(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,",");}
function fmtCur(audAmt,dc,R,compact=false){
  const a=fromAUD(audAmt,dc,R);
  if(dc==="IDR"){const abs=Math.abs(a);if(compact&&abs>=1e9)return`Rp${(a/1e9).toFixed(1)}M`;if(compact&&abs>=1e6)return`Rp${(a/1e6).toFixed(1)}Jt`;if(compact&&abs>=1e3)return`Rp${(a/1e3).toFixed(0)}Rb`;return`Rp ${fmtIDR(a)}`;}
  if(dc==="USD"){const abs=Math.abs(a);if(compact&&abs>=1e6)return`US$${(a/1e6).toFixed(2)}M`;if(compact&&abs>=1e3)return`US$${(a/1e3).toFixed(1)}K`;return`US$${fmtAUD(a)}`;}
  const abs=Math.abs(a);if(compact&&abs>=1e6)return`A$${(a/1e6).toFixed(2)}M`;if(compact&&abs>=1e3)return`A$${(a/1e3).toFixed(1)}K`;return`A$${fmtAUD(a)}`;
}
function fmtGain(audAmt,dc,R){
  const a=fromAUD(audAmt,dc,R);const sign=a>=0?"+":"-";
  if(dc==="IDR")return`${sign}Rp ${fmtIDR(Math.abs(a))}`;
  if(dc==="USD")return`${sign}US$${fmtAUD(a)}`;
  return`${sign}A$${fmtAUD(a)}`;
}
const fmtPct=n=>`${n>=0?"+":""}${n.toFixed(2)}%`;

function ChartBar({labels,datasets,T,yFmt,height=200,stacked=false}){

    if (!ref.current || typeof Chart === "undefined") return;

      options: {

        },
        scales: {

          y: { grid: { color: T.chartGrid }, ticks: { color: T.chartTick, font: { size: 10 }, callback: yFmt || ((v) => `A$${v.toFixed(0)}`) }, border: { color: T.border }, stacked: stacked }
        }
      }
    });
    return () => { if (inst.current) inst.current.destroy(); };

}

// ─── computeHolding ──────────────────────────────────────────────────────
function computeHolding(h,prices,prevPrices,R){
  let qty=0,cbL=0,rgL=0,lots=[],divL=0;
  const txs=[...h.transactions].sort((a,b)=>new Date(a.date)-new Date(b.date));
  for(const tx of txs){
    if(tx.type==="buy"){lots.push({qty:tx.qty,price:tx.price});qty+=tx.qty;cbL+=tx.qty*tx.price;}
    else if(tx.type==="sell"){let rem=tx.qty;qty-=tx.qty;while(rem>0&&lots.length){const lot=lots[0],used=Math.min(lot.qty,rem);rgL+=used*(tx.price-lot.price);cbL-=used*lot.price;lot.qty-=used;rem-=used;if(lot.qty===0)lots.shift();}}
    else if(tx.type==="dividend"){divL+=tx.totalAmount||0;}
  }
  const cpL=prices[h.ticker]??0,pcL=prevPrices[h.ticker]??cpL;
  const cvL=qty*cpL,ugL=cvL-cbL,dgL=(cpL-pcL)*qty,dgPct=pcL>0?(cpL-pcL)/pcL*100:0;
  const cv=toAUD(cvL,h.currency,R),cb=toAUD(cbL,h.currency,R),ug=toAUD(ugL,h.currency,R);
  const rg=toAUD(rgL,h.currency,R),divs=toAUD(divL,h.currency,R),dg=toAUD(dgL,h.currency,R);
  const totalInv=txs.filter(t=>t.type==="buy").reduce((s,t)=>s+toAUD(t.qty*t.price,h.currency,R),0);
  const totalGain=ug+rg+divs,gainPct=totalInv>0?(totalGain/totalInv)*100:0;
  const divYoc=totalInv>0?(divs/totalInv)*100:0;
  return{...h,qty,costBasis:cb,currentPrice:cpL,prevClose:pcL,currentValue:cv,unrealizedGain:ug,
    realizedGain:rg,totalDividends:divs,totalGain,gainPct,dayGain:dg,dayGainPct:dgPct,
    divYieldOnCost:divYoc,totalInvested:totalInv};
}

  const T=dark?DARK:LIGHT;
  const isMob=useWindowSize()<768;

  useEffect(()=>{localStorage.setItem("f6_p",JSON.stringify(portfolio));},[portfolio]);
  useEffect(()=>{localStorage.setItem("f6_dark",JSON.stringify(dark));},[dark]);
  
  const holdings=useMemo(()=>portfolio.map(h=>computeHolding(h,prices,prevPrices,rates)).filter(h=>h.qty>0),[portfolio,prices,prevPrices,rates]);
  const totVal=holdings.reduce((s,h)=>s+h.currentValue,0);
  const FC=(a,compact=false)=>valuesHidden?"••••••":fmtCur(a,displayCur,rates,compact);
  const FG=(a)=>valuesHidden?"••••••":fmtGain(a,displayCur,rates);
  const periodCutoff = useCallback((period) => { const now=new Date(); if(period==="1M"){const d=new Date(now);d.setMonth(d.getMonth()-1);return d;} if(period==="3M"){const d=new Date(now);d.setMonth(d.getMonth()-3);return d;} if(period==="6M"){const d=new Date(now);d.setMonth(d.getMonth()-6);return d;} if(period==="YTD"){return new Date(now.getFullYear(),0,1);} if(period==="1Y"){const d=new Date(now);d.setFullYear(d.getFullYear()-1);return d;} if(period==="5Y"){const d=new Date(now);d.setFullYear(d.getFullYear()-5);return d;} return new Date(0); },[]);

  // ---- NET BUY TRACKER ----
  const netBuyData = useMemo(() => {
    const cutoff = periodCutoff(chartPeriod);
    const categoryMap = new Map();
    for (const h of portfolio) {
      for (const tx of h.transactions) {
        if (!tx.date) continue;
        const txDate = new Date(tx.date);
        if (txDate < cutoff) continue;
        let valAUD = 0;
        if (tx.type === "buy") valAUD = toAUD(tx.qty * tx.price, h.currency, rates);
        else if (tx.type === "sell") valAUD = -toAUD(tx.qty * tx.price, h.currency, rates);
        else continue;
        const cat = getAssetCategory(h.assetType, h.ticker);
        categoryMap.set(cat, (categoryMap.get(cat) || 0) + valAUD);
      }
    }
    const total = Array.from(categoryMap.values()).reduce((a,b)=>a+b,0);
    const categories = Array.from(categoryMap.entries()).sort((a,b)=>b[1]-a[1]).map(([name,val])=> ({name,val,color: name==="Equities & REITs"?"#22c55e":name==="Bonds & Sukuk"?"#06b6d4":name==="Superannuation"?"#f59e0b":"#8b5cf6"}));
    return { total, categories, hasData: Math.abs(total)>0.01 };
  }, [portfolio, rates, chartPeriod, periodCutoff]);

  // ---- REVAMPED DIVIDEND CONTRIBUTION ----
  const divContributionData = useMemo(() => {
    const cutoff = periodCutoff(chartPeriod);
    const monthlyMap = new Map();
    for (const h of portfolio) {
      for (const tx of h.transactions) {
        if (tx.type !== "dividend" || !tx.date) continue;
        const txDate = new Date(tx.date);
        if (txDate < cutoff) continue;
        const monthKey = tx.date.slice(0,7);
        const valAUD = toAUD(tx.totalAmount || 0, h.currency, rates);
        const cat = getAssetCategory(h.assetType, h.ticker);
        if (!monthlyMap.has(monthKey)) monthlyMap.set(monthKey, new Map());
        const catMap = monthlyMap.get(monthKey);
        catMap.set(cat, (catMap.get(cat) || 0) + valAUD);
      }
    }
    const sortedMonths = Array.from(monthlyMap.keys()).sort();
    const allCategories = new Set();
    for (const catMap of monthlyMap.values()) for (const cat of catMap.keys()) allCategories.add(cat);
    const datasets = Array.from(allCategories).map((cat,idx) => ({
      label: cat,
      data: sortedMonths.map(m => monthlyMap.get(m).get(cat) || 0),
      backgroundColor: `hsl(${idx * 45}, 65%, 55%)`,
      borderColor: `hsl(${idx * 45}, 65%, 40%)`,
      borderWidth: 1,
      borderRadius: 4,
    }));
    const labels = sortedMonths.map(m => m.slice(5)+"/"+m.slice(2,4));
    return { labels, datasets, hasData: datasets.length>0 && labels.length>0 };
  }, [portfolio, rates, chartPeriod, periodCutoff]);

  // treemap rects
  const perfRects=useMemo(()=>{const it=holdings.map(h=>({...h,value:h.currentValue})).sort((a,b)=>b.value-a.value);return it.length?squarify(it,0,0,tmSize.w,tmSize.h):[];},[holdings,tmSize]);
  const divRects=useMemo(()=>{const it=holdings.filter(h=>h.totalDividends>0).map(h=>({...h,value:h.totalDividends})).sort((a,b)=>b.value-a.value);return it.length?squarify(it,0,0,tmSize.w,tmSize.h):[];},[holdings,tmSize]);
  const dayRects=useMemo(()=>{const it=holdings.map(h=>({...h,value:Math.max(Math.abs(h.dayGain),0.01)})).sort((a,b)=>b.value-a.value);return it.length?squarify(it,0,0,tmSize.w,tmSize.h):[];},[holdings,tmSize]);
  const rects=tmMode==="performance"?perfRects:tmMode==="day"?dayRects:divRects;

  const mapRef=useCallback(node=>{if(!node)return;const obs=new ResizeObserver(e=>{const{width,height}=e[0].contentRect;setTmSize({w:width,h:height});});obs.observe(node);},[]);

  const card=(x={})=>({background:T.bg3,border:`1px solid ${T.border}`,borderRadius:12,...x});
  const bS=(bg,col,x={})=>({padding:"8px 16px",border:"none",borderRadius:8,background:bg,color:col,fontSize:12,fontWeight:700,...x});
  const bO=(col,x={})=>({padding:"8px 14px",border:`1px solid ${T.border2}`,borderRadius:8,background:"transparent",color:col,fontSize:12,...x});
  const inp=()=>({width:"100%",background:T.bg,border:`1px solid ${T.border}`,borderRadius:8,padding:"9px 12px",color:T.text,fontSize:13,outline:"none"});

  return (
    <ErrorBoundary>
      <div style={{minHeight:"100vh",background:T.bg,color:T.text}}>
        <header style={{background:T.bg2,borderBottom:`1px solid ${T.border}`,position:"sticky",top:0,zIndex:20}}>
          <div style={{padding:"10px 14px",display:"flex",justifyContent:"space-between",flexWrap:"wrap"}}>
            <div style={{fontSize:20,fontWeight:700}}>FOLIO</div>
            <div>
              <button onClick={()=>setDark(!dark)} style={bO(T.text2,{padding:"4px 8px",marginRight:6})}>{dark?"☀️":"🌙"}</button>
              <button onClick={()=>setModal({mode:"add"})} style={bS(T.greenBtn,"#fff",{padding:"4px 12px"})}>+ Add</button>
            </div>
          </div>
        </header>
        <main style={{padding:"12px 14px"}}>
          <div style={{display:"flex",gap:8,marginBottom:12,justifyContent:"center"}}>
            {["treemap","table","chart"].map(v=><button key={v} onClick={()=>setView(v)} style={{padding:"6px 16px",borderRadius:20,background:view===v?T.teal:"transparent",border:`1px solid ${T.border}`,color:view===v?"#fff":T.text2}}>{v==="treemap"?"Map":v==="table"?"Table":"Charts"}</button>)}
          </div>
          {view==="treemap" && (
            <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>
              <div ref={mapRef} style={{flex:1,minWidth:200,height:isMob?400:440,background:T.bg3,borderRadius:12,overflow:"hidden",border:`1px solid ${T.border}`}}>
                {rects.map(r=>{
                  const c=tmMode==="performance"?gainColor(r.gainPct,dark):tmMode==="day"?dayColor(r.dayGainPct,dark):divColor(r.divYieldOnCost,dark);
                  const area=r.w*r.h;
                  const showTicker = area > 800;
                  const showPercent = area > 400;
                  let percentText = "";
                  if(tmMode==="performance") percentText = fmtPct(r.gainPct);
                  else if(tmMode==="day") percentText = fmtPct(r.dayGainPct);
                  else percentText = fmtPct(r.divYieldOnCost);
                  return(
                    <div key={r.ticker} onClick={()=>setSelected(r.ticker===selected?null:r.ticker)} style={{position:"absolute",left:r.x+1,top:r.y+1,width:r.w-2,height:r.h-2,background:c.bg,border:`1px solid ${c.border}`,borderRadius:5,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",cursor:"pointer",overflow:"hidden",outline:r.ticker===selected?`2px solid ${c.text}`:"none",fontSize:Math.min(12,Math.max(9,area/400)),textAlign:"center"}}>
                      {showTicker && <span style={{fontWeight:700,color:c.text,fontSize:Math.min(14,Math.max(9,area/300))}}>{r.ticker}</span>}
                      {showPercent && <span style={{fontSize:Math.min(11,Math.max(8,area/350)),color:c.text,opacity:.9}}>{percentText}</span>}
                      {tmMode==="day" && !tmShowVal && area>600 && <span style={{fontSize:9,color:c.text,opacity:.7}}>{FG(r.dayGain)}</span>}
                      {tmMode==="dividend" && !tmShowVal && area>600 && <span style={{fontSize:9,color:c.text,opacity:.7}}>{FC(r.totalDividends,true)}</span>}
                    </div>
                  );
                })}
              </div>
              <div style={{width:250,background:T.bg3,borderRadius:12,padding:12, border:`1px solid ${T.border}`}}>
                {selected ? (()=>{const h=holdings.find(h=>h.ticker===selected); return h?<div><div style={{fontSize:16,fontWeight:700}}>{h.ticker}</div><div>{FC(h.currentValue)}</div><div>{fmtPct(h.gainPct)}</div><button onClick={()=>setSelected(null)} style={bO(T.text2)}>Close</button></div>:<div>Select a box</div>})():<div style={{textAlign:"center",color:T.text3}}>Tap any box</div>}
              </div>
            </div>
          )}
          {view==="table" && (
            <div style={{overflowX:"auto",...card({padding:10})}}><table style={{width:"100%",borderCollapse:"collapse"}}><thead>{["Ticker","Value","Gain%"].map(c=><th key={c} style={{textAlign:"left",padding:8}}>{c}</th>)}</thead><tbody>{holdings.map(h=><tr key={h.ticker}><td style={{padding:8}}>{h.ticker}</td><td>{FC(h.currentValue,true)}</td><td style={{color: h.gainPct>=0?T.green:T.red}}>{fmtPct(h.gainPct)}</td></tr>)}</tbody></table></div>
          )}
          {view==="chart" && (
            <div style={{display:"flex",flexDirection:"column",gap:16}}>
              <div style={{display:"flex",gap:8,flexWrap:"wrap",justifyContent:"center"}}>
                {["1M","3M","6M","YTD","1Y","5Y"].map(p=><button key={p} onClick={()=>setChartPeriod(p)} style={{padding:"4px 12px",borderRadius:20,background:chartPeriod===p?T.teal:"transparent",border:`1px solid ${T.border}`,color:chartPeriod===p?"#fff":T.text2}}>{p}</button>)}
              </div>
              {/* Net Buy Tracker */}
              <div style={card({padding:16})}>
                <div style={{fontSize:14,fontWeight:700,marginBottom:8}}>📈 Net Buy / Sell ({chartPeriod})</div>
                {netBuyData.hasData ? (
                  <>
                    <div style={{fontSize:12,marginBottom:12}}>Total net flow: <span style={{color:netBuyData.total>=0?T.green:T.red,fontWeight:700}}>{FG(netBuyData.total)}</span></div>
                    <div style={{display:"flex",flexDirection:"column",gap:8}}>
                      {netBuyData.categories.map(cat=>{
                        const percent = Math.abs(cat.val)/Math.abs(netBuyData.total)*100;
                        const barWidth = Math.min(100, Math.max(3, percent));
                        return <div key={cat.name}><div style={{display:"flex",justifyContent:"space-between",fontSize:11}}><span>{cat.name}</span><span style={{color:cat.val>=0?T.green:T.red}}>{FG(cat.val)}</span></div><div style={{background:T.bg4,borderRadius:6,height:8,marginTop:2}}><div style={{width:`${barWidth}%`,background:cat.val>=0?T.green:T.red,borderRadius:6,height:8}}/></div></div>;
                      })}
                    </div>
                  </>
                ) : <div style={{textAlign:"center",color:T.text3,padding:20}}>No buy/sell transactions in selected period</div>}
              </div>
              {/* Revamped Dividend Contribution Chart */}
              <div style={card({padding:16})}>
                <div style={{fontSize:14,fontWeight:700,marginBottom:4}}>🌱 Dividend Contribution by Category</div>
                <div style={{fontSize:11,color:T.text3,marginBottom:12}}>Monthly breakdown · {chartPeriod}</div>
                {divContributionData.hasData ? (
                  <ChartBar labels={divContributionData.labels} datasets={divContributionData.datasets} T={T} yFmt={v=>fmtCur(v,displayCur,rates,true)} height={250} stacked={true}/>
                ) : <div style={{height:200,display:"flex",alignItems:"center",justifyContent:"center",color:T.text3}}>No dividend data for this period</div>}
              </div>
              {/* Portfolio value line chart */}
              <div style={card({padding:16})}>
                <div style={{fontSize:14,fontWeight:700,marginBottom:8}}>📊 Portfolio Value</div>
                <ChartLine labels={history.map(s=>s.date.slice(5))} datasets={[{label:"Value",data:history.map(s=>fromAUD(s.totalValueAUD,displayCur,rates)),borderColor:T.green,fill:false}]} T={T} yFmt={v=>fmtCur(v,displayCur,rates,true)} height={200}/>
              </div>
            </div>
          )}
        </main>
        {modal && modal.mode==="add" && (
          <div onClick={()=>setModal(null)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.7)",display:"flex",alignItems:"center",justifyContent:"center"}}>
            <div onClick={e=>e.stopPropagation()} style={{background:T.bg2,padding:24,borderRadius:12,width:320}}>
              <h3>Add Position</h3>
              <input placeholder="Ticker" style={inp()} onChange={e=>setForm({...form,ticker:e.target.value})}/>
              <input placeholder="Qty" type="number" style={inp()} onChange={e=>setForm({...form,qty:e.target.value})}/>
              <input placeholder="Price" type="number" style={inp()} onChange={e=>setForm({...form,price:e.target.value})}/>
              <button onClick={()=>{if(form.ticker && form.qty && form.price){const newH={id:Date.now(),ticker:form.ticker.toUpperCase(),name:form.ticker,currency:"AUD",assetType:"Shares / Stocks",transactions:[{type:"buy",qty:+form.qty,price:+form.price,date:new Date().toISOString().slice(0,10)}]};setPortfolio([...portfolio,newH]);setPrices({...prices,[form.ticker.toUpperCase()]:+form.price});setPrevPrices({...prevPrices,[form.ticker.toUpperCase()]:+form.price});setModal(null);}} style={bS(T.greenBtn,"#fff",{marginTop:12})}}>Save</button>
            </div>
          </div>
        )}
      </div>
    </ErrorBoundary>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
