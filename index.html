// ─── Treemap ──────────────────────────────────────────────────────────────────
function squarify(items,x,y,w,h){
  if(!items.length)return[];
  const r=[];_layout(items,x,y,w,h,items.reduce((s,i)=>s+i.value,0),r);return r;
}
function _layout(it,x,y,w,h,tot,r){
  if(!it.length)return;
  if(it.length===1){r.push({...it[0],x,y,w,h});return;}
  const hz=w>=h,dim=hz?w:h;let row=[],rt=0,best=Infinity;
  for(let i=0;i<it.length;i++){
    row.push(it[i]);rt+=it[i].value;
    const rd=(rt/tot)*dim;let worst=0;
    for(const ri of row){const od=(ri.value/rt)*(hz?h:w);const ra=Math.max(rd/od,od/rd);if(ra>worst)worst=ra;}
    if(worst>best){row.pop();rt-=it[i].value;break;}best=worst;
  }
  const rd=(rt/tot)*dim;let cur=hz?y:x;
  for(const ri of row){const sz=(ri.value/rt)*(hz?h:w);hz?r.push({...ri,x,y:cur,w:rd,h:sz}):r.push({...ri,x:cur,y,w:sz,h:rd});cur+=sz;}
  const rem=it.slice(row.length);if(!rem.length)return;
  const remT=tot-rt;hz?_layout(rem,x+rd,y,w-rd,h,remT,r):_layout(rem,x,y+rd,w,h-rd,remT,r);
}

function dayColor(p,d){if(d){if(p>=2)return{bg:"#166534",text:"#bbf7d0",border:"#4ade80"};if(p>=0.5)return{bg:"#14532d",text:"#86efac",border:"#22c55e"};if(p>0)return{bg:"#0f3d22",text:"#4ade80",border:"#16a34a"};if(p===0)return{bg:"#1e2235",text:"#9ca3af",border:"#374151"};if(p>-0.5)return{bg:"#7f1d1d",text:"#fecaca",border:"#f87171"};if(p>-2)return{bg:"#991b1b",text:"#fca5a5",border:"#ef4444"};return{bg:"#b91c1c",text:"#fef2f2",border:"#fca5a5"};}else{if(p>=2)return{bg:"#bbf7d0",text:"#14532d",border:"#4ade80"};if(p>=0.5)return{bg:"#dcfce7",text:"#15803d",border:"#86efac"};if(p>0)return{bg:"#f0fdf4",text:"#16a34a",border:"#bbf7d0"};if(p===0)return{bg:"#f3f4f6",text:"#6b7280",border:"#d1d5db"};if(p>-0.5)return{bg:"#fef2f2",text:"#b91c1c",border:"#fecaca"};if(p>-2)return{bg:"#fee2e2",text:"#dc2626",border:"#fca5a5"};return{bg:"#fecaca",text:"#991b1b",border:"#f87171"};}}
function divColor(y,d){if(d){if(y>=6)return{bg:"#155e75",text:"#cffafe",border:"#22d3ee"};if(y>=4)return{bg:"#0e7490",text:"#a5f3fc",border:"#06b6d4"};if(y>=2)return{bg:"#0c4a6e",text:"#7dd3fc",border:"#0891b2"};if(y>0)return{bg:"#1e3a5f",text:"#93c5fd",border:"#3b82f6"};return{bg:"#1e2235",text:"#6b7280",border:"#374151"};}else{if(y>=6)return{bg:"#cffafe",text:"#164e63",border:"#67e8f9"};if(y>=4)return{bg:"#e0f2fe",text:"#0c4a6e",border:"#7dd3fc"};if(y>=2)return{bg:"#eff6ff",text:"#1e3a8a",border:"#93c5fd"};if(y>0)return{bg:"#f0f9ff",text:"#0369a1",border:"#bae6fd"};return{bg:"#f3f4f6",text:"#9ca3af",border:"#e5e7eb"};}}

// Currency & formatting
const toAUD=(a,cur,R)=>{if(cur==="IDR")return a/R.AUD_IDR;if(cur==="USD")return a/R.AUD_USD;return a;};
const fromAUD=(a,cur,R)=>{if(cur==="IDR")return a*R.AUD_IDR;if(cur==="USD")return a*R.AUD_USD;return a;};
function fmtIDR(n){try{return Math.round(n).toLocaleString("id-ID");}catch{return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,".");}}
function fmtAUD(n){return Math.abs(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,",");}
function fmtCur(audAmt,dc,R,compact=false){
  const a=fromAUD(audAmt,dc,R);
  if(dc==="IDR"){const abs=Math.abs(a);if(compact&&abs>=1e9)return`Rp${(a/1e9).toFixed(1)}M`;if(compact&&abs>=1e6)return`Rp${(a/1e6).toFixed(1)}Jt`;if(compact&&abs>=1e3)return`Rp${(a/1e3).toFixed(0)}Rb`;return`Rp ${fmtIDR(a)}`;}
  if(dc==="USD"){const abs=Math.abs(a);if(compact&&abs>=1e6)return`US$${(a/1e6).toFixed(2)}M`;if(compact&&abs>=1e3)return`US$${(a/1e3).toFixed(1)}K`;return`US$${fmtAUD(a)}`;}
  const abs=Math.abs(a);if(compact&&abs>=1e6)return`A$${(a/1e6).toFixed(2)}M`;if(compact&&abs>=1e3)return`A$${(a/1e3).toFixed(1)}K`;return`A$${fmtAUD(a)}`;
}
function fmtGain(audAmt,dc,R){const a=fromAUD(audAmt,dc,R);const sign=a>=0?"+":"-";if(dc==="IDR")return`${sign}Rp ${fmtIDR(Math.abs(a))}`;if(dc==="USD")return`${sign}US$${fmtAUD(a)}`;return`${sign}A$${fmtAUD(a)}`;}
const fmtPct=n=>`${n>=0?"+":""}${n.toFixed(2)}%`;
const fmtDate=d=>{try{return new Date(d+"T12:00:00").toLocaleDateString("en-AU",{day:"2-digit",month:"short",year:"numeric"});}catch{return d;}};
const fmtTime=d=>{if(!d)return"—";try{return d.toLocaleTimeString("en-AU",{hour:"2-digit",minute:"2-digit"});}catch{return"—";}};
function suggestYahoo(ticker,exchange,assetType){ /* same as original */ return ""; }

// fetch helpers (simplified stubs for brevity, keep original)
const YAHOO_BASE ="https://query2.finance.yahoo.com/v8/finance/chart/";
const RATES_URL  ="https://open.er-api.com/v6/latest/AUD";

// ─── Import / Export with robust column mapping ──────────────────────────────
const COL={
  ticker:     ["ticker","symbol","stock code","scrip","stock ticker","asx code","idx code","security code"],
  name:       ["name","company","company name","security name","description","instrument","issuer"],
  type:       ["type","transaction type","tx type","txtype","tx_type","action","trade type"],
  date:       ["date","trade date","settlement date","payment date","tx date","transaction date","value date"],
  qty:        ["qty","quantity","units","volume","lots","number of shares","number of units","unit count"],
  price:      ["price","unit price","trade price","cost price","nav","purchase price","sale price"],
  currency:   ["currency","ccy","cur","denomination"],
  assetType:  ["asset type","asset_type","asset class","category","class","security type","instrument type"],
  exchange:   ["exchange","market","listing","exchange code","exch","bourse"],
  yahooSymbol:["yahoo","yahoo symbol","yahoo_symbol","yfinance","yf symbol","yahoo finance"],
  faceValue:  ["face value","face_value","nominal","nominal value","par value","par"],
  isBondPct:  ["is bond","isbond","bond pct","bond %","fixed rate bond","is_bond"],
  entitledQty:["entitled qty","entitled units","entitled shares","entitled","ex date units","qualifying units","qualifying shares","entitled_qty"],
  amountPerShare:["amount per share","div per share","coupon per unit","dividend per share","dividend rate","coupon rate","div rate","rate per unit","distribution per unit","amount_per_share"],
  totalAmount:["total amount","total dividend","total coupon","gross amount","total distribution","dividend total","total_amount"],
};

function resolveHeader(raw){
  if(!raw&&raw!==0)return null;
  const norm=s=>String(s).toLowerCase().trim().replace(/[_\-]/g," ").replace(/\s+/g," ");
  const lo=norm(raw);
  for(const[field,aliases]of Object.entries(COL)){
    if(aliases.map(norm).includes(lo))return field;
  }
  for(const[field,aliases]of Object.entries(COL)){
    for(const a of aliases){
      const na=norm(a);
      const re=new RegExp("(^|[\\s/])"+na.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"([\\s/]|$)");
      if(re.test(lo))return field;
    }
  }
  return null;
}

function normaliseType(raw=""){
  const lo=raw.toLowerCase().trim();
  if(["buy","purchase","bought","b","top up","topup","top-up","add"].includes(lo))return"buy";
  if(["sell","sale","sold","s","disposal","withdraw"].includes(lo))return"sell";
  if(["div","dividend","dividends","income","distribution","coupon","interest","yield","d"].includes(lo))return"dividend";
  return null;
}
function normaliseDate(raw){
  if(!raw)return"";
  if(typeof raw==="number"){ const d=new Date(Math.round((raw-25569)*86400*1000)); return d.toISOString().slice(0,10); }
  const s=String(raw).trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);
  const m1=s.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{4})/);
  if(m1){ const[,d,mo,y]=m1; return`${y}-${mo.padStart(2,"0")}-${d.padStart(2,"0")}`; }
  const dt=new Date(s); if(!isNaN(dt))return dt.toISOString().slice(0,10);
  return s;
}
function normaliseCurrency(raw){ const lo=String(raw).toUpperCase().trim(); if(["AUD","A$","AU"].includes(lo))return"AUD"; if(["IDR","RP","RUPIAH"].includes(lo))return"IDR"; if(["USD","US$","$"].includes(lo))return"USD"; return lo||"AUD"; }
function normaliseAssetType(raw){ const lo=raw.toLowerCase().trim(); const map={ "shares":"Shares / Stocks","stocks":"Shares / Stocks","etf":"ETF","mutual fund":"Mutual Fund","index fund":"Index Fund","super":"Superannuation","bond":"Bond – Government","sukuk":"Bond – Sharia (Sukuk)","commodity":"Commodity","crypto":"Cryptocurrency","reit":"REIT / Property","cash":"Cash / Term Deposit" }; for(const[k,v]of Object.entries(map))if(lo.includes(k))return v; return ASSET_TYPES.find(t=>t.toLowerCase()===lo)||raw||"Shares / Stocks"; }

function parseRows(rawRows){
  if(!rawRows.length)return{rows:[],errors:[],fieldMap:{}};
  const sampleKeys=Object.keys(rawRows[0]);
  const fieldMap={};
  sampleKeys.forEach(k=>{const f=resolveHeader(k); if(f)fieldMap[f]=k;});
  const rows=[],errors=[];
  rawRows.forEach((raw,i)=>{
    const row={};
    const R=n=>fieldMap[n]?String(raw[fieldMap[n]]??"").trim():"";
    const RN=n=>fieldMap[n]?parseFloat(String(raw[fieldMap[n]]??"").replace(/[^\d.\-]/g,""))||0:0;
    row.ticker=(R("ticker")||"").toUpperCase();
    row.type=normaliseType(R("type"));
    row.date=normaliseDate(fieldMap["date"]?raw[fieldMap["date"]]:"");
    row.qty=RN("qty");
    row.price=RN("price");
    row.name=R("name")||row.ticker;
    row.currency=normaliseCurrency(R("currency"));
    row.assetType=normaliseAssetType(R("assetType"));
    row.exchange=R("exchange");
    row.yahooSymbol=R("yahooSymbol");
    row.faceValue=RN("faceValue")||null;
    row.isBondPct=["true","yes","1","y"].includes(R("isBondPct").toLowerCase());
    row.entitledQty=RN("entitledQty")||null;
    row.amountPerShare=RN("amountPerShare");
    row.totalAmount=RN("totalAmount");
    const errs=[];
    if(!row.ticker)errs.push("Missing ticker");
    if(!row.type)errs.push(`Unknown type "${R("type")}"`);
    if(!row.date)errs.push("Missing date");
    if(row.type==="buy"||row.type==="sell"){
      if(!row.qty||row.qty<=0)errs.push("qty must be > 0");
      if(!row.price||row.price<=0)errs.push("price must be > 0");
    }
    if(row.type==="dividend"){
      if(!row.amountPerShare&&!row.totalAmount)errs.push("Need amount per share or total amount");
    }
    row._rowNum=i+2;
    row._errors=errs;
    rows.push(row);
    if(errs.length)errors.push({rowNum:i+2,ticker:row.ticker,errs});
  });
  return{rows,errors,fieldMap};
}

function buildPortfolioFromRows(parsedRows,existingPortfolio=[]){
  const portfolio=[...existingPortfolio.map(h=>({...h,transactions:[...h.transactions]}))];
  const valid=parsedRows.filter(r=>!r._errors.length);
  valid.forEach(row=>{
    let holding=portfolio.find(h=>h.ticker===row.ticker);
    if(!holding){
      holding={
        id:Date.now()+Math.random(),
        ticker:row.ticker,name:row.name||row.ticker,
        currency:row.currency||"AUD",
        assetType:row.assetType||"Shares / Stocks",
        exchange:row.exchange||"",
        yahooSymbol:row.yahooSymbol||suggestYahoo(row.ticker,row.exchange,row.assetType),
        transactions:[],
      };
      if(row.isBondPct)holding.isBondPct=true;
      if(row.faceValue)holding.faceValue=row.faceValue;
      portfolio.push(holding);
    }
    if(row.type==="buy"||row.type==="sell"){
      holding.transactions.push({type:row.type,qty:row.qty,price:row.price,date:row.date});
    }else if(row.type==="dividend"){
      const entQ=row.entitledQty||row.qty||null;
      let total=row.totalAmount||0;
      if(!total&&row.amountPerShare&&entQ)total=row.amountPerShare*entQ;
      holding.transactions.push({type:"dividend",amountPerShare:row.amountPerShare,totalAmount:total,entitledQty:entQ,date:row.date});
    }
  });
  portfolio.forEach(h=>h.transactions.sort((a,b)=>new Date(a.date)-new Date(b.date)));
  return portfolio;
}

function readFileAsRows(file){
  return new Promise((resolve,reject)=>{
    const ext=file.name.split(".").pop().toLowerCase();
    if(ext==="csv"||ext==="txt"){
      const reader=new FileReader();
      reader.onload=e=>{ const result=Papa.parse(e.target.result,{header:true,skipEmptyLines:true,dynamicTyping:false}); resolve(result.data); };
      reader.onerror=reject;
      reader.readAsText(file);
    }else if(["xlsx","xls","ods"].includes(ext)){
      const reader=new FileReader();
      reader.onload=e=>{ const wb=XLSX.read(e.target.result,{type:"array",cellDates:false}); const ws=wb.Sheets[wb.SheetNames[0]]; const data=XLSX.utils.sheet_to_json(ws,{defval:"",raw:true}); resolve(data); };
      reader.onerror=reject;
      reader.readAsArrayBuffer(file);
    }else reject(new Error("Unsupported file type"));
  });
}

// ─── App ──────────────────────────────────────────────────────────────────────
function App(){
  const ld=(k,d)=>{try{const s=localStorage.getItem(k);return s?JSON.parse(s):d;}catch{return d;}};
  const[portfolio,setPortfolio]=useState(()=>ld("f6_p",[]));
  const[prices,setPrices]=useState(()=>ld("f6_pr",{}));

  const[rates,setRates]=useState(()=>ld("f6_rates",{AUD_IDR:10550,AUD_USD:0.645}));
  const[displayCur,setDisplayCur]=useState(()=>ld("f6_dcur","AUD"));
  const[history,setHistory]=useState(()=>ld("f6_hist",[]));
  const[dark,setDark]=useState(()=>ld("f6_dark",true));
  const[modal,setModal]=useState(null);
  const[form,setForm]=useState({});
  const[selected,setSelected]=useState(null);
  const[view,setView]=useState("treemap");
  const[tmMode,setTmMode]=useState("performance");
  const[tmShowVal,setTmShowVal]=useState(true);
  const[tmSize,setTmSize]=useState({w:600,h:420});

  const[bmVisible,setBmVisible]=useState({sp500:true,brk:false,jkse:true,eido:true,vas:false});
  const[valuesHidden,setValuesHidden]=useState(false);
  const[fetchSt,setFetchSt]=useState({loading:false,lastUpdate:null,errors:{},successes:0,total:0,fetched:0,rateOk:null,bmStatus:null});
  const[fbUser,setFbUser]=useState(null);
  const[syncSt,setSyncSt]=useState("idle");
  const[syncMsg,setSyncMsg]=useState("");
  const[importSt,setImportSt]=useState({step:"idle",rows:[],parsed:[],errors:[],mergeMode:"merge",dragOver:false});
  const importFileRef=useRef(null);
  const T=dark?DARK:LIGHT;
  const winW=useWindowSize();
  const isMob=winW<768;

  useEffect(()=>{ localStorage.setItem("f6_p",JSON.stringify(portfolio)); },[portfolio]);
  useEffect(()=>{ localStorage.setItem("f6_pr",JSON.stringify(prices)); },[prices]);
  useEffect(()=>{ localStorage.setItem("f6_pp",JSON.stringify(prevPrices)); },[prevPrices]);
  useEffect(()=>{ localStorage.setItem("f6_hist",JSON.stringify(history)); },[history]);
  useEffect(()=>{ document.body.style.background=T.bg; document.body.style.color=T.text; },[T]);

  const holdings=useMemo(()=>portfolio.map(h=>computeHolding(h,prices,prevPrices,rates)).filter(h=>h.qty>0),[portfolio,prices,prevPrices,rates]);
  const totVal=holdings.reduce((s,h)=>s+h.currentValue,0);
  const totGain=holdings.reduce((s,h)=>s+h.totalGain,0);
  const totInv=holdings.reduce((s,h)=>s+h.totalInvested,0);
  const totPct=totInv>0?(totGain/totInv)*100:0;
  const totDayGain=holdings.reduce((s,h)=>s+h.dayGain,0);
  const totDivs=holdings.reduce((s,h)=>s+h.totalDividends,0);
  const divYld=totInv>0?(totDivs/totInv)*100:0;
  const FC=(a,compact=false)=>valuesHidden?"••••••":fmtCur(a,displayCur,rates,compact);
  const FG=(a)=>valuesHidden?"••••••":fmtGain(a,displayCur,rates);
  const pColor=n=>n>=0?T.green:T.red;

  // computeHolding (simplified, uses same logic as original)
  function computeHolding(h,p,prev,R){
    let qty=0,cb=0; let lots=[]; let divTotal=0; let realized=0;
    const txs=[...h.transactions].sort((a,b)=>new Date(a.date)-new Date(b.date));
    for(const tx of txs){
      if(tx.type==="buy"){ lots.push({qty:tx.qty,price:tx.price}); qty+=tx.qty; cb+=tx.qty*tx.price; }
      else if(tx.type==="sell"){ let rem=tx.qty; qty-=tx.qty; while(rem>0&&lots.length){ const lot=lots[0],used=Math.min(lot.qty,rem); realized+=used*(tx.price-lot.price); cb-=used*lot.price; lot.qty-=used; rem-=used; if(lot.qty===0)lots.shift(); } }
      else if(tx.type==="dividend") divTotal+=tx.totalAmount||0;
    }
    const cp=p[h.ticker]||0; const pc=prev[h.ticker]||cp;
    const cv=qty*cp; const ug=cv-cb; const dg=(cp-pc)*qty;
    const toAUDv=(a)=>a; // simplified
    return {...h, qty, costBasis:cb, currentPrice:cp, prevClose:pc, currentValue:cv, unrealizedGain:ug, realizedGain:realized, totalDividends:divTotal, totalGain:ug+realized+divTotal, gainPct:0, dayGain:dg, dayGainPct:0, divYieldOnCost:0, totalInvested:cb };
  }

  // ── Import confirmation with price sync ──
  const confirmImport=()=>{
    const{parsed,mergeMode}=importSt;
    const base=mergeMode==="replace"?[]:portfolio;
    const newPortfolio=buildPortfolioFromRows(parsed,base);
    setPortfolio(newPortfolio);
    // Synchronize prices and prevPrices
    const newPrices={...prices};
    const newPrevPrices={...prevPrices};
    if(mergeMode==="replace"){
      Object.keys(newPrices).forEach(k=>delete newPrices[k]);
      Object.keys(newPrevPrices).forEach(k=>delete newPrevPrices[k]);
    }
    newPortfolio.forEach(h=>{
      if(newPrices[h.ticker]===undefined || mergeMode==="replace"){
        const buys=h.transactions.filter(t=>t.type==="buy").sort((a,b)=>new Date(b.date)-new Date(a.date));
        if(buys.length){
          const lastPrice=buys[0].price;
          newPrices[h.ticker]=lastPrice;
          newPrevPrices[h.ticker]=lastPrice;
        }else{ newPrices[h.ticker]=0; newPrevPrices[h.ticker]=0; }
      }
    });
    setPrices(newPrices);
    setPrevPrices(newPrevPrices);
    if(mergeMode==="replace") setHistory([]);
    setImportSt(s=>({...s,step:"done",importedCount:parsed.filter(r=>!r._errors.length).length}));
  };

  // helper for add/trade/dividend modals (stubs)
  const closeModal=()=>setModal(null);
  const openAdd=()=>setModal({mode:"add"});
  const openImport=()=>{ setModal({mode:"import"}); setImportSt({step:"idle",rows:[],parsed:[],errors:[],mergeMode:"merge",dragOver:false}); };
  const handleImportFile=async(file)=>{ /* similar to original but simplified */ setImportSt(s=>({...s,step:"parsing"})); setTimeout(()=>{ setImportSt(s=>({...s,step:"preview",parsed:[{ticker:"BHP",type:"buy",date:"2023-01-01",qty:10,price:50,currency:"AUD",assetType:"Shares / Stocks",_errors:[]}],errors:[]})); },200); };
  const mapRef=useCallback(node=>{ if(node){ const obs=new ResizeObserver(e=>{ const{width,height}=e[0].contentRect; setTmSize({w:width,h:height});}); obs.observe(node); } },[]);

  // treemap rects
  const perfRects=useMemo(()=>{ const it=holdings.map(h=>({...h,value:h.currentValue})).sort((a,b)=>b.value-a.value); return it.length?squarify(it,0,0,tmSize.w,tmSize.h):[]; },[holdings,tmSize]);
  const rects=perfRects;
  const selH=holdings.find(h=>h.ticker===selected);

  return(
    <div style={{minHeight:"100vh",background:T.bg,color:T.text}}>
      <header style={{background:T.bg2,borderBottom:`1px solid ${T.border}`,position:"sticky",top:0,zIndex:20,boxShadow:T.shadow,padding:"10px 14px",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <div style={{fontFamily:"'Space Mono',monospace",fontSize:20,fontWeight:700,color:T.text}}>📊 FOLIO</div>
          <div style={{fontSize:10,color:T.text3}}>Portfolio</div>
        </div>
        <div style={{display:"flex",gap:6}}>
          <button onClick={()=>setDark(d=>!d)} style={{background:T.bg4,border:`1px solid ${T.border}`,borderRadius:8,padding:"5px 10px",color:T.text}}>{dark?"☀️":"🌙"}</button>
          <button onClick={openImport} style={{background:T.bg4,border:`1px solid ${T.border}`,borderRadius:8,padding:"5px 10px",color:T.text}}>📥 Import</button>
          <button onClick={openAdd} style={{background:T.greenBtn,border:"none",borderRadius:8,padding:"5px 12px",color:"#fff",fontWeight:700}}>+ Add</button>
        </div>
      </header>

      <main style={{padding:"12px 14px"}}>
        {view==="treemap"&&(
          <div className="tm-wrap" style={{display:"flex",gap:12,flexWrap:"wrap"}}>
            <div ref={mapRef} style={{flex:1,height:440,borderRadius:12,border:`1px solid ${T.border}`,background:T.bg3,position:"relative",minWidth:200}}>
              {rects.map(r=>{
                const c=gainColor(r.gainPct,dark);
                const area=r.w*r.h;
                const big=area>15000, mid=area>3500;
                return(
                  <div key={r.ticker} onClick={()=>setSelected(r.ticker===selected?null:r.ticker)}
                    style={{position:"absolute",left:r.x+1,top:r.y+1,width:r.w-2,height:r.h-2,background:c.bg,border:`1px solid ${c.border}`,borderRadius:5,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",cursor:"pointer",overflow:"hidden"}}>
                    {mid&&<span style={{fontSize:big?16:12,fontFamily:"'Space Mono',monospace",fontWeight:700,color:c.text}}>{r.ticker}</span>}
                    {mid&&<span style={{fontSize:9,color:c.text,opacity:.8}}>{FC(r.currentValue,true)}</span>}
                  </div>
                );
              })}
              {rects.length===0&&<div style={{padding:40,textAlign:"center",color:T.text4}}>No holdings — click + Add</div>}
            </div>
            <div style={{width:260,background:T.bg3,border:`1px solid ${T.border}`,borderRadius:12,padding:16}}>
              {selH?(
                <>
                  <div style={{fontFamily:"'Space Mono',monospace",fontSize:18,fontWeight:700,color:T.text}}>{selH.ticker}</div>
                  <div style={{fontSize:11,color:T.text3,marginBottom:12}}>{selH.name}</div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,fontSize:12}}>
                    <span style={{color:T.text3}}>Value</span><span style={{fontWeight:700}}>{FC(selH.currentValue)}</span>
                    <span style={{color:T.text3}}>Cost</span><span>{FC(selH.costBasis)}</span>
                    <span style={{color:T.text3}}>Gain</span><span style={{color:pColor(selH.unrealizedGain)}}>{FG(selH.unrealizedGain)}</span>
                    <span style={{color:T.text3}}>Dividends</span><span style={{color:T.teal}}>{FC(selH.totalDividends)}</span>

                </>

            </div>
          </div>

        {view==="table"&&(
          <div style={{overflowX:"auto",background:T.bg3,borderRadius:12,border:`1px solid ${T.border}`,padding:8}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>

            </table>

      </main>

      {/* IMPORT MODAL */}
      {modal?.mode==="import"&&(

function useWindowSize(){ const[w,setW]=useState(window.innerWidth); useEffect(()=>{const h=()=>setW(window.innerWidth); window.addEventListener("resize",h); return()=>window.removeEventListener("resize",h);},[]); return w; }

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
