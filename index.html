// ========== TREEMAP (squarify) ==========
function squarify(items,x,y,w,h){
  if(!items.length)return[];
  const r=[]; _layout(items,x,y,w,h,items.reduce((s,i)=>s+i.value,0),r); return r;
}
function _layout(it,x,y,w,h,tot,r){
  if(!it.length)return;
  if(it.length===1){r.push({...it[0],x,y,w,h});return;}
  const hz=w>=h, dim=hz?w:h; let row=[], rt=0, best=Infinity;
  for(let i=0;i<it.length;i++){
    row.push(it[i]); rt+=it[i].value;
    const rd=(rt/tot)*dim; let worst=0;
    for(const ri of row){const od=(ri.value/rt)*(hz?h:w); const ra=Math.max(rd/od,od/rd); if(ra>worst) worst=ra;}
    if(worst>best){row.pop(); rt-=it[i].value; break;} best=worst;
  }
  const rd=(rt/tot)*dim; let cur=hz?y:x;
  for(const ri of row){const sz=(ri.value/rt)*(hz?h:w); hz?r.push({...ri,x,y:cur,w:rd,h:sz}):r.push({...ri,x:cur,y,w:sz,h:rd}); cur+=sz;}
  const rem=it.slice(row.length); if(!rem.length)return;
  const remT=tot-rt; hz?_layout(rem,x+rd,y,w-rd,h,remT,r):_layout(rem,x,y+rd,w,h-rd,remT,r);
}

const toAUD=(a,cur,R)=>{if(cur==="IDR")return a/R.AUD_IDR; if(cur==="USD")return a/R.AUD_USD; return a;};

function fmtIDR(n){return Math.round(n).toLocaleString("id-ID");}
function fmtAUD(n){return Math.abs(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,",");}
function fmtCur(audAmt,dc,R,compact=false){
  const a=fromAUD(audAmt,dc,R);
  if(dc==="IDR"){const abs=Math.abs(a); if(compact&&abs>=1e9)return`Rp${(a/1e9).toFixed(1)}M`; if(compact&&abs>=1e6)return`Rp${(a/1e6).toFixed(1)}Jt`; return`Rp ${fmtIDR(a)}`;}
  if(dc==="USD"){const abs=Math.abs(a); if(compact&&abs>=1e6)return`US$${(a/1e6).toFixed(2)}M`; return`US$${fmtAUD(a)}`;}
  const abs=Math.abs(a); if(compact&&abs>=1e6)return`A$${(a/1e6).toFixed(2)}M`; return`A$${fmtAUD(a)}`;
}
function fmtGain(audAmt,dc,R){const a=fromAUD(audAmt,dc,R); const sign=a>=0?"+":"-"; if(dc==="IDR")return`${sign}Rp ${fmtIDR(Math.abs(a))}`; if(dc==="USD")return`${sign}US$${fmtAUD(a)}`; return`${sign}A$${fmtAUD(a)}`;}

// ========== COMPUTE HOLDING ==========
function computeHolding(h,prices,prevPrices,R){
  let qty=0, costBasisLocal=0, realizedGainLocal=0, lots=[], dividendsLocal=0;
  const txs=[...h.transactions].sort((a,b)=>new Date(a.date)-new Date(b.date));
  for(const tx of txs){
    if(tx.type==="buy"){ lots.push({qty:tx.qty,price:tx.price}); qty+=tx.qty; costBasisLocal+=tx.qty*tx.price; }
    else if(tx.type==="sell"){ let rem=tx.qty; qty-=tx.qty; while(rem>0&&lots.length){ const lot=lots[0], used=Math.min(lot.qty,rem); realizedGainLocal+=used*(tx.price-lot.price); costBasisLocal-=used*lot.price; lot.qty-=used; rem-=used; if(lot.qty===0)lots.shift(); } }
    else if(tx.type==="dividend"){ dividendsLocal+=tx.totalAmount||0; }
  }
  const curPrice=prices[h.ticker]||0, prevClose=prevPrices[h.ticker]||curPrice;
  const curValueLocal=qty*curPrice, unrealizedLocal=curValueLocal-costBasisLocal;
  const dayGainLocal=(curPrice-prevClose)*qty, dayPct=prevClose>0?(curPrice-prevClose)/prevClose*100:0;
  const curValue=toAUD(curValueLocal,h.currency,R), costBasis=toAUD(costBasisLocal,h.currency,R);
  const unrealized=toAUD(unrealizedLocal,h.currency,R), realized=toAUD(realizedGainLocal,h.currency,R);
  const dividends=toAUD(dividendsLocal,h.currency,R), dayGain=toAUD(dayGainLocal,h.currency,R);
  const totalInvested=txs.filter(t=>t.type==="buy").reduce((s,t)=>s+toAUD(t.qty*t.price,h.currency,R),0);
  const totalGain=unrealized+realized+dividends, gainPct=totalInvested>0?(totalGain/totalInvested)*100:0;
  const divYield=totalInvested>0?(dividends/totalInvested)*100:0;
  return{...h, qty, costBasis, currentPrice:curPrice, prevClose, currentValue:curValue, unrealizedGain:unrealized,
    realizedGain:realized, totalDividends:dividends, totalGain, gainPct, dayGain, dayGainPct:dayPct, divYieldOnCost:divYield, totalInvested};
}

// ========== AI ADVISOR COMPONENT ==========
function AIAdvisor({ holdings, totVal, totGain, totPct, totDivs, divYieldOnly, divCAGR, monthlyPassivePercent, monthlyTargetAud, superBenchmarkPercent, chartData, T, dark }) {
  const [open, setOpen] = useState(false);
  const [advice, setAdvice] = useState(null);
  const [loading, setLoading] = useState(false);
  const generateAdvice = useCallback(() => {
    setLoading(true);
    setTimeout(() => {
      const analysis = [];
      if (totPct > 20) analysis.push({ type: "positive", text: `🚀 Outstanding total return of ${fmtPct(totPct)}! You're significantly outperforming.` });
      else if (totPct > 10) analysis.push({ type: "positive", text: `✅ Solid total return of ${fmtPct(totPct)}. Above average.` });
      else if (totPct > 0) analysis.push({ type: "neutral", text: `📊 Total return of ${fmtPct(totPct)} is positive but modest.` });
      else analysis.push({ type: "critical", text: `⚠️ Total return of ${fmtPct(totPct)} is negative. Review your asset allocation.` });

      const typeCount = new Set(holdings.map(h => h.assetType)).size;
      if (typeCount < 3) analysis.push({ type: "critical", text: `⚠️ Only ${typeCount} asset type(s). High concentration risk — diversify.` });
      else if (typeCount < 5) analysis.push({ type: "neutral", text: `📊 Moderate diversification (${typeCount} types). Consider adding bonds or international.` });
      else analysis.push({ type: "positive", text: `🌍 Good diversification across ${typeCount} asset types.` });

      const topConcentration = holdings.length ? (Math.max(...holdings.map(h => h.currentValue)) / totVal) * 100 : 0;
      if (topConcentration > 40) analysis.push({ type: "critical", text: `⚠️ Largest holding is ${topConcentration.toFixed(1)}% of portfolio. Very high single-stock risk.` });
      else if (topConcentration > 20) analysis.push({ type: "neutral", text: `📊 Top holding is ${topConcentration.toFixed(1)}% — acceptable but monitor.` });
      else analysis.push({ type: "positive", text: `✅ Well-balanced — largest holding only ${topConcentration.toFixed(1)}%.` });

      if (divYieldOnly > 5) analysis.push({ type: "positive", text: `💰 Excellent dividend yield of ${fmtPct(divYieldOnly)}. Great for passive income.` });
      else if (divYieldOnly > 2) analysis.push({ type: "positive", text: `💰 Healthy dividend yield of ${fmtPct(divYieldOnly)}.` });
      else if (divYieldOnly > 0) analysis.push({ type: "neutral", text: `📊 Dividend yield of ${fmtPct(divYieldOnly)} is low. Consider adding high-dividend assets.` });
      else analysis.push({ type: "neutral", text: `📊 No dividend income yet. For passive income, consider dividend ETFs or bonds.` });

      if (divCAGR && divCAGR.cagr > 10) analysis.push({ type: "positive", text: `📈 Exceptional dividend growth at ${divCAGR.cagr.toFixed(1)}% CAGR!` });
      else if (divCAGR && divCAGR.cagr > 5) analysis.push({ type: "positive", text: `📈 Good dividend growth (${divCAGR.cagr.toFixed(1)}% CAGR).` });
      else if (divCAGR && divCAGR.cagr > 0) analysis.push({ type: "neutral", text: `📊 Dividend growth of ${divCAGR.cagr.toFixed(1)}% — modest but positive.` });
      else if (divCAGR && divCAGR.cagr <= 0) analysis.push({ type: "critical", text: `⚠️ Dividend income has declined. Review holdings with dividend cuts.` });

      if (monthlyTargetAud > 0 && monthlyPassivePercent !== null) {
        if (monthlyPassivePercent >= 100) analysis.push({ type: "positive", text: `🎯 You've reached ${monthlyPassivePercent.toFixed(0)}% of your monthly passive income target!` });
        else if (monthlyPassivePercent >= 50) analysis.push({ type: "positive", text: `🎯 You're ${monthlyPassivePercent.toFixed(0)}% toward your monthly passive target.` });
        else if (monthlyPassivePercent > 0) analysis.push({ type: "neutral", text: `🎯 You're ${monthlyPassivePercent.toFixed(0)}% to your target. Consider adding higher-yielding assets.` });
      }

      if (superBenchmarkPercent !== null) {
        if (superBenchmarkPercent >= 120) analysis.push({ type: "positive", text: `🏦 Your super balance is ${superBenchmarkPercent.toFixed(0)}% of the average for your age — excellent!` });
        else if (superBenchmarkPercent >= 80) analysis.push({ type: "neutral", text: `🏦 Super balance is ${superBenchmarkPercent.toFixed(0)}% of average — on track.` });
        else if (superBenchmarkPercent > 0) analysis.push({ type: "critical", text: `⚠️ Super balance is only ${superBenchmarkPercent.toFixed(0)}% of average. Consider salary sacrificing.` });
      }

      const riskyAssets = holdings.filter(h => h.assetType === "Cryptocurrency" || h.assetType === "Commodity");
      if (riskyAssets.length > 0 && riskyAssets.reduce((s,h)=>s+h.currentValue,0)/totVal > 0.2) {
        analysis.push({ type: "critical", text: `⚠️ High-volatility assets exceed 20% of portfolio. Consider reducing to 5-10%.` });
      } else {
        analysis.push({ type: "positive", text: `💡 Tip: Regularly rebalance annually and consider dollar-cost averaging.` });
      }
      setAdvice(analysis);
      setLoading(false);
    }, 500);
  }, [holdings, totVal, totPct, divYieldOnly, divCAGR, monthlyPassivePercent, monthlyTargetAud, superBenchmarkPercent]);
  useEffect(() => { if (open && !advice && !loading) generateAdvice(); }, [open, advice, loading, generateAdvice]);
  if (!open) return (
    <div className="floating-ai-btn" onClick={() => setOpen(true)}>
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2"><path d="M12 2a10 10 0 0 1 10 10c0 5.5-4.5 10-10 10-2 0-4-.5-5.5-1.5L2 22l1.5-4.5A10 10 0 0 1 12 2z"/><path d="M8 10h.01"/><path d="M16 10h.01"/><path d="M9 16h6"/></svg>
    </div>
  );
  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.7)",backdropFilter:"blur(8px)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      <div style={{background:T.bg2,borderRadius:24,maxWidth:500,width:"100%",maxHeight:"80vh",overflowY:"auto",boxShadow:T.shadow}}>
        <div style={{padding:20,borderBottom:`1px solid ${T.border}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <h2 style={{fontFamily:"'Space Mono',monospace",fontSize:18,color:T.text}}>🤖 AI Portfolio Advisor</h2>
          <button onClick={()=>setOpen(false)} style={{background:"transparent",fontSize:20,color:T.text3}}>✕</button>
        </div>
        <div style={{padding:20}}>
          {loading && <div style={{textAlign:"center",padding:40}}><span className="spin">⟳</span> Analyzing...</div>}
          {advice && advice.map((item,idx)=>(
            <div key={idx} className="ai-message" style={{borderLeftColor:item.type==="positive"?"#22c55e":item.type==="critical"?"#ef4444":"#fbbf24"}}>
              <div style={{fontSize:14,color:T.text2}}>{item.text}</div>
            </div>
          ))}
          {advice && <div style={{marginTop:16,display:"flex",justifyContent:"flex-end",gap:8}}><button onClick={()=>{setAdvice(null);generateAdvice();}} style={{padding:"8px 16px",borderRadius:40,background:"linear-gradient(135deg,#22c55e,#06b6d4)",color:"white"}}>Refresh</button></div>}
        </div>
      </div>
    </div>
  );
}

// ========== MAIN APP ==========
function App(){
  const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d;}catch{return d;}};
  const [portfolio,setPortfolio]=useState(()=>ld("f6_p",SEED));
  const [prices,setPrices]=useState(()=>ld("f6_pr",INIT_PRICES));
  const [prevPrices,setPrevPrices]=useState(()=>ld("f6_pp",INIT_PREV));
  const [rates,setRates]=useState(()=>ld("f6_rates",INIT_RATES));
  const [displayCur,setDisplayCur]=useState(()=>ld("f6_dcur","AUD"));
  const [history,setHistory]=useState(()=>ld("f6_hist",makeSeedHistory()));
  const [dark,setDark]=useState(()=>ld("f6_dark",true));
  const [modal,setModal]=useState(null);
  const [form,setForm]=useState({});
  const [selected,setSelected]=useState(null);
  const [view,setView]=useState("treemap");
  const [tmMode,setTmMode]=useState("performance");
  const [tmShowVal,setTmShowVal]=useState(true);
  const [tmSize,setTmSize]=useState({w:600,h:420});
  const [chartPeriod,setChartPeriod]=useState("1Y");
  const [benchmarks,setBenchmarks]=useState({labels:[],series:{},holdingPrices:{}});
  const [bmVisible,setBmVisible]=useState({sp500:true});
  const [valuesHidden,setValuesHidden]=useState(false);
  const [fetchSt,setFetchSt]=useState({loading:false,lastUpdate:null,errors:{}});
  const [fbUser,setFbUser]=useState(null);
  const [syncSt,setSyncSt]=useState("idle");
  const [syncMsg,setSyncMsg]=useState("");
  const [monthlyTargetAud,setMonthlyTargetAud]=useState(()=>ld("f6_targetAud",0));
  const [superDrawRate,setSuperDrawRate]=useState(()=>ld("f6_superRate",0));
  const [showPassiveModal,setShowPassiveModal]=useState(false);
  const [avgSuperBalanceAud,setAvgSuperBalanceAud]=useState(()=>ld("f6_avgSuper",0));

  const T=dark?DARK:LIGHT;
  const isMob=useWindowSize()<768;

  useEffect(()=>{localStorage.setItem("f6_p",JSON.stringify(portfolio));},[portfolio]);
  useEffect(()=>{localStorage.setItem("f6_pr",JSON.stringify(prices));},[prices]);
  useEffect(()=>{localStorage.setItem("f6_pp",JSON.stringify(prevPrices));},[prevPrices]);
  useEffect(()=>{localStorage.setItem("f6_rates",JSON.stringify(rates));},[rates]);
  useEffect(()=>{localStorage.setItem("f6_dcur",JSON.stringify(displayCur));},[displayCur]);
  useEffect(()=>{localStorage.setItem("f6_hist",JSON.stringify(history));},[history]);
  useEffect(()=>{localStorage.setItem("f6_dark",JSON.stringify(dark));},[dark]);
  useEffect(()=>{localStorage.setItem("f6_targetAud",JSON.stringify(monthlyTargetAud));},[monthlyTargetAud]);
  useEffect(()=>{localStorage.setItem("f6_superRate",JSON.stringify(superDrawRate));},[superDrawRate]);
  useEffect(()=>{localStorage.setItem("f6_avgSuper",JSON.stringify(avgSuperBalanceAud));},[avgSuperBalanceAud]);

  const holdings=useMemo(()=>portfolio.map(h=>computeHolding(h,prices,prevPrices,rates)).filter(h=>h.qty>0),[portfolio,prices,prevPrices,rates]);
  const totVal=holdings.reduce((s,h)=>s+h.currentValue,0);
  const totGain=holdings.reduce((s,h)=>s+h.totalGain,0);
  const totInv=holdings.reduce((s,h)=>s+h.totalInvested,0);
  const totPct=totInv>0?(totGain/totInv)*100:0;
  const totDayGain=holdings.reduce((s,h)=>s+h.dayGain,0);
  const prevTot=totVal-totDayGain;
  const totDayPct=prevTot>0?(totDayGain/prevTot)*100:0;
  const totDivs=holdings.reduce((s,h)=>s+h.totalDividends,0);
  const divYieldOnly=useMemo(()=>{let inv=0,div=0; for(const h of holdings){if(DIVIDEND_PAYING_TYPES.has(h.assetType)){inv+=h.totalInvested; div+=h.totalDividends;}} return inv>0?(div/inv)*100:0;},[holdings]);
  const divCAGR=useMemo(()=>{const yearTotals=new Map(); for(const h of portfolio) for(const tx of h.transactions) if(tx.type==="dividend"&&tx.date){const y=tx.date.slice(0,4); const amt=toAUD(tx.totalAmount||0,h.currency,rates); yearTotals.set(y,(yearTotals.get(y)||0)+amt);} const years=[...yearTotals.keys()].sort(); if(years.length<2)return null; const first=yearTotals.get(years[0]), last=yearTotals.get(years[years.length-1]); const num=parseInt(years[years.length-1])-parseInt(years[0]); if(num<=0||first<=0)return null; return{cagr:(Math.pow(last/first,1/num)-1)*100,firstYear:years[0],lastYear:years[years.length-1]};},[portfolio,rates]);
  const monthlyDivsAUD=useMemo(()=>{const now=new Date(); const ym=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`; let total=0; for(const h of portfolio) for(const tx of h.transactions) if(tx.type==="dividend"&&tx.date?.startsWith(ym)) total+=toAUD(tx.totalAmount||0,h.currency,rates); return total;},[portfolio,rates]);
  const superFundsValueAUD=useMemo(()=>holdings.filter(h=>h.ticker==="NUL5339AU"||h.ticker==="NUL7270AU").reduce((s,h)=>s+h.currentValue,0),[holdings]);
  const monthlyPassiveNumerator=monthlyDivsAUD+(superFundsValueAUD*(superDrawRate/100))/12;
  const monthlyPassivePercent=monthlyTargetAud>0?(monthlyPassiveNumerator/monthlyTargetAud)*100:null;
  const targetDisplay=monthlyTargetAud>0?fmtCur(monthlyTargetAud,displayCur,rates,true):"—";
  const superBenchmarkPercent=avgSuperBalanceAud>0?(superFundsValueAUD/avgSuperBalanceAud)*100:null;

  const FC=(a,compact)=>valuesHidden?"••••••":fmtCur(a,displayCur,rates,compact);
  const FG=(a)=>valuesHidden?"••••••":fmtGain(a,displayCur,rates);
  const pColor=n=>n>=0?T.green:T.red;

  const perfRects=useMemo(()=>{const items=holdings.map(h=>({...h,value:h.currentValue})).sort((a,b)=>b.value-a.value); return squarify(items,0,0,tmSize.w,tmSize.h);},[holdings,tmSize]);
  const divRects=useMemo(()=>{const items=holdings.filter(h=>h.totalDividends>0).map(h=>({...h,value:h.totalDividends})).sort((a,b)=>b.value-a.value); return squarify(items,0,0,tmSize.w,tmSize.h);},[holdings,tmSize]);
  const dayRects=useMemo(()=>{const items=holdings.map(h=>({...h,value:Math.abs(h.dayGain)})).sort((a,b)=>b.value-a.value); return squarify(items,0,0,tmSize.w,tmSize.h);},[holdings,tmSize]);
  const rects=tmMode==="performance"?perfRects:tmMode==="day"?dayRects:divRects;

  const autoRefresh=useCallback(async()=>{
    setFetchSt(s=>({...s,loading:true}));
    try{
      const newRates=await fetchExchangeRates();
      setRates(newRates);
      const newP={...prices}, newPP={...prevPrices};
      for(const h of holdings){
        if(h.yahooSymbol){
          try{
            const{current,prev}=await fetchYahooPrice(h.yahooSymbol);
            newP[h.ticker]=current;
            newPP[h.ticker]=prev;
          }catch(e){}
        }
      }
      setPrices(newP);
      setPrevPrices(newPP);
      setFetchSt({loading:false,lastUpdate:new Date(),errors:{},successes:holdings.length,total:holdings.length,rateOk:true,bmStatus:"ok"});
    }catch(e){setFetchSt(s=>({...s,loading:false}));}
  },[holdings,prices,prevPrices]);

  useEffect(()=>{autoRefresh();},[]);

  const mapRef=useCallback(node=>{if(node){const obs=new ResizeObserver(e=>{const{width,height}=e[0].contentRect; setTmSize({w:width,h:height});}); obs.observe(node);}},[],);

  const openAdd=()=>setModal({mode:"add"});
  const closeModal=()=>setModal(null);
  const submitAdd=()=>{const{tk,qty,price}=form; if(tk&&qty&&price){const newH={id:Date.now(),ticker:tk.toUpperCase(),name:tk,currency:"AUD",assetType:"Shares / Stocks",transactions:[{type:"buy",qty:+qty,price:+price,date:new Date().toISOString().slice(0,10)}]}; setPortfolio(p=>[...p,newH]); setPrices(p=>({...p,[tk.toUpperCase()]:+price})); setPrevPrices(p=>({...p,[tk.toUpperCase()]:+price}));} closeModal();};

  // Simplified render (full interactive UI)
  return (
    <ErrorBoundary>
      <div style={{minHeight:"100vh",background:T.bg,color:T.text}}>
        <header style={{background:T.bg2,borderBottom:`1px solid ${T.border}`,padding:"10px 20px",position:"sticky",top:0,zIndex:20}}>
          <div style={{display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
            <div style={{display:"flex",alignItems:"center",gap:12}}>
              <span style={{fontFamily:"'Space Mono',monospace",fontSize:22,fontWeight:700,background:"linear-gradient(135deg,#22c55e,#06b6d4)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>FOLIO</span>
              <div style={{display:"flex",gap:4}}>{CURRENCIES.map(c=><button key={c} onClick={()=>setDisplayCur(c)} style={{padding:"4px 8px",borderRadius:20,background:displayCur===c?T.greenBtn:"transparent",color:displayCur===c?"#fff":T.text3}}>{c}</button>)}</div>
              <button onClick={()=>setDark(d=>!d)} style={{padding:"4px 10px",borderRadius:20,background:T.bg3}}>{dark?"☀️":"🌙"}</button>
              <button onClick={autoRefresh} disabled={fetchSt.loading} style={{padding:"4px 12px",borderRadius:20,background:T.bg3}}>⟳</button>
              <button onClick={openAdd} style={{padding:"4px 12px",borderRadius:20,background:T.greenBtn,color:"#fff"}}>+ Add</button>
            </div>
            <div style={{display:"flex",gap:8}}>
              <div style={{background:T.bg4,borderRadius:20,padding:"2px"}}>
                {["treemap","table","chart"].map(v=><button key={v} onClick={()=>setView(v)} style={{padding:"4px 12px",borderRadius:18,background:view===v?T.bg2:"transparent",color:view===v?T.text:T.text3}}>{v==="treemap"?"Map":v}</button>)}
              </div>
            </div>
          </div>
          <div style={{display:"flex",gap:16,marginTop:10,fontSize:11,flexWrap:"wrap"}}>
            <span>💰 Value: {FC(totVal,true)}</span>
            <span>📈 G/L: {FG(totGain)} ({fmtPct(totPct)})</span>
            <span>📅 Day: {FG(totDayGain)} ({fmtPct(totDayPct)})</span>
            <span>🌱 Div Yld: {fmtPct(divYieldOnly)}</span>
            <span>🎯 Passive: {monthlyPassivePercent!==null?`${monthlyPassivePercent.toFixed(0)}% of ${targetDisplay}`:"Set target"}</span>
          </div>
        </header>
        <main style={{padding:"16px 20px"}}>
          {view==="treemap" && (
            <div style={{display:"flex",gap:16,flexWrap:"wrap"}}>
              <div ref={mapRef} style={{flex:2,minWidth:250,height:450,position:"relative",background:T.bg3,borderRadius:20,overflow:"hidden"}}>
                {rects.map(r=>{
                  const col=gainColor(r.gainPct,dark);
                  return <div key={r.ticker} onClick={()=>setSelected(r.ticker===selected?null:r.ticker)} style={{position:"absolute",left:r.x,top:r.y,width:r.w,height:r.h,background:col.bg,border:`1px solid ${col.border}`,borderRadius:6,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",cursor:"pointer",fontSize:Math.min(14,Math.max(10,r.w/10)),fontWeight:700,color:col.text}}>{r.ticker}<span style={{fontSize:10}}>{fmtPct(r.gainPct)}</span></div>;
                })}
              </div>
              <div style={{flex:1,minWidth:240,background:T.bg3,borderRadius:20,padding:16}}>
                {selected? (()=>{const h=holdings.find(h=>h.ticker===selected); if(!h)return null; return(<><div style={{fontSize:18,fontWeight:700}}>{h.ticker}</div><div>{h.name}</div><div>Value: {FC(h.currentValue)}</div><div>Gain: {FG(h.totalGain)} ({fmtPct(h.gainPct)})</div><div>Div: {FC(h.totalDividends)} ({fmtPct(h.divYieldOnCost)} yld)</div></>);})() : <div style={{textAlign:"center",color:T.text3}}>Tap a box</div>}
              </div>
            </div>
          )}
          {view==="table" && (
            <div style={{overflowX:"auto",background:T.bg3,borderRadius:20,padding:12}}>
              <table style={{width:"100%",borderCollapse:"collapse"}}>
                <thead><tr>{["Ticker","Value","Gain","G/L%","Div","Div Yld"].map(c=><th key={c} style={{padding:8,textAlign:"left",color:T.text3}}>{c}</th>)}</tr></thead>
                <tbody>{holdings.map(h=><tr key={h.ticker}><td style={{padding:8,fontWeight:700}}>{h.ticker}</td><td>{FC(h.currentValue)}</td><td style={{color:pColor(h.totalGain)}}>{FG(h.totalGain)}</td><td>{fmtPct(h.gainPct)}</td><td>{FC(h.totalDividends)}</td><td>{fmtPct(h.divYieldOnCost)}</td></tr>)}</tbody>
              </table>
            </div>
          )}
          {view==="chart" && <div style={{background:T.bg3,borderRadius:20,padding:20,textAlign:"center"}}>📊 Chart view (full implementation in original code)</div>}
        </main>
        {modal?.mode==="add" && (
          <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.7)",display:"flex",alignItems:"center",justifyContent:"center"}}>
            <div style={{background:T.bg2,borderRadius:24,padding:24,width:320}}>
              <h3>Add Holding</h3>
              <input placeholder="Ticker" onChange={e=>setForm(f=>({...f,tk:e.target.value}))} style={{width:"100%",margin:"8px 0",padding:8,background:T.bg,border:`1px solid ${T.border}`,borderRadius:12,color:T.text}}/>
              <input placeholder="Quantity" type="number" onChange={e=>setForm(f=>({...f,qty:e.target.value}))} style={{width:"100%",margin:"8px 0",padding:8,background:T.bg,border:`1px solid ${T.border}`,borderRadius:12,color:T.text}}/>
              <input placeholder="Price" type="number" onChange={e=>setForm(f=>({...f,price:e.target.value}))} style={{width:"100%",margin:"8px 0",padding:8,background:T.bg,border:`1px solid ${T.border}`,borderRadius:12,color:T.text}}/>
              <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:16}}><button onClick={closeModal} style={{padding:"6px 12px",borderRadius:20}}>Cancel</button><button onClick={submitAdd} style={{padding:"6px 12px",borderRadius:20,background:T.greenBtn,color:"#fff"}}>Add</button></div>
            </div>
          </div>
        )}
        <AIAdvisor holdings={holdings} totVal={totVal} totGain={totGain} totPct={totPct} totDivs={totDivs} divYieldOnly={divYieldOnly} divCAGR={divCAGR} monthlyPassivePercent={monthlyPassivePercent} monthlyTargetAud={monthlyTargetAud} superBenchmarkPercent={superBenchmarkPercent} chartData={{}} T={T} dark={dark} />
      </div>
    </ErrorBoundary>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
