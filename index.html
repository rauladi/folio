function App(){
  const ld=(k,d)=>{try{const s=localStorage.getItem(k);return s?JSON.parse(s):d;}catch{return d;}};
  const[portfolio,setPortfolio]=useState(()=>ld("f6_p",SEED));
  const[prices,setPrices]      =useState(()=>ld("f6_pr",INIT_PRICES));
  const[prevPrices,setPrevPrices]=useState(()=>ld("f6_pp",INIT_PREV));
  const[rates,setRates]        =useState(()=>ld("f6_rates",INIT_RATES));
  const[displayCur,setDisplayCur]=useState(()=>ld("f6_dcur","AUD"));
  const[history,setHistory]    =useState(()=>ld("f6_hist",makeSeedHistory()));
  const[dark,setDark]          =useState(()=>ld("f6_dark",true));
  const[modal,setModal]        =useState(null);
  const[form,setForm]          =useState({});
  const[selected,setSelected]  =useState(null);
  const[view,setView]          =useState("treemap");
  const[tmMode,setTmMode]      =useState("performance");
  const[tmShowVal,setTmShowVal]=useState(true);
  const[tmSize,setTmSize]      =useState({w:600,h:420});
  const[chartPeriod,setChartPeriod]=useState("1Y");
  const[benchmarks,setBenchmarks]=useState({labels:[],series:{}});
  const[bmVisible,setBmVisible]  =useState({sp500:true,brk:false,jkse:true,eido:true,vas:false});
  // Fetch status
  const[fetchSt,setFetchSt]    =useState({loading:false,lastUpdate:null,errors:{},successes:0,total:0,fetched:0,rateOk:null,bmStatus:null});

  // ── Cloud Sync State ──
  const[fbUser,setFbUser]      =useState(null);   // logged-in Google user
  const[syncSt,setSyncSt]      =useState("idle");  // idle | saving | loading | ok | error
  const[syncMsg,setSyncMsg]    =useState("");
  const[importSt,setImportSt]  =useState({step:"idle",rows:[],parsed:[],errors:[],mergeMode:"merge",dragOver:false});
  const importFileRef          =useRef(null);

  const T=dark?DARK:LIGHT;
  const winW=useWindowSize();
  const isMob=winW<768;

  useEffect(()=>{try{localStorage.setItem("f6_p",JSON.stringify(portfolio));}catch{}},[portfolio]);
  useEffect(()=>{try{localStorage.setItem("f6_pr",JSON.stringify(prices));}catch{}},[prices]);
  useEffect(()=>{try{localStorage.setItem("f6_pp",JSON.stringify(prevPrices));}catch{}},[prevPrices]);
  useEffect(()=>{try{localStorage.setItem("f6_rates",JSON.stringify(rates));}catch{}},[rates]);
  useEffect(()=>{try{localStorage.setItem("f6_dcur",JSON.stringify(displayCur));}catch{}},[displayCur]);
  useEffect(()=>{try{localStorage.setItem("f6_hist",JSON.stringify(history));}catch{}},[history]);
  useEffect(()=>{try{localStorage.setItem("f6_dark",JSON.stringify(dark));}catch{}},[dark]);
  useEffect(()=>{document.body.style.background=T.bg;document.body.style.color=T.text;},[T]);

  // ── Firebase auth listener — track login state ──
  useEffect(()=>{
    if(!FB_CONFIGURED||!fbAuth)return;
    const unsub=fbAuth.onAuthStateChanged(user=>{
      setFbUser(user||null);
      if(user){ setSyncSt("idle"); setSyncMsg("Signed in as "+user.displayName); }
      else{ setSyncSt("idle"); setSyncMsg(""); }
    });
    return unsub;
  },[]);

  // ── Cloud Save — push local data to Firestore ──
  const cloudSaveAll=useCallback(async()=>{
    if(!fbUser){setSyncMsg("Sign in first");return;}
    setSyncSt("saving");setSyncMsg("Saving…");
    try{
      await cloudSave(fbUser.uid,{
        portfolio:JSON.stringify(portfolio),
        prices:JSON.stringify(prices),
        prevPrices:JSON.stringify(prevPrices),
        history:JSON.stringify(history),
        displayCur,
        dark,
        savedAt:new Date().toISOString(),
      });
      setSyncSt("ok");setSyncMsg("Saved ✓ "+new Date().toLocaleTimeString());
    }catch(e){setSyncSt("error");setSyncMsg("Save failed: "+e.message);}
  },[fbUser,portfolio,prices,prevPrices,history,displayCur,dark]);

  // ── Cloud Load — pull data from Firestore into local state ──
  const cloudLoadAll=useCallback(async()=>{
    if(!fbUser){setSyncMsg("Sign in first");return;}
    setSyncSt("loading");setSyncMsg("Loading…");
    try{
      const data=await cloudLoad(fbUser.uid);
      if(!data){setSyncSt("ok");setSyncMsg("No cloud data yet — save first");return;}
      if(data.portfolio) setPortfolio(JSON.parse(data.portfolio));
      if(data.prices)    setPrices(JSON.parse(data.prices));
      if(data.prevPrices)setPrevPrices(JSON.parse(data.prevPrices));
      if(data.history)   setHistory(JSON.parse(data.history));
      if(data.displayCur)setDisplayCur(data.displayCur);
      if(typeof data.dark==="boolean")setDark(data.dark);
      setSyncSt("ok");setSyncMsg("Loaded ✓ saved "+new Date(data.savedAt).toLocaleString());
    }catch(e){setSyncSt("error");setSyncMsg("Load failed: "+e.message);}
  },[fbUser]);

  // ── Auto-save to cloud 3s after any portfolio change ──
  useEffect(()=>{
    if(!fbUser||!FB_CONFIGURED)return;
    const t=setTimeout(()=>cloudSaveAll(),3000);
    return()=>clearTimeout(t);
  },[portfolio,prices,history]);

  // ── One-time history sanitization on mount ──────────────────────────────────
  // The seed history generates fake low values (~A$85K-100K) that are saved on
  // first load. Real snapshots reflect actual portfolio value. We purge any
  // snapshot below 30% of the most recent snapshot value (most reliable).
  useEffect(()=>{
    setHistory(prev=>{
      if(prev.length<2)return prev;
      const sorted=[...prev].sort((a,b)=>new Date(a.date)-new Date(b.date));
      // Use max of last 3 snapshots as reference (most reliable real values)
      const recent=sorted.slice(-3).map(s=>s.totalValueAUD).filter(v=>v>0);
      if(!recent.length)return prev;
      const refVal=Math.max(...recent);
      const threshold=refVal*0.30; // anything below 30% of recent max is seed/corrupt
      const cleaned=sorted.filter(s=>s.totalValueAUD>=threshold);
      if(cleaned.length<prev.length){
        console.log(`FOLIO: purged ${prev.length-cleaned.length} seed/corrupt history snapshots`);
        return cleaned;
      }
      return prev;
    });
  },[]);

  // Auto-refresh prices on page load — short delay lets React finish first render
  useEffect(()=>{const t=setTimeout(()=>autoRefresh(),800);return()=>clearTimeout(t);},[]);

  const mapRef=useCallback(node=>{
    if(!node)return;
    const obs=new ResizeObserver(e=>{const{width,height}=e[0].contentRect;setTmSize({w:width,h:height});});
    obs.observe(node);
  },[]);

  const holdings=useMemo(()=>portfolio.map(h=>computeHolding(h,prices,prevPrices,rates)).filter(h=>h.qty>0),[portfolio,prices,prevPrices,rates]);

  const totVal    =holdings.reduce((s,h)=>s+h.currentValue,0);
  const totGain   =holdings.reduce((s,h)=>s+h.totalGain,0);
  const totInv    =holdings.reduce((s,h)=>s+h.totalInvested,0);
  const totPct    =totInv>0?(totGain/totInv)*100:0;
  const totDayGain=holdings.reduce((s,h)=>s+h.dayGain,0);
  const prevTot   =totVal-totDayGain;
  const totDayPct =prevTot>0?(totDayGain/prevTot)*100:0;
  const totDivs   =holdings.reduce((s,h)=>s+h.totalDividends,0);
  const divYld    =totInv>0?(totDivs/totInv)*100:0;

  const FC=(a,compact=false)=>fmtCur(a,displayCur,rates,compact);
  const FG=(a)=>fmtGain(a,displayCur,rates);
  const pColor=n=>n>=0?T.green:T.red;

  // Treemap rects
  const perfRects=useMemo(()=>{const it=holdings.map(h=>({...h,value:h.currentValue})).sort((a,b)=>b.value-a.value);return it.length?squarify(it,0,0,tmSize.w,tmSize.h):[];},[holdings,tmSize]);
  const divRects =useMemo(()=>{const it=holdings.filter(h=>h.totalDividends>0).map(h=>({...h,value:h.totalDividends})).sort((a,b)=>b.value-a.value);return it.length?squarify(it,0,0,tmSize.w,tmSize.h):[];},[holdings,tmSize]);
  const dayRects =useMemo(()=>{const it=holdings.map(h=>({...h,value:Math.max(Math.abs(h.dayGain),0.01)})).sort((a,b)=>b.value-a.value);return it.length?squarify(it,0,0,tmSize.w,tmSize.h):[];},[holdings,tmSize]);
  const rects=tmMode==="performance"?perfRects:tmMode==="day"?dayRects:divRects;
  const totalPortfolioDivs=useMemo(()=>holdings.reduce((s,h)=>s+h.totalDividends,0),[holdings]);
  const selH=holdings.find(h=>h.ticker===selected);

  // ─── Live Price Refresh ─────────────────────────────────────────────────────
  const autoRefresh=useCallback(async()=>{
    setFetchSt(s=>({...s,loading:true,fetched:0}));
    let newRates=rates,rateOk=false;
    try{
      newRates=await fetchExchangeRates();
      setRates(newRates);rateOk=true;
    }catch(e){console.warn("Rate fetch failed:",e.message);}

    // ── Fetch all benchmarks in parallel ──────────────────────────────────────
    let bmStatus="loading";
    try{
      const BM_DEFS=[
        {key:"sp500",  label:"S&P 500",          fetch:()=>fetchBenchmark("^GSPC")},
        {key:"brk",    label:"BRK-B",             fetch:()=>fetchBenchmark("BRK-B")},
        {key:"jkse",   label:"IDX Composite",     fetch:()=>fetchBenchmark("^JKSE")},
        {key:"eido",   label:"EIDO",              fetch:()=>fetchBenchmark("EIDO")},
        {key:"vas",    label:"VAS",               fetch:()=>fetchBenchmark("VAS.AX")},
      ];
      const results=await Promise.allSettled(BM_DEFS.map(b=>b.fetch()));
      // Find longest label array as reference timeline
      const successes=results.map((r,i)=>r.status==="fulfilled"?{...BM_DEFS[i],data:r.value}:null).filter(Boolean);
      if(successes.length>0){
        const ref=successes.reduce((a,b)=>b.data.labels.length>a.data.labels.length?b:a);
        const series={};
        results.forEach((r,i)=>{
          series[BM_DEFS[i].key]=r.status==="fulfilled"?r.value.pct:null;
        });
        setBenchmarks({labels:ref.data.labels,series});
        const ok=BM_DEFS.map((b,i)=>results[i].status==="fulfilled"?b.label+"✓":null).filter(Boolean);
        const fail=BM_DEFS.map((b,i)=>results[i].status==="rejected"?b.label:null).filter(Boolean);
        bmStatus=`${ok.length}/${BM_DEFS.length} loaded${fail.length?` · failed: ${fail.join(", ")}`:""}`; 
      }else{
        bmStatus="failed — all benchmarks unavailable";
      }
    }catch(e){bmStatus="error: "+e.message;}

    // Determine which holdings can be auto-fetched and via which source
    // Sources: yahoo (default), djppr (Indonesian gov bonds), morningstar (AU managed funds)
    const fetchable=portfolio.filter(h=>{
      if(h.yahooSymbol)return true;  // has Yahoo symbol
      // PBS/SBN/SR/ST/FR/ORI series → DJPPR
      if(/^(PBS|SBN|SR|ST|FR|ORI|SUKUK)\d/i.test(h.ticker))return true;
      // APIR codes (8+ chars ending in AU/ID/US) → Morningstar
      if(/^[A-Z]{3}\d{4}[A-Z]{2}$/i.test(h.ticker))return true;
      return false;
    });
    const newP={...prices},newPP={...prevPrices};
    const errors={};let successes=0;

    // Route each holding to the right price source
    function fetchPriceFor(h){
      if(h.yahooSymbol) return fetchYahooPrice(h.yahooSymbol);
      const tk=h.ticker.toUpperCase();
      if(/^(PBS|SBN|SR|ST|FR|ORI)\d/i.test(tk)) return fetchDJPPRPrice(tk);
      if(/^[A-Z]{3}\d{4}[A-Z]{2}$/i.test(tk))   return fetchAUFundPrice(tk);
      return Promise.reject(new Error("No price source"));
    }

    // Concurrency pool of 5
    const CONCURRENCY=8;
    const allResults=new Array(fetchable.length);

    async function fetchOne(h,idx){
      try{
        const p=await fetchPriceFor(h);
        allResults[idx]={status:"fulfilled",value:{h,p}};
      }catch(e){
        allResults[idx]={status:"rejected",reason:e};
      }
    }

    let qi=0;
    while(qi<fetchable.length){
      const batch=fetchable.slice(qi,qi+CONCURRENCY);
      await Promise.allSettled(batch.map((h,bi)=>fetchOne(h,qi+bi)));
      qi+=CONCURRENCY;
      // Update progress mid-fetch
      const done=allResults.filter(Boolean).length;
      setFetchSt(s=>({...s,fetched:done,total:fetchable.length}));
    }

    allResults.forEach((r,i)=>{
      const h=fetchable[i];
      if(r?.status==="fulfilled"){
        // isBondPct: Yahoo returns % of face (e.g. 101.5), DJPPR also returns % → multiply by faceValue/100
        // Morningstar / Yahoo regular: price is already absolute
        const isDJPPR=!h.yahooSymbol&&/^(PBS|SBN|SR|ST|FR|ORI)\d/i.test(h.ticker);
        const mult=(h.isBondPct||isDJPPR)?(h.faceValue??1000000)/100:1;
        newP[h.ticker]=r.value.p.current*mult;
        newPP[h.ticker]=r.value.p.prev*mult;
        successes++;
      }else{ errors[h.ticker]=r?.reason?.message||"Failed"; }
    });
    setPrices(newP);setPrevPrices(newPP);
    const now=new Date();
    const date=now.toISOString().slice(0,10);
    const hs=portfolio.map(h=>computeHolding(h,newP,newPP,newRates)).filter(h=>h.qty>0);
    const snap={date,totalValueAUD:hs.reduce((s,h)=>s+h.currentValue,0),totalDividendsAUD:hs.reduce((s,h)=>s+h.totalDividends,0)};
    setHistory(prev=>[...prev.filter(s=>s.date!==date),snap].sort((a,b)=>new Date(a.date)-new Date(b.date)).slice(-90));
    setFetchSt({loading:false,lastUpdate:now,errors,successes,total:fetchable.length,fetched:fetchable.length,rateOk,bmStatus});
  },[portfolio,prices,prevPrices,rates]);

  // ─── Period filter helper ────────────────────────────────────────────────
  const periodCutoff=useCallback((period)=>{
    const now=new Date();
    if(period==="1M"){const d=new Date(now);d.setMonth(d.getMonth()-1);return d;}
    if(period==="3M"){const d=new Date(now);d.setMonth(d.getMonth()-3);return d;}
    if(period==="6M"){const d=new Date(now);d.setMonth(d.getMonth()-6);return d;}
    if(period==="YTD"){return new Date(now.getFullYear(),0,1);}
    if(period==="1Y"){const d=new Date(now);d.setFullYear(d.getFullYear()-1);return d;}
    if(period==="5Y"){const d=new Date(now);d.setFullYear(d.getFullYear()-5);return d;}
    return new Date(0);
  },[]);

  // Chart data
  const chartData=useMemo(()=>{
    const cutoff=periodCutoff(chartPeriod);
    // Sanitise history — remove seed data and corrupt snapshots
    // Seed history has values ~A$85K-100K; real portfolio is much larger.
    // Use max of last 3 snapshots as reference; purge anything below 30% of that.
    const rawSorted=[...history].sort((a,b)=>new Date(a.date)-new Date(b.date));
    const recentVals=rawSorted.slice(-3).map(s=>s.totalValueAUD).filter(v=>v>0);
    const refVal=recentVals.length?Math.max(...recentVals):0;
    const hThreshold=refVal*0.30;
    const allSorted=refVal>0?rawSorted.filter(s=>s.totalValueAUD>=hThreshold):rawSorted;
    const filtered=allSorted.filter(s=>new Date(s.date)>=cutoff);
    // Use last point before cutoff as the "start" baseline if available
    const baseSnap=allSorted.filter(s=>new Date(s.date)<cutoff).slice(-1)[0];

    const labels=filtered.map(s=>fmtMonShort(s.date));
    const vals=filtered.map(s=>fromAUD(s.totalValueAUD,displayCur,rates));
    const divCumul=filtered.map(s=>fromAUD(s.totalDividendsAUD,displayCur,rates));

    // Monthly income (all time for bar, filtered by period)
    const monthly={};
    portfolio.forEach(h=>{h.transactions.filter(t=>t.type==="dividend"&&new Date(t.date)>=cutoff).forEach(t=>{
      const m=t.date.slice(0,7);monthly[m]=(monthly[m]||0)+fromAUD(toAUD(t.totalAmount||0,h.currency,rates),displayCur,rates);
    });});
    const mKeys=Object.keys(monthly).sort();

    // Allocation (always full)
    const byType={};holdings.forEach(h=>{const k=h.assetType||"Other";byType[k]=(byType[k]||0)+fromAUD(h.currentValue,displayCur,rates);});
    const byCur={};holdings.forEach(h=>{byCur[h.currency]=(byCur[h.currency]||0)+fromAUD(h.currentValue,displayCur,rates);});
    const palette=["#6366f1","#22c55e","#06b6d4","#f59e0b","#ef4444","#8b5cf6","#ec4899","#14b8a6","#f97316","#84cc16","#3b82f6","#a78bfa"];

    // ── Waterfall: Growth Contributors ──────────────────────────────────────
    // Starting portfolio value
    const startVal=baseSnap?fromAUD(baseSnap.totalValueAUD,displayCur,rates):0;
    const endVal=fromAUD(totVal,displayCur,rates);
    // Top-ups (buys) in period
    const topUps=portfolio.reduce((s,h)=>{
      return s+h.transactions.filter(t=>t.type==="buy"&&new Date(t.date)>=cutoff)
        .reduce((ss,t)=>ss+fromAUD(toAUD(t.qty*t.price,h.currency,rates),displayCur,rates),0);
    },0);
    // Dividends received in period
    const divInPeriod=portfolio.reduce((s,h)=>{
      return s+h.transactions.filter(t=>t.type==="dividend"&&new Date(t.date)>=cutoff)
        .reduce((ss,t)=>ss+fromAUD(toAUD(t.totalAmount||0,h.currency,rates),displayCur,rates),0);
    },0);
    // Capital gain = end - start - topups (net of sales)
    const netSales=portfolio.reduce((s,h)=>{
      return s+h.transactions.filter(t=>t.type==="sell"&&new Date(t.date)>=cutoff)
        .reduce((ss,t)=>ss+fromAUD(toAUD(t.qty*t.price,h.currency,rates),displayCur,rates),0);
    },0);
    const capitalGain=endVal-startVal-topUps+netSales-divInPeriod;

    const waterfallData=[
      {label:"Start Value",value:startVal,type:"start"},
      capitalGain>=0
        ?{label:"Capital Gain",value:capitalGain,type:"pos"}
        :{label:"Capital Loss",value:capitalGain,type:"neg"},
      {label:"Top-Ups",value:topUps,type:"pos"},
      {label:"Dividends",value:divInPeriod,type:"pos"},
      netSales>0?{label:"Sales",value:-netSales,type:"neg"}:null,
      {label:"End Value",value:endVal,type:"total"},
    ].filter(Boolean);

    // ── Benchmark comparison (period-filtered) ───────────────────────────────
    const BM_KEYS=["sp500","brk","jkse","eido","vas"];
    let bmLabels=[],bmPortfolio=[];
    const bmSeries={};
    BM_KEYS.forEach(k=>bmSeries[k]=[]);

    if(benchmarks.labels.length>0){
      const bCutoff=periodCutoff(chartPeriod);
      const filtIdx=benchmarks.labels.map((l,i)=>new Date(l)>=bCutoff?i:-1).filter(i=>i>=0);
      if(filtIdx.length>1){
        bmLabels=filtIdx.map(i=>fmtMonShort(benchmarks.labels[i]));

        // allSorted is already sanitised above (30% of recent max threshold)
        const saneSorted=allSorted.filter(s=>s.totalValueAUD>0);

        // Find first benchmark date that has a sane portfolio snapshot
        let portBaseVal=null, portBaseSeriesIdx=-1;
        for(let j=0;j<filtIdx.length;j++){
          const bmDate=benchmarks.labels[filtIdx[j]];
          const snap=saneSorted.filter(s=>s.date<=bmDate).slice(-1)[0];
          if(snap&&snap.totalValueAUD>0){
            portBaseVal=snap.totalValueAUD;
            portBaseSeriesIdx=j;
            break;
          }
        }

        // If no sane history exists for the selected period, use current gainPct
        // as a single reference point rather than showing a misleading time series
        const hasReliableHistory=portBaseVal!=null&&portBaseSeriesIdx>=0;

        // Re-normalise all benchmark series from the same start point
        const refFiltI=portBaseSeriesIdx>=0?filtIdx[portBaseSeriesIdx]:filtIdx[0];
        BM_KEYS.forEach(k=>{
          const s=benchmarks.series[k];
          if(!s){bmSeries[k]=filtIdx.map(()=>null);return;}
          const base=s[refFiltI]??null;
          bmSeries[k]=filtIdx.map(i=>s[i]!=null&&base!=null?s[i]-base:null);
        });

        // Portfolio % return — only plot from first reliable snapshot
        // Use actual holdings gainPct if history is insufficient for the period
        bmPortfolio=filtIdx.map((i,j)=>{
          if(!hasReliableHistory||j<portBaseSeriesIdx) return null;
          const bmDate=benchmarks.labels[i];
          const snap=saneSorted.filter(s=>s.date<=bmDate).slice(-1)[0];
          if(!snap||!portBaseVal) return null;
          return((snap.totalValueAUD-portBaseVal)/portBaseVal)*100;
        });

        // Cap any single-period return at ±200% to catch remaining bad data points
        const cappedPortfolio=bmPortfolio.map(v=>v===null?null:Math.max(-200,Math.min(200,v)));
        bmPortfolio=cappedPortfolio;
      }
    }

    return{labels,vals,divCumul,
      mLabels:mKeys.map(fmtMon),mVals:mKeys.map(k=>monthly[k]),
      tLabels:Object.keys(byType),tVals:Object.values(byType),palette,
      byCurLabels:Object.keys(byCur),byCurVals:Object.values(byCur),byCurColors:["#22c55e","#06b6d4","#f59e0b","#8b5cf6"],
      waterfallData,startVal,endVal,
      bmLabels,bmSeries,bmPortfolio,
    };
  },[history,holdings,displayCur,rates,portfolio,chartPeriod,periodCutoff,benchmarks,totVal]);

  const yFmtD=useCallback((v)=>{
    if(displayCur==="IDR"){const abs=Math.abs(v);if(abs>=1e9)return`Rp${(v/1e9).toFixed(1)}M`;if(abs>=1e6)return`Rp${(v/1e6).toFixed(1)}Jt`;return`Rp${(v/1e3).toFixed(0)}Rb`;}
    const abs=Math.abs(v);if(abs>=1e6)return`${displayCur==="USD"?"US$":"A$"}${(v/1e6).toFixed(1)}M`;return`${displayCur==="USD"?"US$":"A$"}${(v/1e3).toFixed(0)}K`;
  },[displayCur]);

  // ─── Modals ─────────────────────────────────────────────────────────────────
  const closeModal=()=>{setModal(null);setForm({});};
  const openAdd=()=>{setModal({mode:"add"});setForm({ticker:"",name:"",qty:"",price:"",date:new Date().toISOString().slice(0,10),currency:"AUD",assetType:"Shares / Stocks",exchange:"",yahooSymbol:"",faceValue:"",isBondPct:false});};
  const openTrade=(h,type)=>{setModal({mode:"trade",holding:h,tradeType:type});setForm({qty:"",price:h.currentPrice,date:new Date().toISOString().slice(0,10)});};
  const openDiv=(h)=>{
    const hc=computeHolding(h,prices,prevPrices,rates);
    setModal({mode:"dividend",holding:h});
    setForm({amountPerShare:"",entitledQty:String(hc.qty),date:new Date().toISOString().slice(0,10)});
  };;
  const openHistory=(h)=>{setModal({mode:"history",holding:h});};
  const openManualPrice=()=>{
    const f={displayCur};
    holdings.forEach(h=>{f["c_"+h.ticker]=prices[h.ticker]||"";f["p_"+h.ticker]=prevPrices[h.ticker]||"";f["ys_"+h.ticker]=h.yahooSymbol||"";});
    setModal({mode:"price"});setForm(f);
  };

  const openImport=()=>{setModal({mode:"import"});setImportSt({step:"idle",rows:[],parsed:[],errors:[],mergeMode:"merge",dragOver:false});};

  const handleImportFile=async(file)=>{
    if(!file)return;
    setImportSt(s=>({...s,step:"parsing",dragOver:false}));
    try{
      const raw=await readFileAsRows(file);
      if(!raw.length){setImportSt(s=>({...s,step:"error",errorMsg:"File is empty or has no data rows."}));return;}
      const{rows,errors,fieldMap}=parseRows(raw);
      setImportSt(s=>({...s,step:"preview",rows:raw,parsed:rows,errors,fieldMap,fileName:file.name}));
    }catch(e){
      setImportSt(s=>({...s,step:"error",errorMsg:e.message}));
    }
  };

  const confirmImport=()=>{
    const{parsed,mergeMode}=importSt;
    const base=mergeMode==="replace"?[]:portfolio;
    const newPortfolio=buildPortfolioFromRows(parsed,base);
    setPortfolio(newPortfolio);
    setImportSt(s=>({...s,step:"done",importedCount:parsed.filter(r=>!r._errors.length).length}));
  };
  const submitAdd=()=>{
    const{ticker,name,qty,price,date,currency,assetType,exchange,yahooSymbol,faceValue,isBondPct}=form;
    if(!ticker||!qty||!price)return;
    const tk=ticker.toUpperCase();
    const ys=yahooSymbol||suggestYahoo(tk,exchange,assetType);
    const isBP=isBondPct||false;
    const fv=faceValue?+faceValue:undefined;
    if(portfolio.find(h=>h.ticker===tk)){
      setPortfolio(prev=>prev.map(h=>h.ticker===tk?{...h,transactions:[...h.transactions,{type:"buy",qty:+qty,price:+price,date}]}:h));
    }else{
      const newH={id:Date.now(),ticker:tk,name:name||tk,currency:currency||"AUD",assetType:assetType||"Shares / Stocks",exchange:exchange||"",yahooSymbol:ys,transactions:[{type:"buy",qty:+qty,price:+price,date}]};
      if(isBP)newH.isBondPct=true;if(fv)newH.faceValue=fv;
      setPortfolio(prev=>[...prev,newH]);
      setPrices(prev=>({...prev,[tk]:+price}));setPrevPrices(prev=>({...prev,[tk]:+price}));
    }
    closeModal();
  };
  const submitTrade=()=>{const{qty,price,date}=form;if(!qty||!price)return;setPortfolio(prev=>prev.map(h=>h.id===modal.holding.id?{...h,transactions:[...h.transactions,{type:modal.tradeType,qty:+qty,price:+price,date}]}:h));closeModal();};
  const submitDiv=()=>{
    const{amountPerShare,entitledQty,date}=form;
    if(!amountPerShare||!entitledQty)return;
    const qty=+entitledQty;
    setPortfolio(prev=>prev.map(p=>p.id===modal.holding.id?{...p,transactions:[...p.transactions,{
      type:"dividend",amountPerShare:+amountPerShare,totalAmount:+amountPerShare*qty,entitledQty:qty,date
    }]}:p));
    closeModal();
  };
  const submitManualPrice=()=>{
    const c={},p={},ys={};
    Object.entries(form).forEach(([k,v])=>{
      if(k.startsWith("c_")&&v!=="")c[k.slice(2)]=+v;
      if(k.startsWith("p_")&&v!=="")p[k.slice(2)]=+v;
      if(k.startsWith("ys_"))ys[k.slice(3)]=v;
    });
    setPrices(prev=>({...prev,...c}));setPrevPrices(prev=>({...prev,...p}));
    if(form.displayCur)setDisplayCur(form.displayCur);
    // Update yahooSymbol on portfolio holdings
    setPortfolio(prev=>prev.map(h=>({...h,yahooSymbol:ys[h.ticker]??h.yahooSymbol})));
    // Snapshot
    const newP={...prices,...c},newPP={...prevPrices,...p};
    const date=new Date().toISOString().slice(0,10);
    const hs=portfolio.map(h=>computeHolding(h,newP,newPP,rates)).filter(h=>h.qty>0);
    const snap={date,totalValueAUD:hs.reduce((s,h)=>s+h.currentValue,0),totalDividendsAUD:hs.reduce((s,h)=>s+h.totalDividends,0)};
    setHistory(prev=>[...prev.filter(s=>s.date!==date),snap].sort((a,b)=>new Date(a.date)-new Date(b.date)).slice(-90));
    closeModal();
  };

  const histH=modal?.mode==="history"?portfolio.find(p=>p.id===modal.holding.id):null;
  const histC=histH?computeHolding(histH,prices,prevPrices,rates):null;

  // ─── Style helpers ────────────────────────────────────────────────────────
  const card=(x={})=>({background:T.bg3,border:`1px solid ${T.border}`,borderRadius:12,...x});
  const bS=(bg,col,x={})=>({padding:"8px 16px",border:"none",borderRadius:8,background:bg,color:col,fontSize:12,fontWeight:700,...x});
  const bO=(col,x={})=>({padding:"8px 14px",border:`1px solid ${T.border2}`,borderRadius:8,background:"transparent",color:col,fontSize:12,...x});
  const inp=()=>({width:"100%",background:T.bg,border:`1px solid ${T.border}`,borderRadius:8,padding:"9px 12px",color:T.text,fontSize:13,outline:"none"});
  const lbl=(x={})=>({display:"block",fontSize:9,letterSpacing:1.2,color:T.text3,textTransform:"uppercase",marginBottom:5,fontWeight:600,...x});
  const fmtNativePrice=(h,v)=>{
    const cur=h.currency;if(!v&&v!==0)return"—";
    if(cur==="IDR")return`Rp ${fmtIDR(v)}`;if(cur==="USD")return`US$${fmtAUD(v)}`;return`A$${fmtAUD(v)}`;
  };

  // Fetch status bar content
  const errCount=Object.keys(fetchSt.errors).length;
  const fetchBarColor=fetchSt.loading?T.amber:errCount>0?T.amber:fetchSt.lastUpdate?T.green:T.text3;

  return(
  <div style={{minHeight:"100vh",background:T.bg,color:T.text}}>

    {/* ── HEADER ── */}
    <header style={{background:T.bg2,borderBottom:`1px solid ${T.border}`,position:"sticky",top:0,zIndex:20,boxShadow:T.shadow}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 14px",gap:8,flexWrap:"wrap"}}>
        {/* Logo */}
        <div style={{display:"flex",alignItems:"center",gap:0,flexShrink:0}}>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 56" width={isMob?160:210} height={isMob?44:56} style={{display:"block"}}>
            <defs>
              <linearGradient id="hbg" x1="0%" y1="100%" x2="100%" y2="0%"><stop offset="0%" stopColor="#22c55e"/><stop offset="55%" stopColor="#10b981"/><stop offset="100%" stopColor="#06b6d4"/></linearGradient>
              <linearGradient id="htg" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stopColor={T.text}/><stop offset="100%" stopColor="#a5f3c0"/></linearGradient>
              <filter id="hgl"><feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
            </defs>
            {/* Icon box */}
            <rect x="1" y="4" width="48" height="48" rx="9" fill={T.bg3} stroke="url(#hbg)" strokeWidth="1"/>
            {/* Bars */}
            <rect x="8"  y="36" width="6" height="10" rx="1.5" fill="#22c55e" opacity="0.7"/>
            <rect x="17" y="29" width="6" height="17" rx="1.5" fill="#22c55e" opacity="0.85"/>
            <rect x="26" y="21" width="6" height="25" rx="1.5" fill="#10b981"/>
            <rect x="35" y="13" width="6" height="33" rx="1.5" fill="#06b6d4" filter="url(#hgl)"/>
            {/* Trend line */}
            <polyline points="11,34 20,27 29,19 38,11" fill="none" stroke="url(#hbg)" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" opacity="0.9"/>
            {/* Dots */}
            <circle cx="11" cy="34" r="1.8" fill="#22c55e"/>
            <circle cx="20" cy="27" r="1.8" fill="#10b981"/>
            <circle cx="29" cy="19" r="1.8" fill="#0dd6c0"/>
            <circle cx="38" cy="11" r="3.5" fill="#06b6d4" filter="url(#hgl)"/>
            <circle cx="38" cy="11" r="1.8" fill="#e0f9ff"/>
            {/* Wordmark */}
            <text x="58" y="34" fontFamily="'Space Mono',monospace" fontWeight="700" fontSize="22" letterSpacing="3" fill="url(#htg)">FOLIO</text>
            {/* Tagline */}
            <text x="59" y="46" fontFamily="'Roboto',sans-serif" fontWeight="500" fontSize="7" letterSpacing="2.5" fill="#4dd08a" opacity="0.75">PORTFOLIO TRACKER</text>
          </svg>
        </div>
        {/* Desktop stats */}
        <div className="hdr-desktop" style={{display:"flex",alignItems:"stretch",flex:1,overflow:"hidden"}}>
          {[["VALUE",FC(totVal,true),T.text],["TOTAL G/L",`${FG(totGain)} (${fmtPct(totPct)})`,pColor(totGain)],["DAY G/L",`${FG(totDayGain)} (${fmtPct(totDayPct)})`,pColor(totDayGain)],["DIVIDENDS",FC(totDivs,true),T.teal],["DIV YLD/COST",fmtPct(divYld),T.teal],["HOLDINGS",String(holdings.length),T.text2]].map(([l,v,c],i)=>(
            <div key={l} style={{display:"flex",flexDirection:"column",padding:"0 12px",borderLeft:i>0?`1px solid ${T.border}`:"none",minWidth:0}}>
              <span style={{fontSize:8,letterSpacing:1.8,color:T.text3,textTransform:"uppercase",marginBottom:2,whiteSpace:"nowrap"}}>{l}</span>
              <span style={{fontSize:11,fontFamily:"'Space Mono',monospace",fontWeight:700,color:c,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{v}</span>
            </div>
          ))}
        </div>
        {/* Mobile stats */}
        <div className="hdr-mobile" style={{display:"none",gap:10,flex:1,justifyContent:"center",flexWrap:"wrap"}}>
          {[["VALUE",FC(totVal,true),T.text],["G/L",fmtPct(totPct),pColor(totGain)],["DAY",fmtPct(totDayPct),pColor(totDayGain)],["DIV",FC(totDivs,true),T.teal]].map(([l,v,c])=>(
            <div key={l} style={{textAlign:"center"}}><div style={{fontSize:8,color:T.text3,letterSpacing:1.5,textTransform:"uppercase"}}>{l}</div><div style={{fontFamily:"'Space Mono',monospace",fontSize:12,fontWeight:700,color:c}}>{v}</div></div>
          ))}
        </div>
        {/* Controls */}
        <div style={{display:"flex",gap:5,alignItems:"center",flexShrink:0,flexWrap:"wrap"}}>
          <div style={{display:"flex",background:T.bg4,borderRadius:8,padding:2,border:`1px solid ${T.border}`}}>
            {CURRENCIES.map(c=><button key={c} onClick={()=>setDisplayCur(c)} style={{padding:"4px 8px",borderRadius:6,border:"none",background:displayCur===c?T.bg2:"transparent",color:displayCur===c?T.text:T.text3,fontSize:10,fontWeight:displayCur===c?700:400,fontFamily:"'Space Mono',monospace"}}>{c}</button>)}
          </div>
          <button onClick={()=>setDark(d=>!d)} style={{...bO(T.text2,{padding:"6px 9px",fontSize:15,lineHeight:1,borderRadius:8})}}>{dark?"☀️":"🌙"}</button>
          <button onClick={autoRefresh} disabled={fetchSt.loading} style={{...bO(fetchBarColor,{padding:"6px 10px",fontSize:11,borderColor:fetchBarColor+"66",opacity:fetchSt.loading?.7:1})}}>
            <span className={fetchSt.loading?"spin":""} style={{marginRight:4,fontSize:12}}>{fetchSt.loading?"⟳":"🔄"}</span>
            {isMob?"":"Live Prices"}
          </button>
          <button onClick={openManualPrice} style={{...bO(T.text2,{fontSize:11,padding:"6px 10px"})}}>✏️{isMob?"":""}</button>
          <button onClick={openImport} style={{...bO(T.text2,{fontSize:11,padding:"6px 10px"})}}>📥 {isMob?"":"Import"}</button>

          {/* ── Cloud Sync Button ── */}
          {FB_CONFIGURED?(
            fbUser?(
              <div style={{display:"flex",alignItems:"center",gap:4}}>
                <div style={{display:"flex",background:T.bg4,borderRadius:8,border:`1px solid ${T.border}`,overflow:"hidden"}}>
                  <button onClick={cloudLoadAll} disabled={syncSt==="loading"||syncSt==="saving"}
                    title="Pull latest data from cloud"
                    style={{padding:"6px 9px",fontSize:11,border:"none",background:"transparent",color:syncSt==="loading"?T.amber:T.teal,cursor:"pointer"}}>
                    {syncSt==="loading"?"⟳":"⬇️"}
                  </button>
                  <button onClick={cloudSaveAll} disabled={syncSt==="loading"||syncSt==="saving"}
                    title="Push local data to cloud"
                    style={{padding:"6px 9px",fontSize:11,border:"none",background:"transparent",color:syncSt==="saving"?T.amber:syncSt==="ok"?T.green:syncSt==="error"?T.red:T.teal,cursor:"pointer"}}>
                    {syncSt==="saving"?"⟳":"⬆️"}
                  </button>
                  <button onClick={()=>signOut()} title={"Signed in: "+fbUser.displayName+"\nClick to sign out"}
                    style={{padding:"6px 9px",fontSize:11,border:"none",background:"transparent",color:T.text3,cursor:"pointer"}}>
                    {fbUser.photoURL?<img src={fbUser.photoURL} style={{width:16,height:16,borderRadius:"50%",verticalAlign:"middle"}} alt=""/>:"👤"}
                  </button>
                </div>
                {syncMsg&&<span style={{fontSize:9,color:syncSt==="error"?T.red:syncSt==="ok"?T.green:T.amber,maxWidth:120,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{syncMsg}</span>}
              </div>
            ):(
              <button onClick={()=>signInGoogle().then(u=>{setFbUser(u);cloudLoadAll();}).catch(e=>setSyncMsg(e.message))}
                style={{...bO(T.teal,{fontSize:11,padding:"6px 10px",display:"flex",alignItems:"center",gap:5})}}>
                ☁️ {isMob?"":"Sync"}
              </button>
            )
          ):(
            <button onClick={()=>setModal({mode:"firebaseSetup"})}
              style={{...bO(T.text3,{fontSize:11,padding:"6px 10px"})}}>
              ☁️ {isMob?"":"Setup Sync"}
            </button>
          )}

          <button onClick={openAdd} style={{...bS(T.greenBtn,"#fff",{padding:"7px 12px",fontSize:11})}}>+ Add</button>
        </div>
      </div>

      {/* Status bar */}
      <div style={{display:"flex",alignItems:"center",gap:10,padding:"4px 14px",background:T.bg,borderTop:`1px solid ${T.border}`,fontSize:10,color:T.text3,flexWrap:"wrap",minHeight:26}}>
        <span>1 AUD = {rates.AUD_IDR.toLocaleString("en-AU")} IDR</span>
        <span style={{color:T.border}}>·</span>
        <span>1 AUD = {rates.AUD_USD.toFixed(4)} USD</span>
        <span style={{color:T.border}}>·</span>
        <span style={{color:fetchBarColor}}>
          {fetchSt.loading&&<span className="pulse">⟳ Fetching prices… {fetchSt.fetched>0?`${fetchSt.fetched}/${fetchSt.total}`:""}</span>}
          {!fetchSt.loading&&fetchSt.lastUpdate&&<span style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
            <span style={{color:T.green}}>✓ Prices updated {fmtTime(fetchSt.lastUpdate)}</span>
            <span style={{color:T.border}}>·</span>
            <span>{fetchSt.successes}/{fetchSt.total} auto-fetched</span>
            {fetchSt.rateOk&&<><span style={{color:T.border}}>·</span><span style={{color:T.teal}}>FX live</span></>}
            {fetchSt.bmStatus&&<><span style={{color:T.border}}>·</span><span style={{color:fetchSt.bmStatus.includes("failed")||fetchSt.bmStatus.includes("error")?T.amber:T.teal}}>Benchmarks: {fetchSt.bmStatus}</span></>}
            {Object.keys(fetchSt.errors).length>0&&(()=>{
              // Split errors: truly missing price (no stored value) vs stale-but-ok (has stored price)
              const truly=Object.keys(fetchSt.errors).filter(t=>!(prices[t]>0));
              const stale=Object.keys(fetchSt.errors).filter(t=>prices[t]>0);
              return(<>
                {truly.length>0&&<><span style={{color:T.border}}>·</span><span style={{color:T.red}}>⚠️ No price: {truly.join(", ")} — <span onClick={openManualPrice} style={{textDecoration:"underline",cursor:"pointer"}}>enter manually ✏️</span></span></>}
                {stale.length>0&&<><span style={{color:T.border}}>·</span><span style={{color:T.amber}}>↻ Fetch failed (using last known): {stale.join(", ")}</span></>}
              </>);
            })()}
          </span>}
          {!fetchSt.loading&&!fetchSt.lastUpdate&&<span>Click 🔄 to fetch live prices &amp; benchmarks</span>}
        </span>
        <span style={{color:T.border}}>·</span>
        <span>Display: <b style={{color:T.text2}}>{displayCur}</b></span>
        <span style={{color:T.border}}>·</span>
        <span>{holdings.length} holdings</span>
      </div>
    </header>

    {/* ── CONTROLS ── */}
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"8px 14px",borderBottom:`1px solid ${T.border}`,background:T.bg2,flexWrap:"wrap",gap:8}}>
      <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
        {view==="treemap"&&tmMode==="performance"&&<>
          <span style={{fontSize:9,color:T.text3,letterSpacing:1,textTransform:"uppercase",marginRight:2}}>G/L to date:</span>
          {[[-4,"≤-3%"],[-2,"-1%"],[0,"0"],[1,"+1%"],[4,"+3%+"]].map(([p,l])=>{const c=gainColor(p,dark);return(<div key={l} style={{display:"flex",alignItems:"center",gap:3}}><div style={{width:11,height:11,borderRadius:2,background:c.bg,border:`1px solid ${c.border}`}}/><span style={{fontSize:9,color:T.text3}}>{l}</span></div>);})}
        </>}
        {view==="treemap"&&tmMode==="day"&&<>
          <span style={{fontSize:9,color:T.text3,letterSpacing:1,textTransform:"uppercase",marginRight:2}}>Day G/L %:</span>
          {[[-3,"≤-2%"],[-1,"-0.5%"],[0,"0"],[0.6,"+0.5%"],[3,"+2%+"]].map(([p,l])=>{const c=dayColor(p,dark);return(<div key={l} style={{display:"flex",alignItems:"center",gap:3}}><div style={{width:11,height:11,borderRadius:2,background:c.bg,border:`1px solid ${c.border}`}}/><span style={{fontSize:9,color:T.text3}}>{l}</span></div>);})}
        </>}
        {view==="treemap"&&tmMode==="dividend"&&<>
          <span style={{fontSize:9,color:T.text3,letterSpacing:1,textTransform:"uppercase",marginRight:2}}>Div yld/cost:</span>
          {[[-1,"0%"],[0.5,">0%"],[2,"+2%"],[4,"+4%"],[6,"+6%+"]].map(([y,l])=>{const c=divColor(y,dark);return(<div key={l} style={{display:"flex",alignItems:"center",gap:3}}><div style={{width:11,height:11,borderRadius:2,background:c.bg,border:`1px solid ${c.border}`}}/><span style={{fontSize:9,color:T.text3}}>{l}</span></div>);})}
        </>}
      </div>
      <div style={{display:"flex",gap:6}}>
        {view==="treemap"&&(
          <div style={{display:"flex",gap:6,alignItems:"center"}}>
            <div style={{display:"flex",background:T.bg4,borderRadius:8,padding:2,border:`1px solid ${T.border}`}}>
              {[["performance","📈 Perf"],["day","☀️ Day"],["dividend","💰 Div"]].map(([v,l])=>(
                <button key={v} onClick={()=>setTmMode(v)} style={{padding:"4px 10px",borderRadius:6,border:"none",background:tmMode===v?T.bg2:"transparent",color:tmMode===v?T.text:T.text3,fontSize:10,transition:"all .15s"}}>{l}</button>
              ))}
            </div>
            {(tmMode==="day"||tmMode==="dividend")&&(
              <button onClick={()=>setTmShowVal(v=>!v)} title={tmShowVal?"Show % only":"Show % and value"}
                style={{padding:"4px 10px",borderRadius:8,border:`1px solid ${T.border}`,background:!tmShowVal?T.teal:T.bg4,color:!tmShowVal?"#fff":T.text3,fontSize:10,fontWeight:600,transition:"all .15s",whiteSpace:"nowrap"}}>
                {tmShowVal?"% only":"% + val"}
              </button>
            )}
          </div>
        )}
        <div style={{display:"flex",background:T.bg4,borderRadius:8,padding:2,border:`1px solid ${T.border}`}}>
          {[["treemap","Map"],["table","Table"],["chart","Charts"]].map(([v,l])=>(
            <button key={v} onClick={()=>setView(v)} style={{padding:"4px 10px",borderRadius:6,border:"none",background:view===v?T.bg2:"transparent",color:view===v?T.text:T.text3,fontSize:10,transition:"all .15s"}}>{l}</button>
          ))}
        </div>
      </div>
    </div>

    {/* ── MAIN ── */}
    <main style={{padding:"12px 14px"}}>

      {/* TREEMAP */}
      {view==="treemap"&&(
        <div className="tm-wrap" style={{display:"flex",gap:12,alignItems:"flex-start",flexWrap:isMob?"wrap":"nowrap"}}>
          <div ref={mapRef} style={{flex:"1 1 280px",width:isMob?"100%":"auto",height:isMob?"calc(100vw - 28px)":440,position:"relative",borderRadius:12,overflow:"hidden",border:`1px solid ${T.border}`,background:T.bg3,minWidth:200}}>
            {rects.map(r=>{
              const c=tmMode==="performance"?gainColor(r.gainPct,dark):tmMode==="day"?dayColor(r.dayGainPct,dark):divColor(r.divYieldOnCost,dark);
              const area=r.w*r.h,big=area>15000,mid=area>3500,sm=area>1400;
              return(
                <div key={r.ticker} onClick={()=>setSelected(r.ticker===selected?null:r.ticker)}
                  style={{position:"absolute",left:r.x+1,top:r.y+1,width:r.w-2,height:r.h-2,background:c.bg,border:`1px solid ${c.border}`,borderRadius:5,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",cursor:"pointer",overflow:"hidden",outline:r.ticker===selected?`2px solid ${c.text}`:"none",transition:"filter .12s"}}
                  onMouseEnter={e=>e.currentTarget.style.filter="brightness(1.2)"}
                  onMouseLeave={e=>e.currentTarget.style.filter="brightness(1)"}
                >
                  {mid&&<span style={{fontSize:big?19:sm?12:10,fontFamily:"'Space Mono',monospace",fontWeight:700,color:c.text,letterSpacing:.5,textAlign:"center",padding:"0 3px",lineHeight:1.2}}>{r.ticker}</span>}
                  {sm&&<span style={{fontSize:big?12:9,fontFamily:"'Space Mono',monospace",color:c.text,opacity:.85,marginTop:1}}>
                    {tmMode==="performance"?fmtPct(r.gainPct):tmMode==="day"?fmtPct(r.dayGainPct):tmShowVal?FC(r.totalDividends,true):fmtPct(r.divYieldOnCost)+" yld"}
                  </span>}
                  {big&&tmMode==="day"&&tmShowVal&&<span style={{fontSize:9,fontFamily:"'Space Mono',monospace",color:c.text,opacity:.6,marginTop:1}}>{FG(r.dayGain)}</span>}
                  {big&&tmMode==="dividend"&&tmShowVal&&<span style={{fontSize:9,fontFamily:"'Space Mono',monospace",color:c.text,opacity:.6,marginTop:1}}>{fmtPct(r.divYieldOnCost)} yld</span>}
                  {big&&tmMode==="dividend"&&!tmShowVal&&totalPortfolioDivs>0&&<span style={{fontSize:9,fontFamily:"'Space Mono',monospace",color:c.text,opacity:.6,marginTop:1}}>{(r.totalDividends/totalPortfolioDivs*100).toFixed(1)}% of total</span>}
                  {/* Bond indicator */}
                  {r.isBondPct&&sm&&<span style={{fontSize:7,color:c.text,opacity:.5,marginTop:1}}>BOND</span>}
                </div>
              );
            })}
            {rects.length===0&&<div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",color:T.text4,fontFamily:"'Space Mono',monospace",fontSize:11,textAlign:"center",padding:20}}>{tmMode==="dividend"?"No dividends recorded yet":"No holdings — tap + Add"}</div>}
          </div>

          {/* Detail panel */}
          <div className="detail-panel" style={{width:isMob?"100%":264,flexShrink:0,...card({padding:16,minHeight:isMob?0:200})}}>
            {selH?(
              <>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14}}>
                  <div style={{flex:1,minWidth:0,marginRight:8}}>
                    <div style={{fontFamily:"'Space Mono',monospace",fontSize:18,fontWeight:700,color:T.text}}>{selH.ticker}</div>
                    <div style={{fontSize:11,color:T.text3,marginTop:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{selH.name}</div>
                    <div style={{display:"flex",gap:4,marginTop:5,flexWrap:"wrap"}}>
                      {[selH.assetType,selH.currency,selH.exchange,selH.yahooSymbol].filter(Boolean).map(tag=>(
                        <span key={tag} style={{fontSize:9,background:T.bg4,padding:"2px 6px",borderRadius:4,border:`1px solid ${T.border}`,color:T.text3,whiteSpace:"nowrap"}}>{tag}</span>
                      ))}
                      {selH.isBondPct&&<span style={{fontSize:9,background:dark?"#0a2030":"#e0f9ff",padding:"2px 6px",borderRadius:4,border:`1px solid ${T.teal}55`,color:T.teal,whiteSpace:"nowrap"}}>Fixed Rate Bond</span>}
                    </div>
                  </div>
                  <div style={{padding:"3px 8px",borderRadius:20,background:gainColor(selH.gainPct,dark).bg,color:gainColor(selH.gainPct,dark).text,fontFamily:"'Space Mono',monospace",fontSize:10,fontWeight:700,whiteSpace:"nowrap"}}>{fmtPct(selH.gainPct)}</div>
                </div>
                {/* Bond face value note */}
                {selH.isBondPct&&<div style={{background:dark?"#040e18":"#f0f9ff",border:`1px solid ${T.teal}44`,borderRadius:8,padding:"6px 10px",marginBottom:12,fontSize:10,color:T.teal}}>
                  Face value: Rp {fmtIDR(selH.faceValue||1000000)} · {selH.qty} units
                </div>}
                {[
                  {title:"Price & Day",rows:[["Native Price",fmtNativePrice(selH,selH.currentPrice),T.text],["Prev Close",fmtNativePrice(selH,selH.prevClose),T.text2],["Day G/L",`${FG(selH.dayGain)} (${fmtPct(selH.dayGainPct)})`,pColor(selH.dayGain)]]},
                  {title:"Position",rows:[["Units",selH.qty<1?selH.qty.toFixed(6):selH.qty.toFixed(4),T.text],["Market Value",FC(selH.currentValue),T.text],["Cost Basis",FC(selH.costBasis),T.text2],["Unrealized",FG(selH.unrealizedGain),pColor(selH.unrealizedGain)],["Realized",FG(selH.realizedGain),pColor(selH.realizedGain)]]},
                  {title:"Income (Div / Coupon)",rows:[["Total Received",FC(selH.totalDividends),T.teal],["Yield on Cost",fmtPct(selH.divYieldOnCost),T.teal]]},
                ].map(sec=>(
                  <div key={sec.title} style={{marginBottom:12,paddingBottom:12,borderBottom:`1px solid ${T.border}`}}>
                    <div style={{fontSize:8,letterSpacing:1.5,color:T.text3,textTransform:"uppercase",marginBottom:7}}>{sec.title}</div>
                    {sec.rows.map(([l,v,c])=>(
                      <div key={l} style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:5}}>
                        <span style={{fontSize:9,color:T.text3,textTransform:"uppercase",letterSpacing:.3}}>{l}</span>
                        <span style={{fontFamily:"'Space Mono',monospace",fontSize:10,color:c,fontWeight:600,textAlign:"right",maxWidth:"60%",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{v}</span>
                      </div>
                    ))}
                  </div>
                ))}
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:5}}>
                  <button onClick={()=>openTrade(selH,"buy")}  style={bS(T.greenBtn,"#fff",{padding:"7px 0",fontSize:11})}>Buy</button>
                  <button onClick={()=>openTrade(selH,"sell")} style={bS(T.redBtn,"#fff",{padding:"7px 0",fontSize:11})}>Sell</button>
                  <button onClick={()=>openDiv(selH)}          style={bS(T.tealBtn,"#fff",{padding:"7px 0",fontSize:11})}>💰 {selH.isBondPct?"Coupon":"Dividend"}</button>
                  <button onClick={()=>openHistory(selH)}      style={bO(T.text2,{padding:"7px 0",fontSize:11})}>📋 History</button>
                </div>
              </>
            ):(
              <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:120,textAlign:"center"}}>
                <div style={{fontSize:28,marginBottom:8,opacity:.4}}>👆</div>
                <div style={{fontFamily:"'Space Mono',monospace",fontSize:11,color:T.text3,lineHeight:1.8}}>Tap any box<br/>to view details</div>
              </div>
            )}
          </div>
        </div>
      )}

      {/* TABLE */}
      {view==="table"&&(
        <div style={{overflowX:"auto",...card()}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>
            <thead>
              <tr>{["Ticker","Type","CCY","Units","Avg Cost","Current","Day G/L","Mkt Value","Unrealzd","Realzd","Div/Coupon","Div Yld","ROI","Total G/L","G/L%","Actions"].map(c=>(
                <th key={c} style={{padding:"10px 10px",textAlign:"left",fontSize:8,letterSpacing:1.5,color:T.text3,textTransform:"uppercase",background:T.bg2,borderBottom:`1px solid ${T.border}`,whiteSpace:"nowrap"}}>{c}</th>
              ))}</tr>
            </thead>
            <tbody>
              {holdings.sort((a,b)=>b.currentValue-a.currentValue).map((h,i)=>{
                const gc=gainColor(h.gainPct,dark);const bg=i%2===0?T.bg3:T.bg2;
                return(
                  <tr key={h.ticker} style={{background:bg}}
                    onMouseEnter={e=>e.currentTarget.style.background=T.bg4}
                    onMouseLeave={e=>e.currentTarget.style.background=bg}
                  >
                    <td style={{padding:"10px 10px",fontFamily:"'Space Mono',monospace",fontWeight:700,color:T.text,fontSize:12,borderBottom:`1px solid ${T.border}`,whiteSpace:"nowrap"}}>{h.ticker}{h.isBondPct&&<span style={{fontSize:8,color:T.teal,marginLeft:3}}>BOND</span>}</td>
                    <td style={{padding:"10px 10px",color:T.text3,maxWidth:90,overflow:"hidden",textOverflow:"ellipsis",borderBottom:`1px solid ${T.border}`,whiteSpace:"nowrap"}}>{h.assetType||"—"}</td>
                    <td style={{padding:"10px 10px",fontFamily:"'Space Mono',monospace",color:T.text3,fontSize:10,borderBottom:`1px solid ${T.border}`}}>{h.currency}</td>
                    <td style={{padding:"10px 10px",fontFamily:"'Space Mono',monospace",color:T.text2,borderBottom:`1px solid ${T.border}`}}>{h.qty<1?h.qty.toFixed(6):h.qty.toFixed(4)}</td>
                    <td style={{padding:"10px 10px",fontFamily:"'Space Mono',monospace",color:T.text2,borderBottom:`1px solid ${T.border}`,whiteSpace:"nowrap"}}>{FC(h.costBasis/Math.max(h.qty,1e-9),true)}</td>
                    <td style={{padding:"10px 10px",fontFamily:"'Space Mono',monospace",color:T.text,borderBottom:`1px solid ${T.border}`,whiteSpace:"nowrap"}}>{fmtNativePrice(h,h.currentPrice)}</td>
                    <td style={{padding:"10px 10px",fontFamily:"'Space Mono',monospace",color:pColor(h.dayGain),borderBottom:`1px solid ${T.border}`,whiteSpace:"nowrap"}}>{FG(h.dayGain)}<br/><span style={{fontSize:9,opacity:.7}}>{fmtPct(h.dayGainPct)}</span></td>
                    <td style={{padding:"10px 10px",fontFamily:"'Space Mono',monospace",color:T.text,fontWeight:600,borderBottom:`1px solid ${T.border}`,whiteSpace:"nowrap"}}>{FC(h.currentValue,true)}</td>
                    <td style={{padding:"10px 10px",fontFamily:"'Space Mono',monospace",color:pColor(h.unrealizedGain),borderBottom:`1px solid ${T.border}`,whiteSpace:"nowrap"}}>{FG(h.unrealizedGain)}</td>
                    <td style={{padding:"10px 10px",fontFamily:"'Space Mono',monospace",color:pColor(h.realizedGain),borderBottom:`1px solid ${T.border}`,whiteSpace:"nowrap"}}>{FG(h.realizedGain)}</td>
                    <td style={{padding:"10px 10px",fontFamily:"'Space Mono',monospace",color:T.teal,borderBottom:`1px solid ${T.border}`,whiteSpace:"nowrap"}}>{FC(h.totalDividends,true)}</td>
                    <td style={{padding:"10px 10px",fontFamily:"'Space Mono',monospace",color:T.teal,borderBottom:`1px solid ${T.border}`,whiteSpace:"nowrap"}}>{fmtPct(h.divYieldOnCost)}</td>
                    <td style={{padding:"10px 10px",borderBottom:`1px solid ${T.border}`,whiteSpace:"nowrap"}}>
                      {(()=>{const roi=h.totalInvested>0?((h.currentValue+h.totalDividends-h.totalInvested)/h.totalInvested)*100:0;const rc=gainColor(roi,dark);return <span style={{padding:"2px 8px",borderRadius:20,background:rc.bg,color:rc.text,fontFamily:"'Space Mono',monospace",fontSize:9,fontWeight:700}}>{fmtPct(roi)}</span>})()}
                    </td>
                    <td style={{padding:"10px 10px",fontFamily:"'Space Mono',monospace",color:pColor(h.totalGain),fontWeight:700,borderBottom:`1px solid ${T.border}`,whiteSpace:"nowrap"}}>{FG(h.totalGain)}</td>
                    <td style={{padding:"10px 10px",borderBottom:`1px solid ${T.border}`,whiteSpace:"nowrap"}}><span style={{padding:"2px 7px",borderRadius:20,background:gc.bg,color:gc.text,fontFamily:"'Space Mono',monospace",fontSize:9,fontWeight:700}}>{fmtPct(h.gainPct)}</span></td>
                    <td style={{padding:"10px 10px",borderBottom:`1px solid ${T.border}`,whiteSpace:"nowrap"}}>
                      <div style={{display:"flex",gap:3}}>
                        {[["B",()=>openTrade(h,"buy"),T.greenBtn],["S",()=>openTrade(h,"sell"),T.redBtn],["D",()=>openDiv(h),T.tealBtn],["H",()=>openHistory(h),T.bg5]].map(([l,fn,bg])=>(
                          <button key={l} onClick={fn} style={{width:22,height:22,borderRadius:4,border:"none",background:bg,color:bg===T.bg5?T.text2:"#fff",fontSize:10,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center"}}>{l}</button>
                        ))}
                      </div>
                    </td>
                  </tr>
                );
              })}
              {holdings.length===0&&<tr><td colSpan={16} style={{padding:48,textAlign:"center",color:T.text4,fontFamily:"'Space Mono',monospace",fontSize:11}}>No holdings — tap "+ Add" to get started</td></tr>}
            </tbody>
          </table>
        </div>
      )}

      {/* CHARTS */}
      {view==="chart"&&(
        <div style={{display:"flex",flexDirection:"column",gap:14}}>

          {/* ── Summary cards ── */}
          <div style={{display:"grid",gridTemplateColumns:isMob?"1fr 1fr":"repeat(5,1fr)",gap:10}}>
            {(()=>{
              const totROI=totInv>0?((totVal+totDivs-totInv)/totInv)*100:0;
              return[
                ["Total Invested", FC(totInv),                              T.text2,       "💰", false],
                ["Current Value",  FC(totVal),                              T.text,        "📈", false],
                ["Total Gain/Loss",`${FG(totGain)}  ${fmtPct(totPct)}`,    pColor(totGain),"🏆", false],
                ["Total Income",   `${FC(totDivs)}  ${fmtPct(divYld)} yld`,T.teal,        "🌱", false],
                ["Total ROI",      fmtPct(totROI),                          pColor(totROI), "🎯", true],
              ].map(([l,v,c,ic,fullRow])=>(
                <div key={l} style={{...card({padding:"14px 16px"}),gridColumn:fullRow&&isMob?"1 / -1":"auto"}}>
                  <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:6}}>
                    <span style={{fontSize:16}}>{ic}</span>
                    <span style={{fontSize:10,color:T.text3,letterSpacing:1,textTransform:"uppercase",fontWeight:600}}>{l}</span>
                  </div>
                  <div style={{fontFamily:"'Space Mono',monospace",fontSize:13,fontWeight:700,color:c,whiteSpace:"pre-line",lineHeight:1.6}}>{v}</div>
                </div>
              ));
            })()}
          </div>

          {/* ── Period selector (shared for time-based charts) ── */}
          <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
            <span style={{fontSize:11,color:T.text3,fontWeight:500}}>Time period:</span>
            <div style={{display:"flex",gap:3,background:T.bg3,padding:3,borderRadius:10,border:`1px solid ${T.border}`}}>
              {["1M","3M","6M","YTD","1Y","5Y"].map(p=>(
                <button key={p} onClick={()=>setChartPeriod(p)} style={{padding:"5px 12px",borderRadius:7,border:"none",background:chartPeriod===p?`linear-gradient(135deg,#22c55e,#06b6d4)`:"transparent",color:chartPeriod===p?"#fff":T.text3,fontSize:11,fontWeight:chartPeriod===p?700:500,transition:"all .15s",cursor:"pointer"}}>{p}</button>
              ))}
            </div>
            <span style={{fontSize:10,color:T.text3,marginLeft:4}}>{chartData.labels.length} data points</span>
          </div>

          {/* ── Row 1: Portfolio value + Allocation ── */}
          <div className="chart-row" style={{display:"flex",gap:12,flexWrap:isMob?"wrap":"nowrap"}}>
            <div style={{flex:"2 1 280px",...card({padding:16})}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
                <div>
                  <div style={{fontSize:12,fontWeight:600,color:T.text,marginBottom:2}}>Portfolio Value Over Time</div>
                  <div style={{fontSize:11,color:T.text3}}>{displayCur} · {chartPeriod} view</div>
                </div>
                {chartData.labels.length>=2&&<div style={{textAlign:"right"}}>
                  <div style={{fontSize:10,color:T.text3}}>Period return</div>
                  <div style={{fontFamily:"'Space Mono',monospace",fontSize:12,fontWeight:700,color:pColor(chartData.endVal-chartData.startVal)}}>{fmtPct(chartData.startVal>0?(chartData.endVal-chartData.startVal)/chartData.startVal*100:0)}</div>
                </div>}
              </div>
              <ChartLine labels={chartData.labels} datasets={[
                {label:"Portfolio Value",data:chartData.vals,borderColor:dark?"#22c55e":"#16a34a",backgroundColor:dark?"rgba(34,197,94,.07)":"rgba(22,163,74,.06)",fill:true,borderWidth:2},
                {label:"Cum. Dividends / Coupons",data:chartData.divCumul,borderColor:dark?"#06b6d4":"#0891b2",backgroundColor:"transparent",borderDash:[5,4],borderWidth:1.5}
              ]} T={T} yFmt={yFmtD} height={isMob?170:230}/>
            </div>
            <div style={{flex:"1 1 200px",...card({padding:16})}}>
              <div style={{fontSize:12,fontWeight:600,color:T.text,marginBottom:2}}>Asset Allocation</div>
              <div style={{fontSize:11,color:T.text3,marginBottom:12}}>by type · {displayCur}</div>
              <ChartDoughnut labels={chartData.tLabels} data={chartData.tVals} colors={chartData.palette} T={T} height={isMob?180:230}/>
            </div>
          </div>

          {/* ── Row 2: Income by month + Currency split ── */}
          <div className="chart-row" style={{display:"flex",gap:12,flexWrap:isMob?"wrap":"nowrap"}}>
            <div style={{flex:"2 1 280px",...card({padding:16})}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
                <div>
                  <div style={{fontSize:12,fontWeight:600,color:T.text,marginBottom:2}}>Monthly Income — Div &amp; Coupons</div>
                  <div style={{fontSize:11,color:T.text3}}>{chartData.mLabels.length} months · {chartPeriod} · {displayCur}</div>
                </div>
              </div>
              <ChartBar labels={chartData.mLabels} datasets={[{label:"Income",data:chartData.mVals,backgroundColor:dark?"rgba(6,182,212,.72)":"rgba(8,145,178,.6)",borderColor:dark?"#06b6d4":"#0891b2",borderWidth:1,borderRadius:5}]} T={T} yFmt={yFmtD} height={isMob?160:210}/>
            </div>
            <div style={{flex:"1 1 200px",...card({padding:16})}}>
              <div style={{fontSize:12,fontWeight:600,color:T.text,marginBottom:2}}>Currency Split</div>
              <div style={{fontSize:11,color:T.text3,marginBottom:12}}>by holding currency · {displayCur}</div>
              <ChartDoughnut labels={chartData.byCurLabels} data={chartData.byCurVals} colors={chartData.byCurColors} T={T} height={isMob?160:210}/>
            </div>
          </div>

          {/* ── Row 3: Growth Contributors Waterfall ── */}
          <div style={{...card({padding:16})}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12,flexWrap:"wrap",gap:8}}>
              <div>
                <div style={{fontSize:12,fontWeight:600,color:T.text,marginBottom:2}}>📊 Growth Contributors — {chartPeriod}</div>
                <div style={{fontSize:11,color:T.text3}}>Breakdown of what drove your portfolio value change</div>
              </div>
              {/* Legend */}
              <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>
                {[["Start / End","#6366f155"],["Capital Gain","#22c55e"],["Capital Loss","#ef4444"],["Top-Up (Buy)","#22c55e"],["Dividends","#22c55e"]].map(([l,c])=>(
                  <div key={l} style={{display:"flex",alignItems:"center",gap:4}}>
                    <div style={{width:10,height:10,borderRadius:2,background:c}}/>
                    <span style={{fontSize:10,color:T.text3}}>{l}</span>
                  </div>
                ))}
              </div>
            </div>
            <ChartWaterfall data={chartData.waterfallData} T={T} yFmt={yFmtD} height={isMob?220:270}/>
            {/* Contribution summary pills */}
            {chartData.waterfallData.length>1&&(()=>{
              const wf=chartData.waterfallData;
              const capItem=wf.find(d=>d.label==="Capital Gain"||d.label==="Capital Loss");
              const topUp=wf.find(d=>d.label==="Top-Ups");
              const divItem=wf.find(d=>d.label==="Dividends");
              const total=chartData.endVal-chartData.startVal;
              const pct=(v)=>total!==0?(v/Math.abs(total)*100).toFixed(0)+"%":"—";
              return(
                <div style={{display:"flex",gap:8,marginTop:12,flexWrap:"wrap"}}>
                  {[
                    ["💹 Capital G/L",capItem?.value??0,capItem?.value>=0?"#22c55e":"#ef4444",pct(capItem?.value??0)],
                    ["💸 Top-Ups",topUp?.value??0,"#6366f1",pct(topUp?.value??0)],
                    ["🌱 Dividends",divItem?.value??0,T.teal,pct(divItem?.value??0)],
                  ].map(([l,v,c,p])=>(
                    <div key={l} style={{background:T.bg4,border:`1px solid ${T.border}`,borderRadius:8,padding:"8px 12px",flex:"1 1 100px",minWidth:100}}>
                      <div style={{fontSize:10,color:T.text3,marginBottom:3}}>{l}</div>
                      <div style={{fontFamily:"'Space Mono',monospace",fontSize:12,fontWeight:700,color:c}}>{FC(v,true)}</div>
                      <div style={{fontSize:10,color:T.text3,marginTop:1}}>{p} of change</div>
                    </div>
                  ))}
                </div>
              );
            })()}
          </div>

          {/* ── Row 4: Benchmark Comparison ── */}
          <div style={{...card({padding:16})}}>
            <div style={{marginBottom:12}}>
              <div style={{fontSize:12,fontWeight:600,color:T.text,marginBottom:2}}>📐 Benchmark Comparison — {chartPeriod}</div>
              <div style={{fontSize:11,color:T.text3,marginBottom:10}}>Your portfolio vs selected benchmarks · % return from period start</div>
              {/* ── Benchmark toggles ── */}
              {(()=>{
                const BM_DEF=[
                  {key:"sp500",   label:"S&P 500",       color:"#6366f1"},
                  {key:"brk",     label:"BRK-B",         color:"#f59e0b"},
                  {key:"jkse",    label:"IDX Composite", color:"#ef4444"},
                  {key:"eido",    label:"EIDO",          color:"#8b5cf6"},
                  {key:"vas",     label:"VAS",           color:"#06b6d4"},
                ];
                return(
                  <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:10}}>
                    {BM_DEF.map(({key,label,color})=>{
                      const on=bmVisible[key];
                      const hasData=benchmarks.series[key]?.some(v=>v!=null);
                      return(
                        <button key={key} onClick={()=>setBmVisible(v=>({...v,[key]:!v[key]}))}
                          style={{padding:"4px 10px",borderRadius:20,border:`1.5px solid ${color}`,
                            background:on?color:"transparent",color:on?"#fff":color,
                            fontSize:10,fontWeight:600,cursor:"pointer",opacity:hasData?1:0.4,
                            transition:"all .15s"}}>
                          {label}{!hasData?" ✗":""}
                        </button>
                      );
                    })}
                  </div>
                );
              })()}
              {!fetchSt.lastUpdate&&<div style={{display:"flex",alignItems:"center",gap:6,background:T.bg4,border:`1px solid ${T.amber}44`,borderRadius:8,padding:"6px 12px",marginBottom:8}}>
                <span style={{fontSize:11,color:T.amber}}>⚠️ Click <b>🔄 Live Prices</b> to load benchmark data</span>
              </div>}
            </div>
            {chartData.bmLabels.length>1?(()=>{
              const BM_DEF=[
                {key:"sp500", label:"S&P 500",       color:"#6366f1", dash:[]},
                {key:"brk",   label:"BRK-B",         color:"#f59e0b", dash:[4,3]},
                {key:"jkse",  label:"IDX Composite", color:"#ef4444", dash:[2,2]},
                {key:"eido",  label:"EIDO",          color:"#8b5cf6", dash:[6,2]},
                {key:"vas",   label:"VAS (ASX)",     color:"#06b6d4", dash:[4,2]},
              ];
              const portPoints=chartData.bmPortfolio.filter(v=>v!=null).length;
              const datasets=[
                {label:"Your Portfolio",data:chartData.bmPortfolio,borderColor:dark?"#22c55e":"#16a34a",backgroundColor:dark?"rgba(34,197,94,.07)":"rgba(22,163,74,.06)",fill:true,borderWidth:2.5,borderDash:[],spanGaps:false},
                ...BM_DEF.filter(b=>bmVisible[b.key]).map(b=>({
                  label:b.label,data:chartData.bmSeries[b.key]||[],
                  borderColor:b.color,backgroundColor:"transparent",
                  borderWidth:2,borderDash:b.dash,spanGaps:false,
                }))
              ];
              const lastPort=chartData.bmPortfolio.filter(v=>v!=null).slice(-1)[0]??0;
              return(<>
                {portPoints<3&&<div style={{fontSize:10,color:T.amber,background:T.bg4,border:`1px solid ${T.amber}44`,borderRadius:6,padding:"6px 10px",marginBottom:8}}>
                  ⚠️ Portfolio line shows only {portPoints} data point{portPoints!==1?"s":""} — it will become more accurate as you refresh prices daily. Benchmarks show full historical data.
                </div>}
                <ChartLine labels={chartData.bmLabels} datasets={datasets}
                  T={T} yFmt={v=>`${v>=0?"+":""}${v.toFixed(1)}%`} height={isMob?220:280} spanGaps={false}/>
                <div style={{display:"flex",gap:6,marginTop:12,flexWrap:"wrap"}}>
                  <div style={{background:T.bg4,border:"1.5px solid "+(dark?"#22c55e":"#16a34a"),borderRadius:8,padding:"8px 12px",flex:"1 1 80px"}}>
                    <div style={{fontSize:9,color:T.text3,marginBottom:2}}>Your Portfolio</div>
                    <div style={{fontFamily:"'Space Mono',monospace",fontSize:12,fontWeight:700,color:dark?"#22c55e":"#16a34a"}}>{lastPort>=0?"+":""}{lastPort.toFixed(2)}%</div>
                  </div>
                  {BM_DEF.filter(b=>bmVisible[b.key]&&(chartData.bmSeries[b.key]||[]).some(v=>v!=null)).map(b=>{
                    const last=(chartData.bmSeries[b.key]||[]).filter(v=>v!=null).slice(-1)[0]??0;
                    const diff=lastPort-last;
                    return(
                      <div key={b.key} style={{background:T.bg4,border:`1.5px solid ${b.color}`,borderRadius:8,padding:"8px 12px",flex:"1 1 80px"}}>
                        <div style={{fontSize:9,color:T.text3,marginBottom:2}}>{b.label}</div>
                        <div style={{fontFamily:"'Space Mono',monospace",fontSize:12,fontWeight:700,color:b.color}}>{last>=0?"+":""}{last.toFixed(2)}%</div>
                        <div style={{fontSize:9,color:diff>=0?T.green:T.red,marginTop:2}}>{diff>=0?"▲ ":"▼ "}{Math.abs(diff).toFixed(1)}% vs you</div>
                      </div>
                    );
                  })}
                </div>
              </>);
            })():(
              <div style={{height:200,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:10,color:T.text3}}>
                <div style={{fontSize:32,opacity:.3}}>📐</div>
                <div style={{fontSize:13,fontWeight:500}}>Benchmark data not loaded yet</div>
                <div style={{fontSize:11}}>Hit <b style={{color:T.text2}}>🔄 Live Prices</b> to fetch benchmark data</div>
              </div>
            )}
          </div>

        </div>
      )}
    </main>

    {/* ── MODALS ── */}

                  <div><label style={lbl({color:T.teal})}>Yahoo Symbol</label><input style={inp()} placeholder="PBS032.JK" value={form.yahooSymbol||""} onChange={e=>setForm(f=>({...f,yahooSymbol:e.target.value}))}/><div style={{fontSize:9,color:T.text3,marginTop:3}}>Price is % of face value on IDX</div></div>
                </div>
              </div>
