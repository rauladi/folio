<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover" />
<meta name="theme-color" content="#0a0e14" />
<title>SAUDAGAR KAPITALIS — Investment Dashboard</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;width:100%;overflow-x:hidden}
  body{
    font-family:'Inter','Roboto','Segoe UI',system-ui,-apple-system,sans-serif;
    font-size:14px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
    background:var(--bg);color:var(--text);overflow-x:hidden;
  }
  #root{width:100%;min-height:100vh}
  input,select,button{font-family:inherit}
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
  input[type=number]{-moz-appearance:textfield}
  button{cursor:pointer;border:none;outline:none;background:none;color:inherit;transition:background .15s,transform .1s,color .15s,opacity .15s}
  button:active{transform:scale(.97)}
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--border-light);border-radius:4px}
  ::-webkit-scrollbar-thumb:hover{background:var(--text-3)}

  :root{
    --bg:#0a0e14;--bg-card:#11161f;--bg-elevated:#161c26;--bg-hover:#1c232f;--bg-input:#0e131a;
    --border:#222b38;--border-light:#2d3746;
    --text:#e6edf3;--text-2:#8b949e;--text-3:#6b7684;
    --green:#22c55e;--green-dim:#16a34a;--green-bg:rgba(34,197,94,.12);
    --red:#ef4444;--red-bg:rgba(239,68,68,.12);
    --blue:#3b82f6;--blue-bg:rgba(59,130,246,.12);
    --amber:#f59e0b;--amber-bg:rgba(245,158,11,.12);
    --teal:#14b8a6;--teal-bg:rgba(20,184,166,.12);
    --purple:#a855f7;--purple-bg:rgba(168,85,247,.12);
    --radius:14px;--radius-sm:10px;
    --shadow:0 1px 2px rgba(0,0,0,.3);--shadow-lg:0 12px 32px rgba(0,0,0,.5);
    --chart-grid:rgba(255,255,255,.05);--chart-tick:#6b7684;
  }
  html[data-theme="light"]{
    --bg:#f4f6fa;--bg-card:#ffffff;--bg-elevated:#f7f9fc;--bg-hover:#eef2f7;--bg-input:#f4f6fa;
    --border:#e2e8f0;--border-light:#cbd5e1;
    --text:#0d1520;--text-2:#475569;--text-3:#94a3b8;
    --green:#16a34a;--green-dim:#15803d;--green-bg:rgba(22,163,74,.1);
    --red:#dc2626;--red-bg:rgba(220,38,38,.1);
    --blue:#2563eb;--blue-bg:rgba(37,99,235,.1);
    --amber:#d97706;--amber-bg:rgba(217,119,6,.1);
    --teal:#0d9488;--teal-bg:rgba(13,148,136,.1);
    --purple:#9333ea;--purple-bg:rgba(147,51,234,.1);
    --shadow:0 1px 3px rgba(15,23,42,.06);--shadow-lg:0 12px 32px rgba(15,23,42,.12);
    --chart-grid:rgba(15,23,42,.06);--chart-tick:#64748b;
  }

  .app{display:flex;flex-direction:column;min-height:100vh;background:var(--bg)}

  /* HEADER */
  .header{position:sticky;top:0;z-index:40;background:var(--bg-card);border-bottom:1px solid var(--border);padding:10px 20px;backdrop-filter:blur(12px)}
  .header-inner{display:flex;align-items:center;gap:16px;max-width:1600px;margin:0 auto;width:100%}
  .logo{display:flex;align-items:center;gap:10px;flex-shrink:0}
  .logo-mark{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--green) 0%,var(--green-dim) 100%);box-shadow:0 4px 12px rgba(34,197,94,.25)}
  .logo-text{display:flex;flex-direction:column;line-height:1.1}
  .logo-text b{font-size:14px;font-weight:800;letter-spacing:.6px;color:var(--text)}
  .logo-text span{font-size:9px;color:var(--text-3);font-weight:500;letter-spacing:.3px;margin-top:1px}
  .header-nav{display:flex;gap:4px;flex:1;justify-content:center}
  .nav-tab{padding:8px 16px;border-radius:9px;font-size:13px;font-weight:600;color:var(--text-2);display:flex;align-items:center;gap:7px;white-space:nowrap}
  .nav-tab:hover{background:var(--bg-hover);color:var(--text)}
  .nav-tab.active{background:var(--green-bg);color:var(--green)}
  .header-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
  .icon-btn{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--text-2);border:1px solid transparent}
  .icon-btn:hover{background:var(--bg-hover);color:var(--text);border-color:var(--border)}
  .icon-btn:disabled{opacity:.5;cursor:not-allowed}
  .avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--purple));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;overflow:hidden;border:2px solid var(--border);flex-shrink:0}
  .avatar img{width:100%;height:100%;object-fit:cover}
  .currency-pill{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:9px;background:var(--bg-elevated);border:1px solid var(--border);font-size:12px;font-weight:600;color:var(--text)}
  .currency-pill select{background:transparent;border:none;color:inherit;font-size:12px;font-weight:600;outline:none;cursor:pointer;appearance:none;padding-right:4px}
  .currency-pill select option{background:var(--bg-card);color:var(--text)}

  /* MAIN */
  .main{flex:1;width:100%;max-width:1600px;margin:0 auto;padding:18px 20px 40px}
  .greeting{margin-bottom:18px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .greeting h1{font-size:22px;font-weight:800;color:var(--text);letter-spacing:-.4px}
  .greeting p{font-size:12px;color:var(--text-3);margin-top:3px;font-weight:500}
  .greeting-quote{font-size:12px;color:var(--text-2);font-style:italic;max-width:280px;text-align:right;line-height:1.5}
  .greeting-quote span{display:block;font-style:normal;color:var(--text-3);font-size:11px;margin-top:2px}

  /* CARDS */
  .card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);transition:border-color .15s}
  .card:hover{border-color:var(--border-light)}
  .card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px;flex-wrap:wrap}
  .card-title{font-size:13px;font-weight:700;color:var(--text)}
  .card-sub{font-size:11px;color:var(--text-3);font-weight:500;margin-top:2px}

  /* KPI */
  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
  .kpi-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden;transition:border-color .15s}
  .kpi-card:hover{border-color:var(--border-light)}
  .kpi-top{display:flex;align-items:center;gap:9px}
  .kpi-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .kpi-icon.green{background:var(--green-bg);color:var(--green)}
  .kpi-icon.blue{background:var(--blue-bg);color:var(--blue)}
  .kpi-icon.amber{background:var(--amber-bg);color:var(--amber)}
  .kpi-icon.teal{background:var(--teal-bg);color:var(--teal)}
  .kpi-icon.red{background:var(--red-bg);color:var(--red)}
  .kpi-label{font-size:11px;color:var(--text-3);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
  .kpi-value{font-size:22px;font-weight:800;color:var(--text);letter-spacing:-.5px;font-variant-numeric:tabular-nums;line-height:1.1}
  .kpi-delta{font-size:11px;font-weight:700;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
  .kpi-delta.up{color:var(--green)}
  .kpi-delta.down{color:var(--red)}
  .kpi-delta.neutral{color:var(--text-3)}
  .kpi-delta span{color:var(--text-3);font-weight:500}
  .kpi-progress{height:4px;border-radius:2px;background:var(--bg-elevated);overflow:hidden;margin-top:2px}
  .kpi-progress-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--green),var(--teal));transition:width .5s}

  /* GRID ROWS */
  .row-2{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:16px}
  .row-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}

  /* PERIOD TABS */
  .period-tabs{display:flex;gap:2px;background:var(--bg-elevated);padding:3px;border-radius:9px;border:1px solid var(--border)}
  .period-tab{padding:5px 11px;border-radius:6px;font-size:11px;font-weight:600;color:var(--text-3)}
  .period-tab:hover{color:var(--text)}
  .period-tab.active{background:var(--green);color:#fff;box-shadow:0 2px 6px rgba(34,197,94,.3)}

  /* SNAPSHOT LIST */
  .snapshot-list{display:flex;flex-direction:column;gap:2px}
  .snapshot-row{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-radius:8px;transition:background .15s}
  .snapshot-row:hover{background:var(--bg-elevated)}
  .snapshot-row .lbl{font-size:12px;color:var(--text-2);font-weight:500}
  .snapshot-row .val{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
  .snapshot-row .val.up{color:var(--green)}
  .snapshot-row .val.down{color:var(--red)}

  /* ALLOC */
  .alloc-legend{display:flex;flex-direction:column;gap:6px}
  .alloc-legend-item{display:flex;align-items:center;gap:8px;font-size:11px}
  .alloc-dot{width:8px;height:8px;border-radius:3px;flex-shrink:0}
  .alloc-legend-item .name{flex:1;color:var(--text-2);font-weight:500}
  .alloc-legend-item .pct{color:var(--text);font-weight:700;font-variant-numeric:tabular-nums}

  /* RISK */
  .risk-gauge{position:relative;width:160px;height:90px;margin:0 auto}
  .risk-gauge svg{width:100%;height:100%;display:block}
  .risk-gauge-label{position:absolute;left:0;right:0;bottom:6px;text-align:center}
  .risk-gauge-label .lvl{font-size:12px;font-weight:800;letter-spacing:1px}
  .risk-gauge-label .sub{font-size:9px;color:var(--text-3);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-top:1px}
  .risk-metrics{width:100%;display:flex;flex-direction:column;gap:5px;margin-top:10px}
  .risk-metric{display:flex;justify-content:space-between;font-size:11px;padding:5px 8px;border-radius:6px;background:var(--bg-elevated)}
  .risk-metric .k{color:var(--text-3);font-weight:500}
  .risk-metric .v{color:var(--text);font-weight:700;font-variant-numeric:tabular-nums}

  /* TABLE */
  .table-wrap{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
  .table-toolbar{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
  .search-input{flex:1;min-width:160px;display:flex;align-items:center;gap:8px;background:var(--bg-input);border:1px solid var(--border);border-radius:9px;padding:7px 12px;color:var(--text)}
  .search-input input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:12px}
  .search-input input::placeholder{color:var(--text-3)}
  .table-scroll{overflow:auto;max-height:calc(100vh - 320px)}
  .modern-table{width:100%;border-collapse:collapse;font-size:12px}
  .modern-table thead th{position:sticky;top:0;z-index:5;background:var(--bg-elevated);padding:10px 14px;text-align:left;font-size:10px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid var(--border);white-space:nowrap}
  .modern-table tbody td{padding:12px 14px;border-bottom:1px solid var(--border);color:var(--text-2);font-weight:500;white-space:nowrap}
  .modern-table tbody tr:hover td{background:var(--bg-elevated)}
  .modern-table tbody tr:last-child td{border-bottom:none}
  .ticker-cell{display:flex;align-items:center;gap:10px}
  .ticker-badge{width:32px;height:32px;border-radius:8px;background:var(--bg-elevated);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;color:var(--text);letter-spacing:.3px;flex-shrink:0;border:1px solid var(--border)}
  .ticker-info{display:flex;flex-direction:column;line-height:1.3}
  .ticker-info .t{font-weight:700;color:var(--text);font-size:12px}
  .ticker-info .n{font-size:10px;color:var(--text-3);font-weight:500;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .num-cell{font-variant-numeric:tabular-nums;font-weight:600;color:var(--text)}
  .pill{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:6px;font-size:10px;font-weight:700;font-variant-numeric:tabular-nums}
  .pill.up{background:var(--green-bg);color:var(--green)}
  .pill.down{background:var(--red-bg);color:var(--red)}
  .pill.neutral{background:var(--bg-elevated);color:var(--text-2)}
  .row-actions{display:flex;gap:4px}
  .row-action{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:var(--bg-elevated);color:var(--text-2);font-size:11px;font-weight:700}
  .row-action:hover{background:var(--bg-hover);color:var(--text)}
  .row-action.buy:hover{background:var(--green-bg);color:var(--green)}
  .row-action.sell:hover{background:var(--red-bg);color:var(--red)}
  .row-action.div:hover{background:var(--teal-bg);color:var(--teal)}

  /* TREEMAP */
  .treemap{position:relative;width:100%;border-radius:var(--radius);overflow:hidden;background:var(--bg-elevated);border:1px solid var(--border)}
  .treemap-cell{position:absolute;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;transition:filter .12s;padding:2px;text-align:center}
  .treemap-cell:hover{filter:brightness(1.12)}
  .treemap-cell .tk{font-weight:800;font-family:'Space Mono',monospace;letter-spacing:.2px;line-height:1.1}
  .treemap-cell .pct{font-family:'Space Mono',monospace;opacity:.9;line-height:1.1;margin-top:1px}
  .treemap-cell .sub{font-family:'Space Mono',monospace;opacity:.7;line-height:1.1;margin-top:1px}

  /* VIEW TOGGLE */
  .view-toggle{display:flex;gap:3px;background:var(--bg-elevated);padding:3px;border-radius:9px;border:1px solid var(--border)}
  .view-toggle button{padding:5px 12px;border-radius:6px;font-size:11px;font-weight:600;color:var(--text-3);display:flex;align-items:center;gap:5px}
  .view-toggle button.active{background:var(--bg-card);color:var(--text);box-shadow:var(--shadow)}
  .view-toggle button:hover:not(.active){color:var(--text-2)}

  /* BUTTONS */
  .btn{padding:9px 16px;border-radius:9px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:all .15s}
  .btn-primary{background:var(--green);color:#fff;box-shadow:0 2px 8px rgba(34,197,94,.25)}
  .btn-primary:hover{background:var(--green-dim);box-shadow:0 4px 12px rgba(34,197,94,.35)}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed}
  .btn-ghost{background:var(--bg-elevated);color:var(--text-2);border:1px solid var(--border)}
  .btn-ghost:hover{background:var(--bg-hover);color:var(--text);border-color:var(--border-light)}
  .btn-danger{background:var(--red);color:#fff}
  .btn-danger:hover{background:#dc2626}
  .btn-sm{padding:6px 12px;font-size:11px;border-radius:8px}

  /* INPUTS */
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
  .field label{font-size:10px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.6px}
  .field input,.field select{width:100%;background:var(--bg-input);border:1px solid var(--border);border-radius:9px;padding:10px 12px;color:var(--text);font-size:13px;outline:none;transition:border-color .15s}
  .field input:focus,.field select:focus{border-color:var(--green)}
  .field input::placeholder{color:var(--text-3)}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .field-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

  /* BOTTOM NAV */
  .bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--bg-card);border-top:1px solid var(--border);padding:6px 8px calc(6px + env(safe-area-inset-bottom));backdrop-filter:blur(12px)}
  .bottom-nav-inner{display:flex;justify-content:space-around;max-width:500px;margin:0 auto}
  .bottom-nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 4px;border-radius:10px;color:var(--text-3);transition:color .15s,background .15s}
  .bottom-nav-item span{font-size:10px;font-weight:600}
  .bottom-nav-item.active{color:var(--green)}

  /* MODAL */
  .modal-overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .15s ease}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .modal{background:var(--bg-card);border:1px solid var(--border);border-radius:18px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:slideUp .2s ease}
  @keyframes slideUp{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
  .modal-lg{max-width:760px}
  .modal-header{padding:18px 20px 14px;border-bottom:1px solid var(--border)}
  .modal-header h2{font-size:16px;font-weight:800;color:var(--text)}
  .modal-header p{font-size:11px;color:var(--text-3);margin-top:3px;font-weight:500}
  .modal-body{padding:18px 20px}
  .modal-footer{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--border)}

  /* IMPORT */
  .import-drop{border:2px dashed var(--border-light);border-radius:14px;padding:36px 20px;text-align:center;background:var(--bg-elevated);transition:all .2s;cursor:pointer}
  .import-drop.dragover{border-color:var(--green);background:var(--green-bg)}
  .import-drop .ico{font-size:36px;margin-bottom:10px;opacity:.5}
  .import-drop .ttl{font-size:14px;font-weight:700;color:var(--text);margin-bottom:4px}
  .import-drop .desc{font-size:11px;color:var(--text-3);margin-bottom:14px}

  @keyframes spin{to{transform:rotate(360deg)}}
  .spin{display:inline-block;animation:spin .9s linear infinite}

  /* RESPONSIVE */
  @media(max-width:1100px){.row-4{grid-template-columns:1fr 1fr}}
  @media(max-width:900px){
    .header-nav{display:none}
    .row-2{grid-template-columns:1fr}
    .greeting-quote{display:none}
  }
  @media(max-width:768px){
    .header{padding:8px 12px}
    .main{padding:14px 12px 100px}
    .greeting h1{font-size:19px}
    .kpi-grid{grid-template-columns:1fr 1fr;gap:10px}
    .kpi-card{padding:12px}
    .kpi-value{font-size:18px}
    .row-4{grid-template-columns:1fr;gap:10px}
    .bottom-nav{display:block}
    .logo-text span{display:none}
    .logo-mark{width:30px;height:30px}
    .card{padding:14px}
    .table-scroll{max-height:calc(100vh - 260px)}
    .modern-table tbody td{padding:10px 12px}
    .modern-table thead th{padding:8px 12px}
  }
  @media(max-width:480px){
    .kpi-grid{grid-template-columns:1fr 1fr;gap:8px}
    .kpi-value{font-size:16px}
    .main{padding:12px 10px 100px}
    .field-row,.field-row-3{grid-template-columns:1fr}
    .greeting h1{font-size:17px}
  }
</style>
</head>

// ─── Treemap ──────────────────────────────────────────────────────────────
function squarify(items,x,y,w,h){
  if(!items.length)return[];
  const r=[];
  _layout(items,x,y,w,h,items.reduce((s,i)=>s+i.value,0),r);
  return r;
}
function _layout(it,x,y,w,h,tot,r){
  if(!it.length)return;
  if(it.length===1){r.push({...it[0],x,y,w,h});return;}
  const hz=w>=h,dim=hz?w:h;
  let row=[],rt=0,best=Infinity;
  for(let i=0;i<it.length;i++){
    row.push(it[i]);rt+=it[i].value;
    const rd=(rt/tot)*dim;
    let worst=0;
    for(const ri of row){const od=(ri.value/rt)*(hz?h:w);const ra=Math.max(rd/od,od/rd);if(ra>worst)worst=ra;}
    if(worst>best){row.pop();rt-=it[i].value;break;}
    best=worst;
  }
  const rd=(rt/tot)*dim;
  let cur=hz?y:x;
  for(const ri of row){const sz=(ri.value/rt)*(hz?h:w);hz?r.push({...ri,x,y:cur,w:rd,h:sz}):r.push({...ri,x:cur,y,w:sz,h:rd});cur+=sz;}
  const rem=it.slice(row.length);
  if(!rem.length)return;
  const remT=tot-rt;
  hz?_layout(rem,x+rd,y,w-rd,h,remT,r):_layout(rem,x,y+rd,w,h-rd,remT,r);
}

function getPerformanceColor(pct,dark){
  const maxAbs=10;const clamped=Math.max(-maxAbs,Math.min(maxAbs,pct));const ratio=clamped/maxAbs;
  if(Math.abs(pct)<0.05)return{bg:dark?"#2d3746":"#e2e8f0",text:dark?"#8b949e":"#475569",border:dark?"#3d4b5c":"#cbd5e1"};
  const hue=((ratio+1)/2)*120;const sat=70;const light=dark?32:45;
  const bg=`hsl(${hue}, ${sat}%, ${light}%)`;const text="#ffffff";
  const borderLight=dark?22:35;const border=`hsl(${hue}, ${sat}%, ${borderLight}%)`;
  return{bg,text,border};
}
function getDividendColor(yieldPct,dark){
  const maxYield=8;const clamped=Math.max(0,Math.min(maxYield,yieldPct));const ratio=clamped/maxYield;
  if(yieldPct<=0.01)return{bg:dark?"#2d3746":"#e2e8f0",text:dark?"#8b949e":"#475569",border:dark?"#3d4b5c":"#cbd5e1"};
  const hue=50-ratio*20;const sat=80;const light=dark?38:52;
  const bg=`hsl(${hue}, ${sat}%, ${light}%)`;const text="#ffffff";
  const borderLight=dark?25:40;const border=`hsl(${hue}, ${sat}%, ${borderLight}%)`;
  return{bg,text,border};
}

const toAUD=(a,cur,R)=>{if(cur==="IDR")return a/R.AUD_IDR;if(cur==="USD")return a/R.AUD_USD;return a;};
const fromAUD=(a,cur,R)=>{if(cur==="IDR")return a*R.AUD_IDR;if(cur==="USD")return a*R.AUD_USD;return a;};
function fmtIDR(n){try{return Math.round(n).toLocaleString("id-ID");}catch{return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,".");}}
function fmtAUD(n){return Math.abs(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,",");}
function fmtCur(audAmt,dc,R,compact=false){
  const a=fromAUD(audAmt,dc,R);
  if(dc==="IDR"){const abs=Math.abs(a);if(compact&&abs>=1e9)return`Rp${(a/1e9).toFixed(1)}M`;if(compact&&abs>=1e6)return`Rp${(a/1e6).toFixed(1)}Jt`;if(compact&&abs>=1e3)return`Rp${(a/1e3).toFixed(0)}Rb`;return`Rp ${fmtIDR(a)}`;}
  if(dc==="USD"){const abs=Math.abs(a);if(compact&&abs>=1e6)return`US$${(a/1e6).toFixed(2)}M`;if(compact&&abs>=1e3)return`US$${(a/1e3).toFixed(1)}K`;return`US$${fmtAUD(a)}`;}
  const abs=Math.abs(a);
  if(compact&&abs>=1e6)return`A$${(a/1e6).toFixed(2)}M`;
  if(compact&&abs>=1e3)return`A$${(a/1e3).toFixed(1)}K`;
  return`A$${fmtAUD(a)}`;
}
function fmtGain(audAmt,dc,R){
  const a=fromAUD(audAmt,dc,R);const sign=a>=0?"+":"-";
  if(dc==="IDR")return`${sign}Rp ${fmtIDR(Math.abs(a))}`;
  if(dc==="USD")return`${sign}US$${fmtAUD(a)}`;
  return`${sign}A$${fmtAUD(a)}`;
}

async function tryProxy(proxyUrl,timeoutMs){
  const r=await fetch(proxyUrl,{signal:AbortSignal.timeout(timeoutMs)});
  if(!r.ok)throw new Error("HTTP "+r.status);
  const t=await r.text();if(!t||t.length<10)throw new Error("Empty");
  let parsed=JSON.parse(t);
  if(parsed?.contents&&typeof parsed.contents==="string")parsed=JSON.parse(parsed.contents);
  return parsed;
}
async function fetchWithProxy(url,timeoutMs=10000){
  return new Promise((resolve,reject)=>{
    let settled=false;let pending=PROXIES.length;
    PROXIES.forEach(proxy=>{
      tryProxy(proxy(url),timeoutMs).then(data=>{if(!settled){settled=true;resolve(data);}})
        .catch(()=>{pending--;if(pending===0&&!settled)reject(new Error("All proxies failed"));});
    });
  });
}
async function fetchYahooPrice(symbol){
  const sym=encodeURIComponent(symbol);
  const parseChart=d=>{
    const res=d?.chart?.result?.[0];if(!res)return null;
    const closes=res.indicators?.quote?.[0]?.close;
    if(!closes||closes.length<2)return null;
    const prev=closes[closes.length-2];const cur=closes[closes.length-1];
    if(prev&&cur)return{current:cur,prev};
    return null;
  };
  const urls=[`https://query1.finance.yahoo.com/v8/finance/chart/${sym}?interval=1d&range=2d`,YAHOO_BASE+sym+"?interval=1d&range=2d"];
  for(const url of urls){
    try{const d=await fetchWithProxy(url);const r=parseChart(d);if(r&&r.current>0&&r.prev>0)return r;}catch(e){}
  }
  throw new Error("Price fetch failed for "+symbol);
}
async function fetchBenchmark(symbol){
  const sym=encodeURIComponent(symbol);
  const url=YAHOO_BASE+sym+"?interval=1mo&range=5y";
  const d=await fetchWithProxy(url);
  const res=d?.chart?.result?.[0];
  if(!res)throw new Error("No data");
  const ts=res.timestamp||[];const closes=res.indicators?.quote?.[0]?.close||[];
  if(!ts.length||!closes.length)throw new Error("Empty data");
  const base=closes.find(v=>v!=null)||1;
  return{labels:ts.map(t=>new Date(t*1000).toISOString().slice(0,10)),pct:closes.map(v=>v!=null?((v-base)/base)*100:null)};
}
async function fetchHoldingHistory(yahooSymbol){
  const sym=encodeURIComponent(yahooSymbol);
  try{
    const d=await fetchWithProxy(YAHOO_BASE+sym+"?interval=1mo&range=5y");
    const res=d?.chart?.result?.[0];if(!res)return null;
    const ts=res.timestamp||[];const closes=res.indicators?.quote?.[0]?.close||[];
    if(!ts.length||!closes.length)return null;
    const priceMap={};
    ts.forEach((t,i)=>{if(closes[i]!=null)priceMap[new Date(t*1000).toISOString().slice(0,10)]=closes[i];});
    return{priceMap,currency:res.meta?.currency||"AUD"};
  }catch(e){return null;}
}
async function fetchExchangeRates(){

}

// ─── Compute Holding ───────────────────────────────────────────────────────
function computeHolding(h,prices,prevPrices,R){
  let qty=0,cbL=0,rgL=0,lots=[],divL=0;
  const txs=[...(h.transactions||[])].sort((a,b)=>new Date(a.date)-new Date(b.date));
  for(const tx of txs){
    if(tx.type==="buy"){lots.push({qty:tx.qty,price:tx.price});qty+=tx.qty;cbL+=tx.qty*tx.price;}
    else if(tx.type==="sell"){
      let rem=tx.qty;qty-=tx.qty;
      while(rem>0&&lots.length){const lot=lots[0],used=Math.min(lot.qty,rem);rgL+=used*(tx.price-lot.price);cbL-=used*lot.price;lot.qty-=used;rem-=used;if(lot.qty===0)lots.shift();}
    }else if(tx.type==="dividend"){divL+=tx.totalAmount||0;}
  }
  const cpL=prices[h.ticker]??0,pcL=prevPrices[h.ticker]??cpL;
  const cvL=qty*cpL,ugL=cvL-cbL,dgL=(cpL-pcL)*qty,dgPct=pcL>0?(cpL-pcL)/pcL*100:0;
  const cv=toAUD(cvL,h.currency,R),cb=toAUD(cbL,h.currency,R),ug=toAUD(ugL,h.currency,R);
  const rg=toAUD(rgL,h.currency,R),divs=toAUD(divL,h.currency,R),dg=toAUD(dgL,h.currency,R);
  const totalInv=txs.filter(t=>t.type==="buy").reduce((s,t)=>s+toAUD(t.qty*t.price,h.currency,R),0);
  const totalGain=ug+rg+divs,gainPct=totalInv>0?(totalGain/totalInv)*100:0;
  const divYoc=totalInv>0?(divs/totalInv)*100:0;
  return{...h,qty,costBasis:cb,currentPrice:cpL,prevClose:pcL,currentValue:cv,unrealizedGain:ug,realizedGain:rg,totalDividends:divs,totalGain,gainPct,dayGain:dg,dayGainPct:dgPct,divYieldOnCost:divYoc,totalInvested:totalInv};
}

let globalIdCounter=Date.now();
function repairPortfolio(portfolio){
  if(!Array.isArray(portfolio))return[];
  const seenIds=new Set();
  return portfolio.map(h=>{
    let id=h.id;
    if(!id||typeof id!=="number"||isNaN(id)||seenIds.has(id)){id=++globalIdCounter;}
    seenIds.add(id);
    let tx=h.transactions;if(!Array.isArray(tx))tx=[];
    tx=tx.filter(t=>t&&typeof t==="object");
    return{...h,id,transactions:tx};
  });
}

function RiskGauge({score,label,T}){
  const size=160,R=62,cx=size/2,cy=size-16;
  const pct=Math.max(0,Math.min(1,score));
  const angle=Math.PI-Math.PI*pct;
  const arcStartX=cx-R,arcStartY=cy;
  const arcEndX=cx+R*Math.cos(angle),arcEndY=cy-R*Math.sin(angle);
  const largeArc=pct>0.5?1:0;
  const track=`M ${cx-R} ${cy} A ${R} ${R} 0 0 1 ${cx+R} ${cy}`;
  const fill=`M ${arcStartX} ${arcStartY} A ${R} ${R} 0 ${largeArc} 1 ${arcEndX} ${arcEndY}`;
  let color="#22c55e";
  if(pct>0.66)color="#ef4444";
  else if(pct>0.33)color="#f59e0b";
  return(
    <div className="risk-gauge">
      <svg viewBox={`0 0 ${size} ${size-8}`}>
        <defs>
          <linearGradient id="rg" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stopColor="#22c55e"/>
            <stop offset="50%" stopColor="#f59e0b"/>
            <stop offset="100%" stopColor="#ef4444"/>
          </linearGradient>
        </defs>
        <path d={track} stroke={T.bg4} strokeWidth="12" fill="none" strokeLinecap="round"/>
        <path d={fill} stroke="url(#rg)" strokeWidth="12" fill="none" strokeLinecap="round"/>
        <circle cx={cx} cy={cy} r="3" fill={T.text}/>
      </svg>
      <div className="risk-gauge-label">
        <div className="lvl" style={{color}}>{label}</div>
        <div className="sub">Risk Score</div>
      </div>
    </div>
  );
}

// ─── Risk Metrics ──────────────────────────────────────────────────────────
function computeRiskMetrics(historyData){
  if(!historyData||historyData.length<3)return{volatility:null,maxDrawdown:null,bestMonth:null,worstMonth:null};
  const sorted=[...historyData].sort((a,b)=>new Date(a.date)-new Date(b.date));
  const values=sorted.map(d=>d.totalValueAUD);
  const returns=[];
  for(let i=1;i<values.length;i++){
    if(values[i-1]>0){let ret=(values[i]-values[i-1])/values[i-1];if(ret>1)ret=1;if(ret<-1)ret=-1;returns.push(ret);}
  }
  if(returns.length<2)return{volatility:null,maxDrawdown:null,bestMonth:null,worstMonth:null};
  const mean=returns.reduce((s,r)=>s+r,0)/returns.length;
  const variance=returns.reduce((s,r)=>s+(r-mean)**2,0)/returns.length;
  const volatility=Math.sqrt(variance)*Math.sqrt(12);
  let peak=values[0],maxDrawdown=0;
  for(const v of values){if(v>peak)peak=v;const dd=peak>0?(peak-v)/peak:0;if(dd>maxDrawdown)maxDrawdown=dd;}
  const monthlyRet=[];
  const dates=sorted.map(d=>d.date);
  for(let i=1;i<values.length;i++){
    let ret=values[i-1]>0?(values[i]-values[i-1])/values[i-1]:0;
    if(ret>1)ret=1;if(ret<-1)ret=-1;
    monthlyRet.push({date:dates[i],ret});
  }
  const best=monthlyRet.reduce((a,b)=>a.ret>b.ret?a:b,{ret:-Infinity});
  const worst=monthlyRet.reduce((a,b)=>a.ret<b.ret?a:b,{ret:Infinity});
  return{
    volatility:volatility*100,
    maxDrawdown:maxDrawdown*100,
    bestMonth:best.ret!==-Infinity?{date:best.date,ret:best.ret*100}:null,
    worstMonth:worst.ret!==Infinity?{date:worst.date,ret:worst.ret*100}:null
  };
}

function computeIncomeRiskMetrics(portfolio,rates){
  const def={totalIncome:0,stability:null,payoutRisk:null,cutProb:null,concentration:null,dividendGrowth:null,quarters:[]};
  if(!Array.isArray(portfolio))return def;
  const divHoldings=portfolio.filter(h=>DIVIDEND_PAYING_TYPES.has(h.assetType)&&!INCOME_RISK_EXCLUDED_TICKERS.has(h.ticker));
  if(!divHoldings.length)return def;
  const quarterlyIncome={};const holdingTotalIncome={};const yearlyIncome={};
  for(const h of divHoldings){
    for(const tx of h.transactions||[]){
      if(tx.type!=="dividend"||!tx.date)continue;
      const date=new Date(tx.date);
      const q=Math.floor(date.getMonth()/3)+1;
      const qk=`${date.getFullYear()}-Q${q}`;
      const year=String(date.getFullYear());
      const amountAUD=toAUD(tx.totalAmount||0,h.currency,rates);
      quarterlyIncome[qk]=(quarterlyIncome[qk]||0)+amountAUD;
      yearlyIncome[year]=(yearlyIncome[year]||0)+amountAUD;
      holdingTotalIncome[h.ticker]=(holdingTotalIncome[h.ticker]||0)+amountAUD;
    }
  }
  const quarterKeys=Object.keys(quarterlyIncome).sort();
  if(quarterKeys.length<3)return def;
  const incomeValues=quarterKeys.map(k=>quarterlyIncome[k]);
  const mean=incomeValues.reduce((a,b)=>a+b,0)/incomeValues.length;
  const stdDev=Math.sqrt(incomeValues.reduce((s,v)=>s+(v-mean)**2,0)/incomeValues.length);
  const cv=mean>0?stdDev/mean:1;
  const stability=Math.max(0,Math.min(1,1-Math.min(cv,1)));
  let peak=-Infinity,maxDD=0;
  for(const v of incomeValues){if(v>peak)peak=v;if(peak>0){const dd=(peak-v)/peak;if(dd>maxDD)maxDD=dd;}}
  const payoutRisk=Math.min(1,maxDD);
  let cutProb;
  if(stability>0.7&&payoutRisk<0.3)cutProb="Low";
  else if(stability>0.5&&payoutRisk<0.5)cutProb="Low–Medium";
  else if(payoutRisk<0.6)cutProb="Medium";
  else if(payoutRisk<0.75)cutProb="Medium–High";
  else cutProb="High";
  const sortedIncome=Object.values(holdingTotalIncome).sort((a,b)=>b-a);
  const top3=sortedIncome.slice(0,3).reduce((s,v)=>s+v,0);
  const totalIncome=sortedIncome.reduce((s,v)=>s+v,0);
  const concentration=totalIncome>0?top3/totalIncome:0;
  const years=Object.keys(yearlyIncome).sort();
  let dividendGrowth=null;
  if(years.length>=2){
    const fY=years[0],lY=years[years.length-1];
    const fV=yearlyIncome[fY],lV=yearlyIncome[lY];
    const nY=parseInt(lY)-parseInt(fY);
    if(nY>0&&fV>0&&lV>0)dividendGrowth=(Math.pow(lV/fV,1/nY)-1)*100;
  }
  return{totalIncome,stability,payoutRisk,cutProb,concentration,dividendGrowth,quarters:quarterKeys};
}

// ─── CSV Import ────────────────────────────────────────────────────────────
function parseCSVRows(rawRows){
  if(!rawRows.length)return{rows:[],errors:[]};
  const keys=Object.keys(rawRows[0]).map(k=>k.toLowerCase().replace(/[_\-]/g," ").trim());
  const find=names=>{for(const n of names){const idx=keys.indexOf(n);if(idx>=0)return Object.keys(rawRows[0])[idx];}return null;};
  const kTicker=find(["ticker","symbol","code"]);
  const kName=find(["name","company","security"]);
  const kType=find(["type","transaction type","action"]);
  const kDate=find(["date","trade date"]);
  const kQty=find(["qty","quantity","units"]);
  const kPrice=find(["price","unit price"]);
  const kCur=find(["currency","ccy"]);
  const kAsset=find(["asset type","asset class"]);
  const kAmt=find(["amount per share","div per share","dividend"]);
  const kTotal=find(["total amount","total dividend"]);
  const kEnt=find(["entitled qty","entitled units"]);
  const rows=[],errors=[];
  rawRows.forEach((raw,i)=>{
    const get=k=>k?String(raw[k]??"").trim():"";
    const num=k=>k?parseFloat(String(raw[k]??"").replace(/[^\d.\-]/g,""))||0:0;
    const row={
      ticker:get(kTicker).toUpperCase(),
      name:get(kName)||get(kTicker),
      type:normaliseType(get(kType)),
      date:get(kDate),
      qty:num(kQty),
      price:num(kPrice),
      currency:normaliseCurrency(get(kCur)),
      assetType:get(kAsset)||"Shares / Stocks",
      amountPerShare:num(kAmt),
      totalAmount:num(kTotal),
      entitledQty:num(kEnt)||null,
      _rowNum:i+2
    };
    const errs=[];
    if(!row.ticker)errs.push("Missing ticker");
    if(!row.type)errs.push("Unknown type");
    if(!row.date)errs.push("Missing date");
    if((row.type==="buy"||row.type==="sell")&&(!row.qty||!row.price))errs.push("qty & price required");
    if(row.type==="dividend"&&!row.amountPerShare&&!row.totalAmount)errs.push("Amount required");
    row._errors=errs;
    rows.push(row);
    if(errs.length)errors.push({rowNum:i+2,ticker:row.ticker,errs});
  });
  return{rows,errors};
}
function normaliseType(raw=""){
  const lo=raw.toLowerCase().trim();
  if(["buy","purchase","bought","b","top up"].includes(lo))return"buy";
  if(["sell","sale","sold","s","disposal"].includes(lo))return"sell";
  if(["div","dividend","income","distribution","coupon","interest","yield","d"].includes(lo))return"dividend";
  return null;
}
function normaliseCurrency(raw=""){
  const lo=String(raw).toUpperCase().trim();
  if(["AUD","A$","AU"].includes(lo))return"AUD";
  if(["IDR","RP","RUPIAH"].includes(lo))return"IDR";
  if(["USD","US$","$"].includes(lo))return"USD";
  return lo||"AUD";
}
function readFileAsRows(file){
  return new Promise((resolve,reject)=>{
    const ext=file.name.split(".").pop().toLowerCase();
    if(ext==="csv"||ext==="txt"){
      const reader=new FileReader();
      reader.onload=e=>{const r=Papa.parse(e.target.result,{header:true,skipEmptyLines:true});resolve(r.data);};
      reader.onerror=reject;reader.readAsText(file);
    }else if(["xlsx","xls","ods"].includes(ext)){
      const reader=new FileReader();
      reader.onload=e=>{const wb=XLSX.read(e.target.result,{type:"array"});const ws=wb.Sheets[wb.SheetNames[0]];resolve(XLSX.utils.sheet_to_json(ws,{defval:"",raw:true}));};
      reader.onerror=reject;reader.readAsArrayBuffer(file);
    }else{reject(new Error("Unsupported file type: ."+ext));}
  });
}
function buildPortfolioFromRows(parsedRows,existingPortfolio=[]){
  const portfolio=repairPortfolio(existingPortfolio).map(h=>({...h,transactions:[...h.transactions]}));
  const valid=parsedRows.filter(r=>!r._errors.length);
  valid.forEach(row=>{
    let h=portfolio.find(x=>x.ticker===row.ticker);
    if(!h){
      h={id:Date.now()+Math.random()*1000,ticker:row.ticker,name:row.name||row.ticker,currency:row.currency,assetType:row.assetType,exchange:"",yahooSymbol:suggestYahoo(row.ticker,"",row.assetType),transactions:[]};
      portfolio.push(h);
    }
    if(row.type==="buy"||row.type==="sell"){
      h.transactions.push({type:row.type,qty:row.qty,price:row.price,date:row.date});
    }else if(row.type==="dividend"){
      const ent=row.entitledQty||row.qty||null;
      let total=row.totalAmount||0;
      if(!total&&row.amountPerShare&&ent)total=row.amountPerShare*ent;
      h.transactions.push({type:"dividend",amountPerShare:row.amountPerShare,totalAmount:total,...(ent?{entitledQty:ent}:{}),date:row.date});
    }
  });
  portfolio.forEach(h=>h.transactions.sort((a,b)=>new Date(a.date)-new Date(b.date)));
  return repairPortfolio(portfolio);
}

  const simulationResult=useMemo(()=>{
    if(!holdings.length)return null;
    const{growthRate,reinvestDividends,fxRate,simulationYears,targetPct}=whatIf;
    const totalValue=holdings.reduce((s,h)=>s+h.currentValue,0);
    if(totalValue<=0)return null;
    const holdingData=holdings.map(h=>({...h,divYield:h.currentValue>0?h.totalDividends/h.currentValue:0}));
    const safeTargetPct=targetPct&&typeof targetPct==="object"?targetPct:{};
    const totalPct=Object.values(safeTargetPct).reduce((s,v)=>s+(typeof v==="number"?v:0),0);
    let pctMap={...safeTargetPct};
    if(totalPct===0){
      const cur={};
      holdings.forEach(h=>{cur[h.ticker]=(h.currentValue/totalValue)*100;});
      pctMap=cur;
    }else{
      const sum=Object.values(pctMap).reduce((s,v)=>s+(typeof v==="number"?v:0),0);
      if(sum>0&&Math.abs(sum-100)>0.001){
        const factor=100/sum;
        Object.keys(pctMap).forEach(k=>{pctMap[k]=pctMap[k]*factor;});
      }
    }
    const adjustedHoldings=holdingData.map(h=>{
      const pct=pctMap[h.ticker]||0;
      const adjVal=(pct/100)*totalValue;
      return{...h,adjustedValue:adjVal,adjustedDividends:adjVal*h.divYield,targetPct:pct};
    });
    const weightedAvgYield=adjustedHoldings.reduce((s,h)=>s+(h.targetPct/100)*h.divYield,0);

    const dividendHistory=[];
    for(let i=0;i<simulationYears;i++){

      const div=portfolioValue*weightedAvgYield;

      dividendCAGR=(Math.pow(dividendHistory[dividendHistory.length-1]/dividendHistory[0],1/(dividendHistory.length-1))-1)*100;

    setPrevPrices(prev=>({...prev,...p}));

    // Benchmarks
    try{
      const BM=[["sp500","^GSPC"],["jkse","^JKSE"]];
      const results=await Promise.allSettled(BM.map(([,s])=>fetchBenchmark(s)));
      const series={};
      let refLabels=[];
      results.forEach((r,i)=>{
        if(r.status==="fulfilled"){series[BM[i][0]]=r.value.pct;if(r.value.labels.length>refLabels.length)refLabels=r.value.labels;}
      });
      setBenchmarks(prev=>({...prev,labels:refLabels,series}));
    }catch(e){}

    // Prices
    const fetchable=portfolio.filter(h=>h.yahooSymbol);
    const newP={...prices},newPP={...prevPrices};
    const errors={};
    let successes=0;
    for(const h of fetchable){
      try{
        const p=await fetchYahooPrice(h.yahooSymbol);
        newP[h.ticker]=p.current;
        newPP[h.ticker]=p.prev;
        successes++;
      }catch(e){errors[h.ticker]=e.message;}
    }
    setPrices(newP);setPrevPrices(newPP);
    const now=new Date();
    const date=now.toISOString().slice(0,10);
    const hs=portfolio.map(h=>computeHolding(h,newP,newPP,newRates)).filter(h=>h.qty>0);

                          return(
                            <tr key={i}>
                              <td style={{color:T.text2,fontSize:10}}>{fmtDate(tx.date)}</td>
                              <td><span className="pill" style={{background:t.c+"22",color:t.c}}>{t.l}</span></td>
                              <td>{units}</td>
                              <td>{price}</td>
                              <td style={{color:t.c,fontWeight:700}}>{total}</td>
                              <td>
                                <div style={{display:"flex",gap:3}}>
                                  <button className="row-action" onClick={()=>setEditTx({holdingId:histH.id,txIndex:origIdx,tx:{...tx}})}>✏️</button>
                                  <button className="row-action" onClick={()=>{
                                    if(!confirm("Delete this transaction?"))return;
                                    setPortfolioRepaired(p=>p.map(h=>h.id===histH.id?{...h,transactions:h.transactions.filter((_,j)=>j!==origIdx)}:h));
                                    closeModal();
                                  }}>🗑️</button>
                                </div>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
                <div className="modal-footer"><button className="btn btn-ghost" onClick={closeModal}>Close</button></div>
              </>
            );
          })()}

          {modal.mode==="price"&&(
            <>
              <div className="modal-header"><h2>✏️ Manual Price Override</h2><p>Override prices or edit Yahoo symbols</p></div>
              <div className="modal-body">
                <div className="field" style={{maxWidth:200}}>
                  <label>Display Currency</label>
                  <select value={form.displayCur||displayCur} onChange={e=>setForm(f=>({...f,displayCur:e.target.value}))}>{CURRENCIES.map(c=><option key={c}>{c}</option>)}</select>
                </div>
                {holdings.map(h=>(
                  <div key={h.ticker} style={{marginBottom:14,paddingBottom:14,borderBottom:`1px solid ${T.border}`}}>
                    <div style={{fontSize:12,fontWeight:700,color:T.text,fontFamily:"'Space Mono',monospace",marginBottom:6}}>{h.ticker}<span style={{fontFamily:"Inter",color:T.text3,fontWeight:400}}> — {h.name}</span></div>
                    <div className="field-row-3">
                      <div className="field"><label>Current Price</label><input type="number" placeholder={String(prices[h.ticker]||"")} value={form["c_"+h.ticker]||""} onChange={e=>setForm(f=>({...f,["c_"+h.ticker]:e.target.value}))}/></div>
                      <div className="field"><label>Prev Close</label><input type="number" placeholder={String(prevPrices[h.ticker]||"")} value={form["p_"+h.ticker]||""} onChange={e=>setForm(f=>({...f,["p_"+h.ticker]:e.target.value}))}/></div>
                      <div className="field"><label>Yahoo Symbol</label><input value={form["ys_"+h.ticker]??h.yahooSymbol??""} onChange={e=>setForm(f=>({...f,["ys_"+h.ticker]:e.target.value}))}/></div>
                    </div>
                  </div>
                ))}
              </div>
              <div className="modal-footer">
                <button className="btn btn-ghost" onClick={closeModal}>Cancel</button>
                <button className="btn btn-primary" onClick={submitManualPrice}>💾 Save</button>
              </div>
            </>
          )}

          {modal.mode==="import"&&(()=>{
            const IS=importSt;
            const valid=IS.parsed.filter(r=>!r._errors.length);
            const invalid=IS.parsed.filter(r=>r._errors.length);
            return(
              <>
                <div className="modal-header"><h2>📥 Import Transactions</h2><p>Upload CSV or Excel with your buy/sell/dividend history</p></div>
                <div className="modal-body">
                  <div style={{display:"flex",gap:8,marginBottom:16,flexWrap:"wrap"}}>
                    <button className="btn btn-ghost btn-sm" onClick={downloadTemplateCSV}><Icon name="download" size={14}/>Template CSV</button>
                  </div>
                  <input ref={importFileRef} type="file" accept=".csv,.xlsx,.xls,.ods,.txt" style={{display:"none"}} onChange={e=>{if(e.target.files[0])handleImportFile(e.target.files[0]);e.target.value="";}}/>
                  {(IS.step==="idle"||IS.step==="parsing")&&(
                    <div className={`import-drop ${IS.dragOver?"dragover":""}`}
                      onDragOver={e=>{e.preventDefault();setImportSt(s=>({...s,dragOver:true}));}}
                      onDragLeave={()=>setImportSt(s=>({...s,dragOver:false}))}
                      onDrop={e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f)handleImportFile(f);}}
                      onClick={()=>importFileRef.current&&importFileRef.current.click()}>
                      <div className="ico">📂</div>
                      <div className="ttl">{IS.step==="parsing"?"Parsing file…":"Drag & drop your file here"}</div>
                      <div className="desc">or click to browse · CSV, XLSX supported</div>
                    </div>
                  )}
                  {IS.step==="error"&&(
                    <div style={{background:T.redBg||"rgba(239,68,68,.1)",border:`1px solid ${T.red}55`,borderRadius:10,padding:"14px 16px",color:T.red}}>
                      <div style={{fontWeight:700,marginBottom:4}}>Could not read file</div>
                      <div style={{fontSize:12}}>{IS.errorMsg}</div>
                      <button className="btn btn-ghost btn-sm" style={{marginTop:10}} onClick={()=>setImportSt(s=>({...s,step:"idle"}))}>Try again</button>
                    </div>
                  )}
                  {IS.step==="preview"&&(
                    <>
                      <div style={{display:"flex",gap:8,marginBottom:12,flexWrap:"wrap"}}>
                        {[[IS.parsed.length+" rows",T.text],[valid.length+" valid",T.green],...(invalid.length?[[invalid.length+" errors",T.amber]]:[])].map(([l,c])=>(
                          <span key={l} style={{fontSize:11,fontWeight:600,color:c,background:T.bg3,border:`1px solid ${T.border}`,borderRadius:6,padding:"3px 10px"}}>{l}</span>
                        ))}
                      </div>
                      <div style={{display:"flex",gap:8,alignItems:"center",background:T.bg3,border:`1px solid ${T.border}`,borderRadius:10,padding:"10px 14px",marginBottom:12,flexWrap:"wrap"}}>
                        <span style={{fontSize:12,fontWeight:600,color:T.text}}>Mode:</span>
                        {[["merge","Merge"],["replace","Replace"]].map(([v,l])=>(
                          <button key={v} className={`btn btn-sm ${IS.mergeMode===v?"btn-primary":"btn-ghost"}`} onClick={()=>setImportSt(s=>({...s,mergeMode:v}))}>{l}</button>
                        ))}
                      </div>
                      <div style={{overflowX:"auto",borderRadius:8,border:`1px solid ${T.border}`,marginBottom:12,maxHeight:260,overflowY:"auto"}}>
                        <table className="modern-table" style={{fontSize:11}}>
                          <thead><tr><th>Row</th><th>Ticker</th><th>Type</th><th>Date</th><th>Qty</th><th>Price</th></tr></thead>
                          <tbody>
                            {IS.parsed.slice(0,50).map((r,i)=>(
                              <tr key={i} style={{background:r._errors.length?(dark?"#2a1500":"#fff7ed"):"transparent"}}>
                                <td style={{color:T.text3,fontSize:10}}>{r._rowNum}</td>
                                <td style={{fontFamily:"'Space Mono',monospace",fontWeight:700,color:T.text}}>{r.ticker}</td>
                                <td>{r.type&&<span className={`pill ${r.type==="buy"?"up":r.type==="sell"?"down":"neutral"}`}>{r.type.toUpperCase()}</span>}</td>
                                <td style={{color:T.text2,fontSize:10}}>{r.date}</td>
                                <td>{r.qty||"—"}</td>
                                <td>{r.price||"—"}</td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </>
                  )}
                  {IS.step==="done"&&(
                    <div style={{textAlign:"center",padding:"24px 0"}}>
                      <div style={{fontSize:48,marginBottom:12}}>🎉</div>
                      <div style={{fontSize:18,fontWeight:700,color:T.green,marginBottom:8}}>Import complete!</div>
                      <div style={{fontSize:13,color:T.text2}}>{IS.importedCount} transactions imported.</div>
                    </div>
                  )}
                </div>
                <div className="modal-footer">
                  {IS.step==="preview"&&<>
                    <button className="btn btn-ghost" onClick={()=>setImportSt(s=>({...s,step:"idle",parsed:[],errors:[]}))}>Back</button>
                    <button className="btn btn-ghost" onClick={closeModal}>Cancel</button>
                    <button className="btn btn-primary" disabled={!valid.length} onClick={confirmImport}>Import {valid.length} rows</button>
                  </>}
                  {IS.step==="done"&&<button className="btn btn-primary" onClick={closeModal}>Done</button>}
                  {(IS.step==="idle"||IS.step==="error")&&<button className="btn btn-ghost" onClick={closeModal}>Cancel</button>}
                </div>
              </>
            );
          })()}
        </div>
      </div>
    );
  };

  return(
    <ErrorBoundary>
      <div className="app">
        <header className="header">
          <div className="header-inner">
            <div className="logo">
              <div className="logo-mark">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                  <path d="M4 20 L8 12 L12 16 L20 4" stroke="#fff" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" fill="none"/>
                  <circle cx="20" cy="4" r="2" fill="#fff"/>
                </svg>
              </div>
              <div className="logo-text">
                <b>SAUDAGAR KAPITALIS</b>
                <span>Invest. Grow. Freedom.</span>
              </div>
            </div>
            <nav className="header-nav">
              {[["dashboard","Dashboard","dashboard"],["portfolio","Portfolio","wallet"],["analytics","Analytics","chart"]].map(([v,l,ic])=>(
                <button key={v} className={`nav-tab ${view===v?"active":""}`} onClick={()=>setView(v)}>
                  <Icon name={ic} size={15}/>{l}
                </button>
              ))}
            </nav>
            <div className="header-actions">
              <div className="currency-pill">
                <select value={displayCur} onChange={e=>setDisplayCur(e.target.value)}>
                  {CURRENCIES.map(c=><option key={c}>{c}</option>)}
                </select>
              </div>
              <button className="icon-btn" title={valuesHidden?"Show values":"Hide values"} onClick={()=>setValuesHidden(v=>!v)}><Icon name={valuesHidden?"eye-off":"eye"} size={16}/></button>
              <button className="icon-btn" title="Passive settings" onClick={()=>setShowPassiveModal(true)}><Icon name="settings" size={16}/></button>
              <button className="icon-btn" title={dark?"Light":"Dark"} onClick={()=>setDark(d=>!d)}><Icon name={dark?"sun":"moon"} size={16}/></button>
              <button className="icon-btn" title="Refresh" onClick={autoRefresh} disabled={fetchSt.loading}><span className={fetchSt.loading?"spin":""}><Icon name="refresh" size={16}/></span></button>
              <button className="icon-btn" title="Prices" onClick={openManualPrice}><Icon name="edit" size={16}/></button>
              <button className="icon-btn" title="Import" onClick={openImport}><Icon name="download" size={16}/></button>
              <button className="icon-btn" title="Export" onClick={()=>{exportTransactionsCSV(portfolio);showToast("Exported ✓");}}><Icon name="upload" size={16}/></button>
              {FB_CONFIGURED?(fbUser?(
                <>
                  <button className="icon-btn" title="Load" onClick={()=>cloudLoadAll()} disabled={syncSt==="loading"||syncSt==="saving"}><span className={syncSt==="loading"?"spin":""}><Icon name="cloud" size={16}/></span></button>
                  <button className="icon-btn" title="Save" onClick={()=>cloudSaveAll()} disabled={syncSt==="loading"||syncSt==="saving"}><Icon name="check" size={16}/></button>
                  <button className="avatar" title={fbUser.displayName||fbUser.email} onClick={handleSignOut}>{fbUser.photoURL?<img src={fbUser.photoURL} alt=""/>:(fbUser.displayName||"U").slice(0,1).toUpperCase()}</button>
                </>
              ):(
                <button className="icon-btn" title="Sign in" onClick={handleSignIn}><Icon name="cloud" size={16}/></button>
              )):null}
            </div>
          </div>
        </header>

        <main className="main">
          {view==="dashboard"&&renderDashboard()}
          {view==="portfolio"&&renderPortfolio()}
          {view==="analytics"&&renderAnalytics()}
        </main>

        <nav className="bottom-nav">
          <div className="bottom-nav-inner">
            {[["dashboard","Dashboard","dashboard"],["portfolio","Portfolio","wallet"],["analytics","Analytics","chart"]].map(([v,l,ic])=>(
              <button key={v} className={`bottom-nav-item ${view===v?"active":""}`} onClick={()=>setView(v)}>
                <Icon name={ic} size={20}/>
                <span>{l}</span>
              </button>
            ))}
          </div>
        </nav>

        {renderModals()}

        {editTx&&(()=>{
          const h=portfolio.find(p=>p.id===editTx.holdingId);
          if(!h)return null;
          const tx=editTx.tx;
          const cur=h.currency||"AUD";
          const save=()=>{
            setPortfolioRepaired(p=>p.map(holding=>holding.id===editTx.holdingId?{...holding,transactions:holding.transactions.map((t,j)=>j===editTx.txIndex?{...editTx.tx}:t)}:holding));
            setEditTx(null);
          };
          return(
            <div className="modal-overlay" onClick={()=>setEditTx(null)}>
              <div className="modal" onClick={e=>e.stopPropagation()} style={{maxWidth:380}}>
                <div className="modal-header"><h2>✏️ Edit Transaction</h2><p>{h.ticker} — {tx.type?.toUpperCase()}</p></div>
                <div className="modal-body">
                  <div className="field"><label>Date</label><input type="date" value={tx.date??""} onChange={e=>setEditTx(s=>({...s,tx:{...s.tx,date:e.target.value}}))}/></div>
                  {tx.type!=="dividend"&&<>
                    <div className="field"><label>Units</label><input type="number" value={tx.qty??""} onChange={e=>setEditTx(s=>({...s,tx:{...s.tx,qty:parseFloat(e.target.value)||0}}))}/></div>
                    <div className="field"><label>Price ({cur})</label><input type="number" value={tx.price??""} onChange={e=>setEditTx(s=>({...s,tx:{...s.tx,price:parseFloat(e.target.value)||0}}))}/></div>
                  </>}
                  {tx.type==="dividend"&&<>
                    <div className="field"><label>Amount per Unit ({cur})</label><input type="number" value={tx.amountPerShare??""} onChange={e=>setEditTx(s=>({...s,tx:{...s.tx,amountPerShare:parseFloat(e.target.value)||0}}))}/></div>
                    <div className="field"><label>Entitled Units</label><input type="number" value={tx.entitledQty??""} onChange={e=>setEditTx(s=>({...s,tx:{...s.tx,entitledQty:parseFloat(e.target.value)||0}}))}/></div>
                    <div className="field"><label>Total Amount ({cur})</label><input type="number" value={tx.totalAmount??""} onChange={e=>setEditTx(s=>({...s,tx:{...s.tx,totalAmount:parseFloat(e.target.value)||0}}))}/></div>
                  </>}
                </div>
                <div className="modal-footer">
                  <button className="btn btn-ghost" onClick={()=>setEditTx(null)}>Cancel</button>
                  <button className="btn btn-primary" onClick={save}>Save</button>
                </div>
              </div>
            </div>
          );
        })()}

        {showPassiveModal&&(
          <div className="modal-overlay" onClick={()=>setShowPassiveModal(false)}>
            <div className="modal" onClick={e=>e.stopPropagation()} style={{maxWidth:400}}>
              <div className="modal-header"><h2>⚙️ Passive Income Settings</h2><p>Set your monthly target & super draw rate</p></div>
              <div className="modal-body">
                <div className="field"><label>Monthly Target (AUD)</label><input type="number" step="100" value={monthlyTargetAud} onChange={e=>setMonthlyTargetAud(parseFloat(e.target.value)||0)} placeholder="e.g. 5000"/></div>
                <div className="field"><label>Super Annual Draw Rate (%)</label><input type="number" step="0.1" value={superDrawRate} onChange={e=>setSuperDrawRate(parseFloat(e.target.value)||0)} placeholder="e.g. 4.0"/><div style={{fontSize:10,color:T.text3,marginTop:4}}>Applied to NUL5339AU + NUL7270AU</div></div>
                <div className="field"><label>Average Super Balance (AUD)</label><input type="number" step="1000" value={avgSuperBalanceAud} onChange={e=>setAvgSuperBalanceAud(parseFloat(e.target.value)||0)} placeholder="e.g. 100000"/></div>
              </div>
              <div className="modal-footer"><button className="btn btn-primary" onClick={()=>setShowPassiveModal(false)}>Save</button></div>
            </div>
          </div>
        )}

        {toast&&(
          <div style={{position:"fixed",bottom:80,left:"50%",transform:"translateX(-50%)",zIndex:200,background:toast.type==="warn"?T.amberBg:T.greenBg||"rgba(34,197,94,.15)",border:`1px solid ${toast.type==="warn"?T.amber:T.green}66`,color:toast.type==="warn"?T.amber:T.green,padding:"10px 18px",borderRadius:12,fontSize:12,fontWeight:600,boxShadow:"0 8px 24px rgba(0,0,0,.4)",maxWidth:"90vw",textAlign:"center"}}>{toast.msg}</div>
        )}
      </div>
    </ErrorBoundary>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
